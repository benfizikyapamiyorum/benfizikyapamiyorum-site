/* ---- Oynanan simülasyon bloğu (src/sim.js ve her konunun sim.js dosyası) ----
   Bankada değil; not listesine yalnız gösterimde eklenir ve notDizi indekslemesine girmez.
   Değerler bu oturumda bellekte tutulur (kayıtlı ilerlemeye yazılmaz). Değişimde yalnız sahne,
   ölçümler ve denklem yeniden çizilir; ardışık girişler requestAnimationFrame ile tek kareye birleşir. */
const SIMA = window.BFY_SIM_ARAC;
const SIMV = {};
const simDeger = s => (SIMV[s.id] = SIMV[s.id] || SIMA.degerler(s));
const simKid = (s, k) => `sim-${s.id}-${k.ad}`;
const simKYazi = (k, x) => SIMA.sayi(x, SIMA.adimOndalik(k.adim)) + (k.birim ? ' ' + k.birim : '');
const simYuzde = (k, x) => ((x - k.min) / (k.max - k.min) * 100).toFixed(2) + '%';
// Dar kâğıtta (telefon) sahne dikey yerleşimle çizilir: ciz(v, u, { dar: true }). Kâğıt genişliği döndürmeyle değişmez.
const simDar = () => (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--kagit-w')) || innerWidth) < 560;
function simSahne(s, v) { try { return s.ciz(v, 'sim_' + s.id + '_', { dar: simDar() }); } catch (e) { console.error('Simülasyon çizilemedi: ' + s.id, e); return '<p class="sim-hata">Şekil çizilemedi.</p>'; } }
// Sahne kutusu viewBox oranında sabit boyutlu ve kapsüllü (contain): yeniden çizim sayfanın geri kalanını yeniden yerleştirmez.
function simOran(s, v) { const m = /viewBox="0 0 ([\d.]+) ([\d.]+)"/.exec(simSahne(s, v)); return m ? ` style="aspect-ratio:${m[1]}/${m[2]}"` : ''; }
function simOlcumHTML(s, v) {
  let ol = [];
  try { ol = s.olcumler(v); } catch (e) { console.error('Simülasyon ölçümü hesaplanamadı: ' + s.id, e); }
  return ol.map(o => `<div class="sim-o"><span>${esc(o.etiket)}</span><b>${SIMA.sayi(o.deger, o.ondalik)}${o.birim ? ` <small>${esc(o.birim)}</small>` : ''}</b></div>`).join('');
}
function simDenklemHTML(s, v) { if (!s.denklem) return ''; try { return O.tex(s.denklem(v), false); } catch (e) { console.error('Simülasyon denklemi yazılamadı: ' + s.id, e); return ''; } }
function simHTML(s) {
  const v = simDeger(s);
  const kont = s.kontroller.map(k => {
    const id = simKid(s, k);
    if (SIMA.kaydirici(k)) return `<div class="sim-k"><div class="sim-ke"><label for="${id}">${esc(k.etiket)}</label><output for="${id}" data-sim-cikti="${esc(k.ad)}">${esc(simKYazi(k, v[k.ad]))}</output></div>
<input type="range" id="${id}" data-sim-k="${esc(k.ad)}" min="${k.min}" max="${k.max}" step="${k.adim}" value="${v[k.ad]}" aria-valuetext="${esc(simKYazi(k, v[k.ad]))}" style="--p:${simYuzde(k, v[k.ad])}">
<div class="sim-uc" aria-hidden="true"><span>${esc(simKYazi(k, k.min))}</span><span>${esc(simKYazi(k, k.max))}</span></div></div>`;
    return `<div class="sim-k"><div class="sim-ke"><span id="${id}">${esc(k.etiket)}</span></div><div class="sim-secenek s${k.secenekler.length}" role="radiogroup" aria-labelledby="${id}">${k.secenekler.map((o, i) => { const on = o.deger === v[k.ad]; return `<button type="button" role="radio" aria-checked="${on}" tabindex="${on ? 0 : -1}" class="${on ? 'on' : ''}" data-sim-sec="${esc(k.ad)}" data-i="${i}"><b>${esc(o.etiket)}</b>${o.alt ? `<small>${esc(o.alt)}</small>` : ''}</button>`; }).join('')}</div></div>`;
  }).join('');
  return `<div class="blk n-sim" data-sim="${esc(s.id)}"><div class="na-etk yesil">Simülasyon</div><h3>${esc(s.baslik)}</h3>${md(s.metin)}
<div class="sim-sahne"${simOran(s, v)}>${simSahne(s, v)}</div>
<div class="sim-kontroller">${kont}</div>
<div class="sim-olcumler">${simOlcumHTML(s, v)}</div>${s.denklem ? `<div class="sim-denklem">${simDenklemHTML(s, v)}</div>` : ''}
${s.gorev ? `<div class="sim-gorev"><b>Görev</b>${md(s.gorev)}${s.gorevCevap ? `<button type="button" class="btn cizgi ince" data-sim-cevap aria-expanded="false">Cevabı gör</button><div class="sim-cevap" hidden>${md(s.gorevCevap)}</div>` : ''}</div>` : ''}</div>`;
}
function simTazele(blok) {
  const s = SIMA.bul(blok.dataset.sim); if (!s) return;
  const v = simDeger(s);
  const yaz = (el, h) => { if (el && el._h !== h) { el.innerHTML = h; el._h = h; } };
  yaz(blok.querySelector('.sim-sahne'), simSahne(s, v));
  yaz(blok.querySelector('.sim-olcumler'), simOlcumHTML(s, v));
  yaz(blok.querySelector('.sim-denklem'), simDenklemHTML(s, v));
  s.kontroller.forEach(k => {
    if (!SIMA.kaydirici(k)) return;
    const c = blok.querySelector(`[data-sim-cikti="${CSS.escape(k.ad)}"]`), r = blok.querySelector(`input[data-sim-k="${CSS.escape(k.ad)}"]`);
    if (c) c.textContent = simKYazi(k, v[k.ad]);
    if (r) { r.setAttribute('aria-valuetext', simKYazi(k, v[k.ad])); r.style.setProperty('--p', simYuzde(k, v[k.ad])); }
  });
}
function simIste(blok) { if (blok._simRaf) return; blok._simRaf = requestAnimationFrame(() => { blok._simRaf = 0; if (blok.isConnected) simTazele(blok); }); }
function simSec(btn, odakla) {
  const blok = btn.closest('.n-sim'), s = SIMA.bul(blok.dataset.sim); if (!s) return;
  const k = s.kontroller.find(x => x.ad === btn.dataset.simSec), o = k && k.secenekler[+btn.dataset.i]; if (!o) return;
  simDeger(s)[k.ad] = o.deger;
  btn.parentNode.querySelectorAll('[data-sim-sec]').forEach(b => { const on = b === btn; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); b.tabIndex = on ? 0 : -1; });
  if (odakla) btn.focus();
  simIste(blok);
}
document.addEventListener('input', e => {
  const r = e.target.closest && e.target.closest('.n-sim input[data-sim-k]'); if (!r) return;
  const blok = r.closest('.n-sim'), s = SIMA.bul(blok.dataset.sim); if (!s) return;
  const k = s.kontroller.find(x => x.ad === r.dataset.simK); if (!k) return;
  const x = Math.min(k.max, Math.max(k.min, +r.value));
  simDeger(s)[k.ad] = +(k.min + Math.round((x - k.min) / k.adim) * k.adim).toFixed(SIMA.adimOndalik(k.adim));
  simIste(blok);
});
// Seçici düğme grubu: ok tuşlarıyla seçim (radyo grubu davranışı)
document.addEventListener('keydown', e => {
  const b = e.target.closest && e.target.closest('.n-sim [data-sim-sec]'); if (!b) return;
  const yon = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
  const hepsi = [...b.parentNode.querySelectorAll('[data-sim-sec]')];
  let j = null;
  if (yon) j = (hepsi.indexOf(b) + yon + hepsi.length) % hepsi.length;
  else if (e.key === 'Home') j = 0; else if (e.key === 'End') j = hepsi.length - 1;
  if (j === null) return;
  e.preventDefault(); simSec(hepsi[j], true);
});

/* ---- Soru kartı (çalışma, deneme ve inceleme modlarında ortak) ---- */
const gecici = { secim: null, adim: {}, tekrar: false, etk: {}, oySonuc: {} };
function soruKart(q, { mod, secim, cevap, konu }) {

  const genis = ['grafikSec', 'grafikler'].includes(q.sekil) || /_genis$/.test(q.sekil || '');
  const fig = q.sekil ? window.BFY_FIG(q.sekil) : '';
  const ctx = { tablo: q.tablo ? tabloBaslikli(q.tablo) : '', sekil: q.sekil ? `<div class="q-sekil-ic ${genis ? 'genis' : ''}">${fig}</div>` : '' };
  const icSekil = /\{\{sekil\}\}/.test(q.metin);
  let h = q.set ? baglamKart(q) : '';
  h += `<div class="q-bas">${ETK.etkMi(q) ? `<span class="etiket tur">${ETK.TUR_AD[q.tur]}</span>` : ''}<span class="etiket z${q.zorluk}">${yildiz(q.zorluk)} ${ZAD[q.zorluk]}</span><span class="etiket">${XP[q.zorluk]} XP</span>${q.tur === 'acik' ? `<span class="etiket">${q.puan} puan</span>` : ''}${q.yks && !TYT ? '<span class="etiket yks">YKS tarzı</span>' : ''}${q.cikmis ? `<span class="etiket yks">${O.cikmisEtiket(q.cikmis)}</span>` : ''}${q.tahmin ? `<span class="etiket thm" title="${esc(String(q.tahmin.gerekce || '').replace(/\$[^$]*\$/g, '…'))}">Çıkma ihtimali yüksek</span>` : ''}<span class="etiket bec">${esc(q.beceri)}</span></div>`;
  h += `<div class="q-metin">${md(q.metin, ctx)}</div>`;
  if (q.sekil && !icSekil) h += `<div class="dj-sekil ${genis ? 'genis' : ''}">${fig}</div>`;
  if (q.tur === 'cs') {
    const ops = q.sira.map(i => q.secenekler[i]);
    const kisa = ops.every(o => o.replace(/\$([^$]*)\$/g, (m, x) => 'x'.repeat(Math.max(3, Math.ceil(1.6 * x.replace(/\\[a-zA-Z]+/g, 'x').replace(/[{}_^\s]/g, '').length)))).length <= 12);
    const cevapli = cevap !== undefined && cevap !== null && mod !== 'deneme';
    h += `<div class="secenekler ${kisa ? 'iki' : ''}">${ops.map((o, i) => {
      const orj = q.sira[i];
      let cls = '';
      if (cevapli) { if (orj === q.dogru) cls = 'dogru'; else if (orj === cevap) cls = 'yanlis'; else cls = 'soluk'; }
      else if (secim === orj) cls = 'secili';
      return `<button type="button" class="${cls}" data-sec="${orj}" ${cevapli ? 'disabled' : ''}><span class="h">${HARF[i]}</span><span>${inline(o)}</span></button>`;
    }).join('')}</div>`;
  }
  return h;
}
function baglamKart(q) {

    const ters = st.tablo[0].map((_, j) => st.tablo.map(r => r[j] == null ? '' : r[j]));

}
