    s += `<path d="M146 ${base} C147 ${base - 120} 145 ${tp + 60} 140 ${tp + 14} Q140 ${tp - 4} 150 ${tp - 4} Q160 ${tp - 4} 160 ${tp + 14} C155 ${tp + 60} 153 ${base - 120} 154 ${base} Z" fill="url(#${u}jet)" stroke="#6fb4dc" stroke-width=".8"/>`;
    [[136, tp + 26], [164, tp + 30], [132, tp + 50], [167, tp + 58], [139, tp + 80], [161, tp + 90]].forEach(([x, y]) => { s += `<circle cx="${x}" cy="${y}" r="1.8" fill="#5aa9dc"/>`; });
    s += `<rect x="143" y="${base - 2}" width="14" height="8" rx="2" fill="url(#${u}metalV)" stroke="#7d868e" stroke-width=".7"/>`;
    s += arrow(186, base - 6, 186, base - 58, { color: P.coral, w: 2.4 });
    s += T(194, base - 30, 'ϑ_0 = 12 m/s', { size: 12, weight: 800, fill: P.coral });
    const y54 = Y(5.4);
    s += `<line x1="92" y1="${y54}" x2="226" y2="${y54}" stroke="${P.copper}" stroke-width="1.6" stroke-dasharray="7 5"/>`;
    s += dimV(84, y54, base, '5,4 m', { side: 'left', size: 13 });
    return svg(300, 330, s, u, 64);
  }
};

/* balkon3: düzgün sürüm */
FIGS.balkon3 = function (u) {
  const gy = 262;
  let s = `<rect class="bg" x="0" y="0" width="340" height="290" rx="14" fill="url(#${u}sky)"/>`;
  s += `<rect class="bg" x="0" y="${gy}" width="340" height="28" fill="url(#${u}grass)"/>`;
  s += `<rect x="18" y="18" width="70" height="${gy - 18}" fill="url(#${u}facade)" stroke="#bfae92" stroke-width="1"/>`;
  for (let r = 0; r < 4; r++) s += `<rect x="34" y="${130 + r * 32}" width="38" height="22" rx="2" fill="url(#${u}glass)" stroke="#9fb3c2" stroke-width=".8"/>`;
  s += `<rect x="36" y="34" width="34" height="52" rx="2" fill="#8fb3c9" stroke="#7a95a7" stroke-width=".8"/>`;
  s += `<rect x="88" y="92" width="150" height="10" fill="#d4c9b7" stroke="#a89a82" stroke-width=".8"/>`;
  s += `<g stroke="#8a7f70" stroke-width="1.6">` + [0, 1, 2, 3, 4, 5, 6, 7].map(i => `<line x1="${96 + i * 19}" y1="92" x2="${96 + i * 19}" y2="62"/>`).join('') + `</g>`;
  s += `<line x1="90" y1="62" x2="236" y2="62" stroke="#6f665a" stroke-width="3" stroke-linecap="round"/>`;
  const bY = 50;
  s += ball(u, 256, bY, 8, 'blue') + ball(u, 284, bY, 8, 'green') + ball(u, 312, bY, 8, 'copper');
  s += T(256, bY - 16, 'A', { size: 13, anchor: 'middle', weight: 800 }) + T(284, bY + 64, 'B', { size: 13, anchor: 'middle', weight: 800 }) + T(312, bY + 30, 'C', { size: 13, anchor: 'middle', weight: 800 });
  s += arrow(284, bY + 11, 284, bY + 46, { color: P.coral, w: 2.3 }) + T(294, bY + 36, 'ϑ', { size: 12.5, weight: 800, fill: P.coral });
  s += arrow(312, bY - 11, 312, bY - 44, { color: P.coral, w: 2.3 }) + T(322, bY - 26, 'ϑ', { size: 12.5, weight: 800, fill: P.coral });
  s += T(256, bY + 26, 'ϑ_0 = 0', { size: 10.5, anchor: 'middle', weight: 700, fill: '#1d5a86' });
  s += dimV(334, bY, gy, 'h', { side: 'left', size: 14 });
  return svg(340, 290, s, u, 76);
};

window.BFY_FIG = function (key) {
  const f = FIGS[key];
  if (!f) return '';
  return f('u' + (++UID) + '_');
};
/* Konu dosyalarının kullanacağı ortak araçlar */
window.BFY_FIGLIB = { P, FONT, mt, T, arrow, dimV, ball, defs, svg, dashLine, miniGraph };
window.BFY_FIG_EKLE = function (key, fn) {
  if (FIGS[key]) throw new Error('Şekil anahtarı zaten var: ' + key);
  FIGS[key] = fn;
};
window.BFY_FIG_VAR = key => !!FIGS[key];
})();

</script>
<script>
/* ============================================================
   BFY — 3B görünümlü (izometrik) çizim kütüphanesi
   Kartlar, hikâyeler, tanımlar, efsaneler ve deneyler için küçük sahneler.
   Işık sol üstten gelir: üst yüz açık, sol yüz orta, sağ yüz koyu.
   Kullanım (konu figs.js içinde):
     const I = window.BFY_ISO;
     BFY_FIG_EKLE('k911_kart_mekanik', u => I.sahne(u, s => { ... }, { w:160, h:110 }));
   Her çizim yalnızca SVG'dir; internetsiz çalışır, baskıda da keskin kalır.
   ============================================================ */
(function () {
const { FONT, mt } = window.BFY_FIGLIB;

/* ---------- renk araçları ---------- */
const RENK = {
  yesil: '#3f8a67', koyu: '#244f40', bakir: '#c9793f', mercan: '#d9573b', gok: '#3b8fc8', lacivert: '#2b4a8b',
  gunes: '#e7a93b', mor: '#7b5bc4', gri: '#9aa5ad', krem: '#f3ead6', ahsap: '#c9955a', cam: '#bfe2f2',
  metal: '#b8c0c7', beyaz: '#f7f8f6', siyah: '#2a3330', kirmizi: '#d24b3e', mavi: '#2f7fb8', turuncu: '#ee8a3a',
  pembe: '#e58aa8', sari: '#f2c94c', zemin: '#e9efe9'
};
function hex2rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgb2hex(r, g, b) { return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
/* k > 0 açar (beyaza), k < 0 koyulaştırır (siyaha) */
function ton(h, k) { const [r, g, b] = hex2rgb(RENK[h] || h); return k >= 0 ? rgb2hex(r + (255 - r) * k, g + (255 - g) * k, b + (255 - b) * k) : rgb2hex(r * (1 + k), g * (1 + k), b * (1 + k)); }
const r1 = v => Math.round(v * 10) / 10;

/* ---------- izometrik izdüşüm ----------
   Dünya: x sağ-ön, y sol-ön, z yukarı. Ekran: (ox, oy) orijin. */
function Izo(ox, oy, s = 1) {
  const C = Math.cos(Math.PI / 6) * s, S = Math.sin(Math.PI / 6) * s;
  const p = (x, y, z = 0) => [r1(ox + (x - y) * C), r1(oy + (x + y) * S - z * s)];
  const pts = arr => arr.map(a => p(...a).join(',')).join(' ');
  return { p, pts, s, C, S, ox, oy };
}

/* ---------- temel cisimler ---------- */
// Kutu: (x,y,z) köşesinden w (x yönü), d (y yönü), h (yükseklik)
function kutu(I, x, y, z, w, d, h, renk, o = {}) {
  const c = RENK[renk] || renk, cizgi = o.cizgi || ton(c, -0.45), sw = o.sw ?? 0.9;
  const ust = I.pts([[x, y, z + h], [x + w, y, z + h], [x + w, y + d, z + h], [x, y + d, z + h]]);
  const sag = I.pts([[x + w, y, z], [x + w, y + d, z], [x + w, y + d, z + h], [x + w, y, z + h]]);
  const sol = I.pts([[x, y + d, z], [x + w, y + d, z], [x + w, y + d, z + h], [x, y + d, z + h]]);
  let s = `<polygon points="${sol}" fill="${o.sol || ton(c, -0.08)}" stroke="${cizgi}" stroke-width="${sw}" stroke-linejoin="round"/>`;
  s += `<polygon points="${sag}" fill="${o.sag || ton(c, -0.28)}" stroke="${cizgi}" stroke-width="${sw}" stroke-linejoin="round"/>`;
  s += `<polygon points="${ust}" fill="${o.ust || ton(c, 0.28)}" stroke="${cizgi}" stroke-width="${sw}" stroke-linejoin="round"/>`;
  return s;
}
// Zemin plakası: yuvarlatılmış kenarlı ince plaka (sahne tabanı)
function plaka(I, x, y, w, d, renk = '#dfe8e1', kal = 6) {
  return kutu(I, x, y, -kal, w, d, kal, renk, { cizgi: ton(renk, -0.25), sw: 0.8, ust: ton(renk, 0.35) });
}
// Dik silindir: taban merkezi (x,y,z), yarıçap r, yükseklik h
function silindir(I, u, x, y, z, r, h, renk, o = {}) {
  const c = RENK[renk] || renk, id = u + 'cy' + (++silindir.n);
  const [bx, by] = I.p(x, y, z), [tx, ty] = I.p(x, y, z + h);
  const rx = r * I.C * 1.155, ry = r * I.S * 1.155;
  let s = `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${ton(c, 0.05)}"/><stop offset=".35" stop-color="${ton(c, 0.3)}"/><stop offset="1" stop-color="${ton(c, -0.35)}"/></linearGradient></defs>`;
  s += `<path d="M${r1(bx - rx)},${by} L${r1(tx - rx)},${ty} A${r1(rx)},${r1(ry)} 0 0 0 ${r1(tx + rx)},${ty} L${r1(bx + rx)},${by} A${r1(rx)},${r1(ry)} 0 0 1 ${r1(bx - rx)},${by}Z" fill="url(#${id})" stroke="${ton(c, -0.45)}" stroke-width=".9"/>`;
  if (!o.acik) s += `<ellipse cx="${tx}" cy="${ty}" rx="${r1(rx)}" ry="${r1(ry)}" fill="${o.kapak || ton(c, 0.35)}" stroke="${ton(c, -0.45)}" stroke-width=".9"/>`;
  return s;
}
silindir.n = 0;
// Yatay silindir (x ekseni boyunca): merkez (x,y,z), yarıçap r, uzunluk L
function yatSilindir(I, u, x, y, z, r, L, renk) {
  const c = RENK[renk] || renk, id = u + 'ys' + (++silindir.n);
  const a = I.p(x, y, z), b = I.p(x + L, y, z);
  const ry = r, rx = r * 0.5;
  let s = `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${ton(c, 0.35)}"/><stop offset=".5" stop-color="${ton(c, 0.05)}"/><stop offset="1" stop-color="${ton(c, -0.35)}"/></linearGradient></defs>`;
  s += `<path d="M${a[0]},${r1(a[1] - ry)} L${b[0]},${r1(b[1] - ry)} L${b[0]},${r1(b[1] + ry)} L${a[0]},${r1(a[1] + ry)}Z" fill="url(#${id})" stroke="${ton(c, -0.45)}" stroke-width=".9"/>`;
  s += `<ellipse cx="${b[0]}" cy="${b[1]}" rx="${r1(rx)}" ry="${r1(ry)}" fill="${ton(c, 0.2)}" stroke="${ton(c, -0.45)}" stroke-width=".9"/>`;
  return s;
}
// Küre (ekran koordinatı): parlak noktalı, yumuşak gölgeli
function kure(u, cx, cy, r, renk, o = {}) {
  const c = RENK[renk] || renk, id = u + 'k' + (++kure.n);
  let s = `<defs><radialGradient id="${id}" cx="34%" cy="30%" r="78%"><stop offset="0" stop-color="${ton(c, 0.75)}"/><stop offset=".45" stop-color="${ton(c, 0.1)}"/><stop offset="1" stop-color="${ton(c, -0.45)}"/></radialGradient></defs>`;
  if (o.golge !== false) s += `<ellipse cx="${r1(cx + r * 0.15)}" cy="${r1(cy + r * (o.golgeY || 1.05))}" rx="${r1(r * 0.85)}" ry="${r1(r * 0.25)}" fill="#0b1f18" opacity=".14"/>`;
  s += `<circle cx="${r1(cx)}" cy="${r1(cy)}" r="${r1(r)}" fill="url(#${id})"${o.cizgi === false ? '' : ` stroke="${ton(c, -0.5)}" stroke-width=".7"`}/>`;
  return s;
}
kure.n = 0;
// Gölge elipsi (ekran)
const golge = (cx, cy, rx, ry, op = 0.16) => `<ellipse cx="${r1(cx)}" cy="${r1(cy)}" rx="${r1(rx)}" ry="${r1(ry)}" fill="#0b1f18" opacity="${op}"/>`;
// Ekran düzleminde ok
function ok(x1, y1, x2, y2, o = {}) {
  const c = RENK[o.renk] || o.renk || RENK.mercan, w = o.w || 2.4, hl = o.bas || 8, hw = o.basG || 5;
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, bx = x2 - ux * hl, by = y2 - uy * hl;
  return `<line x1="${r1(x1)}" y1="${r1(y1)}" x2="${r1(bx)}" y2="${r1(by)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"${o.kesik ? ` stroke-dasharray="${o.kesik}"` : ''}/><polygon points="${r1(x2)},${r1(y2)} ${r1(bx - uy * hw)},${r1(by + ux * hw)} ${r1(bx + uy * hw)},${r1(by - ux * hw)}" fill="${c}"/>`;
}
// İzometrik düzlemde ok (dünya koordinatı)
function izoOk(I, a, b, o = {}) { const [x1, y1] = I.p(...a), [x2, y2] = I.p(...b); return ok(x1, y1, x2, y2, o); }
// Etiket hapı (ekran)
function etiket(x, y, yazi, o = {}) {
  const size = o.size || 10, w = o.w || Math.max(24, String(yazi).replace(/[_^{}]/g, '').length * size * 0.56 + 12), h = size + 8, c = RENK[o.renk] || o.renk || RENK.koyu;
  const x0 = o.anchor === 'start' ? x : o.anchor === 'end' ? x - w : x - w / 2;
  return `<g><rect x="${r1(x0)}" y="${r1(y - h / 2)}" width="${r1(w)}" height="${h}" rx="${h / 2}" fill="${o.zemin || '#fff'}" stroke="${c}" stroke-width="1" opacity=".96"/><text x="${r1(x0 + w / 2)}" y="${r1(y + size * 0.36)}" font-family="${FONT}" font-size="${size}" font-weight="800" fill="${c}" text-anchor="middle">${mt(yazi)}</text></g>`;
}
// Düz yazı (ekran), beyaz haleli
function yazi(x, y, s, o = {}) {
  const size = o.size || 10, a = o.anchor || 'middle', c = RENK[o.renk] || o.renk || RENK.siyah;
  return `<text x="${r1(x)}" y="${r1(y)}" font-family="${FONT}" font-size="${size}" font-weight="${o.weight || 700}" fill="${c}" text-anchor="${a}" paint-order="stroke" stroke="${o.hale || '#fff'}" stroke-width="${o.haleW ?? 2.6}" stroke-linejoin="round"${o.italic ? ' font-style="italic"' : ''}>${mt(s)}</text>`;
}
// Parıltı / ışın (ekran)
function parilti(cx, cy, r, renk = 'gunes', n = 8) {
  const c = RENK[renk] || renk; let s = '';
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, r0 = r * 0.55; s += `<line x1="${r1(cx + Math.cos(a) * r0)}" y1="${r1(cy + Math.sin(a) * r0)}" x2="${r1(cx + Math.cos(a) * r)}" y2="${r1(cy + Math.sin(a) * r)}" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/>`; }
  return s;
}
// Dalga çizgisi (ekran): (x1,y) -> (x2,y), genlik A, dalga sayısı n
function dalga(x1, y, x2, A, n, renk = 'gok', w = 2.2) {
  const c = RENK[renk] || renk; let d = '';
  for (let i = 0; i <= 60; i++) { const t = i / 60, x = x1 + (x2 - x1) * t; d += (i ? 'L' : 'M') + r1(x) + ',' + r1(y - A * Math.sin(t * n * Math.PI * 2)); }
  return `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
}

/* ---------- hazır nesneler (sahne parçaları) ---------- */
const N = {
  // Basit insan figürü (ekran): ayak noktası (x,y), boy h
  insan(u, x, y, h = 40, renk = 'gok', o = {}) {
    const k = h / 40, ten = o.ten || '#e8b892';
    let s = golge(x, y, 9 * k, 2.6 * k);
    s += `<path d="M${r1(x - 4 * k)},${r1(y)} L${r1(x - 3 * k)},${r1(y - 14 * k)} M${r1(x + 4 * k)},${r1(y)} L${r1(x + 3 * k)},${r1(y - 14 * k)}" stroke="${o.pantolon || '#34495e'}" stroke-width="${r1(4.2 * k)}" stroke-linecap="round"/>`;
    s += `<rect x="${r1(x - 6 * k)}" y="${r1(y - 29 * k)}" width="${r1(12 * k)}" height="${r1(16 * k)}" rx="${r1(5 * k)}" fill="${RENK[renk] || renk}" stroke="${ton(renk, -0.4)}" stroke-width=".8"/>`;
    s += kure(u, x, y - 34 * k, 5.6 * k, ten, { golge: false, cizgi: false });
    if (o.sac !== false) s += `<path d="M${r1(x - 5.6 * k)},${r1(y - 35 * k)} A${r1(5.6 * k)},${r1(5.6 * k)} 0 0 1 ${r1(x + 5.6 * k)},${r1(y - 35 * k)} Q${r1(x)},${r1(y - 37.5 * k)} ${r1(x - 5.6 * k)},${r1(y - 35 * k)}Z" fill="${o.sacRenk || '#3b2a20'}"/>`;
    return s;
  },
  // Ağaç (ekran)
  agac(u, x, y, h = 34) { return golge(x, y, h * 0.32, h * 0.09) + `<rect x="${r1(x - h * 0.05)}" y="${r1(y - h * 0.42)}" width="${r1(h * 0.1)}" height="${r1(h * 0.42)}" fill="#8a5a33"/>` + kure(u, x, y - h * 0.62, h * 0.3, '#4f9a5d', { golge: false }); },
  // Mıknatıs çubuğu (izometrik): N kırmızı, S mavi
  miknatis(I, x, y, z, L = 40, k = 10) { return kutu(I, x, y, z, L / 2, k, k, '#d24b3e') + kutu(I, x + L / 2, y, z, L / 2, k, k, '#2f6fb8'); },
  // Pil (yatay silindir)
  pil(I, u, x, y, z, L = 34, r = 7) { return yatSilindir(I, u, x, y, z, r, L * 0.75, '#2b3330') + yatSilindir(I, u, x + L * 0.75, y, z, r, L * 0.22, '#c9a33a'); },
  // Ampul (ekran): taban merkezi (x,y)
  ampul(u, x, y, r = 10, yanik = true) {
    let s = yanik ? `<circle cx="${x}" cy="${r1(y - r * 1.6)}" r="${r1(r * 2.2)}" fill="#ffd95a" opacity=".22"/>` : '';
    s += `<rect x="${r1(x - r * 0.45)}" y="${r1(y - r * 0.7)}" width="${r1(r * 0.9)}" height="${r1(r * 0.75)}" rx="1.5" fill="#9aa5ad" stroke="#5f6a70" stroke-width=".7"/>`;
    s += kure(u, x, y - r * 1.6, r, yanik ? '#ffe27a' : '#e8eef0', { golge: false });
    return s;
  },
  // Termometre (ekran): taban (x,y), boy h, dolu oran f
  termometre(x, y, h = 50, f = 0.6, renk = 'kirmizi') {
    const c = RENK[renk] || renk;
    return `<rect x="${x - 4}" y="${y - h}" width="8" height="${h}" rx="4" fill="#fff" stroke="#7d8a91" stroke-width="1"/><rect x="${x - 2}" y="${r1(y - h * f)}" width="4" height="${r1(h * f)}" rx="2" fill="${c}"/><circle cx="${x}" cy="${y + 2}" r="6.5" fill="${c}" stroke="${ton(c, -0.4)}" stroke-width="1"/>` +
      [0.25, 0.5, 0.75].map(t => `<line x1="${x + 4}" y1="${r1(y - h * t)}" x2="${x + 7}" y2="${r1(y - h * t)}" stroke="#7d8a91" stroke-width="1"/>`).join('');
  },
  // Alev (ekran): taban (x,y)
  alev(u, x, y, h = 22) {
    const id = u + 'al' + (++kure.n);
    return `<defs><radialGradient id="${id}" cx="50%" cy="80%" r="80%"><stop offset="0" stop-color="#fff3b0"/><stop offset=".45" stop-color="#ffb02e"/><stop offset="1" stop-color="#e2502a"/></radialGradient></defs><path d="M${x},${y} C${r1(x - h * 0.45)},${y} ${r1(x - h * 0.42)},${r1(y - h * 0.45)} ${r1(x - h * 0.12)},${r1(y - h * 0.62)} C${r1(x - h * 0.1)},${r1(y - h * 0.82)} ${r1(x + h * 0.05)},${r1(y - h * 0.9)} ${x},${y - h} C${r1(x + h * 0.3)},${r1(y - h * 0.72)} ${r1(x + h * 0.46)},${r1(y - h * 0.4)} ${r1(x + h * 0.3)},${r1(y - h * 0.12)} C${r1(x + h * 0.22)},${r1(y - h * 0.02)} ${r1(x + h * 0.1)},${y} ${x},${y}Z" fill="url(#${id})"/>`;
  },
  // Beher (ekran): taban merkezi (x,y), genişlik w, yükseklik h, sıvı oranı f
  beher(x, y, w = 30, h = 36, f = 0.55, sivi = '#7cc3e8') {
    const l = x - w / 2, r = x + w / 2, sy = y - h * f;
    return `<path d="M${l},${y - h} L${l},${y - 3} Q${l},${y} ${l + 3},${y} L${r - 3},${y} Q${r},${y} ${r},${y - 3} L${r},${y - h}" fill="rgba(220,240,250,.35)" stroke="#6f8f9f" stroke-width="1.4"/>` +
      `<path d="M${l + 1},${r1(sy)} L${l + 1},${y - 3} Q${l + 1},${y - 1} ${l + 3},${y - 1} L${r - 3},${y - 1} Q${r - 1},${y - 1} ${r - 1},${y - 3} L${r - 1},${r1(sy)}Z" fill="${sivi}" opacity=".75"/>` +
      `<ellipse cx="${x}" cy="${r1(sy)}" rx="${r1(w / 2 - 1)}" ry="2" fill="${ton(sivi, 0.35)}"/>` +
      `<line x1="${l + 4}" y1="${y - h + 6}" x2="${l + 4}" y2="${y - 6}" stroke="#fff" stroke-width="1.6" opacity=".7"/>`;
  },
  // Atom (ekran): merkez, yarıçap
  atom(u, cx, cy, R = 26, renk = 'gok') {
    const c = RENK[renk] || renk; let s = '';

      `<g clip-path="url(#${id})" fill="#5fae6a" opacity=".9"><path d="M${r1(cx - r * 0.6)},${r1(cy - r * 0.5)} q${r1(r * 0.4)},${r1(-r * 0.25)} ${r1(r * 0.6)},${r1(r * 0.1)} t${r1(r * 0.1)},${r1(r * 0.5)} q${r1(-r * 0.4)},${r1(r * 0.2)} ${r1(-r * 0.7)},0z"/><path d="M${r1(cx + r * 0.1)},${r1(cy + r * 0.2)} q${r1(r * 0.5)},${r1(-r * 0.1)} ${r1(r * 0.6)},${r1(r * 0.3)} t${r1(-r * 0.3)},${r1(r * 0.4)} q${r1(-r * 0.3)},${r1(-r * 0.2)} ${r1(-r * 0.3)},${r1(-r * 0.7)}z"/></g>` +
      '';
  },
  // Prizma (izometrik üçgen prizma, ekran yaklaşık): sol alt köşe (x,y), kenar a, derinlik d
  prizma(u, x, y, a = 40) {

      `<polygon points="${x + a / 2},${r1(y - h)} ${r1(x + a / 2 + dx)},${r1(y - h + dy)} ${r1(x + a + dx)},${r1(y + dy)} ${x + a},${y}" fill="#a9d2e8" stroke="#5d8fa8" stroke-width="1" opacity=".9"/>` +
      `<polygon points="${x},${y} ${x + a / 2},${r1(y - h)} ${x + a},${y}" fill="url(#${id})" stroke="#5d8fa8" stroke-width="1.1"/>`;
  }

/* ---------- sahne çerçevesi ----------
   Kart, hikâye ve tanım çizimleri için ortak dış görünüm: yumuşak zemin, köşe yuvarlak. */
function sahne(u, ciz, o = {}) {

  if (zem) s += `<rect class="bg" x="0" y="0" width="${w}" height="${h}" rx="${o.rx ?? 12}" fill="${zem}"/>`;

<script>
/* ============================================================
   BFY — Oynanan simülasyon not blokları (ortak çekirdek)
   Her konu klasöründe isteğe bağlı sim.js: window.BFY_SIM['9.3.2'] = [ {...}, ... ]
   Bankaya (bank.js) hiçbir şey yazılmaz: motor sim bloklarını not listesine yalnız
   gösterim sırasında, "sonra" alanındaki başlıklı nottan sonra yerleştirir.
   Sim blokları not sırası (notDizi, oyun/efsane/kart anahtarları) indekslemesine girmez.
   Ayrıntı: SIM_KILAVUZ.md
   ============================================================ */
(function () {
'use strict';
window.BFY_SIM = window.BFY_SIM || {};

/* Türkçe sayı: ondalık virgül, 10 000 ve üstünde bölünmez boşlukla binlik ayırma, eksi işareti "−". */
function sayi(x, ondalik) {
  const o = Math.max(0, Math.min(6, ondalik | 0));
  if (typeof x !== 'number' || !isFinite(x)) return String(x);
  let t = Math.abs(x).toFixed(o);
  if (+t === 0) t = (0).toFixed(o);
  const neg = x < 0 && +t !== 0;
  let [tam, kes] = t.split('.');
  if (tam.length >= 5) tam = tam.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (neg ? '−' : '') + tam + (kes ? ',' + kes : '');
}
/* Kaydırıcı adımının ondalık basamak sayısı (0,5 -> 1; 0,05 -> 2) */
function adimOndalik(adim) { const s = String(adim); return s.includes('.') ? s.split('.')[1].length : 0; }
const kaydirici = k => !Array.isArray(k.secenekler);

/* Konunun sim tanımları */
const liste = id => (window.BFY_SIM[id] || []).filter(s => s && typeof s === 'object');
/* Tüm simler: id -> tanım */
function bul(id) { for (const k of Object.keys(window.BFY_SIM)) { const s = liste(k).find(x => x.id === id); if (s) return s; } return null; }
/* Varsayılan değerler: { ad: deger } */
function degerler(s) { const v = {}; (s.kontroller || []).forEach(k => { v[k.ad] = k.deger; }); return v; }

/* Notlar + sim blokları (gösterim listesi). Sim öğesi: { tur: 'sim', sim: tanım }.
   "sonra" bir notun başlığıyla eşleşmezse (ya da yoksa) sim, notun sonuna eklenir. */
const _onbellek = new WeakMap();
const notBaslik = n => n.baslik || (n.sol && n.sol.baslik) || '';
function notSimli(konu) {
  const sims = liste(konu.id);
  if (!sims.length) return konu.not;
  const c = _onbellek.get(konu);
  if (c && c.not === konu.not && c.n === konu.not.length && c.sims === sims.length) return c.dizi;
  const dizi = konu.not.slice();
  sims.forEach(s => {
    const blok = { tur: 'sim', sim: s };
    let i = -1;
    if (s.sonra) for (let j = 0; j < dizi.length; j++) if (dizi[j].tur !== 'sim' && notBaslik(dizi[j]) === s.sonra) i = j;
    if (i < 0) { dizi.push(blok); return; }
    // aynı nottan sonra birden çok sim: yazıldıkları sırayla
    let k = i + 1; while (k < dizi.length && dizi[k].tur === 'sim') k++;
    dizi.splice(k, 0, blok);
  });
  _onbellek.set(konu, { not: konu.not, n: konu.not.length, sims: sims.length, dizi });
  return dizi;
}

/* Tanım denetimi: hata listesi (boşsa geçerli). qa/sim.py ve geliştirme sırasında kullanılır. */
function denetle(s, konuId) {
  const H = [], ad = (s && s.id) || '?';
  const h = m => H.push(`${ad}: ${m}`);
  if (!s || typeof s !== 'object') return ['tanım nesne değil'];
  if (!/^k\w+_sim\d+$/.test(s.id || '')) h('id "kKKK_simN" biçiminde olmalı');
  ['baslik', 'metin'].forEach(f => { if (!s[f] || typeof s[f] !== 'string') h(f + ' eksik'); });
  if (typeof s.ciz !== 'function') h('ciz(v, u) fonksiyonu eksik');
  if (typeof s.olcumler !== 'function') h('olcumler(v) fonksiyonu eksik');
  if (s.denklem != null && typeof s.denklem !== 'function') h('denklem bir fonksiyon olmalı');
  if (s.gorevCevap && !s.gorev) h('gorevCevap var ama gorev yok');
  const ks = s.kontroller;
  if (!Array.isArray(ks) || !ks.length || ks.length > 3) h('kontroller 1–3 öğe olmalı');
  const adlar = new Set();
  (ks || []).forEach((k, i) => {
    const kk = `kontrol ${i + 1} (${k.ad})`;
    if (!/^[a-zA-Z_]\w*$/.test(k.ad || '')) h(kk + ': ad geçersiz');
    if (adlar.has(k.ad)) h(kk + ': ad tekrar ediyor'); adlar.add(k.ad);
    if (!k.etiket) h(kk + ': etiket eksik');
    if (kaydirici(k)) {
      ['min', 'max', 'adim', 'deger'].forEach(f => { if (typeof k[f] !== 'number' || !isFinite(k[f])) h(`${kk}: ${f} sayı olmalı`); });
      if (!(k.max > k.min)) h(kk + ': max > min olmalı');
      if (!(k.adim > 0)) h(kk + ': adim > 0 olmalı');
      if (k.deger < k.min || k.deger > k.max) h(kk + ': deger aralık dışında');
      const n = (k.deger - k.min) / k.adim, m = (k.max - k.min) / k.adim;
      if (Math.abs(n - Math.round(n)) > 1e-6) h(kk + ': deger adıma oturmuyor');
      if (Math.abs(m - Math.round(m)) > 1e-6) h(kk + ': (max − min) adımın tam katı değil');
      if (!k.birim && k.birim !== '') h(kk + ': birim eksik (birimsizse birim: \'\')');
    } else {
      if (k.secenekler.length < 2 || k.secenekler.length > 5) h(kk + ': 2–5 seçenek olmalı');
      if (!k.secenekler.some(o => o.deger === k.deger)) h(kk + ': deger seçeneklerde yok');
      k.secenekler.forEach(o => { if (!o.etiket) h(kk + ': seçenek etiketi eksik'); });
    }
  });
  // Metin kuralları: "·" yok; cümleler nokta ya da soru işaretiyle biter.
  ['baslik', 'metin', 'pdfMetin', 'gorev', 'gorevCevap'].forEach(f => {
    const t = s[f]; if (!t) return;
    if (t.includes('·')) h(f + ': "·" kullanılmaz (çarpma için $\\cdot$)');
    if (f !== 'baslik' && !/[.?!][")”’]*$/.test(t.trim())) h(f + ': nokta ya da soru işaretiyle bitmeli');
  });
  if (s.baslik && /[.]$/.test(s.baslik.trim())) h('baslik nokta ile bitmez');
  if (typeof s.olcumler === 'function' && ks && ks.length) {
    try {
      const o = s.olcumler(degerler(s));
      if (!Array.isArray(o) || !o.length || o.length > 4) h('olcumler 1–4 öğe döndürmeli');
      else o.forEach((x, i) => { if (!x.etiket || typeof x.deger !== 'number' || !isFinite(x.deger)) h(`ölçüm ${i + 1}: etiket ve sonlu sayı olmalı`); });
    } catch (e) { h('olcumler hata verdi: ' + e.message); }
  }
  if (konuId && window.BFY_BANK && window.BFY_BANK[konuId] && s.sonra && !window.BFY_BANK[konuId].not.some(n => notBaslik(n) === s.sonra)) h(`sonra: "${s.sonra}" başlıklı not bulunamadı (sim notun sonuna eklenir)`);
  return H;
}

window.BFY_SIM_ARAC = { sayi, adimOndalik, kaydirici, liste, bul, degerler, notSimli, denetle };
})();

</script>
<script>
/* ============================================================
   BFY — Ben Fizik Yapabilirim YKS 2027 AYT · A.2.4 İndüksiyon, Alternatif Akım ve Transformatörler — şekiller
   Önek: kA24_ (soru, not ve çözümlü örnek şekilleri; düz 2B), iA24_ (not tanım çizimi; 3B izometrik).
   Yön kuralları: ⊗ sayfa düzleminden içe, ⊙ dışa. Halkada bakana göre saat yönünün tersine akım, bakana doğru alan oluşturur.
   Devre sembolleri: direnç (zikzak), bobin (ilmek), sığaç (iki levha), ampul (çarpılı daire), AA kaynağı (~), pil (uzun/kısa çizgi).

(function () {
const { P, T, arrow, svg, dashLine } = window.BFY_FIGLIB;

const uc = (x, y) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="3.6" fill="#fff" stroke="${TEL}" stroke-width="1.6"/>`;

}

}
// Alan bölgesi: dikdörtgen içinde düzenli ⊗ / ⊙ ızgarası; atla(x,y) true dönen noktalar çizilmez
function alan(x0, y0, w, h, dx, dy, tur, atla = () => false, o = {}) {
  let s = `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="${o.fill || '#eef3f8'}" stroke="${o.st || '#b9c7d3'}" stroke-width="1" stroke-dasharray="${o.dash || '5 3'}"/>`;

// Yatay direnç (zikzak), x1 → x2
function direncH(x1, x2, y, o = {}) {
  const n = 6, L = x2 - x1, a = 7, pad = L * 0.18, w = (L - 2 * pad) / n;
  let d = `M${f1(x1)} ${f1(y)} L${f1(x1 + pad)} ${f1(y)}`;
  for (let i = 0; i < n; i++) d += ` L${f1(x1 + pad + w * (i + 0.5))} ${f1(y + (i % 2 ? a : -a))}`;
  d += ` L${f1(x2 - pad)} ${f1(y)} L${f1(x2)} ${f1(y)}`;

  const pad = 6, r = (x2 - x1 - 2 * pad) / (2 * n);
  let d = `M${f1(x1)} ${f1(y)} L${f1(x1 + pad)} ${f1(y)}`;
  for (let i = 0; i < n; i++) d += ` a${f1(r)} ${f1(r * 1.15)} 0 0 1 ${f1(2 * r)} 0`;

}

    `<line x1="${f1(x - g)}" y1="${f1(y - h)}" x2="${f1(x - g)}" y2="${f1(y + h)}" stroke="${TEL}" stroke-width="2.4"/><line x1="${f1(x + g)}" y1="${f1(y - h)}" x2="${f1(x + g)}" y2="${f1(y + h)}" stroke="${TEL}" stroke-width="2.4"/>`;
}
function sigacV(x, y, o = {}) {

  return `<rect x="${f1(x - 3)}" y="${f1(y - g - 2)}" width="6" height="${f1(2 * g + 4)}" fill="${o.bg || '#fff'}"/>` +
    `<line x1="${f1(x - h)}" y1="${f1(y - g)}" x2="${f1(x + h)}" y2="${f1(y - g)}" stroke="${TEL}" stroke-width="2.4"/><line x1="${f1(x - h)}" y1="${f1(y + g)}" x2="${f1(x + h)}" y2="${f1(y + g)}" stroke="${TEL}" stroke-width="2.4"/>`;
}

function ampul(x, y, r = 9) {

const kapaliKutu = (x, y, w, h, ad) => `<rect x="${f1(x - w / 2)}" y="${f1(y - h / 2)}" width="${w}" height="${h}" rx="3" fill="#e5e9ec" stroke="${TEL}" stroke-width="1.8"/>` + T(x, y + 5, ad, { size: 14, anchor: 'middle', weight: 800, halo: false });

  return `<path d="M${x} ${y} h${w} v${h} h${-w}Z M${x + k} ${y + k} v${h - 2 * k} h${w - 2 * k} v${-(h - 2 * k)}Z" fill="#a9b3ba" fill-rule="evenodd" stroke="#6c777e" stroke-width="1.2"/>`;

function sarim(cx, y1, y2, n, k = 14) {
  const h = (y2 - y1) / n; let s = '';
  for (let i = 0; i < n; i++) { const y = y1 + h * (i + 0.5); s += `<path d="M${f1(cx - k / 2 - 3)} ${f1(y - h * 0.35)} L${f1(cx + k / 2 + 3)} ${f1(y + h * 0.35)}" stroke="${BAK}" stroke-width="3" stroke-linecap="round"/>`; }
  return s;
}

/* ---------- grafik ekseni (T_2_3 kalıbı) ---------- */
function eksen(o) {
  const { x0, y0, W, H, tMax, vMin, vMax } = o;
  const sx = t => x0 + t / tMax * W, sy = v => y0 + (vMax - v) / (vMax - vMin) * H;
  let s = '';
  if (o.panel) s += `<rect class="bg" x="${o.panel[0]}" y="${o.panel[1]}" width="${o.panel[2]}" height="${o.panel[3]}" rx="10" fill="#f6f9f7"/>`;
  const top = y0 - 8, zy = sy(0), right = sx(tMax) + 12;
  s += `<line x1="${x0}" y1="${f1(sy(vMin) + (vMin < 0 ? 4 : 0))}" x2="${x0}" y2="${top + 4}" stroke="${P.ink}" stroke-width="1.5"/><polygon points="${x0},${top - 6} ${x0 - 4},${top + 4} ${x0 + 4},${top + 4}" fill="${P.ink}"/>`;
  s += `<line x1="${x0}" y1="${f1(zy)}" x2="${right - 2}" y2="${f1(zy)}" stroke="${P.ink}" stroke-width="1.5"/><polygon points="${right + 8},${f1(zy)} ${right - 2},${f1(zy - 4)} ${right - 2},${f1(zy + 4)}" fill="${P.ink}"/>`;
  s += T(x0 + 8, top + 2, o.yLabel, { size: 12.5, weight: 800 });
  s += T(right + 11, zy + 4.5, o.tLabel || 't (s)', { size: 12.5, weight: 800 });
  (o.tTicks || []).forEach(([t, l, ust]) => { s += `<line x1="${f1(sx(t))}" y1="${f1(zy - 3)}" x2="${f1(sx(t))}" y2="${f1(zy + 3)}" stroke="${P.ink}" stroke-width="1.2"/>` + T(sx(t), ust ? zy - 7 : zy + 16, l, { size: 12, anchor: 'middle', weight: 600, fill: P.ink2 }); });
  (o.vTicks || []).forEach(([v, l]) => { s += `<line x1="${x0 - 3}" y1="${f1(sy(v))}" x2="${x0 + 3}" y2="${f1(sy(v))}" stroke="${P.ink}" stroke-width="1.2"/>` + T(x0 - 7, sy(v) + 4.5, l, { size: 12, anchor: 'end', weight: 600, fill: P.ink2 }); });
  return { s, sx, sy, zy };
}
const cizgi = (pts, sx, sy, c = MAV, w = 2.8) => `<polyline points="${pts.map(([t, v]) => f1(sx(t)) + ',' + f1(sy(v))).join(' ')}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;

// Yatay çubuk mıknatıs: sol yarı solKutup
function miknatisH(x, y, w, h, solKutup) {
  const sol = solKutup === 'N' ? KIR : MAV, sag = solKutup === 'N' ? MAV : KIR, sagK = solKutup === 'N' ? 'S' : 'N';
  return `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w / 2)}" height="${h}" fill="${sol}" stroke="#333" stroke-width=".8"/><rect x="${f1(x + w / 2)}" y="${f1(y)}" width="${f1(w / 2)}" height="${h}" fill="${sag}" stroke="#333" stroke-width=".8"/>` +
    T(x + w / 4, y + h / 2 + 4.5, solKutup, { size: 12.5, anchor: 'middle', weight: 800, fill: '#fff', halo: false }) + T(x + 3 * w / 4, y + h / 2 + 4.5, sagK, { size: 12.5, anchor: 'middle', weight: 800, fill: '#fff', halo: false });
}
function miknatisV(x, y, w, h, ustKutup) {
  const ust = ustKutup === 'N' ? KIR : MAV, alt = ustKutup === 'N' ? MAV : KIR, altK = ustKutup === 'N' ? 'S' : 'N';
  return `<rect x="${f1(x)}" y="${f1(y)}" width="${w}" height="${f1(h / 2)}" fill="${ust}" stroke="#333" stroke-width=".8"/><rect x="${f1(x)}" y="${f1(y + h / 2)}" width="${w}" height="${f1(h / 2)}" fill="${alt}" stroke="#333" stroke-width=".8"/>` +
    T(x + w / 2, y + h / 4 + 4.5, ustKutup, { size: 12, anchor: 'middle', weight: 800, fill: '#fff', halo: false }) + T(x + w / 2, y + 3 * h / 4 + 4.5, altK, { size: 12, anchor: 'middle', weight: 800, fill: '#fff', halo: false });
}
// Kenar boyunca akım okları (dikdörtgen çerçeve): ccw = bakana göre saat yönünün tersi
function cerceveAkim(x, y, w, h, ccw, c = KIR) {
  let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${BAK}" stroke-width="3.2"/>`;
  const mx = x + w / 2, my = y + h / 2;
  // ccw: üst kenar sola, sol kenar aşağı, alt kenar sağa, sağ kenar yukarı
  const k = ccw ? 1 : -1;
  s += head(mx - 7 * k, y, -k, 0, c, 10, 5) + head(mx + 7 * k, y + h, k, 0, c, 10, 5) + head(x, my + 7 * k, 0, k, c, 10, 5) + head(x + w, my - 7 * k, 0, -k, c, 10, 5);
  return s;
}

      dogru: 2,
      cozum: [
        r`İletilen güç $P = V \cdot I$'dır. Aynı gücü taşırken gerilim büyütülünce hattaki akım küçülür.`,
        r`Tellerde ısıya dönüşen güç $I^2 \cdot R_\text{hat}$'tır; akım küçülünce kayıp çok daha hızlı azalır.`,
        r`{{S1}} gerilim ile akımın birlikte arttığını sanır; aynı güçte gerilim büyüyünce akım küçülür. {{S0}} direncin gerilime bağlı olduğunu sanır; direnç telin cinsine, boyuna ve kesitine bağlıdır. {{S3}} transformatörün güç ürettiğini sanır; ideal transformatör gücü yalnız aktarır, gerçekte biraz da kayıp olur. {{S4}} transformatörün frekansı değiştirdiğini sanır; frekans iki tarafta aynıdır.`
      ]

      id: 'kA24_03', yks: true, zorluk: 1, tur: 'cs', cikti: '11.2.6.2', beceri: 'Şekil okuma ve kavram', cikmis: { yil: 2021, no: 7, kalip: 'İletim zincirindeki iki transformatörün primer ve sekonder ilişkileri' },
      metin: r`Bir rüzgâr santralinde türbin jeneratörleri $690\ \text{V}$ gerilim üretiyor. Bu gerilim T1 transformatörüyle $34,5\ \text{kV}$'a çıkarılıp hatla taşınıyor, T2 transformatörüyle $400\ \text{V}$'a düşürülerek bir fabrikaya veriliyor. Transformatörler ideal kabul ediliyor.

        'T1\'de sekonder akımı primer akımından küçük, T2\'de sekonder akımı primer akımından büyüktür.',

        r`T2 gerilimi $34,5\ \text{kV}$'tan $400\ \text{V}$'a düşürür (düşürücü, $N_p > N_s$); sekonder akımı primerden büyüktür.`,
        r`{{S1}} akımın da gerilimle birlikte arttığını sanır; ideal transformatörde ikisi ters orantılıdır. {{S2}} T2'nin de akımı küçülttüğünü sanır; fabrikaya düşük gerilim, büyük akım gider. {{S3}} T1'in de akımı büyüttüğünü sanır; hatta küçük akım istenir. {{S4}} seri bağlı gibi düşünüp akımın iki bobinde aynı olduğunu sanır; bobinler arasında akım değil, değişen akı aktarılır.`

    },
    {
      id: 'kA24_04', yks: true, zorluk: 1, tur: 'cs', cikti: '11.2.4.9', beceri: 'Gözlemi açıklama',
      tahmin: { gerekce: r`Öz-indüksiyon (11.2.4.9) programda ayrı bir kazanım ama 2018–2026 AYT'lerinde hiç sorulmadı. Hesap gerektirmeyen, gözlemi açıklatan bu kalıp ÖSYM'nin kavramsal tarzına uyar.` },
      metin: r`Ahmet, çok sarımlı demir çekirdekli bir bobini $6\ \text{V}$'luk bir pile ve bir anahtara bağlıyor. Bobinin uçlarına paralel olarak, ancak yaklaşık $70\ \text{V}$'ta ışık veren bir neon lamba bağlıyor. Anahtar kapalıyken lamba yanmıyor; anahtar açıldığı an lamba kısa bir süre parlayıp sönüyor.

Bu gözlemin en doğru açıklaması aşağıdakilerden hangisidir?`,
      secenekler: [
        'Akım hızla azalırken bobindeki akı değişimi, bu azalmaya karşı koyan büyük bir öz-indüksiyon emk\'si oluşturur.',

        'Anahtar açılınca bobinin direnci sıfıra düşer ve akım bir an büyür.'

      cozum: [

        r`Anahtar açılınca akım çok kısa sürede sıfıra iner. Bobindeki akının hızlı değişimi, Lenz yasasına göre akımın azalmasına karşı koyan büyük bir emk oluşturur. Bu emk pilin geriliminden çok büyük olup lambayı yakacak düzeye çıktığı için lamba bir an parlar.`,
        r`{{S1}} bobinin enerjiyi yük olarak depoladığını sanır; bobin enerjiyi manyetik alanında tutar ve gerilimi akım değişimi oluşturur. {{S2}} pilin gerilimini değişken sanır; pil $6\ \text{V}$'tan büyük gerilim veremez. {{S3}} lambayı mıknatıslanmanın yaktığını sanır; lambayı yakan uçlarındaki gerilimdir. {{S4}} anahtar açılınca devreden akım geçebileceğini sanır; açık devrede akım büyümez, sıfıra iner.`

    {

      tahmin: { gerekce: r`Etkin ve maksimum değer (11.2.5.2 c) programda vurgulanıyor ama 9 yılda sorulmadı. Farklı ülkelerin şebeke değerleri programın önerdiği bağlamdır; kalıp kısa ve kavramsaldır.` },
      metin: r`Can, yurt dışında ziyaret ettiği bir ülkede prizlerdeki gerilimin etkin değerinin $120\ \text{V}$, frekansının $60\ \text{Hz}$ olduğunu öğreniyor.

Buna göre,

I. Prizdeki gerilimin en büyük değeri yaklaşık $168\ \text{V}$'tur.
II. Bu prize bağlı bir cihazdan geçen akımın yönü saniyede $60$ kez değişir.
III. Bu prize bağlanan bir ısıtıcı, $120\ \text{V}$'luk doğru gerilime bağlandığında aynı sürede aynı ısıyı üretir.

yargılarından hangileri doğrudur? ($\sqrt{2} \approx 1,4$)`,
      secenekler: [r`Yalnız I`, r`Yalnız II`, r`Yalnız III`, r`I ve II`, r`I ve III`],
      dogru: 4,
      cozum: [
        r`I. $V_\text{max} = \sqrt{2} \cdot V_\text{etkin} \approx 1,4 \cdot 120 = 168\ \text{V}$. **Doğru.**`,
        r`II. $60\ \text{Hz}$'de akım saniyede $60$ tam salınım yapar; her salınımda yön iki kez değişir, yani saniyede $120$ kez. **Yanlış.**`,
        r`III. Etkin değer, aynı dirençte aynı sürede aynı ısıyı üreten doğru gerilim değeridir. **Doğru.**`,
        r`{{S0}} etkin değerin tanımı olan III'ü atlar. {{S1}} bir salınımda yönün iki kez değiştiğini atlar; doğru olan I ve III'ü de dışarıda bırakır. {{S2}} en büyük değerin etkin değerin $\sqrt{2}$ katı olduğunu görmez. {{S3}} frekans ile yön değişim sayısını eşit sanır ve III'ü atlar.`
      ]
    },
    {
      id: 'kA24_06', yks: true, zorluk: 1, tur: 'cs', cikti: '11.2.4.11', beceri: 'Motor ve dinamo ilkesi',
      tahmin: { gerekce: r`Motor ve dinamonun karşılaştırılması (11.2.4.11 b) program açıklamasında açıkça isteniyor; analizde "dönen çerçevede emk ve üreteç ilkesi" sorulmamış alt başlıklar arasında. Günlük hayat bağlamlı I-II-III biçimi ÖSYM'nin en sık kalıbıdır.` },
      metin: r`Bazı elektrikli bisikletlerde tekerleği döndüren makine, yokuş çıkarken motor olarak çalışır; yokuş inerken fren yapıldığında ise dinamo gibi çalışarak aküyü şarj eder.

yargılarından hangileri doğrudur?`,

      dogru: 3,
      cozum: [
        r`I. Motor, akım geçen bobinlere etkiyen manyetik kuvvetlerle döner: elektrik enerjisi mekanik enerjiye dönüşür. **Doğru.**`,

        r`III. Lenz yasasına göre indüksiyon akımı, onu oluşturan harekete karşı koyar; kuvvet dönmeyi yavaşlatır. Fren etkisi buradan gelir. **Yanlış.**`,
        r`{{S0}} dinamonun indüksiyonla çalıştığını atlar. {{S1}} motorda elektrik enerjisinin mekanik enerjiye dönüştüğünü atlar. {{S2}} indüksiyon akımının harekete karşı koyduğunu görmez ve doğru olan I ile II'yi dışarıda bırakır. {{S4}} motoru atlar ve indüksiyon akımının dönmeye yardım ettiğini sanır; öyle olsaydı enerji bedavaya üretilirdi.`

      id: 'kA24_07', yks: true, zorluk: 2, tur: 'cs', cikti: '11.2.4.7', beceri: 'Deney yorumlama', cikmis: { yil: 2019, no: 6, kalip: 'Halkalardan düşen mıknatısların varış sırası (Lenz)' },
      metin: r`Fizik kulübünde Selin, aynı boyutta üç halkayı yalıtkan ayaklar üzerine yatay olarak yerleştiriyor: K tam bir bakır halka, L üzerinde ince bir yarık bulunan bakır halka, M plastik halkadır. Halkalar aynı kalınlıkta telden bükülmüştür. Selin, özdeş üç çubuk mıknatısı halkaların üstünde aynı yükseklikten, halkaların içinden geçecek biçimde aynı anda serbest bırakıyor.

Hava direnci önemsiz olduğuna göre,

yargılarından hangileri doğrudur?`,

      secenekler: [r`Yalnız I`, r`Yalnız II`, r`I ve II`, r`I ve III`, r`I, II ve III`],

      cozum: [
        r`I. Mıknatıs K'ye yaklaşırken ve K'den uzaklaşırken halkadaki akı değişir. Kapalı halkada indüksiyon akımı dolaşır ve Lenz yasasına göre harekete karşı koyar; mıknatıs frenlenir, en son ulaşır. **Doğru.**`,
        r`II. L'de de emk oluşur ama yarık devreyi açtığı için akım dolaşamaz; M yalıtkandır. İki mıknatıs da serbest düşer ve aynı anda ulaşır. **Doğru.**`,
        r`III. Mıknatıs ters çevrilince indüksiyon akımının yönü de değişir ama yine harekete karşı koyar. Fren etkisi kutup yönelimine bağlı değildir. **Yanlış.**`,
        r`{{S0}} yarıklı halkada akım dolaşamadığını görmez. {{S1}} kapalı bakır halkanın mıknatısı frenlediğini atlar. {{S3}} ve {{S4}} kutup ters çevrilince halkanın mıknatısı çekip hızlandıracağını sanır; Lenz'e göre karşı koyma her durumda vardır.`

    },
    {
      id: 'kA24_08', yks: true, zorluk: 2, tur: 'cs', cikti: '11.2.5.3', beceri: 'Bağlamı fizik diline çevirme', cikmis: { yil: 2019, no: 7, kalip: 'Frekansa göre süzme yapacak elemanları seçme' },
      metin: r`Bir atölyede çalışan matkap, prize bağlı hatta yüksek frekanslı parazit gerilimler karıştırıyor. Teknisyen, aynı hattan beslenen bir buzdolabının kontrol kartına $50\ \text{Hz}$'lik şebeke akımının kolayca, yüksek frekanslı parazit akımlarının ise zorlukla ulaşmasını istiyor. Bunun için karta giden hatta seri olarak tek bir eleman ekleyecektir.

I. sığaç,

elemanlarından hangileri kullanılabilir?`,
      secenekler: [r`Yalnız I`, r`Yalnız II`, r`Yalnız III`, r`I ve III`, r`II ve III`],

      cozum: [
        r`İstenen: düşük frekansa küçük, yüksek frekansa büyük karşı koyan eleman.`,

        r`{{S0}} bobin ile sığacın frekans davranışını ters eşler. {{S2}} direncin akımı zayıflatmasını frekans seçebilmesi sanır. {{S3}} sığacı seçer ve direnci de frekans ayırt eden bir eleman sayar. {{S4}} bobinin yanında direnci de frekans ayırt eden bir eleman sayar; direnç paraziti şebeke akımından daha zor geçirmez.`

    {

      metin: r`Bir deney arabasının üzerine düşey olarak tutturulmuş iletken MN çubuğu, araba ile birlikte sayfa düzleminden dışa doğru olan düzgün manyetik alan bölgesinde şekildeki gibi sağa doğru sabit hızla ilerliyor. Çubuk herhangi bir devreye bağlı değildir.

yargılarından hangileri doğrudur?`,

      secenekler: [r`Yalnız I`, r`I ve II`, r`I ve III`, r`II ve III`, r`I, II ve III`],

      metin: r`Bir apartmanda asansör motorunu şebekeden besleyen transformatörün etiketi silinmiştir. Teknisyen, transformatörün çalışırken ısındığını, yani ideal olmadığını biliyor; primer ve sekonder sarım sayılarını bilmiyor.

      metin: r`Bir elektronik atölyesinde Deniz, her birinin içinde tek bir ideal devre elemanı (direnç, bobin ya da sığaç) bulunan X, Y ve Z kutularını sırayla frekansı ayarlanabilen bir alternatif gerilim kaynağına bağlıyor. Kaynağın etkin gerilimi sabit tutulup frekans artırılırken kutudan geçen etkin akımı gözlüyor.

/* ---------------- Ücretsiz vitrin ----------------
   Her konudan 4 çoktan seçmeli, hepsi şekilli: sahneli, dolgun çizimli sorular öne çıkar,

const _vitrin = {};
function vitrinListesi(k) {
  if (_vitrin[k.id]) return _vitrin[k.id];
  if (Array.isArray(k.vitrin) && k.vitrin.length) return (_vitrin[k.id] = k.vitrin);
  const cs = k.sorular.filter(q => q.tur === 'cs');

  const sec = [];
  const al = (liste, n) => { for (const q of liste) { if (sec.length >= 4 || n <= 0) break; if (!sec.includes(q)) { sec.push(q); n--; } } };
  // En dolgun çizimliler seçilir; aynı zorluktan en çok 2 soru.
  const say = z => sec.filter(q => q.zorluk === z).length;
  for (const q of sekilli(0)) { if (sec.length >= 4) break; if (say(q.zorluk) < 2) sec.push(q); }
  al(sekilli(0), 4 - sec.length); al(cs, 4 - sec.length);
  return (_vitrin[k.id] = sec.sort((a, b) => a.zorluk - b.zorluk).map(q => q.id));

// ks: soruların alınacağı konular (varsayılan seçili konular; TYT konu konu kitapçığında tek konu).
function soruSec(seed, ks = secKonular()) {
  const rnd = rng(seed);
  let havuz = [];
  ks.forEach(k => k.sorular.forEach(q => havuz.push({ ...q, konu: k })));
  if (S.seviye === 0) {
    // Ücretsiz vitrin: her konudan 4 şekilli soru (bkz. vitrinListesi)
    const sec = [];
    ks.forEach(k => { const v = vitrinListesi(k); sec.push(...havuz.filter(q => q.konu === k && v.includes(q.id))); });
    return sec.sort((a, b) => a.zorluk - b.zorluk);
  }
  // Etkileşimli türler (eşleştir, sınıfla, sırala) tek seçenekle açılıp kapanır.
  havuz = havuz.filter(q => (ETK.etkMi(q) ? S.turler.etk !== false : S.turler[q.tur]));
  if (S.zorluk !== 'karisik') havuz = havuz.filter(q => q.zorluk === +S.zorluk);

  let setSorulari = [];
  if (S.turler.set !== false && S.turler.cs && S.zorluk === 'karisik') {
    const tum = []; ks.forEach(k => (k.setler || []).forEach(st => tum.push({ st, k })));
    const nSet = S.soruSayisi === 'hepsi' ? tum.length : Math.min(tum.length, Math.floor(+S.soruSayisi * 0.4 / 3));
    shuffle(tum, rnd).slice(0, nSet).forEach(({ st, k }) => st.sorular.forEach((q, j) => setSorulari.push({ ...q, tur: q.tur || 'cs', konu: k, set: st, setSira: j })));
  }

  let secim;

    // dengeli dağılım: ~%30 ★, %45 ★★, %25 ★★★
    const by = { 1: shuffle(havuz.filter(q => q.zorluk === 1), rnd), 2: shuffle(havuz.filter(q => q.zorluk === 2), rnd), 3: shuffle(havuz.filter(q => q.zorluk === 3), rnd) };
    const hedef = { 1: Math.round(n * 0.3), 3: Math.round(n * 0.25) }; hedef[2] = n - hedef[1] - hedef[3];
    secim = [];

}
// Bir seçenekteki sayıları sırayla çıkarır (ondalık virgül, binlik boşluk, kesir, 10^n dahil).
function sayiDizisi(o) {
  let s = o.replace(/\{,\}/g, '.').replace(/(\d),(\d)/g, '$1.$2');
  for (let k = 0; k < 3; k++) s = s.replace(/(\d)\\,(\d{3})/g, '$1$2').replace(/(\d) (\d{3})\b/g, '$1$2');

  s = s.replace(/(\d+(?:\.\d+)?)\s*\\(?:cdot|times)\s*10\^\{?([-−]?\d+)\}?/g, (_, a, e) => ' ' + (parseFloat(a) * Math.pow(10, parseInt(e.replace('−', '-'), 10))) + ' ');

// "Yalnız I", "I ve II", "I, II ve III" gibi yargı seçenekleri ("Işık…" gibi I ile başlayan metinler değil)
const yargiSecenegi = o => /^(Yalnız )?(III|II|I)((, (III|II|I))*( ve (III|II|I)))?$/.test(String(o).trim());
function seceneklerKaristir(q, rnd) {
  if (q.tur !== 'cs') return q;
  const ops = q.secenekler;
  // Sayısal (birimli, "ve" ile ikili, noktalı virgüllü) seçenekler yazıldığı sırada kalır
  const sayisal = o => {
    if (!/\d/.test(o)) return false;
    const k = o.replace(/\\text\{[^}]*\}/g, ' ').replace(/\\(dfrac|tfrac|frac|cdot|times|approx|circ|,|;|\s)/g, ' ')
      .replace(/\b(ve|ile)\b/g, ' ').replace(/[${}()\[\]^_;,.:%°=≈×·\-−–\/\s\\]/g, ' ')
      .replace(/\b(m|cm|mm|km|s|ms|ns|h|kg|g|N|mN|kN|J|W|kW|V|kV|mV|A|mA|T|Wb|lx|lm|cd|Hz|rad|K|C|nC|μN|μT|kWh|dk|birim|kat|katı|q|B|E|F|ϑ|k|d|L|R)\b/g, ' ');

  // Aynı kalıpta yalnız sayıları farklı seçenekler ("L = 95 cm; x = 20 cm") da yazıldığı sırada kalır.
  const kalip = o => o.replace(/\d+(\{?[.,]\}?\d+)?/g, '#').replace(/\s+/g, ' ').trim();
  const ayniKalip = /\d/.test(ops[0] || '') && ops.every(o => /\d/.test(o) && kalip(o) === kalip(ops[0]));
  const harfKumesi = o => /^(Yalnız )?\$?[A-ZÇĞİÖŞÜ]\$?((, | ve )\$?[A-ZÇĞİÖŞÜ]\$?)*$/.test(o.trim()) && !/^(Yalnız )?I/.test(o.trim());
  const sabit = ops.every(yargiSecenegi) || ops.every(sayisal) || ops.every(nokta) || ops.every(harfKumesi) || ayniKalip;
  if (sabit) {
    const idx = ops.map((_, i) => i);
    if (ops.every(yargiSecenegi)) return { ...q, sira: idx };
    // Sayısal ve nokta harfli seçenekler küçükten büyüğe / alfabetik basılır ({{Sx}} eşlemesi sira ile korunur).
    // "Yalnız K", "K ve L", "K, L ve M" gibi harf kümesi seçenekleri: önce tekler, sonra ikililer, sonra üçlüler.
    if (ops.every(harfKumesi)) {
      const hk = o => o.replace(/Yalnız|ve|[$,\s]/g, ' ').trim().split(/\s+/);
      return { ...q, sira: idx.sort((a, b) => { const x = hk(ops[a]), y = hk(ops[b]); return x.length - y.length || x.join('').localeCompare(y.join(''), 'tr') || a - b; }) };
    }
    if (ops.every(nokta)) {
      const h = o => o.replace(/[$\s]|noktası/g, '');
      return { ...q, sira: idx.sort((a, b) => h(ops[a]).localeCompare(h(ops[b]), 'tr') || a - b) };
    }
    const d = sayiDizisi;
    return { ...q, sira: idx.sort((a, b) => { const x = d(ops[a]), y = d(ops[b]); for (let i = 0; i < Math.min(x.length, y.length); i++) if (x[i] !== y[i]) return x[i] - y[i]; return x.length - y.length || a - b; }) };
  }
  const sira = shuffle(ops.map((_, i) => i), rnd);

}

}

// Çıkmış soru analizi (PDF): yıllara göre sayı şeridi, kalıplar ve kartlar (soru metni yok, resmî kitapçık adresiyle).

// Simülasyon (PDF): varsayılan değerlerle durağan sahne, başlık, kısa metin ve şekildeki değerler.
let _simU = 0;
function simPdfBlok(s) {
  const A = window.BFY_SIM_ARAC, v = A.degerler(s);

// Çözümlü örnek (TYT): soru + 5 şık; seçenek sırası örneğin kimliğine bağlıdır (PDF ve uygulamada aynı).
// PDF'te iki blok: soru bloğu ve kutulu çözüm bloğu (sayfa sonunda ayrılabilir).
function hashSayi(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const _cz = {};
function cozumluHazirla(n) { const id = n.id || n.baslik; if (!_cz[id]) _cz[id] = seceneklerKaristir({ ...n, tur: 'cs', id }, rng(hashSayi(id))); return _cz[id]; }
const cikmisEtiket = c => (c ? `Çıkmış soru benzeri${c.yil ? ' (' + esc(c.yil) + (c.no ? ` ${esc(c.oturum || UR.sinav)}, ${esc(c.no)}. soru` : '') + ')' : ''}` : '');
function cozumluBloklari(n, no) {

  const govde = md(n.metin, ctx), ic = /\{\{sekil\}\}/.test(n.metin);
  const ops = q.sira.map(i => n.secenekler[i]), maxL = Math.max(...ops.map(plainLen));
  const sec = `<ol class="sec ${maxL <= 9 ? 'k5' : maxL <= 26 ? 'k2' : 'k1'}">${ops.map((o, i) => `<li><b>${HARF[i]})</b><span>${inline(o)}</span></li>`).join('')}</ol>`;
  const z = n.zorluk || 1;
  const ust = `<div class="cz-bas"><span class="na-etk mavi">Çözümlü örnek ${no}</span><span class="q-z z${z}">${yildiz(z)} ${ZAD[z]}</span>${n.cikmis ? `<span class="cz-cik">${cikmisEtiket(n.cikmis)}</span>` : ''}</div><h3>${esc(n.baslik)}</h3>`;

  const harfle = c => c.replace(/\{\{S(\d)\}\}/g, (_, x) => HARF[q.sira.indexOf(+x)]);
  const kutu = (cls, et, m) => (m ? `<div class="${cls}"><b>${et}</b>${md(m)}</div>` : '');
  return [`<div class="blk n-cozumlu">${ust}${body}${sec}</div>`,
    `<div class="blk n-cozumlu-c"><div class="czk-ust"><b>Çözüm</b><span class="cz-cev">Cevap: ${HARF[q.sira.indexOf(n.dogru)]}</span></div><ol>${n.cozum.map(c => `<li>${md(harfle(c))}</li>`).join('')}</ol>${kutu('cz-ip', 'İpucu', n.ipucu)}${kutu('cz-tz', UR.sinav + ' tuzağı', n.tuzak)}</div>`];

// Kavram kartları: her kartta ön yüz (kalın), kesikli çizgi, arka yüz. Kısa kartlar 3, uzunlar 2 sütun.

// Not içi mini oyun: soru gibi basılır; cevap efsane kartlarındaki gibi ters yazılır.

function baglamBlok(st, a, b) {

}
function soruBlok(q, no, opts) {

// Etkileşimli türlerin basılı biçimi: eşleştir (numaralı sol, harfli sağ, harf kutusu), sınıfla (öğe × grup tablosu),
// sırala (karışık öğeler, sıra numarası kutusu). cevapli: kutular doğru cevapla dolu basılır (öğretmen, çözüm soru altında).
function etkHTML(q, cevapli) {
  const kutu = c => `<span class="cvp${cevapli ? ' dolu' : ''}">${cevapli ? esc(c) : ''}</span>`;
  if (q.tur === 'eslestir') {
    const sol = q.sol.map((m, i) => `<li><span class="es-no">${i + 1}</span><span class="es-m">${inline(m)}</span>${kutu(ETK.HARF[q.sagSira.indexOf(q.dogru[i])])}</li>`).join('');
    const sag = q.sagSira.map((j, k) => `<li><b>${ETK.HARF[k]})</b><span>${inline(q.sag[j])}</span></li>`).join('');
    return `<div class="etk-es"><ol class="es-sol">${sol}</ol><ol class="es-sag">${sag}</ol></div><div class="etk-not">Her numaranın yanındaki kutuya eşleştiği harfi yazınız.${q.sag.length > q.sol.length ? ' Sağdaki öğelerin her biri en çok bir kez kullanılır; kullanılmayan öğe vardır.' : ''}</div>`;
  }
  if (q.tur === 'sinifla') {
    const bas = `<tr><th></th>${q.gruplar.map(g => `<th>${inline(g)}</th>`).join('')}</tr>`;
    const sat = q.ogeSira.map(i => `<tr><td class="sn-m">${inline(q.ogeler[i].m)}</td>${q.gruplar.map((_, gi) => `<td><span class="kare${cevapli && q.ogeler[i].g === gi ? ' dolu' : ''}">${cevapli && q.ogeler[i].g === gi ? '✓' : ''}</span></td>`).join('')}</tr>`).join('');
    return `<table class="etk-sn g${q.gruplar.length}"><thead>${bas}</thead><tbody>${sat}</tbody></table><div class="etk-not">Her öğenin satırında ait olduğu grubun kutusunu işaretleyiniz.</div>`;
  }
  if (q.tur === 'sirala') {
    return `<ol class="etk-sr">${q.ogeSira.map(i => `<li>${kutu(i + 1)}<span>${inline(q.ogeler[i])}</span></li>`).join('')}</ol><div class="etk-not">Kutulara 1'den başlayarak doğru sıra numaralarını yazınız.</div>`;
  }
  return '';
}
function cozumHTML(q, no) {

function skorBlok(qs) {

// Etkileşimli sorunun anahtar hücresi cevabın uzunluğuna göre 1–6 sütun kaplar.

// Birden çok formda her form ayrı blok olur (formEtiketi = true): uzun anahtar tek sayfaya sığmadığında sayfalar arasında bölünebilir.
function anahtarBlok(forms, formEtiketi = forms.length > 1, baslikli = true) {
  return `<div class="blk anahtar">${baslikli ? '<h3>Cevap anahtarı</h3>' : ''}${forms.map(({ harf, qs }) => `<div class="an-f">${formEtiketi ? `<b class="an-h">${harf} Formu</b>` : ''}<div class="an-grid">${qs.map((q, i) => (ETK.etkMi(q) ? anahtarEtk(q, i + 1) : `<span><i>${i + 1}</i>${q.tur === 'cs' ? dogruHarf(q) : 'Açık uçlu'}</span>`)).join('')}</div></div>`).join('')}</div>`;
}

/* ---------------- Doküman ---------------- */
// Sayfa düzeni için set sırasını ve setlerden önceki son m tekil soruyu yeniden yerleştirir (v = {m, p}).
function permler(n) {
  const out = [], a = [...Array(n).keys()];
  const gez = (k) => { if (k === n) { out.push(a.slice()); return; } for (let i = k; i < n; i++) { [a[k], a[i]] = [a[i], a[k]]; gez(k + 1); [a[k], a[i]] = [a[i], a[k]]; } };
  gez(0); return out;
}
function setDuzen(qs, v) {
  if (!v || (!v.m && !v.p)) return qs;
  const ilk = qs.findIndex(q => q.set); if (ilk < 0) return qs;
  let son = ilk; qs.forEach((q, i) => { if (q.set) son = i; });
  const once = qs.slice(0, ilk), sonra = qs.slice(son + 1), birim = [];
  qs.slice(ilk, son + 1).forEach(q => { const b = birim[birim.length - 1]; if (b && b[0].set.id === q.set.id) b.push(q); else birim.push([q]); });
  const pr = permler(birim.length)[v.p % Math.max(1, permler(birim.length).length)] || birim.map((_, i) => i);
  const m = Math.min(v.m || 0, once.filter(q => q.tur === 'cs').length);
  const tas = []; for (let i = once.length - 1; i >= 0 && tas.length < m; i--) if (once[i].tur === 'cs') tas.unshift(...once.splice(i, 1));
  return [...once, ...pr.flatMap(i => birim[i]), ...tas, ...sonra];
}
function belgeBloklari() {
  // TYT birden çok konu: konu konu kitapçık (her konunun notu ve soruları birlikte)
  if (S.sinif >= 20 && secKonular().length > 1) return tytKitapBloklari();
  const bloklar = [];
  const forms = S.mod === 'ogretmen' && S.ab && S.seviye >= 2 ? ['A', 'B'] : ['A'];
  const formQs = forms.map(h => ({ harf: h, qs: S.parca.sorular ? setDuzen(formHazirla(S.seed, h), S._duzen) : [] }));
  const cozumAlt = S.mod === 'ogretmen' && S.cozum === 'altinda' && S.seviye >= 2;
  const cozumSonda = S.cozum === 'sonda' && S.seviye >= 1;
  formQs.forEach(({ harf, qs }, fi) => {
    if (fi > 0) bloklar.push('<div class="blk kir"></div>');
    bloklar.push(kapakBlok(harf));
    if (S.parca.not && fi === 0) secKonular().forEach(k => bloklar.push(...notBloklari(k)));
    if (qs.length) {
      if (S.parca.not && fi === 0) bloklar.push('<div class="blk kir"></div>');
      bloklar.push(`<div class="blk bolum"><span class="bn soru">SORULAR</span><h2>${S.mod === 'ogretmen' ? 'Değerlendirme' : 'Sıra sende'}</h2><span class="bc">${qs.length} soru</span></div>`);
      qs.forEach((q, i) => {
        if (q.set && (i === 0 || !qs[i - 1].set || qs[i - 1].set.id !== q.set.id)) {
          const son = i + qs.filter(x => x.set && x.set.id === q.set.id).length;
          bloklar.push(baglamBlok(q.set, i + 1, son));
        }
        bloklar.push(soruBlok(q, i + 1, { cozumAlt }));
      });
      if (S.mod === 'ogrenci' && S.parca.skor) bloklar.push(skorBlok(qs));
    }
  });
  const hepsi = formQs.filter(f => f.qs.length);
  if (hepsi.length && S.anahtar !== false) {
    bloklar.push('<div class="blk kir"></div>');
    if (hepsi.length > 1) hepsi.forEach((f, i) => bloklar.push(anahtarBlok([f], true, i === 0))); else bloklar.push(anahtarBlok(hepsi));
    if (cozumSonda && !cozumAlt) {
      bloklar.push(`<div class="blk bolum"><span class="bn cz">ÇÖZÜMLER</span><h2>Adım adım çözümler</h2><span class="bc">${hepsi[0].harf} Formu sırasıyla</span></div>`);
      hepsi[0].qs.forEach((q, i) => bloklar.push(`<div class="blk">${cozumHTML(q, i + 1)}</div>`));
    }
  }
  if (S.seviye === 0) bloklar.push(`<div class="blk tanitim"><b>Bu ücretsiz örnektir.</b> Tüm sorular, adım adım çözümler, kişiye özel kapak ve öğretmen modu (A-B form, çözümlü sürüm) için ${sinifAd(S.sinif)} lisansı al: ${CFG.site}</div>`);
  return bloklar;
}

/* ---------------- TYT konu kitapçığı (birden çok konu) ----------------
   Kapak, içindekiler, her konu için not + o konunun soruları (numaralar konuda 1'den başlar),
   sonda konu konu cevap anahtarı ve çözümler. Soru sayısı ve zorluk seçimi her konuya ayrı uygulanır. */
function tytKitapBloklari() {
  const B = [], ks = secKonular();
  const forms = S.mod === 'ogretmen' && S.ab && S.seviye >= 2 ? ['A', 'B'] : ['A'];
  const cozumAlt = S.mod === 'ogretmen' && S.cozum === 'altinda' && S.seviye >= 2;
  const cozumSonda = S.cozum === 'sonda' && S.seviye >= 1;
  const formlar = forms.map(h => ({ harf: h, kq: ks.map((k, i) => ({ k, qs: S.parca.sorular ? setDuzen(formHazirla(S.seed + i * 7919, h, [k]), S._duzen) : [] })) }));
  const notVar = S.parca.not;
  formlar.forEach(({ harf, kq }, fi) => {
    if (fi > 0) B.push('<div class="blk kir"></div>');
    B.push(kapakBlok(harf));
    if (fi === 0) B.push(icindekilerBlok(kq.map(x => x.k), notVar, kq.some(x => x.qs.length)));
    kq.forEach(({ k, qs }, ki) => {
      const bas = `data-kbas="${fi}-${ki}"`;
      if (notVar && fi === 0) {
        B.push('<div class="blk kir"></div>');
        B.push(...notBloklari(k).map((b, j) => (j === 0 ? b.replace('class="blk bolum"', `class="blk bolum" ${bas}`) : b)));
      }
      if (!qs.length) return;
      B.push('<div class="blk kir"></div>');
      B.push(`<div class="blk bolum" ${notVar && fi === 0 ? '' : bas}><span class="bn soru">SORULAR</span><h2>${esc(k.kisa || k.ad)}</h2><span class="bc">${qs.length} soru${forms.length > 1 ? ` – ${harf} Formu` : ''}</span></div>`);
      qs.forEach((q, i) => {
        if (q.set && (i === 0 || !qs[i - 1].set || qs[i - 1].set.id !== q.set.id)) B.push(baglamBlok(q.set, i + 1, i + qs.filter(x => x.set && x.set.id === q.set.id).length));
        B.push(soruBlok(q, i + 1, { cozumAlt }));
      });
    });
    const tum = kq.flatMap(x => x.qs);
    if (S.mod === 'ogrenci' && S.parca.skor && tum.length) B.push(skorBlok(tum));
  });
  const soruVar = formlar[0].kq.some(x => x.qs.length);
  if (soruVar && S.anahtar !== false) {
    B.push('<div class="blk kir"></div>');
    B.push(`<div class="blk bolum"><span class="bn cz">ANAHTAR</span><h2>Cevap anahtarı</h2><span class="bc">${ks.length} konu</span></div>`);
    formlar[0].kq.forEach(({ k }, ki) => {
      const fs = formlar.map(f => ({ harf: f.harf, qs: f.kq[ki].qs })).filter(f => f.qs.length);
      if (fs.length) B.push(anahtarBlok(fs).replace('<h3>Cevap anahtarı</h3>', `<h3 class="an-konu">${esc(k.id.replace(/^[TA]\./, ''))} ${esc(k.ad)}</h3>`));
    });
    if (cozumSonda && !cozumAlt) {
      B.push('<div class="blk kir"></div>');
      B.push(`<div class="blk bolum"><span class="bn cz">ÇÖZÜMLER</span><h2>Adım adım çözümler</h2><span class="bc">${forms.length > 1 ? 'A Formu sırasıyla' : ks.length + ' konu'}</span></div>`);
      formlar[0].kq.forEach(({ k, qs }) => {
        if (!qs.length) return;
        B.push(`<div class="blk cz-konu"><b>${esc(k.id.replace(/^[TA]\./, ''))}</b> ${esc(k.ad)}</div>`);
        qs.forEach((q, i) => B.push(`<div class="blk">${cozumHTML(q, i + 1)}</div>`));
      });
    }
  }
  if (S.seviye === 0) B.push(`<div class="blk tanitim"><b>Bu ücretsiz örnektir.</b> Tüm sorular, adım adım çözümler, kişiye özel kapak ve öğretmen modu (A-B form, çözümlü sürüm) için ${sinifAd(S.sinif)} lisansı al: ${CFG.site}</div>`);
  return B;
}
// İçindekiler: sayfa numaraları sayfalamadan sonra doldurulur (data-ics -> konu başlığının sayfası).
function icindekilerBlok(ks, notVar, soruVar) {
  const icerik = notVar && soruVar ? 'Konu özeti, çözümlü örnekler ve sorular' : notVar ? 'Konu özeti ve çözümlü örnekler' : 'Sorular';
  let un = null, h = '';
  ks.forEach((k, i) => {
    const u = tytUniteleri([k])[0];
    if (u && u !== un) { un = u; h += `<div class="ic-un">${u.no}. Ünite – ${esc(u.ad)}</div>`; }
    h += `<div class="ic-s"><span class="ic-no">${esc(k.id.replace(/^[TA]\./, ''))}</span><span class="ic-ad">${esc(k.ad)}</span><i></i><span class="ic-sy" data-ics="0-${i}">…</span></div>`;
  });
  return `<div class="blk icindekiler"><h3>İçindekiler <small>${icerik}</small></h3>${h}</div>`;
}

/* ---------------- TYT deneme ve tarama kitapçığı ----------------
   Gerçek sınav kâğıdı düzeni: A4, iki sütun, soru numaraları, şekiller; her denemenin başında ad-soyad,
   süre ve D/Y/Net kutusu; isteğe bağlı kapak (net çizelgesi), optik cevap şeridi, cevap anahtarı ve çözümler.
   A kitapçığında şık sırası uygulamadakiyle aynıdır (soru kimliğine bağlı); B kitapçığında soru sırası ve
   şık sırası form koduna bağlı olarak karışır (sayısal, harf ve I-II-III seçenekleri motor kuralıyla sabit kalır). */
const TYT_UCRETSIZ = UR.ucretsiz;
const tytTestler = () => window.BFY_TYT_TEST || {};
const tytTestListe = () => Object.keys(tytTestler()).sort((a, b) => a.localeCompare(b, 'tr', { numeric: true }));
const tytTestAcik = id => TYT_UCRETSIZ.includes(id) || S.seviye > 0;
const dnSecili = () => S.denemeler.filter(id => tytTestler()[id] && tytTestAcik(id)).sort((a, b) => a.localeCompare(b, 'tr', { numeric: true }));
function dnFormlar() { return S.mod === 'ogretmen' && S.ab && S.seviye >= 2 ? ['A', 'B'] : ['A']; }
function dnHazirla(t, harf) {
  const qs = t.sorular.map(q => ({ ...q, tur: 'cs' }));
  if (harf === 'B') { const rnd = rng(S.seed * 31 + hashSayi(t.id)); return shuffle(qs, rnd).map(q => seceneklerKaristir(q, rnd)); }
  return qs.map(q => seceneklerKaristir(q, rng(hashSayi(q.id))));
}
const dnKonuAd = id => { for (const s of window.BFY_KATALOG) for (const u of s.uniteler || []) for (const k of u.konular) if (k.id === id) return k.ad; return id || ''; };
const dnSure = t => Math.round((t.sure || 600) / 60);
const dnAralik = ids => (ids.length === 1 ? ids[0] : ids.length === 2 ? ids.join(', ') : `${ids[0]}–${ids[ids.length - 1]}`);
const dnTarama = t => /^[TA]U/.test(t.id);
const dnSayiYazi = ids => { const tu = ids.filter(id => /^[TA]U/.test(id)).length, td = ids.length - tu; return [td ? td + ' deneme' : '', tu ? tu + ' tarama' : ''].filter(Boolean).join(', '); };
function dnKapakBlok(ids, sik) {
  const T = tytTestler(), ts = ids.map(id => T[id]), soru = ts.reduce((a, t) => a + t.sorular.length, 0);
  const td = ts.filter(t => !dnTarama(t)).length, tu = ts.length - td;
  const baslik = S.baslik.trim() || (tu && !td ? UR.sinav + ' Fizik Ünite Taramaları' : td && !tu ? UR.sinav + ' Fizik Denemeleri' : UR.sinav + ' Fizik Deneme ve Taramaları');
  const say = [td ? td + ' deneme' : '', tu ? tu + ' ünite taraması' : ''].filter(Boolean).join(', ');
  // Uzun listede çizelge yan yana parçalara bölünür, sütunlar kısalır: 13–24 kitapçık iki, 25'ten çoğu üç parça.
  const parca = ts.length > 24 ? 3 : ts.length > 12 ? 2 : 1, cift = parca > 1;
  const satirT = t => parca === 3 ? `<tr><td class="dk-id">${esc(t.id)}</td><td></td><td></td><td></td><td></td></tr>` : cift ? `<tr><td class="dk-id">${esc(t.id)}</td><td></td><td></td><td></td><td></td><td></td></tr>` : `<tr><td class="dk-id">${esc(t.id)}</td><td class="dk-adi">${esc(t.ad)}</td><td>${t.sorular.length}</td><td>${dnSure(t)} dk</td><td></td><td></td><td></td><td></td><td></td></tr>`;
  const bas = parca === 3 ? '<tr><th>Kod</th><th>Tarih</th><th>D</th><th>Y</th><th>Net</th></tr>' : cift ? '<tr><th>Kod</th><th>Tarih</th><th>Süre</th><th>D</th><th>Y</th><th>Net</th></tr>' : '<tr><th>Kod</th><th class="dk-adi">Deneme</th><th>Soru</th><th>Süre</th><th>Tarih</th><th>Geçen süre</th><th>D</th><th>Y</th><th>Net</th></tr>';
  const boy = Math.ceil(ts.length / parca), tablo = L => `<table class="dk-tab${cift ? ' cift' : ''}"><thead>${bas}</thead><tbody>${L.map(satirT).join('')}</tbody></table>`;
  const cizelge = cift ? `<div class="dk-iki p${parca}">${Array.from({ length: parca }, (_, i) => tablo(ts.slice(i * boy, (i + 1) * boy))).join('')}</div>` : tablo(ts);
  return `<div class="blk dn-kapak${sik ? ' sik' : ''}">
    <div class="dk-bant"><span>${UR.ad.toLocaleUpperCase('tr-TR')}</span><span>${dnAralik(ids)}</span></div>
    <h1>${esc(baslik)}</h1>

    <h3>Net çizelgem</h3>

  </div>`;
}
// Kapakta: kitapçıktaki soruların ünitelere dağılımı (yatay çubuklar)
function dnDagilim(ts) {
  const sin = window.BFY_KATALOG.find(x => x.no === 20); if (!sin) return '';
  const say = {}; ts.forEach(t => t.sorular.forEach(q => { const u = +String(q.konu || '').split('.')[1]; if (u) say[u] = (say[u] || 0) + 1; }));

  return `<h3>Soruların ünitelere dağılımı</h3><div class="dk-dag">${sin.uniteler.map(u => `<div><span class="dd-ad">${u.no}. ${esc(u.ad)}</span><span class="dd-cb"><i style="width:${Math.round(100 * (say[u.no] || 0) / en)}%"></i></span><b>${say[u.no] || 0}</b></div>`).join('')}</div>`;
}
function dnBasBlok(t, harf, ab) {

    <div class="db-yon"><span>Bu testte <b>${t.sorular.length} soru</b> vardır. Her sorunun tek doğru cevabı vardır. Net = D − Y ÷ 4.</span><span class="db-saat">Başlama <i></i> Bitiş <i></i></span></div>
  </div>`;

// Sınav sorusu (sütun içi): numara, kök, şekil (kökün ilk paragrafından sonra), alt alta şıklar.
function dnSoruHTML(q, no, tam) {
  const fig = q.sekil ? window.BFY_FIG(q.sekil) : '';
  let metin = String(q.metin).trim();
  if (fig && !/\{\{sekil\}\}/.test(metin)) { const p = metin.split(/\n\s*\n/); if (p.length > 1) p.splice(1, 0, '{{sekil}}'); else p.push('{{sekil}}'); metin = p.join('\n\n'); }
  // Sütun içi tablo: kısa hücreler (ör. "2000 W") bölünmez, uzun metin hücreleri sola yaslanır ve tablo sütunu doldurur.
  let tablo = q.tablo ? tabloBaslikli(q.tablo) : '';
  if (tablo) {
    const uzun = q.tablo.some(r => r.some(c => plainLen(c) > 16));
    tablo = tablo.replace(/<td>([\s\S]*?)<\/td>/g, (m, ic) => { const L = ic.replace(/<[^>]+>/g, '').trim().length; return L <= 10 ? `<td class="kisa">${ic}</td>` : L > 16 ? `<td class="uzun">${ic}</td>` : m; });
    if (uzun) tablo = tablo.replace('class="vt yatay"', 'class="vt yatay genis"');
  }
  const ctx = { tablo, sekil: fig ? `<div class="dn-sekil">${fig}</div>` : '' };
  const ops = q.sira.map(i => q.secenekler[i]), maxL = Math.max(...ops.map(plainLen));
  const kol = tam ? (maxL <= 9 ? 'k5' : maxL <= 26 ? 'k2' : 'k1') : maxL <= 5 ? 'k5' : 'k1';
  return `<div class="blk dn-soru${tam ? ' tam' : ''}"><div class="dn-no">${no}.</div><div class="dn-ic"><div class="q-metin">${md(metin, ctx)}</div><ol class="sec dn-sec ${kol}">${ops.map((o, i) => `<li><b>${HARF[i]})</b><span>${inline(o)}</span></li>`).join('')}</ol></div></div>`;
}
// Optik cevap şeridi: her soru için A–E yuvarlakları
function dnOptikBlok(t, n) {
  return `<div class="blk dn-son"><div class="ds-yazi">${esc(t.id)} bitti. Cevaplarınızı kontrol ediniz.</div>${S.dn.optik ? `<div class="ds-optik"><span class="ds-et">Cevaplarım</span><div class="ds-izg">${Array.from({ length: n }, (_, i) => `<div class="ds-s"><i>${i + 1}</i>${HARF.map(h => `<span>${h}</span>`).join('')}</div>`).join('')}</div></div>` : ''}</div>`;
}
function dnAnahtarBloklari(ids, formlar) {
  const T = tytTestler(), B = [];
  B.push(`<div class="blk bolum"><span class="bn cz">ANAHTAR</span><h2>Cevap anahtarı</h2><span class="bc">${dnSayiYazi(ids)}${formlar.length > 1 ? ', A ve B kitapçığı' : ''}</span></div>`);
  formlar.forEach(({ harf, testler }) => {
    // Aynı soru sayısındaki testler aynı tabloda; uzun listeler 12 satırlık parçalara bölünür.
    const gr = {}; testler.forEach(x => { (gr[x.qs.length] = gr[x.qs.length] || []).push(x); });
    Object.keys(gr).sort((a, b) => a - b).forEach(n => {
      const L = gr[n];
      if (Object.keys(gr).length > 1) B.push(`<div class="blk da-gr">${L.every(x => dnTarama(x.t)) ? 'Ünite taramaları' : L.every(x => !dnTarama(x.t)) ? 'Denemeler' : n + ' soruluk kitapçıklar'}</div>`);

// kc: açık kavram kartları ('konu:not:kart' -> 1), oy: kazanılan not içi oyunlar ('oy:konu:not' -> { d, t })
const K = Object.assign({ q: {}, ef: {}, kc: {}, oy: {}, xp: 0, gunler: [], son: null, deneme: null, denemeler: [], kt: null, ktler: [], kh: {}, ayar: { ses: true, titresim: true } }, yukle());
K.ayar = Object.assign({ ses: true, titresim: true }, K.ayar);
K.kc = K.kc || {}; K.oy = K.oy || {}; K.ktler = K.ktler || [];
// TYT denemeleri: tyt = geçmiş sonuçlar, tytA = süren deneme, tytS = denemenin son cevapları, tytq = XP'si alınmış sorular
if (TYT) { K.tyt = K.tyt || []; K.tytA = K.tytA || null; K.tytS = K.tytS || {}; K.tytq = K.tytq || {}; }
function kaydet() { store.set(ANAHTAR, JSON.stringify(K)); }
// Kâğıt genişliği: ekranın kısa kenarı döndürmeyle değişmez; bu yüzden kâğıt her yönde aynı genişlikte kalır.
(function kagitGenisligi() {
  const kisa = Math.min(screen.width || innerWidth, screen.height || innerHeight, 10000);
  const L = Math.max(300, Math.min(788, kisa - 32));
  document.documentElement.style.setProperty('--kagit-w', L + 'px');
  document.documentElement.style.setProperty('--kagit-pad', (L >= 560 ? 24 : 16) + 'px');
})();
// Lisans sınıf bazlıdır: bir konunun kilidi, o konunun sınıfının lisansına bağlıdır.
const konuSinif = konu => (/^[TA]\./.test(String(konu.id)) ? U.sinif : +String(konu.id).split('.')[0]);
const sevK = konu => sinifSeviye(konuSinif(konu));
// Ana ekranda ve denemede seçili sınıf (cihazda hatırlanır). Varsayılan: lisanslı sınıf (ikisi varsa 11), yoksa 11.
const gorunurSiniflar = () => KAT.filter(s => sinifGorunur(s.no) && s.uniteler.some(u => u.konular.some(k => BANK[k.id]))).map(s => s.no);
function secSinif() {
  const g = gorunurSiniflar();
  if (g.includes(K.sinif)) return K.sinif;
  const lis = g.filter(n => LISLER[n]).sort((a, b) => b - a);
  return lis[0] || (g.includes(11) ? 11 : g[g.length - 1]);
}
// Hoş geldin adı: seçili sınıfın lisansı, yoksa herhangi bir lisans
const aktifLisans = () => LISLER[secSinif()] || LISLER[Object.keys(LISLER).filter(n => sinifGorunur(n)).sort((a, b) => b - a)[0]] || null;
function sinifSecici() {
  if (KAT.length < 2) return ''; // tek ürünlü derleme (TYT): seçici yok
  const g = gorunurSiniflar(), sec = secSinif();
  return `<div class="sinif-sec cips buyuk">${KAT.map(s => { const ok = g.includes(s.no); return `<button class="cip ${ok && s.no === sec ? 'on' : ''}" type="button" data-dsinif="${s.no}" ${ok ? '' : 'disabled'}>${s.ad}${ok ? '' : '<small>yakında</small>'}</button>`; }).join('')}</div>`;
}

/* ---------------- İçerik yardımcıları ---------------- */
const tumKonular = () => KAT.filter(s => s.uniteler).flatMap(s => s.uniteler.flatMap(u => u.konular.map(k => ({ ...k, sinif: s.no, unite: u.no, uad: u.ad })))).filter(k => BANK[k.id]);
const konuBilgi = id => tumKonular().find(k => k.id === id);
function hashSayi(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const hazir = {};
// Çoktan seçmelide seçenekler, etkileşimli türlerde sağ sütun / öğeler soru kimliğine bağlı olarak (her cihazda aynı) karışır.
function soruHazirla(q) { if (!hazir[q.id]) hazir[q.id] = q.tur === 'cs' ? seceneklerKaristir(q, rng(hashSayi(q.id))) : ETK.etkMi(q) ? ETK.etkKaristir(q, rng(hashSayi(q.id))) : { ...q }; return hazir[q.id]; }
const vitrin = konu => new Set(O.vitrinListesi(konu));
// Bağlam setlerinin soruları da bankaya bağlanır (set bilgisiyle).
const QH = {};
Object.values(BANK).forEach(k => { k.sorular.forEach(q => { QH[q.id] = q; }); (k.setler || []).forEach(st => st.sorular.forEach((q, j) => { q.tur = q.tur || 'cs'; q.set = st; q.setSira = j; QH[q.id] = q; })); });
const tumSorular = konu => [...konu.sorular, ...(konu.setler || []).flatMap(st => st.sorular)];
// Gösterim sırası: tekil çoktan seçmeliler (zorluğa göre), bağlam setleri, açık uçlular
const sirali = konu => [
  ...konu.sorular.filter(q => q.tur !== 'acik').sort((a, b) => a.zorluk - b.zorluk),
  ...(konu.setler || []).flatMap(st => st.sorular),
  ...konu.sorular.filter(q => q.tur === 'acik')
].map(soruHazirla);
const acik = (konu, q) => sevK(konu) > 0 || vitrin(konu).has(q.id);
const qKonu = {}; Object.values(BANK).forEach(k => tumSorular(k).forEach(q => { qKonu[q.id] = k; }));
const yildiz = z => '★'.repeat(z);
// TYT: ekrandaki içeriği oluşturucuda hazır seçimle açan "Yazdır / PDF" bağlantısı (yalnız TYT derlemesi).
const PDF_ADRES = (window.BFY_LINK || {}).tytOlustur || 'tyt-olusturucu.html';
const pdfLink = (hash, yazi) => (TYT ? `<a class="pdf-link yazdir-link" href="${esc(PDF_ADRES + '#' + hash)}">🖨️ ${esc(yazi)}</a>` : '');
const harfle = (q, c) => (q.sira ? c.replace(/\{\{S(\d)\}\}/g, (_, n) => HARF[q.sira.indexOf(+n)]) : c);

function konuDurum(konu) {
  let c = 0, d = 0, xp = 0, top = 0;
  const tum = tumSorular(konu);
  tum.forEach(q => { top += XP[q.zorluk]; const r = K.q[q.id]; if (r) { c++; if (r.d) d++; xp += r.xp || 0; } });
  return { n: tum.length, c, d, xp, top, yuzde: Math.round(100 * c / tum.length) };
}
function unvanBul(liste, xp, top) { const es = [0, 0.35, 0.6, 0.85]; let i = 0; es.forEach((e, j) => { if (xp >= e * top && top > 0) i = j; }); return liste[i]; }
function genelUnvan() {
  const top = Object.values(BANK).reduce((s, k) => s + tumSorular(k).reduce((a, q) => a + XP[q.zorluk], 0), 0);
  return unvanBul(['Çaylak', 'Kâşif', 'Usta', 'Efsane'], K.xp, top);
}
function bugun(d = new Date()) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function gunEkle() { const b = bugun(); if (!K.gunler.includes(b)) { K.gunler.push(b); if (K.gunler.length > 400) K.gunler.shift(); } }
function seri() {
  const d = new Date(); let n = 0;
  if (!K.gunler.includes(bugun(d))) d.setDate(d.getDate() - 1);
  while (K.gunler.includes(bugun(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const cozulen = () => Object.keys(K.q).length;
const dogruSay = () => Object.values(K.q).filter(r => r.d).length;

/* ---------------- Geri bildirim ---------------- */
let AC;
function ses(tur) {
  if (!K.ayar.ses) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime, notalar = tur === 'd' ? [660, 880, 1320] : [310, 230];
    notalar.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain(), b = t + i * 0.09;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, b); g.gain.exponentialRampToValueAtTime(0.12, b + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, b + 0.2);
      o.connect(g).connect(AC.destination); o.start(b); o.stop(b + 0.22);
    });
  } catch (e) { }
}
function titret(tur) { if (K.ayar.titresim && navigator.vibrate) try { navigator.vibrate(tur === 'd' ? 25 : [40, 60, 40]); } catch (e) { } }
function konfeti() {
  const k = $('#konfeti'), renk = ['#244f40', '#aa693e', '#e7a93b', '#2e6f95', '#d9573b', '#7bc59a'];
  for (let i = 0; i < 40; i++) {
    const e = document.createElement('i');
    e.style.left = (Math.random() * 100) + 'vw'; e.style.background = renk[i % renk.length];
    e.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px'); e.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    e.style.animationDelay = (Math.random() * 0.25) + 's';
    k.appendChild(e); setTimeout(() => e.remove(), 1700);
  }
}
let tostZ;
function tost(m) { const t = $('#tost'); t.textContent = m; t.classList.add('goster'); clearTimeout(tostZ); tostZ = setTimeout(() => t.classList.remove('goster'), 1900); }
function xpPop() { const c = $('.xp-cip'); if (c) { c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); } }

/* ---------------- Üst çubuk ---------------- */
function ust({ geri, baslik, alt, kalem, sag }) {

    <div class="bas"><b>${esc(baslik)}</b>${alt ? `<small>${esc(alt)}</small>` : ''}</div>
    ${sag || ''}${kalem ? `<button class="ust-btn ${INK.aktif ? 'on' : ''}" id="kalemAc" type="button" aria-label="Kalem">${IKON.kalem}<span>Kalem</span></button>` : ''}
    <span class="xp-cip"><i>★</i>${K.xp} XP</span>`;
}
function navAktif(ad) { $$('.dj-nav a').forEach(a => a.classList.toggle('on', a.dataset.nav === ad)); }

/* ---------------- Ekranlar ---------------- */
function halka(y, renk, yazi) {
  const C = 2 * Math.PI * 22;
  return `<div class="halka" style="--renk:${renk}"><svg viewBox="0 0 52 52"><circle class="zemin" cx="26" cy="26" r="22"/><circle class="dolu" cx="26" cy="26" r="22" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - y)).toFixed(1)}"/></svg><span>${yazi}</span></div>`;
}
function kilitBant(m, sinif) { return sinifSeviye(sinif) > 0 ? '' : `<div class="kilit-bant"><span>🔒 ${m}</span><button type="button" data-kod>Lisansım var</button></div>`; }

function anaEkran() {
  const sn = secSinif(), L = LISLER[sn];
  ust({ baslik: sn === U.sinif ? U.ad : 'Yapabilirim ' + sn, alt: 'Fizik yapamıyorum demeyi bırak.' }); navAktif('konular');
  const son = K.son && BANK[K.son.id] ? K.son : null;
  let h = `<section class="hero">${L && L.ad ? `<div class="hero-ad">${esc(L.ad)} – ${lisansAdi(L)}</div>` : ''}<h1>${ilkAd() ? esc(ilkAd()) + ', bugün ne çalışıyoruz?' : 'Bugün ne çalışıyoruz?'}</h1><p>Notu oku, soruları çöz, kalemle üstüne yaz. Her doğru cevap XP kazandırır.</p>
    <div class="hero-istat"><div><b>${K.xp}</b><span>XP</span></div><div><b>${seri()}</b><span>günlük seri</span></div><div><b>${cozulen()}</b><span>çözülen soru</span></div><div><b>${genelUnvan()}</b><span>unvan</span></div></div></section>`;
  if (son) { const sk = BANK[son.id]; h += `<a class="devam" href="#/soru/${son.id}/${son.idx}"><div><small>Kaldığın yerden devam et</small><b>${esc(sk.ad)}, ${son.idx + 1}. soru</b></div><span class="ok">→</span></a>`; }
  h += kilitBant(`Ücretsiz sürüm: her konuda 4 soru açık. ${SA(sn)} lisansınla bütün sorular ve çözümler açılır.`, sn);
  if (TYT) h += tytAnaKart();
  h += sinifSecici();
  KAT.filter(s => s.uniteler && s.no === sn).forEach(s => s.uniteler.forEach(u => {
    const ks = u.konular.filter(k => BANK[k.id]); if (!ks.length) return;
    h += `<h2 class="baslik2">${u.no}. Ünite: ${esc(u.ad)}<small>${ks.length} konu</small></h2><div class="konu-grid">`;
    ks.forEach(kb => {
      const k = BANK[kb.id], d = konuDurum(k), renk = k.renk || '#244f40';
      h += `<a class="konu-kart" href="#/konu/${k.id}" style="--renk:${renk}">${halka(d.c / d.n, renk, d.yuzde + '%')}<div class="kk-metin"><small>${k.id.split('.').slice(1).join('.')}</small><b>${esc(k.ad)}</b><em>${d.c ? `${d.d}/${d.c} doğru, ${unvanBul(k.unvanlar || ['Çaylak', 'Kâşif', 'Usta', 'Efsane'], d.xp, d.top)}` : `${d.n} soru, ${d.top} XP`}</em></div></a>`;
    });
    h += '</div>';
  }));
  h += `<a class="pdf-link" href="olustur/">📄 PDF çalışma kâğıdı oluştur</a>`;
  return h;
}

// Not içi bloklara bağlı kayıt anahtarları (oyun, kavram kartı, efsane) 3B animasyon bloklarını saymaz:
