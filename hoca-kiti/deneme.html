<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Hoca Kiti deneme | Ben Fizik Yapamıyorum</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1B2F5E;--navy2:#2B4A8A;--acc:#E0731F;--muted:#5B6573;--ink:#1a2233;--ok:#1F7A4D;--hata:#B3261E}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#EEF2F8;color:var(--ink)}
.w{max-width:720px;margin:0 auto;padding:34px 18px 60px}
.marka{font-family:Manrope,Inter,sans-serif;font-weight:800;font-size:15px;color:var(--acc)}
h1{font-family:Manrope,Inter,sans-serif;font-weight:800;font-size:34px;color:var(--navy);margin:6px 0 8px;line-height:1.15}
.alt{color:var(--muted);font-size:16px;line-height:1.6;margin:0 0 20px}
.kutu{background:#fff;border-radius:18px;padding:20px 22px;margin-top:16px;box-shadow:0 8px 26px rgba(27,47,94,.07)}
.kutu h2{font-size:18px;margin:0 0 8px;color:var(--navy)}.kutu p{margin:6px 0;color:var(--muted);line-height:1.6;font-size:15px}
.btn{display:inline-block;margin:10px 10px 0 0;padding:13px 20px;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;font-size:15px;text-decoration:none}
.btn.ikinci{background:#fff;color:var(--navy);border:2px solid var(--navy)}.btn.al{background:var(--acc)}
.etiket{display:inline-block;background:#FFF1E6;color:#9A4A0C;font-weight:700;font-size:13px;padding:5px 10px;border-radius:999px}
.hata{color:var(--hata)}.ok{color:var(--ok)}
.dip{margin-top:26px;color:var(--muted);font-size:13px;line-height:1.6}.dip a{color:var(--navy2)}
</style></head><body><div class="w">
<div class="marka">Ben Fizik Yapamıyorum</div>
<h1>Hoca Kiti deneme</h1>
<p class="alt" id="alt">Deneme linkiniz kontrol ediliyor…</p>
<div id="ic"></div>
<div class="dip">Deneme sürümünde bu haftanın ve gelecek haftanın kiti açıktır; öbür haftalar tam kitte. Sorun yaşarsanız <a href="mailto:cerkeztimur@gmail.com">e-posta</a> ile yazın.<br><a href="/materyaller.html#paketler">Hoca Kiti paketleri</a><br><a href="/">benfizikyapamiyorum.com</a></div>
</div>
<script>
(function(){
  var PUB=[{"kty":"EC","crv":"P-256","x":"_TaTTBflkNhET_aI5hsfW9UGRrxkG8CSUZ6NuZht-TQ","y":"qBWA-eJwvUagRLMiCF_HbuHx-L_uPfA1FRcHd0hwDUU"},{"kty":"EC","crv":"P-256","x":"vmG6TPdeE0BDMUH0-KXeZpGziz15ZXnV4HluaZ1R8a4","y":"nAUayVW3k26LUy5pjX9EcNgqKx0-jNVwF9F1qx6-H0g"}], MAG={"9":"https://www.shopier.com/47806607","10":"https://www.shopier.com/47980342","11":"https://www.shopier.com/51257681"}, FIY={9:'1.299',10:'1.699',11:'1.999'};
  var $=function(i){return document.getElementById(i)};
  function b64u(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';return Uint8Array.from(atob(t),function(c){return c.charCodeAt(0)});}
  function oku(){try{return JSON.parse(localStorage.getItem('bfy_hoca_deneme')||'{}')||{};}catch(e){return {};}}
  function yaz(o){try{localStorage.setItem('bfy_hoca_deneme',JSON.stringify(o));return true;}catch(e){return false;}}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
  function tarih(t){var p=t.split('-');return +p[2]+' '+['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'][+p[1]-1]+' '+p[0];}
  function bitti(t){return new Date().toISOString().slice(0,10)>t;}
  function hafta(s,n){return '/hoca-kiti/t'+s+'/BFY'+s+'_Hafta'+String(n).padStart(2,'0')+'_KIT_interaktif.html';}
  function kart(s,d){
    var son=bitti(d.bitis), h=d.hs;
    if(son) return '<div class="kutu"><span class="etiket">'+s+'. sınıf deneme süresi bitti</span><h2>Denemeniz '+tarih(d.bitis)+' tarihinde sona erdi.</h2><p>36 haftanın tamamı, yazılılar ve PDF\'ler tam kitte. Kitte yapılan her düzeltme ve ekleme aynı linkle size de gelir.</p><a class="btn al" href="'+MAG[s]+'" target="_blank" rel="noopener">'+s+'. Sınıf Hoca Kiti, ₺'+FIY[s]+'</a></div>';
    return '<div class="kutu"><span class="etiket">'+s+'. sınıf deneme, '+tarih(d.bitis)+' tarihine kadar</span><h2>'+(d.ad?esc(d.ad)+' Hocam, ':'')+'denemeniz açık.</h2><p>Açık haftalar: '+h.map(function(n){return 'Hafta '+n}).join(' ve ')+'. Z Kitap\'ta 36 haftanın hepsini görebilirsiniz; öbür haftalar tam kitte açılır.</p>'+
      '<a class="btn" href="'+hafta(s,h[0])+'?mode=tahta">▶ Hafta '+h[0]+' tahtada</a><a class="btn ikinci" href="'+hafta(s,h[0])+'?mode=hoca">Cevaplı nüsha</a><a class="btn ikinci" href="/hoca-kiti/t'+s+'/">Z Kitap</a><br><a class="btn al" href="'+MAG[s]+'" target="_blank" rel="noopener">Tam kiti al, ₺'+FIY[s]+'</a></div>';
  }
  function ciz(){var o=oku(),h='';['9','10','11'].forEach(function(s){if(o[s])h+=kart(s,o[s])});$('ic').innerHTML=h||'<div class="kutu"><h2>Bu cihazda açık bir deneme yok.</h2><p>Deneme linki e-postanıza gönderilir. Linke bu cihazda bir kez dokunmanız yeterli.</p><a class="btn" href="/materyaller.html#deneme">Deneme iste</a></div>';$('alt').textContent='Denemeniz bu cihazda kayıtlı. Kitte bu haftanın konusunu tahtada, cevaplı ve öğrenci nüshasıyla deneyin.';}
  async function isle(hs){
    var q=new URLSearchParams(hs.replace(/^#/,'')), jt=q.get('d')||'', a=q.get('a')||'', hk=q.get('h')||'';
    var m=jt.match(/^([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]{80,90})$/);
    if(!m||!/^[A-Za-z0-9_-]{43}$/.test(a)){$('alt').innerHTML='<span class="hata">Bu deneme linki eksik ya da hatalı. Size gönderilen linkin tamamını açın.</span>';return;}
    var veri=b64u(m[1]),imza=b64u(m[2]),p=new TextDecoder().decode(veri).split('|');
    if(p[0]!=='B3'||!/^(9|10|11)$/.test(p[1])){$('alt').innerHTML='<span class="hata">Bu link bir Hoca Kiti deneme linki değil.</span>';return;}
    var ok=false;for(var i=0;i<PUB.length&&!ok;i++){var k=await crypto.subtle.importKey('jwk',PUB[i],{name:'ECDSA',namedCurve:'P-256'},false,['verify']);ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,imza,veri);}
    if(!ok){$('alt').innerHTML='<span class="hata">Bu deneme linki geçerli değil.</span>';return;}
    var s=p[1],hs2=p[4].split(',').map(Number),keys={};
    hk.split('~').forEach(function(x){var y=x.split('.');if(y.length===2&&hs2.indexOf(+y[0])>=0&&/^[A-Za-z0-9_-]{43}$/.test(y[1]))keys[y[0]]=y[1];});
    try{var key=await crypto.subtle.importKey('raw',b64u(a),'AES-GCM',false,['decrypt']);var b=await (await fetch('/hoca-kiti/e'+s+'/m.bin',{cache:'no-cache'})).arrayBuffer();await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(b,0,12)},key,new Uint8Array(b,12));}
    catch(e){$('alt').innerHTML='<span class="hata">Deneme açılamadı. İnternet bağlantınızı kontrol edip yeniden deneyin.</span>';return;}
    var o=oku();o[s]={no:p[2],bitis:p[3],hs:hs2,m:p[5],ad:p.slice(6).join('|'),a:a,k:keys};
    if(!yaz(o)){$('alt').innerHTML='<span class="hata">Tarayıcı bu cihazda kayıt yapmaya izin vermiyor. Gizli sekmedeyseniz normal sekmede açın.</span>';return;}
    ciz();
  }
  if(!window.crypto||!crypto.subtle){$('alt').textContent='Bu tarayıcı denemeyi açamıyor. Chrome, Safari ya da Edge’in güncel sürümünü kullanın.';return;}
  if(/d=/.test(location.hash)){var h=location.hash;history.replaceState(null,'',location.pathname);isle(h);}else ciz();
})();
</script></body></html>
