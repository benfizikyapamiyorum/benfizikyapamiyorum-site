<title>Yapabilirim çekim modu</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Fraunces:ital,opsz,wght@1,9..144,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(120% 90% at 75% 10%,#2f6b56 0%,#1d473a 45%,#0f241c 100%);color:#fff;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
.sahne{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:5vw;padding:1.5vh 4vw}
.tel{position:relative;flex:none;border-radius:62px;background:#0d1512;padding:14px;box-shadow:0 40px 90px rgba(0,0,0,.5),inset 0 0 0 3px #2e3a35}
.tel .ekran{position:relative;overflow:hidden;border-radius:48px;background:#f6f4ee;width:calc(var(--w)*var(--s)*1px);height:calc(var(--h)*var(--s)*1px)}
.tel iframe{position:absolute;left:0;top:0;width:calc(var(--w)*1px);height:calc(var(--h)*1px);border:0;transform:scale(var(--s));transform-origin:0 0;background:#f6f4ee}
.genis .tel{border-radius:22px;padding:12px}
.genis .tel .ekran{border-radius:12px;width:calc(var(--gw)*1px);height:calc(var(--gh)*1px)}
.genis .tel iframe{width:calc(var(--gw)*1px/var(--s));height:calc(var(--gh)*1px/var(--s))}
.yazi{width:40vw;flex:none}
.no{display:inline-flex;align-items:center;gap:12px;font-size:clamp(16px,1.5vw,24px);font-weight:800;letter-spacing:.12em;color:#1c2522;background:#e9be64;padding:8px 18px;border-radius:99px}
.bas{margin-top:2.4vh;font-size:clamp(40px,5.2vw,92px);font-weight:800;letter-spacing:-.045em;line-height:1.02}
.bas em{font-family:'Fraunces',serif;font-style:italic;font-weight:600;color:#e9be64;letter-spacing:-.02em}
.alt{margin-top:2vh;font-size:clamp(18px,1.9vw,32px);line-height:1.35;color:#dbe7df;font-weight:500}
.marka{display:flex;margin-bottom:3vh;align-items:center;gap:12px;font-weight:800;color:#d9edaf;font-size:clamp(14px,1.3vw,20px)}
.marka img{width:44px;height:44px;border-radius:12px}
.web{margin-top:4vh;font-weight:800;color:#d9edaf;opacity:.85;letter-spacing:.04em;font-size:clamp(13px,1.2vw,18px)}
/* yönetmen paneli: çekimde H ile gizle */
.panel{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(10,22,18,.92);border:1px solid rgba(217,237,175,.25);border-radius:16px;padding:8px 10px;font-size:14px;color:#cfe0d6;max-width:96vw;z-index:9}
.panel button{font:inherit;font-weight:800;background:#244f40;color:#fff;border:0;border-radius:10px;padding:8px 12px;cursor:pointer}
.panel button:hover{background:#2f6b56}
.panel .soyle{max-width:52vw;line-height:1.3}
.panel .soyle b{color:#e9be64}
.gizli .panel{display:none}
.uyari{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,18,14,.94);z-index:20;padding:24px}
.uyari.ac{display:flex}
.uyari div{max-width:640px;background:#f6f4ee;color:#173a30;border-radius:24px;padding:28px 30px;font-size:17px;line-height:1.5}
.uyari h2{font-size:26px;margin-bottom:10px}
.uyari ul{margin:12px 0 18px 20px}
.uyari button{font:inherit;font-weight:800;background:#244f40;color:#fff;border:0;border-radius:12px;padding:12px 18px;cursor:pointer}
.tam .sahne{padding:0;gap:0}
.tam .tel{position:fixed;inset:0;border-radius:0;padding:0;box-shadow:none;background:#f6f4ee}
.tam .tel .ekran{width:100vw!important;height:100vh!important;border-radius:0}
.tam .tel iframe{width:100vw!important;height:100vh!important;transform:none!important}
.tam .yazi{display:none}
.tam.gizli .panel{display:none}
.tam .panel{bottom:auto;top:10px}
</style></head>
