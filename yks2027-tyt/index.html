        r`Helyum balonu durgun havanın içinde yükselir. Ona, yerini değiştirdiği havanın ağırlığı kadar kaldırma kuvveti etki eder ve bu kuvvet balonun ağırlığından büyüktür. Akışkanın hareket etmesi gerekmez: Arşimet ilkesi.`,
        r`Diğer örneklerde akışkan cisme göre hareket etmektedir; hızlı akan havanın basıncı düşer ve iki yüz arasında basınç farkı oluşur: Bernoulli ilkesi.`,
        r`{{S0}} uçağın kanatlarına etki eden kuvvetin de "kaldırma kuvveti" diye anılmasına aldanır; bu kuvvet kanat çevresindeki hava akışından doğar. {{S2}} çatıyı kaldıranın evin içindeki havanın kaldırma kuvveti olduğunu sanır; çatının üstündeki hızlı rüzgâr basıncı düşürür. {{S3}} şemsiyeyi havanın kaldırdığını düşünür; ters dönme, üst yüzde hızla akan havanın basıncının düşmesindendir. {{S4}} trene doğru itilmeyi kaldırma kuvveti sanır; tren yanındaki hızlı akan havanın basıncı düşüktür.`
      ]
    },
    {
      id: 'kY83_08', yks: true, zorluk: 1, tur: 'cs', cikti: '10.2.2.1', beceri: 'Oran akıl yürütme',
      tahmin: { gerekce: r`Yüzen homojen cisimde batan kesrin özkütleler oranına eşit olması programdaki modelin oran düzeyindeki kullanımıdır; 9 yılda doğrudan sorulmadı. Kesilen cismin yine aynı kesirle yüzmesi, hesap gerektirmeyen tipik bir TYT tuzağıdır.` },
      metin: r`Bir marangoz, su kanalında şekildeki gibi yüzen homojen bir kalası kesikli çizgi boyunca iki eşit olmayan parçaya ayırıyor ve büyük parçayı yeniden suya bırakıyor.

Büyük parça için,

I. Parçaya etki eden kaldırma kuvveti, kalasın tamamına etki edenden küçüktür.
II. Parçanın batan hacminin kendi hacmine oranı, kalasınkiyle aynıdır.
III. Parçanın suya batan hacmi, kalasın suya batan hacmine eşittir.

yargılarından hangileri doğrudur?`,
      sekil: 'kY83_kalas',
      secenekler: [r`Yalnız I`, r`I ve II`, r`I ve III`, r`II ve III`, r`I, II ve III`],
      dogru: 1,
      cozum: [
        r`I. Parça da yüzer ve ona etki eden kaldırma kuvveti kendi ağırlığına eşittir. Parçanın ağırlığı kalasınkinden küçük olduğu için kaldırma kuvveti de küçüktür. **Doğru.**`,
        r`II. Kalas homojen olduğu için parçanın özkütlesi kalasınkiyle aynıdır. Yüzen homojen cisimde $\dfrac{V_b}{V} = \dfrac{d_c}{d_s}$ olduğundan oran değişmez. **Doğru.**`,
        r`III. Parçanın hacmi küçüldüğü için aynı oranla batan hacmi de küçülür. **Yanlış.**`,
        r`{{S0}} batan kesrin özkütleler oranına bağlı olduğunu görmez. {{S2}} kesilen parçanın kalas kadar battığını sanır ve II'yi atlar. {{S3}} hem batan hacmi değişmez sanır hem de kaldırma kuvvetinin azaldığını atlar. {{S4}} kesilen parçanın kalas kadar battığını sanır; hacmi küçülen parçanın batan hacmi de küçülür.`
      ]
    },
    {
      id: 'kY83_09', yks: true, zorluk: 1, tur: 'cs', cikti: '10.2.2.1', beceri: 'Değişken belirleme',
      tahmin: { gerekce: r`Kaldırma kuvvetinin neye bağlı olup olmadığı programın ana mesajıdır; ÖSYM bunu hep bağlam içinde, dolaylı ölçtü. Değişkenleri ayrı ayrı sınayan kısa bir I-II-III sorusu kolay soru olarak gelebilir.` },
      metin: r`Bir laboratuvarda ipe asılı metal bir silindir, gliserin dolu bir kabın içinde tamamen batmış hâlde ve kabın tabanına değmeden tutuluyor. Aşağıdaki değişiklikler ayrı ayrı yapılıyor.

I. Silindir, yine tamamen sıvının içinde kalacak biçimde daha derine indiriliyor.
II. Silindir, aynı hacimde fakat daha ağır bir metal silindirle değiştiriliyor.
III. Gliserin yerine su kullanılıyor.

Bu değişikliklerden hangileri silindire etki eden kaldırma kuvvetini değiştirir?`,
      secenekler: [r`Yalnız III`, r`I ve II`, r`I ve III`, r`II ve III`, r`I, II ve III`],
      dogru: 0,
      cozum: [
        r`Tamamen batmış cisme etki eden kaldırma kuvveti $F_k = V \cdot d_s \cdot g$'dir; yalnız cismin hacmine ve sıvının özkütlesine bağlıdır.`,
        r`I. Derinlik artınca alt ve üst yüzeylerdeki basınç kuvvetleri eşit miktarda artar; fark değişmez.`,
        r`II. Hacim aynı kaldığı için kaldırma kuvveti değişmez; değişen ağırlıktır.`,
        r`III. Suyun özkütlesi gliserininkinden küçüktür; kaldırma kuvveti azalır.`,
        r`{{S1}} derinlikle basıncın, ağırlıkla da kaldırma kuvvetinin arttığını sanır ve sıvının cinsini atlar. {{S2}} derinlik arttıkça basınçla birlikte kaldırma kuvvetinin de arttığını sanır. {{S3}} ağır cisme daha büyük kaldırma kuvveti etki ettiğini sanır. {{S4}} kaldırma kuvvetinin her değişiklikle değiştiğini düşünür.`
      ]
    },
    {
      id: 'kY83_10', yks: true, zorluk: 1, tur: 'cs', cikti: '10.2.2.1', beceri: 'Şekilde yön belirleme',
      tahmin: { gerekce: r`Kaldırma kuvvetinin yönü (yer çekimine zıt, düşey yukarı) programın temel bilgisidir ama hiç sorulmadı. Eğik kap şekli, kuvveti kabın tabanına dik sanma yanılgısını yoklayan kısa bir şekil sorusudur.` },
      metin: r`Eğimli bir rampanın üzerinde duran, içi su dolu cam bir kabın tabanında küçük bir taş şekildeki gibi duruyor. Su durgundur.

Suyun taşa uyguladığı kaldırma kuvvetinin yönü, şekilde numaralanmış oklardan hangisiyle gösterilmiştir?`,
      sekil: 'kY83_egik',
      secenekler: [r`$1$`, r`$2$`, r`$3$`, r`$4$`, r`$5$`],
      dogru: 2,
      cozum: [
        r`Sıvı basıncı derinlikle artar ve derinlik düşey doğrultuda ölçülür. Cismin altındaki noktalar her zaman daha derindedir; basınç kuvvetlerinin farkı düşey yukarı yönlüdür.`,
        r`Kaldırma kuvveti, kabın duruşundan bağımsız olarak yer çekimine zıt yöndedir: 3 numaralı ok.`,
        r`{{S0}} kaldırma kuvvetini kabın tabanına dik sanır; kabın eğik durması sıvının basınç dağılımını değiştirmez. {{S1}} kuvveti rampa boyunca yukarı sanır. {{S3}} taşın kaymasına neden olan kuvveti kaldırma kuvveti sanır. {{S4}} yatay bir kuvvet seçer; sıvı yüzeyi yatay olduğundan aynı derinlikteki noktalarda basınç eşittir ve yatay bir net kuvvet oluşmaz.`
      ]
    },
    {
      id: 'kY83_11', yks: true, zorluk: 1, tur: 'cs', cikti: '10.2.2.1', beceri: 'Modelden çıkarım',
      tahmin: { gerekce: r`Yer çekimi ivmesinin kaldırma kuvvetine etkisi programdaki modelde yer alır ($g$); yüzen cisimde $g$'nin sadeleşmesi oran düzeyinde, hesapsız bir çıkarımdır. Uzay ve Mars bağlamları ÖSYM'nin son yıllardaki bağlam tercihlerine uyar.` },
      metin: r`Mars'ta kurulması tasarlanan bir serada, su dolu bir tankta yüzen tahta bir blok düşünülüyor. Mars'taki yer çekimi ivmesi Dünya'dakinin yaklaşık 0,38 katıdır; suyun ve bloğun özkütleleri Dünya'dakiyle aynı alınıyor. Aynı blok Dünya'da aynı suda yüzerken hacminin bir kısmı suyun içindedir.

Mars'taki durumla ilgili aşağıdakilerden hangisi doğrudur?`,
      secenekler: ['Blok daha çok batar; çünkü kaldırma kuvveti ağırlığından daha fazla küçülür.', 'Blok daha az batar; çünkü ağırlığı küçülür ama kaldırma kuvveti değişmez.', 'Blok yine yüzer ve hacminin aynı oranı suya batar; kaldırma kuvveti ile ağırlık aynı oranda küçülür.', 'Blok tankın tabanına batar; çünkü küçük yer çekiminde su cismi taşıyamaz.', 'Blok suyun üstüne tamamen çıkar; çünkü ağırlığı neredeyse sıfır olur.'],
      dogru: 2,
      cozum: [
        r`Yüzme koşulu $V_b \cdot d_s \cdot g = V \cdot d_c \cdot g$'dir. $g$ iki tarafta da bulunduğu için sadeleşir: $\dfrac{V_b}{V} = \dfrac{d_c}{d_s}$. Batan oran yer çekimine bağlı değildir.`,
        r`Ağırlık ve kaldırma kuvveti ikisi de $g$ ile orantılıdır; ikisi de 0,38 katına iner, eşitlik bozulmaz.`,
        r`{{S1}} kaldırma kuvvetinin de $g$'ye bağlı olduğunu atlar. {{S0}} iki kuvvetin farklı oranda küçüldüğünü sanır. {{S3}} yüzmenin yer çekimine bağlı olduğunu sanır; karar özkütlelerle verilir. {{S4}} ağırlığın sıfıra indiğini sanır; Mars'ta yer çekimi Dünya'dakinden küçük ama sıfır değildir.`
      ]
    },
    {
      id: 'kY83_12', yks: true, zorluk: 1, tur: 'cs', cikti: '10.2.2.2', beceri: 'Çözüm önerisini değerlendirme',
      tahmin: { gerekce: r`10.2.2.2 kazanımı, kaldırma kuvvetiyle günlük hayat problemlerine çözüm önerisi üretmeyi ister; tasarım önerilerini değerlendiren bir soru 9 yılda sorulmadı. "Derinliğin etkisizliği" bu kalıbın doğal tuzağıdır.` },
      metin: r`Bir rafting şirketi, nehir kıyısındaki yüzer iskelesinde şişirilmiş, kapalı plastik dubalar kullanıyor. Ekip, iskelenin batmadan taşıyabileceği en büyük yükü değiştirebilecek bazı fikirleri tartışıyor.

Aşağıdaki değişikliklerden hangisi bu en büyük yükü **değiştirmez?**`,
      secenekler: ['Dubaları aynı hacimde fakat daha hafif bir malzemeden yapmak', 'Dubaları, iskelenin yapısı aynı kalacak biçimde nehrin daha derin bir kesimine taşımak', 'Daha büyük hacimli dubalar kullanmak', 'Duba sayısını artırmak', 'Dubaların cidarlarını, dış hacmi aynı kalacak biçimde daha kalın ve ağır yapmak'],
      dogru: 1,
      cozum: [
        r`İskelenin taşıyabileceği en büyük yük, dubalar tamamen battığında oluşan kaldırma kuvveti ile iskelenin kendi ağırlığının farkıdır. Bu kuvvet dubaların toplam hacmine ve suyun özkütlesine bağlıdır.`,
        r`Suyun derinliği bu ikisini değiştirmez; dubalar tabana değmediği sürece en büyük yük aynı kalır.`,
        r`{{S0}} hafif malzemenin iskelenin ağırlığını azaltıp taşınabilecek yükü artırdığını görmez. {{S2}} hacmin büyümesinin en büyük kaldırma kuvvetini artırdığını görmez. {{S3}} duba sayısıyla toplam hacmin arttığını atlar. {{S4}} ağır cidarın taşınabilecek yükten pay yediğini görmez; en büyük yük azalır.`
      ]
    },
    {
      id: 'kY83_13', yks: true, zorluk: 1, tur: 'cs', cikti: '10.2.2.1', beceri: 'Oran',
      tahmin: { gerekce: r`Yüzen cismin batan kesri ile özkütleler oranı arasındaki ilişki programdaki modelin oran düzeyindeki kullanımıdır. Program hesaplamaya girmediği için soru sayı hesabı değil, "yarısından fazla mı, az mı" karşılaştırması ister. Tuzak, batan kısım ile dışarıda kalan kısmı karıştırmak ve yüzen cisimde kaldırma kuvvetini ağırlıktan farklı sanmaktır.` },
      metin: r`Bir bahçe havuzunda homojen bir çam kütüğü dilimi yüzüyor. Çamın özkütlesi suyunkinin yarısından büyük, suyunkinden küçüktür.

Dilimle ilgili aşağıdakilerden hangisi doğrudur?`,
      secenekler: ['Hacminin yarısından fazlası suyun içindedir; suyun dilime uyguladığı kaldırma kuvveti dilimin ağırlığına eşittir.', 'Hacminin yarısından fazlası su yüzeyinin üstündedir; suyun dilime uyguladığı kaldırma kuvveti dilimin ağırlığına eşittir.', 'Hacminin yarısından fazlası suyun içindedir; suyun dilime uyguladığı kaldırma kuvveti dilimin ağırlığından küçüktür.', 'Hacminin yarısından fazlası su yüzeyinin üstündedir; suyun dilime uyguladığı kaldırma kuvveti dilimin ağırlığından büyüktür.', 'Hacminin tam yarısı suyun içindedir; suyun dilime uyguladığı kaldırma kuvveti dilimin ağırlığına eşittir.'],
      dogru: 0,
      cozum: [
        r`Dilim yüzerek dengededir; kaldırma kuvveti ağırlığına eşittir: $F_k = G$.`,
        r`Yüzen homojen cisimde batan kesir özkütleler oranına eşittir: $\dfrac{V_b}{V} = \dfrac{d_c}{d_s}$. Bu oran yarıdan büyük olduğu için hacmin yarısından fazlası suyun içindedir.`,
        r`{{S1}} batan kesri, su yüzeyinin üstünde kalan kesirle karıştırır. {{S2}} cismin bir kısmı dışarıda kaldığı için kaldırma kuvvetinin ağırlığı karşılamadığını sanır; öyle olsaydı dilim batardı. {{S3}} hem batan ile dışarıda kalan kısmı karıştırır hem de yüzen cisme ağırlığından büyük kaldırma kuvveti etki ettiğini sanır. {{S4}} yüzen her cismin yarısına kadar battığını sanır; batan kesir özkütleler oranına bağlıdır.`
      ]
    },
    {
      id: 'kY83_14', yks: true, zorluk: 2, tur: 'cs', cikti: '10.2.2.1', beceri: 'Etki-tepki ile kuvvet analizi',
      tahmin: { gerekce: r`Kaldırma kuvvetinin tepkisinin sıvıya ve kaba aktarılması, 9. sınıftaki etki-tepki ile birleşen ve ÖSYM'nin henüz sormadığı bir kalıptır. Dinamometre ve terazi okumalarını birlikte yorumlatan sorular TYT'nin deney ağırlıklı yapısına uyar.` },
      metin: r`Sena, mutfak terazisinin üzerine su dolu bir kap koyup teraziyi sıfırlıyor. Bir dinamometreye astığı metal silindiri, kabın tabanına ve çeperlerine değmeyecek biçimde suya tamamen batırıyor. Kaptan su taşmıyor.

{{sekil}}

Silindir suya batırılınca,

I. Dinamometrenin gösterdiği değer azalır.
II. Terazinin gösterdiği değer artar.
III. Dinamometredeki azalma, terazideki artışa eşittir.

yargılarından hangileri doğrudur? (Terazideki değişim kuvvet cinsinden düşünülecektir.)`,
      sekil: 'kY83_terazi',
      secenekler: [r`Yalnız I`, r`Yalnız II`, r`I ve II`, r`II ve III`, r`I, II ve III`],
      dogru: 4,
      cozum: [
        r`I. Su silindire yukarı yönlü kaldırma kuvveti uygular; dinamometre artık $G - F_k$ kadarını taşır. **Doğru.**`,
        r`II. Etki-tepki gereği silindir de suya $F_k$ büyüklüğünde aşağı yönlü kuvvet uygular. Bu kuvvet suyla kaba, oradan teraziye aktarılır. **Doğru.**`,
        r`III. Dinamometredeki azalma da terazideki artış da $F_k$ kadardır. **Doğru.**`,
        r`{{S0}} kaldırma kuvvetinin tepkisinin suya etki ettiğini görmez. {{S1}} dinamometrenin azaldığını atlar. {{S2}} iki değişimin eşit olduğunu görmez. {{S3}} dinamometrenin okumasının değişmediğini düşünür.`
      ]
    },
    {
      id: 'kY83_15', yks: true, zorluk: 2, tur: 'cs', cikti: '10.2.2.1', beceri: 'Arşimet ilkesini uygulama',
      tahmin: { gerekce: r`Arşimet ilkesinin "taşan sıvının ağırlığı = kaldırma kuvveti" biçimi 2018'de sorulmuştu; terazi okumasıyla birleşen yüzen-batan karşılaştırması ise sorulmadı. İki sütunlu seçenek kalıbı ÖSYM'nin bu konuda kullandığı biçimdir.` },
      metin: r`Batuhan, yan ağzına kadar su dolu bir taşırma kabını bir terazinin üzerine koyuyor. Kabın ağzından taşan su, terazinin dışındaki bir kaba akıyor. Önce kaba bir tahta küp bırakıyor; küp yüzüyor. Taşma bitince küpü çıkarıp kabı yeniden ağzına kadar dolduruyor ve bu kez bir çelik bilye bırakıyor; bilye kabın tabanına batıyor.

{{sekil}}

Taşma bittikten sonra terazinin gösterdiği değer, cisim bırakılmadan önceki değere göre tahta küpte ve çelik bilyede nasıl değişir?`,
      sekil: 'kY83_tasirma',
      secenekler: ['Tahta küpte değişmez; çelik bilyede artar.', 'Tahta küpte artar; çelik bilyede artar.', 'Tahta küpte değişmez; çelik bilyede değişmez.', 'Tahta küpte artar; çelik bilyede değişmez.', 'Tahta küpte azalır; çelik bilyede artar.'],
      dogru: 0,
      cozum: [
        r`Taşan suyun ağırlığı kaldırma kuvvetine eşittir. Teraziye eklenen ağırlık cismin ağırlığı, eksilen ise taşan suyun ağırlığıdır.`,
        r`Tahta küp yüzüyor: $F_k = G$. Taşan suyun ağırlığı küpün ağırlığına eşittir; terazi **değişmez.** Çelik bilye batıyor: $F_k < G$. Taşan su bilyeden hafiftir; terazi **artar.**`,
        r`{{S1}} yüzen küpün ağırlığının da teraziye eklendiğini düşünür ama taşan suyu hesaba katmaz. {{S2}} taşan suyun ağırlığının her durumda cismin ağırlığına eşit olduğunu sanır. {{S3}} durumları ters eşler. {{S4}} yüzen küpte taşan suyun küpten ağır olduğunu sanır.`
      ]
    },
    {
      id: 'kY83_16', yks: true, zorluk: 2, tur: 'cs', cikti: '10.2.2.1', beceri: 'Kuvvet karşılaştırma',
      tahmin: { gerekce: r`Eşit kütleli fakat farklı hacimli cisimlerde kaldırma kuvvetinin farklı olması, 2024'te sorulan "eşit hacim" kalıbının tersidir ve ÖSYM'nin sıradaki çeşitlemesi olabilir. Eşit kollu terazi, kuvvet farkını gözlenebilir kılan klasik bir düzenektir.` },
      metin: r`Bir metal geri dönüşüm atölyesinde eşit kollu bir terazinin kollarına iplerle bir bakır parça ile bir alüminyum parça asılmış ve terazi havada şekildeki gibi dengededir. Parçaların altındaki su dolu kaplar yükseltiliyor ve iki parça da aynı anda suya tamamen daldırılıyor; parçalar kapların tabanına değmiyor. Bakırın özkütlesi alüminyumunkinden büyüktür. Havanın kaldırma kuvveti önemsizdir.

Parçalar suya daldırıldıktan sonra terazi için aşağıdakilerden hangisi doğrudur?`,
      sekil: 'kY83_kollu',
      secenekler: ['Alüminyum parçanın asılı olduğu kol aşağı iner; çünkü alüminyumun hacmi büyük olduğu için ağırlığı da büyüktür.', 'Bakır parçanın asılı olduğu kol aşağı iner; çünkü hacmi küçük olan bakıra daha küçük kaldırma kuvveti etki eder.', 'Denge bozulmaz; çünkü parçaların kütleleri eşittir.', 'Denge bozulmaz; çünkü iki parça da suya tamamen batmıştır.', 'Alüminyum parçanın asılı olduğu kol aşağı iner; çünkü özkütlesi büyük olan bakıra daha büyük kaldırma kuvveti etki eder.'],
      dogru: 1,
      cozum: [
        r`Eşit kollu terazi havada dengede olduğuna göre parçaların ağırlıkları eşittir. Özkütlesi büyük olan bakırın hacmi daha küçüktür.`,
        r`İki parça da tamamen batınca kaldırma kuvvetleri hacimleriyle orantılıdır: Alüminyuma daha büyük, bakıra daha küçük kaldırma kuvveti etki eder. Bakırın kolunu aşağı çeken net kuvvet daha büyük kalır; bakırın kolu aşağı iner.`,
        r`{{S0}} hacmi büyük olan cismin daha ağır olduğunu sanır; ağırlıklar eşittir. {{S2}} kaldırma kuvvetlerinin de eşit olacağını sanır. {{S3}} tamamen batmış cisimlere eşit kaldırma kuvveti etki ettiğini sanır; bu yalnız hacimler eşitse doğrudur. {{S4}} kaldırma kuvvetinin cismin özkütlesiyle arttığını sanır.`
      ]
    },
    {
      id: 'kY83_17', yks: true, zorluk: 2, tur: 'cs', cikti: '10.2.2.1', beceri: 'Tablo yorumlama',
      tahmin: { gerekce: r`Dinamometre okumalarından kaldırma kuvveti ve sıvıların özkütle karşılaştırması TYT'nin deney ve tablo yorumu kalıbına uyar; 2026'da deney yorumlu bir soru geldi. Okuma farkı ölçüm yorumudur; yarı batma yargısı hesapla değil, karşılaştırmayla çözülür.` },
      metin: r`Arda, ipe bağladığı bir taşı dinamometreye asıp önce havada, sonra X ve Y sıvılarına batırarak ölçümler yapıyor. Taş sıvılarda çözünmüyor ve kabın tabanına değmiyor.

{{tablo}}

Buna göre,

I. X sıvısının taşa uygulayabildiği en büyük kaldırma kuvveti $2,0\ \text{N}$'dur.
II. Taşın yarısı Y sıvısındayken dinamometre $5,0\ \text{N}$ gösterir.
III. Y sıvısının özkütlesi X sıvısınınkinden büyüktür.

yargılarından hangileri doğrudur?`,
      tablo: [['Taşın durumu', 'Dinamometre (N)'], ['Havada', '6,0'], ['Yarısı X sıvısında', '5,0'], ['Tamamı X sıvısında', '4,0'], ['Tamamı Y sıvısında', '3,5']],
      secenekler: [r`Yalnız I`, r`Yalnız III`, r`I ve III`, r`II ve III`, r`I, II ve III`],
      dogru: 2,
      cozum: [
        r`I. Taş X'e tamamen batınca batan hacim en büyüktür: $F_k = G - G' = 6,0 - 4,0 = 2,0\ \text{N}$. **Doğru.**`,
        r`III. Aynı hacim tamamen batmışken Y'deki kaldırma kuvveti $6,0 - 3,5 = 2,5\ \text{N}$'dur; daha büyük kaldırma kuvveti daha yoğun sıvıyı gösterir. **Doğru.**`,
        r`II. Yarısı X'teyken okuma $5,0\ \text{N}$'dur. Y daha yoğun olduğu için aynı batan hacme Y'de daha büyük kaldırma kuvveti etki eder; yarısı Y'deyken dinamometre $5,0\ \text{N}$'dan küçük bir değer gösterir. **Yanlış.**`,
        r`{{S0}} sıvıların kaldırma kuvvetlerini karşılaştırmayı atlar. {{S1}} I'deki kaldırma kuvvetini sıvıdaki okuma ($4,0\ \text{N}$) sanır. {{S3}} yarıya batma okumasının sıvıya bağlı olmadığını sanır ve I'i de atlar. {{S4}} X'teki $5,0\ \text{N}$'luk yarı batma okumasını Y'ye taşır; kaldırma kuvvetinin sıvının özkütlesine bağlı olduğunu atlar.`
      ]
    },
    {
      id: 'kY83_18', yks: true, zorluk: 2, tur: 'cs', cikti: '10.2.2.1', beceri: 'Sıralama',
      tahmin: { gerekce: r`Aynı cismin üç sıvıdaki yüzme, askıda kalma ve batma durumlarında kaldırma kuvvetlerini sıralamak 2020 ve 2024 sorularının ortak noktasıdır; ÖSYM sıralama biçimini bu konuda henüz kullanmadı.` },
      metin: r`Bir ilaç laboratuvarında şurupların özkütlesi, kütlesi ve hacmi değişmeyen bir test boncuğuyla denetleniyor. Aynı boncuk X, Y ve Z şuruplarına ayrı ayrı bırakılınca şekildeki gibi X'te yüzüyor, Y'de askıda kalıyor, Z'de tüpün tabanına batıyor.

Şurupların boncuğa uyguladığı kaldırma kuvvetleri $F_X$, $F_Y$ ve $F_Z$ arasındaki ilişki nedir?`,
      sekil: 'kY83_boncuk',
      secenekler: [r`$F_X = F_Y = F_Z$`, r`$F_X > F_Y > F_Z$`, r`$F_Z > F_Y > F_X$`, r`$F_X = F_Y > F_Z$`, r`$F_Z > F_X = F_Y$`],
      dogru: 3,
      cozum: [
        r`Yüzen ve askıda kalan boncuk dengededir: $F_X = G$ ve $F_Y = G$. Batan boncukta $F_Z < G$'dir; aradaki farkı tüpün tabanı taşır.`,
        r`Sonuç: $F_X = F_Y > F_Z$.`,
        r`{{S1}} en yoğun şurupta (X) kaldırma kuvvetinin en büyük olacağını sanır; yüzen cisimde kuvvet ağırlığı aşmaz. {{S2}} en çok batan boncuğa en büyük kuvvet etki ettiğini sanır. {{S0}} kaldırma kuvvetinin cismin kendisine bağlı olduğunu, sıvıyla değişmediğini düşünür. {{S4}} batan boncuğun batan hacmi büyük olduğu için kuvvetin en büyük olduğunu sanır; Z'nin özkütlesi en küçüktür.`
      ]
    },
    {
      id: 'kY83_19', yks: true, zorluk: 2, tur: 'cs', cikti: '10.2.2.1', beceri: 'Basınç kuvveti ile ilişkilendirme',
      tahmin: { gerekce: r`Kazanım 10.2.2.1 kaldırma kuvvetini basınç kuvveti farkıyla açıklatır; bu bağlantı 9 yılda hiç sorulmadı. Yüzen cisimde alt yüzey kuvveti ile taban basınç kuvvetini birlikte yoklayan soru, Y.8.1 ile birleşen olası bir TYT kalıbıdır.` },
      metin: r`Silindir biçimli cam bir vazoda su vardır. Şule, vazoya dikdörtgenler prizması biçiminde tahta bir blok bırakıyor; blok şekildeki gibi alt yüzeyi yatay olarak yüzüyor ve vazodan su taşmıyor. Açık hava basıncının etkisi hesaba katılmayacaktır.

Blok bırakıldıktan sonra,

I. Vazodaki su seviyesi yükselir.
II. Suyun bloğun alt yüzeyine uyguladığı basınç kuvveti, bloğun ağırlığından büyüktür.
III. Suyun vazonun tabanına uyguladığı basınç kuvvetindeki artış, bloğun ağırlığına eşittir.

yargılarından hangileri doğrudur?`,
      sekil: 'kY83_bidon',
      secenekler: [r`Yalnız I`, r`Yalnız II`, r`I ve II`, r`I ve III`, r`I, II ve III`],
      dogru: 3,
      cozum: [
        r`I. Blok batan hacmi kadar suyun yerini değiştirir; su seviyesi yükselir. **Doğru.**`,
        r`II. Bloğun üst yüzeyi havadadır; ona sıvı kuvveti etki etmez. Kaldırma kuvveti yalnız alt yüzeydeki kuvvettir ve yüzen blokta ağırlığa eşittir. **Yanlış.**`,
        r`III. Silindir biçimli kapta suyun tabana uyguladığı basınç kuvveti, tabanın üstündeki her şeyin ağırlığını taşır. Blok yüzerken ağırlığı suya aktarılır; seviyenin yükselmesiyle taban basınç kuvveti tam bloğun ağırlığı kadar artar. **Doğru.**`,
        r`{{S0}} taban kuvvetindeki artışı görmez. {{S1}} kaldırma kuvvetinin ağırlıktan büyük olduğunu sanır ve I ile III'ü atlar. {{S2}} kaldırma kuvvetinin ağırlıktan büyük olduğunu sanır ve III'ü atlar. {{S4}} üst yüzey havadayken de bir aşağı yönlü sıvı kuvveti olduğunu varsayar ve alt yüzey kuvvetini büyük sanır.`
      ]
    },
    {
      id: 'kY83_20', yks: true, zorluk: 2, tur: 'cs', cikti: '10.2.2.1', beceri: 'Olasılık değerlendirme',
      tahmin: { gerekce: r`"Olabilir" mantığı 2026'da kaldırma kuvveti sorusunda kullanıldı. Eşit hacimli cisimlerde kaldırma kuvveti farkından olası denge durumlarını sınamak, aynı mantığın kuvvet üzerinden kurulan çeşitlemesidir.` },
      metin: r`Bir malzeme laboratuvarında hacimleri eşit X ve Y numuneleri aynı sıvıya bırakılıyor; ikisi de bir süre sonra dengede kalıyor. Sıvının X'e uyguladığı kaldırma kuvvetinin, Y'ye uyguladığından büyük olduğu ölçülüyor.

Buna göre numunelerin dengedeki durumu için,

I. X yüzüyor, Y kabın tabanına batmış.
II. X ve Y'nin ikisi de yüzüyor.
III. X sıvının içinde askıda, Y yüzüyor.

durumlarından hangileri olabilir?`,
      secenekler: [r`Yalnız I`, r`Yalnız III`, r`I ve II`, r`II ve III`, r`I, II ve III`],
      dogru: 3,
      cozum: [
        r`Hacimler eşit ve sıvı aynı olduğu için kaldırma kuvvetini batan hacim belirler: $V_{b,X} > V_{b,Y}$.`,
        r`I. Y batmışsa $V_{b,Y}$ hacmin tamamıdır; X yüzüyorsa $V_{b,X}$ daha küçüktür. Kaldırma kuvveti Y'de büyük olurdu. **Olamaz.**`,
        r`II. İki numune de yüzüyorsa $F_k = G$'dir; X daha ağırsa daha çok batar. **Olabilir.**`,
        r`III. Askıdaki X'in tamamı, yüzen Y'nin bir kısmı sıvıdadır; $V_{b,X} > V_{b,Y}$. **Olabilir.**`,
        r`{{S0}} yüzen cismin batan hacminin batmış cisimden küçük olduğunu görmez. {{S1}} iki yüzen cismin farklı ağırlıklarda olabileceğini düşünmez. {{S2}} batan Y'nin hacminin tamamının sıvıda olduğunu atlar ve askıdaki X'i gözden kaçırır. {{S4}} I'deki çelişkiyi görmez.`
      ]
    },
    {
      id: 'kY83_21', yks: true, zorluk: 2, tur: 'cs', cikti: '10.2.2.1', beceri: 'Kesin çıkarım',
      tahmin: { gerekce: r`Yüzme-batma gözlem tablosundan özkütle sıralaması kurmak 2025 ve 2026 sorularının ortak becerisidir. "Kesinlikle" kökü ve deneyi yapılmamış bir hücre, ÖSYM'nin verilmeyen bilgiyi varsaydırma tuzağını taşır.` },
      metin: r`Bir öğrenci, birbirine karışmayan $S_1$ ve $S_2$ sıvılarına A ve B katı cisimlerini ayrı ayrı bırakarak gözlemlerini tabloya yazıyor. Cisimler sıvılarda çözünmüyor; tablodaki çizgi o deneyin yapılmadığını gösteriyor.

{{tablo}}

Buna göre,

I. A'nın kütlesi B'ninkinden büyüktür.
II. $S_1$ sıvısının özkütlesi $S_2$ sıvısınınkinden büyüktür.
III. B cismi $S_1$ sıvısına bırakılsaydı yüzerdi.

yargılarından hangileri kesinlikle doğrudur?`,
      tablo: [['Cisim', r`$S_1$ sıvısında`, r`$S_2$ sıvısında`], ['A', 'Yüzüyor', 'Tabana batıyor'], ['B', '—', 'Yüzüyor']],
      secenekler: [r`Yalnız II`, r`Yalnız III`, r`I ve II`, r`I ve III`, r`II ve III`],
      dogru: 4,
      cozum: [
        r`A, $S_1$'de yüzüyor: $d_A < d_{S_1}$. A, $S_2$'de batıyor: $d_A > d_{S_2}$. B, $S_2$'de yüzüyor: $d_B < d_{S_2}$. Sıralama: $d_{S_1} > d_A > d_{S_2} > d_B$.`,
        r`II. $d_{S_1} > d_{S_2}$ **Kesinlikle doğru.**`,
        r`III. $d_B < d_{S_2} < d_{S_1}$ olduğundan B, $S_1$'de de yüzer. **Kesinlikle doğru.**`,
        r`I. Gözlemler yalnız özkütleleri karşılaştırır; cisimlerin hacimleri bilinmediği için kütleleri karşılaştırılamaz. **Kesin değil.**`,
        r`{{S0}} B'nin $S_1$'deki durumunun özkütle zincirinden çıktığını görmez. {{S1}} iki sıvının karşılaştırmasını atlar. {{S2}} özkütlesi büyük olan cismin kütlesinin de büyük olduğunu sanır ve III'ü atlar. {{S3}} özkütlesi büyük olan cismin kütlesinin de büyük olduğunu sanır ve II'yi atlar.`
      ]
    },
    {
      id: 'kY83_22', yks: true, zorluk: 2, tur: 'cs', cikti: '10.2.2.1', beceri: 'Değişkenler arası ilişki',
      tahmin: { gerekce: r`Derinliğin tamamen batmış cisimde basınç kuvvetlerini artırıp kaldırma kuvvetini değiştirmemesi programın vurguladığı bir ayrımdır; 9 yılda TYT'de sorulmadı. İki sütunlu seçenek, 2020'deki ÖSYM biçimidir.` },
      metin: r`Bir deniz biyoloğu, tekneden çelik bir halata bağlı, kapalı ve sızdırmaz bir kamera kutusunu denize indiriyor. Kutu tamamen su altındayken, biçimi ve hacmi değişmeden daha derine indiriliyor ve her ölçüm derinliğinde durdurulup bekletiliyor. Deniz suyunun özkütlesi her derinlikte aynı kabul ediliyor.

Kutu daha derinde durdurulduğunda, halatın kutuyu yukarı çekme kuvveti ve suyun kutunun alt yüzeyine uyguladığı basınç kuvveti öncekine göre nasıl değişir?`,
      secenekler: ['Halatın kuvveti artar; alt yüzeydeki basınç kuvveti artar.', 'Halatın kuvveti azalır; alt yüzeydeki basınç kuvveti artar.', 'Halatın kuvveti değişmez; alt yüzeydeki basınç kuvveti artar.', 'Halatın kuvveti değişmez; alt yüzeydeki basınç kuvveti değişmez.', 'Halatın kuvveti azalır; alt yüzeydeki basınç kuvveti değişmez.'],
      dogru: 2,
      cozum: [
        r`Derinlik artınca alt yüzeydeki sıvı basıncı ve basınç kuvveti **artar.** Üst yüzeydeki kuvvet de aynı miktarda artar.`,
        r`Kaldırma kuvveti iki kuvvetin farkıdır ve değişmez. Kutu dengede olduğu için halatın kuvveti $G - F_k$'dir; **değişmez.**`,
        r`{{S1}} artan basıncın kutuyu daha çok kaldırdığını sanır. {{S0}} artan basıncın kutuyu aşağı ittiğini sanır. {{S3}} basıncın derinlikle arttığını atlar. {{S4}} hem kaldırma kuvvetinin arttığını hem basıncın değişmediğini düşünür.`
      ]
    },
    {
      id: 'kY83_23', yks: true, zorluk: 2, tur: 'cs', cikti: '10.2.2.2', beceri: 'Günlük hayat uygulaması',
      tahmin: { gerekce: r`10.2.2.2 kazanımı kaldırma kuvvetinin günlük hayattaki uygulamalarını ister. Sıcaklıkla sıvının özkütlesinin değişmesi ile yüzme-batmayı birleştiren Galileo termometresi, ÖSYM'nin özkütle ile kaldırma kuvvetini birleştiren son sorularına uyar.` },
      metin: r`Galileo termometresi, sıvıyla dolu kapalı bir cam silindirin içinde, özkütleleri birbirinden biraz farklı küçük kapalı cam kürelerden oluşan bir süs eşyasıdır. Oda ısındıkça bazı küreler sırayla silindirin dibine iner. Isınmayla kürelerin hacmindeki değişim, sıvınınkinin yanında önemsizdir.

Buna göre,

I. Isınan sıvının özkütlesi azalır.
II. Isınma sırasında yukarıdan dibe inen bir küreye etki eden kaldırma kuvveti, inmeye başlamadan öncekinden küçüktür.
III. Isınınca dibe inen kürelerin özkütlesi, yukarıda kalan kürelerinkinden küçüktür.

yargılarından hangileri doğrudur?`,
      secenekler: [r`Yalnız I`, r`Yalnız II`, r`I ve II`, r`I ve III`, r`II ve III`],
      dogru: 2,
      cozum: [
        r`I. Sıvı ısınınca genleşir; kütlesi aynı kalırken hacmi büyür ve özkütlesi azalır. **Doğru.**`,
        r`II. Küre yukarıdayken $F_k \geq G$ idi; dibe inerken ve dipte $F_k < G$'dir. Ayrıca kürenin hacmi aynı, sıvının özkütlesi küçüktür. **Doğru.**`,
        r`III. Sıvının özkütlesi azalırken önce, özkütlesi sıvınınkini ilk aşan küreler, yani en yoğun olanlar dibe iner. **Yanlış.**`,
        r`{{S0}} dibe inmenin kaldırma kuvvetinin ağırlığın altına düşmesi demek olduğunu görmez. {{S1}} sıvının genleşerek seyrekleştiğini atlar. {{S3}} hafif kürelerin önce battığını sanır ve II'yi atlar. {{S4}} hafif kürelerin önce battığını sanır ve sıvının seyrekleşmesini atlar.`
      ]
    },
    {
      id: 'kY83_24', yks: true, zorluk: 3, tur: 'cs', cikti: '10.2.2.1', beceri: 'Çok adımlı akıl yürütme',
      tahmin: { gerekce: r`Yüzen kaptaki cismin suya atılmasıyla seviyenin düşmesi, yüzen ve batan cisimlerin yerini değiştirdiği hacimleri karşılaştırtan klasik bir kavram zinciridir; 9 yılda sorulmadı. TYT'nin zor soruları hesapla değil bu tür zincirlerle kurulur.` },
      metin: r`Su dolu geniş bir leğende, içinde bir taş bulunan metal bir tencere şekildeki gibi yüzüyor. İpek, taşı tencereden alıp leğendeki suya bırakıyor; taş leğenin tabanına batıyor, tencere yüzmeye devam ediyor. Leğenden su taşmıyor.

Bu işlemden sonra tencerenin suya batan hacmi ve leğendeki su seviyesi ilk duruma göre nasıl değişir?`,
      sekil: 'kY83_tencere',
      secenekler: ['Tencerenin batan hacmi azalır; su seviyesi düşer.', 'Tencerenin batan hacmi azalır; su seviyesi değişmez.', 'Tencerenin batan hacmi azalır; su seviyesi yükselir.', 'Tencerenin batan hacmi değişmez; su seviyesi yükselir.', 'Tencerenin batan hacmi artar; su seviyesi yükselir.'],
      dogru: 0,
      cozum: [
        r`Taş tencerenin içindeyken tencere, taşın ağırlığını da taşıyacak kadar batar. Taş alınınca tencerenin yüzdürmesi gereken ağırlık azalır; batan hacmi **azalır.**`,
        r`Taş tenceredeyken, ağırlığına eşit ağırlıkta suyun yerini değiştiriyordu. Suda batmışken ise yalnız kendi hacmi kadar suyun yerini değiştirir. Taşın özkütlesi sudan büyük olduğu için kendi hacmindeki suyun ağırlığı taşın ağırlığından küçüktür. Yeri değişen toplam su azalır; seviye **düşer.**`,
        r`{{S1}} taşın her iki durumda da aynı miktarda su yerini değiştirdiğini sanır. {{S2}} suya giren taşın seviyeyi yükselteceğini düşünür; tencerenin yükselmesini hesaba katmaz. {{S3}} tencerenin batan hacminin taşla değişmediğini sanır. {{S4}} tencereden yük alınınca tencerenin daha çok battığını sanır.`
      ]
    },
    {
      id: 'kY83_25', yks: true, zorluk: 3, tur: 'cs', cikti: '10.2.2.1', beceri: 'Çok adımlı akıl yürütme',
      tahmin: { gerekce: r`Yüzen buzun erimesiyle seviyenin değişmemesi Arşimet ilkesinin bilinen bir sonucudur; buzun içindeki cismin yüzüp batmasına göre sonucun değişmesi ise ÖSYM'nin zor soru tarzında bir çeşitlemedir. 9 yılda sorulmadı.` },
      metin: r`Bir kafede, aynı sıcaklıktaki suyla dolu üç özdeş bardağa birer buz küpü bırakılıyor. I. bardaktaki buz saf sudan; II. bardaktaki buz içine küçük bir cam boncuk, III. bardaktaki buz içine küçük bir mantar parçası dondurularak yapılmıştır. Üç buz küpü de şekildeki gibi yüzüyor.

{{sekil}}

Buzlar tamamen eridiğinde hangi bardaklarda su seviyesi buzlar erimeden önceki seviyeyle aynı olur? (Suyun sıcaklıkla hacim değişimi ve buharlaşma önemsizdir.)`,
      sekil: 'kY83_buzlar_genis',
      secenekler: [r`Yalnız I`, r`Yalnız III`, r`I ve II`, r`I ve III`, r`I, II ve III`],
      dogru: 3,
      cozum: [
        r`Yüzen buz, kendi ağırlığına eşit ağırlıkta suyun yerini değiştirir. Eriyince oluşan su da aynı ağırlıkta olduğu için tam o hacmi doldurur. I'de seviye değişmez.`,
        r`II. Buz ve boncuk birlikte yüzerken, toplam ağırlıklarına eşit ağırlıkta suyun yerini değiştirir. Eriyince boncuk batar ve yalnız kendi hacmi kadar suyun yerini değiştirir; camın özkütlesi sudan büyük olduğu için bu, boncuğun ağırlığına eşit sudan azdır. Seviye düşer.`,
        r`III. Buz eriyince mantar yüzer ve yine kendi ağırlığına eşit ağırlıkta suyun yerini değiştirir. Yeri değişen toplam su aynı kalır; seviye değişmez.`,
        r`{{S0}} mantarın eriyen buzdan sonra da yüzerek aynı suyu yerinden ettiğini görmez. {{S1}} saf buzun eriyince seviyeyi değiştirdiğini sanır. {{S2}} batan boncuğun daha az su yerinden ettiğini görmez ve mantarı atlar. {{S4}} boncuğun eriyen buzdan sonra batınca daha az su yerinden ettiğini görmez.`

      tahmin: { gerekce: r`Batan hacmin derinlikle değişimini grafik diline çevirmek, programın deney ve simülasyon vurgusuna ve ÖSYM'nin grafik yorumlama kalıbına uyar; biçime bağlı eğri farkı hesap gerektirmeyen ama kavramı zorlayan bir sorudur.` },
      metin: r`Hacimleri ve yükseklikleri eşit X, Y ve Z cisimleri şekildeki gibidir: X dik silindir, Y sivri ucu aşağıda olan koni, Z sivri ucu yukarıda olan konidir. Cisimler ayrı ayrı, eksenleri düşey kalacak biçimde geniş bir su tankına yavaşça indiriliyor. Tank geniş olduğu için su seviyesinin yükselmesi önemsizdir.

      metin: r`Bir kavanozdaki suyun üzerinde, yüksek yoğunluklu polietilenden yapılmış bir küp yüzüyor. Küpün özkütlesi sıvı yağınkinden büyük, suyunkinden küçüktür. Kavanoza, küp tamamen yağın ve suyun içinde kalacak kadar sıvı yağ yavaşça dökülüyor; küp yine dengede kalıyor ve kavanozun tabanına değmiyor. Yağ ile su karışmıyor.

      metin: r`Fizik laboratuvarındaki baroskop adlı düzenekte, eşit kollu küçük bir terazinin bir koluna ince camdan yapılmış, içi hava dolu, kapalı ve büyük bir küre, diğer koluna küçük bir pirinç ağırlık asılıdır. Terazi havada şekildeki gibi dengededir. Düzenek bir fanusun içine konup fanustaki hava pompayla boşaltılıyor; cam küre sağlamdır ve biçimi değişmez.

      dogru: 3,
      cozum: [

        r`Havada denge varken kollara etki eden net kuvvetler eşittir: $G_\text{küre} - F_\text{küre} = G_\text{pirinç} - F_\text{pirinç}$. $F_\text{küre} > F_\text{pirinç}$ olduğuna göre $G_\text{küre} > G_\text{pirinç}$'tir. Hava boşaltılınca kaldırma kuvvetleri kalkar ve ağır olan kürenin kolu aşağı iner.`,

        r`II. Ayrıyken $F_X = G_X$ ve $F_Y = G_Y$ idi. Birleşik cisim yüzdüğü için $F = G_X + G_Y = F_X + F_Y$. **Kesinlikle doğru.**`,

  /* --- destek çubuğu ve kol --- */
  s += `<rect x="22" y="${YZ - 6}" width="44" height="6" rx="1.5" fill="#6d7a84"/><rect x="38" y="10" width="6" height="${YZ - 16}" fill="#8b98a2"/>`;
  s += `<rect x="38" y="10" width="${XC - 32}" height="6" rx="2" fill="#8b98a2"/>`;

  /* --- dinamometre: gövde, ölçek (0–12 N), gösterge --- */
  const DY0 = 22, DY1 = 82, nY = n => DY0 + 6 + (DY1 - DY0 - 12) * n / 12;
  s += `<line x1="${XC}" y1="16" x2="${XC}" y2="${DY0}" stroke="#55626b" stroke-width="1.6"/>`;
  s += `<rect x="${XC - 10}" y="${DY0}" width="20" height="${DY1 - DY0}" rx="4" fill="#fdfdfb" stroke="#55626b" stroke-width="1.6"/>`;
  for (let n = 0; n <= 12; n += 2) s += `<line x1="${XC - 9}" y1="${nY(n)}" x2="${XC - (n % 4 ? 5 : 3)}" y2="${nY(n)}" stroke="#55626b" stroke-width=".9"/>`;
  s += `<line x1="${XC - 9}" y1="${nY(okuma)}" x2="${XC + 9}" y2="${nY(okuma)}" stroke="${P.coral}" stroke-width="2.4"/>`;
  s += `<line x1="${XC}" y1="${DY1}" x2="${XC}" y2="${YK}" stroke="#55626b" stroke-width="1.6"/><path d="M${XC} ${YK} q-5 0 -5 5 q0 5 5 5" fill="none" stroke="#55626b" stroke-width="1.6"/>`;
  s += `<line x1="${XC - 2}" y1="${YK + 10}" x2="${XC}" y2="${YT}" stroke="#4a4a4a" stroke-width="1.1"/>`;
  s += T(XC + 18, 36, `${md.ad}`, { size: 12, weight: 700, fill: P.ink2 });
  s += T(XC + 18, 56, `G = ${sayi(gw, 2)} N`, { size: 13, weight: 800, fill: P.ink });
  s += T(XC + 18, 76, `G' = ${sayi(okuma, 2)} N`, { size: 13, weight: 800, fill: P.coral });

  /* --- kriko ve kap --- */
  const yKB = yTab + 3, hJ = YZ - yKB;                        // kabın dış tabanı, krikonun yüksekliği
  s += `<rect x="${XC - 54}" y="${yKB}" width="108" height="${Math.max(0, hJ)}" fill="none"/>`;
  if (hJ > 8) {
    s += `<path d="M${XC - 40} ${YZ - 3} L${XC + 40} ${yKB + 3} M${XC + 40} ${YZ - 3} L${XC - 40} ${yKB + 3}" stroke="#7d8b95" stroke-width="2.4"/>`;
    s += `<rect x="${XC - 46}" y="${YZ - 4}" width="92" height="4" fill="#7d8b95"/>`;
  }
  s += `<rect x="${XC - 46}" y="${yKB}" width="92" height="3" fill="#7d8b95"/>`;
  s += `<rect x="${KL}" y="${yY}" width="${KR - KL}" height="${yTab - yY}" fill="url(#${u}sv)"/>`;
  s += `<line x1="${KL}" y1="${yY}" x2="${KR}" y2="${yY}" stroke="${sv.kenar}" stroke-width="1.6"/>`;
  if (yY < YT) { const xs = XC - 2 + 2 * (yY - YK - 10) / (YT - YK - 10); s += `<line x1="${xs.toFixed(2)}" y1="${yY}" x2="${XC}" y2="${YT}" stroke="#4a4a4a" stroke-width="1.1" opacity=".75"/>`; }   // ipin sıvıdaki kısmı

  /* --- silindir (sıvının önünde, sıvıdaki kısmı yarı saydam örtüyle) --- */
  s += `<rect x="${XC - 11}" y="${YT}" width="22" height="${HC * S}" rx="2" fill="url(#${u}cy)" stroke="#55626b" stroke-width="1.2"/>`;
  if (v.x > 0) s += `<rect x="${XC - 11}" y="${Math.max(yY, YT)}" width="22" height="${yAlt - Math.max(yY, YT)}" fill="${sv.dolgu[1]}" opacity=".35"/>`;
  s += `<path d="M${KL - 2} ${yY - 12} V${yTab + 1.5} H${KR + 2} V${yY - 12}" fill="none" stroke="#5d7d8f" stroke-width="3" stroke-linejoin="round"/>`;

  /* --- derinlik ölçüsü (kabın sağında) --- */
  const DX = KR + 18;
  s += dashLine(XC + 12, yAlt, DX + 4, yAlt, P.ink2, '3 3', 1);
  if (v.x >= 1.5) {
    s += dashLine(KR + 4, yY, DX + 4, yY, P.ink2, '3 3', 1);
    s += `<line x1="${DX}" y1="${yY + 5}" x2="${DX}" y2="${yAlt - 5}" stroke="${P.ink}" stroke-width="1.2"/><polygon points="${DX},${yY} ${DX - 3},${yY + 6} ${DX + 3},${yY + 6}" fill="${P.ink}"/><polygon points="${DX},${yAlt} ${DX - 3},${yAlt - 6} ${DX + 3},${yAlt - 6}" fill="${P.ink}"/>`;
  }
  // iki satır: tek satırda sağdaki grafik paneline dayanıyordu
  const yEt = v.x >= 1.5 ? (yY + yAlt) / 2 - 3.5 : yAlt - 24;
  s += T(DX + 7, yEt, 'x =', { size: 12.5, weight: 800, fill: P.ink }) + T(DX + 7, yEt + 16, `${sayi(v.x, v.x % 1 ? 1 : 0)} cm`, { size: 12.5, weight: 800, fill: P.ink });
  s += T(XC, 322, `${sv.ad}: d = ${sayi(v.d, 0)} kg/m^3`, { size: 12.5, anchor: 'middle', weight: 700, fill: P.ink });

  /* --- F_k–x grafiği: üç sıvı soluk, seçili sıvı koyu --- */
  const gx = x => OX + x * GX, gy = f => OY - f * GY;
  for (let x = 4; x <= 16; x += 4) s += `<line x1="${gx(x)}" y1="${OY}" x2="${gx(x)}" y2="${gy(2.05)}" stroke="#e1e9ee" stroke-width="1"/>`;
  for (let f = 0.5; f <= 2; f += 0.5) s += `<line x1="${OX}" y1="${gy(f)}" x2="${gx(16) + 4}" y2="${gy(f)}" stroke="#e1e9ee" stroke-width="1"/>`;
  const xe = OX + G.EX, ye = OY - G.EY;
  s += `<line x1="${OX}" y1="${OY}" x2="${xe}" y2="${OY}" stroke="${P.ink}" stroke-width="1.4"/><polygon points="${xe + 7},${OY} ${xe - 2},${OY - 3.8} ${xe - 2},${OY + 3.8}" fill="${P.ink}"/>`;
  s += `<line x1="${OX}" y1="${OY}" x2="${OX}" y2="${ye}" stroke="${P.ink}" stroke-width="1.4"/><polygon points="${OX},${ye - 7} ${OX - 3.8},${ye + 2} ${OX + 3.8},${ye + 2}" fill="${P.ink}"/>`;
  s += T(xe + 11, OY + 4.5, 'x (cm)', { size: 13, weight: 700 });
  s += T(OX + 8, ye + 4, 'F_k (N)', { size: 13, weight: 700 });
  s += T(OX - 5, OY + 15, '0', { size: 12, anchor: 'end', weight: 600, fill: P.ink2 });
  for (let x = 4; x <= 16; x += 4) s += T(gx(x), OY + 17, String(x), { size: 12, anchor: 'middle', weight: 600, fill: P.ink2 });
  for (let f = 0.5; f <= 2; f += 0.5) s += T(OX - 7, gy(f) + 4.3, sayi(f, 1), { size: 12, anchor: 'end', weight: 600, fill: P.ink2 });
  [790, 1000, 1260].forEach(d => {
    const fm = V * 1e-6 * d * g, sec = d === v.d;
    s += `<path d="M${gx(0)} ${gy(0)} L${gx(HC)} ${gy(fm)} L${gx(16)} ${gy(fm)}" fill="none" stroke="${sec ? P.blue : '#b9cbd8'}" stroke-width="${sec ? 2.8 : 1.6}" stroke-linecap="round" stroke-linejoin="round"/>`;
  });
  s += dashLine(gx(HC), gy(0), gx(HC), gy(1.98), P.ink2, '2 4', 1);
  s += T(gx(HC) + 4, gy(2.02), 'tamamen battı', { size: 11.5, weight: 700, fill: P.ink2 });
  const px = gx(v.x), py = gy(fk);
  if (v.x > 0) s += dashLine(px, py + 6, px, OY, P.ink2, '3 3', 1.1);
  s += `<circle cx="${px}" cy="${py}" r="5.2" fill="${P.coral}" stroke="#fff" stroke-width="1.6"/>`;
  return svg(W, H, s, u, o && o.dar ? 80 : 150);
}

/* 2) prizmanın alt ve üst yüzeylerine etki eden basınç kuvvetleri */
(function () {
const { P, T, arrow, svg, dashLine } = window.BFY_FIGLIB;

const g = 10, A = 50, HP = 16;                                   // cm², cm

const F1 = (v, x) => Math.max(0, (x == null ? v.x : x) - HP) / 100 * v.d * g * A * 1e-4;
const F2 = (v, x) => (x == null ? v.x : x) / 100 * v.d * g * A * 1e-4;
const batan = v => A * Math.min(v.x, HP);
const SIVI = {
  920: { ad: 'Sıvı yağ', dolgu: ['#fbf3d6', '#ecd88f'], kenar: '#b0902c' },
  1000: { ad: 'Su', dolgu: ['#d7ecf8', '#9ccbe8'], kenar: '#2a6f9e' },
  1260: { ad: 'Gliserin', dolgu: ['#f4f0e2', '#ddd3ad'], kenar: '#9a8a4a' }
};

const GENIS = { W: 560, H: 330, OX: 344, OY: 286, GX: 3.3, GY: 7, EX: 162, EY: 246, panel: [290, 12, 260, 306] };
const DAR = { W: 300, H: 552, OX: 58, OY: 514, GX: 3.3, GY: 5.2, EX: 162, EY: 174, panel: [10, 326, 280, 218] };
const S = 3.8, XC = 140, YS = 76, YB = 286, YZ = 290, KL = 62, KR = 218;   // px/cm, prizma ekseni, sıvı yüzeyi, tank tabanı, masa, tank çeperleri
const PW = 30;                                                               // prizmanın ön görünüş genişliği (≈ 7,1 cm kenar)

function sahne(v, u, o) {
  const G = o && o.dar ? DAR : GENIS, { W, H, OX, OY, GX, GY } = G;
  const sv = SIVI[v.d], f1 = F1(v), f2 = F2(v);
  const yAlt = YS + v.x * S, yUst = yAlt - HP * S;
  let s = `<defs><linearGradient id="${u}sv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sv.dolgu[0]}"/><stop offset="1" stop-color="${sv.dolgu[1]}"/></linearGradient>
  <linearGradient id="${u}pr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7d8790"/><stop offset=".45" stop-color="#d5dbe0"/><stop offset="1" stop-color="#7d8790"/></linearGradient></defs>`;
  s += `<rect class="bg" x="0" y="0" width="${W}" height="${H}" rx="14" fill="#f3f8fb"/>`;
  s += `<rect class="bg" x="${G.panel[0]}" y="${G.panel[1]}" width="${G.panel[2]}" height="${G.panel[3]}" rx="12" fill="#fbfdfe" stroke="#dde7ee" stroke-width="1"/>`;
  s += `<rect class="bg" x="20" y="${YZ}" width="250" height="9" rx="2" fill="url(#${u}wood)" stroke="#c9a76c" stroke-width=".8"/>`;

  /* --- tank ve sıvı --- */
  s += `<rect x="${KL}" y="${YS}" width="${KR - KL}" height="${YB - YS}" fill="url(#${u}sv)"/>`;
  s += `<line x1="${KL}" y1="${YS}" x2="${KR}" y2="${YS}" stroke="${sv.kenar}" stroke-width="1.6"/>`;

  /* --- ip ve prizma --- */
  s += `<line x1="${XC}" y1="4" x2="${XC}" y2="${yUst}" stroke="#4a4a4a" stroke-width="1.2"/>`;
  s += `<rect x="${XC - PW / 2}" y="${yUst}" width="${PW}" height="${HP * S}" fill="url(#${u}pr)" stroke="#55626b" stroke-width="1.2"/>`;
  if (v.x > 0) s += `<rect x="${XC - PW / 2}" y="${Math.max(YS, yUst)}" width="${PW}" height="${yAlt - Math.max(YS, yUst)}" fill="${sv.dolgu[1]}" opacity=".35"/>`;
  s += `<path d="M${KL - 2} ${YS - 16} V${YB + 1.5} H${KR + 2} V${YS - 16}" fill="none" stroke="#5d7d8f" stroke-width="3" stroke-linejoin="round"/>`;

  /* --- basınç kuvveti okları (boyları kuvvetle orantılı) --- */
  const L = f => 5 + 0.6 * f;
  if (f2 > 0) {
    const l2 = L(f2);
    s += arrow(XC, yAlt + l2 + 2, XC, yAlt + 1, { color: P.blue, w: 2.6, head: 7, headW: 4.4 });
    s += T(XC + 8, yAlt + l2 / 2 + 8, 'F₂', { size: 13, weight: 800, fill: P.blue });
  }
  if (f1 > 0) {
    const l1 = L(f1);
    s += arrow(XC, yUst - l1 - 2, XC, yUst - 1, { color: P.coral, w: 2.6, head: 7, headW: 4.4 });
    s += T(XC + 8, yUst - l1 / 2 + 2, 'F₁', { size: 13, weight: 800, fill: P.coral });
  }

  /* --- derinlik ölçüsü (tankın sağında) --- */
  const DX = KR + 16;
  s += dashLine(XC + PW / 2 + 2, yAlt, DX + 4, yAlt, P.ink2, '3 3', 1);
  if (v.x >= 4) s += `<line x1="${DX}" y1="${YS + 5}" x2="${DX}" y2="${yAlt - 5}" stroke="${P.ink}" stroke-width="1.2"/><polygon points="${DX},${YS} ${DX - 3},${YS + 6} ${DX + 3},${YS + 6}" fill="${P.ink}"/><polygon points="${DX},${yAlt} ${DX - 3},${yAlt - 6} ${DX + 3},${yAlt - 6}" fill="${P.ink}"/>`;
  s += dashLine(KR + 4, YS, DX + 4, YS, P.ink2, '3 3', 1);
  // etiket iki satır: tek satırda en büyük değerde sağdaki grafik paneline (geniş) ya da viewBox sınırına (dar) dayanıyordu
  const yEt = v.x >= 4 ? (YS + yAlt) / 2 - 3.5 : yAlt + 16;
  s += T(DX + 6, yEt, 'x =', { size: 12.5, weight: 800, fill: P.ink }) + T(DX + 6, yEt + 16, `${sayi(v.x, 0)} cm`, { size: 12.5, weight: 800, fill: P.ink });
  s += T(145, 318, `${sv.ad}: d = ${sayi(v.d, 0)} kg/m^3`, { size: 12.5, anchor: 'middle', weight: 700, fill: P.ink });

  /* --- F₁ ve F₂ – x grafiği --- */
  const gx = x => OX + x * GX, gy = f => OY - f * GY;
  for (let x = 16; x <= 48; x += 16) s += `<line x1="${gx(x)}" y1="${OY}" x2="${gx(x)}" y2="${gy(32)}" stroke="#e1e9ee" stroke-width="1"/>`;
  for (let f = 10; f <= 30; f += 10) s += `<line x1="${OX}" y1="${gy(f)}" x2="${gx(48) + 4}" y2="${gy(f)}" stroke="#e1e9ee" stroke-width="1"/>`;
  const xe = OX + G.EX, ye = OY - G.EY;
  s += `<line x1="${OX}" y1="${OY}" x2="${xe}" y2="${OY}" stroke="${P.ink}" stroke-width="1.4"/><polygon points="${xe + 7},${OY} ${xe - 2},${OY - 3.8} ${xe - 2},${OY + 3.8}" fill="${P.ink}"/>`;
  s += `<line x1="${OX}" y1="${OY}" x2="${OX}" y2="${ye}" stroke="${P.ink}" stroke-width="1.4"/><polygon points="${OX},${ye - 7} ${OX - 3.8},${ye + 2} ${OX + 3.8},${ye + 2}" fill="${P.ink}"/>`;
  s += T(xe + 11, OY + 4.5, 'x (cm)', { size: 13, weight: 700 });
  s += T(OX + 8, ye + 4, 'F (N)', { size: 13, weight: 700 });
  s += T(OX - 5, OY + 15, '0', { size: 12, anchor: 'end', weight: 600, fill: P.ink2 });
  for (let x = 16; x <= 48; x += 16) s += T(gx(x), OY + 17, String(x), { size: 12, anchor: 'middle', weight: 600, fill: P.ink2 });
  for (let f = 10; f <= 30; f += 10) s += T(OX - 7, gy(f) + 4.3, String(f), { size: 12, anchor: 'end', weight: 600, fill: P.ink2 });
  s += `<path d="M${gx(0)} ${gy(0)} L${gx(48)} ${gy(F2(v, 48))}" fill="none" stroke="${P.blue}" stroke-width="2.8" stroke-linecap="round"/>`;
  s += `<path d="M${gx(0)} ${gy(0)} L${gx(HP)} ${gy(0)} L${gx(48)} ${gy(F1(v, 48))}" fill="none" stroke="${P.coral}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>`;
  s += T(gx(30), gy(F2(v, 30)) - 9, 'F₂', { size: 13, anchor: 'end', weight: 800, fill: P.blue });
  s += T(gx(36) + 4, gy(F1(v, 36)) + 18, 'F₁', { size: 13, weight: 800, fill: P.coral });
  const px = gx(v.x);
  if (v.x > 0) {
    s += dashLine(px, gy(f2) + 6, px, OY, P.ink2, '3 3', 1.1);
    if (f2 - f1 > 1.2) s += `<line x1="${px}" y1="${gy(f2) + 6}" x2="${px}" y2="${gy(f1) - 6}" stroke="#2f9a5e" stroke-width="2.4"/>`;
  }
  s += `<circle cx="${px}" cy="${gy(f2)}" r="5" fill="${P.blue}" stroke="#fff" stroke-width="1.6"/><circle cx="${px}" cy="${gy(f1)}" r="5" fill="${P.coral}" stroke="#fff" stroke-width="1.6"/>`;
  return svg(W, H, s, u, o && o.dar ? 80 : 150);
}

function tytKitapAdi(ks) { const us = tytUniteleri(ks); return us.length === 1 ? us[0].ad : us.length === 2 ? us.map(u => u.ad).join(' + ') : `${UR.sinav} Fizik: ${ks.length} konu`; }
function kapakBlok(harf) {
  const ks = secKonular();
  const unAd = (() => { const s = window.BFY_KATALOG.find(x => x.no === S.sinif); const u = s && s.uniteler && s.uniteler.find(x => x.konular.some(k => k.id === ks[0]?.id)); return u ? u.ad : ''; })();
  const baslik = S.baslik.trim() || (ks.length === 1 ? ks[0].ad : ks.length === 2 ? ks.map(k => k.kisa || k.ad).join(' + ') : S.sinif >= 20 ? tytKitapAdi(ks) : unAd);
  const cikti = [...new Set(ks.flatMap(k => k.ciktilar))].join(', ');
  if (S.mod === 'ogretmen') {
    return `<div class="blk kapak-hoca">
      <div class="kh-ust"><div><div class="kh-okul">${esc(S.okul.trim() || 'Okul adı')}</div><div class="kh-alt">${sinifAdB(S.sinif)} Fizik – ${esc(baslik)}${S.ab ? ` – <b>${harf} Formu</b>` : ''}</div></div>
      <div class="kh-kod">${formKodu()}${S.ab ? '-' + harf : ''}</div></div>
      <table class="kh-tab"><tr><th>Adı Soyadı</th><td></td><th>Sınıfı / No</th><td class="dar"></td><th>Puan</th><td class="dar"></td></tr></table>
      <div class="kh-not">Öğrenme çıktıları: ${cikti}. Hesaplamalarda $g = 10\\ \\text{m/s}^2$ alınız ve hava direncini ihmal ediniz.</div>
    </div>`.replace(/\$([^$]+)\$/g, (_, m) => tex(m));
  }
  const un = (ks.length === 1 && ks[0].unvanlar) || ['Çaylak', 'Kâşif', 'Usta', 'Efsane'];
  return `<div class="blk kapak">
    <div class="kp-sol">
      <div class="kp-ust">${S.sinif >= 20 ? `${UR.ad.toLocaleUpperCase('tr-TR')} – ${S.tekrar ? 'SON GÜN TEKRARI' : UR.kapak}` : `YAPABİLİRİM ${S.sinif} – ${S.sinif}. SINIF FİZİK NOT + SORU`}</div>
      <h1>${esc(baslik)}</h1>
      <div class="kp-cikti">${cikti} – ${S.sinif >= 20 && UR.kod !== 'tyt' ? '2018 Fizik Öğretim Programı (2027 YKS)' : 'Türkiye Yüzyılı Maarif Modeli'}</div>
    </div>
    <div class="kp-sag">
      <div class="kp-ad"><span>Adım</span><b>${esc(S.ad.trim()) || '&nbsp;'}</b></div>
      <div class="kp-ad"><span>Tarih</span><b>&nbsp;</b></div>
      ${S.tekrar && S.sinif >= 20 ? `<div class="kp-gorev"><b>Görev:</b> Formülleri ve tuzakları sesli tekrar et. Emin olmadığın satırı işaretle, sınavdan önce bir kez daha oku.</div>` : `<div class="kp-gorev"><b>Görev:</b> Notu oku, soruları çöz, XP topla. <span class="xp1">★ 10</span> <span class="xp2">★★ 20</span> <span class="xp3">★★★ 30 XP</span></div>
      <div class="kp-unvan">${un.map(u => `<span>${esc(u)}</span>`).join('<i>›</i>')}</div>`}
    </div>
  </div>`;
}

function notBloklari(k) {
  const B = [];
  const on = S.parca;
  // Son gün tekrarı: yalnız formüller, kısa yol ve tuzak kartları, ÖSYM kalıpları ve kontrol listesi.
  if (S.tekrar && S.sinif >= 20) return tekrarBloklari(k);
  B.push(`<div class="blk bolum"><span class="bn">NOT</span><h2>${esc(k.ad)}</h2><span class="bc">${k.ciktilar.join(', ')}</span></div>`);
  // Simülasyon blokları (src/konu/*/sim.js) bankada değil: gösterim listesine "sonra" konumunda eklenir (src/sim.js).
  const SA = window.BFY_SIM_ARAC;
  (SA ? SA.notSimli(k) : k.not).forEach(n => {
    if (n.tur === 'sim') { B.push(simPdfBlok(n.sim)); return; }
    if (n.tur === 'efsane' && !on.efsane) return;
    if (n.tur === 'deney' && !on.deney) return;
    if (n.tur === 'acilis') {
      const ic = `<div class="na-etk">Hikâye</div><h3>${esc(n.baslik)}</h3>${md(n.metin)}<div class="na-soru"><b>Düşün:</b> ${inline(n.soru)}</div>`;
      B.push(n.sekil ? `<div class="blk n-acilis n-res"><div class="nr-m">${ic}</div><div class="nr-s">${window.BFY_FIG(n.sekil)}</div></div>` : `<div class="blk n-acilis">${ic}</div>`);
    } else if (n.tur === 'tanim') {
      const ic = `<h3>${esc(n.baslik)}</h3>${md(n.metin)}${n.kutu ? `<div class="kutu"><b>${esc(n.kutu.etiket)}</b>${md(n.kutu.metin)}</div>` : ''}`;
      B.push(n.sekil ? `<div class="blk n-kart n-res"><div class="nr-m">${ic}</div><div class="nr-s">${window.BFY_FIG(n.sekil)}</div></div>` : `<div class="blk n-kart">${ic}</div>`);
    } else if (n.tur === 'ikili') {
      B.push(`<div class="blk n-ikili"><div class="n-kart"><h3>${esc(n.sol.baslik)}</h3>${md(n.sol.metin)}</div><div class="n-kart yan"><h3>${esc(n.sag.baslik)}</h3>${tabloBaslikli(n.sag.tablo)}<div class="dip">${inline(n.sag.dip)}</div></div></div>`);
    } else if (n.tur === 'sekilli') {
      const f = window.BFY_FIG(n.sekil);
      if (n.altSekil) B.push(`<div class="blk n-kart"><h3>${esc(n.baslik)}</h3><div class="sekil-genis">${f}</div>${md(n.metin)}${n.kutu ? `<div class="kutu"><b>${esc(n.kutu.etiket)}</b>${md(n.kutu.metin)}</div>` : ''}</div>`);
      else B.push(`<div class="blk n-kart n-yan"><div class="ny-metin"><h3>${esc(n.baslik)}</h3>${md(n.metin)}${n.kutu ? `<div class="kutu"><b>${esc(n.kutu.etiket)}</b>${md(n.kutu.metin)}</div>` : ''}</div><div class="ny-sekil">${f}</div></div>`);
    } else if (n.tur === 'formul') {
      B.push(`<div class="blk n-formul"><h3>${esc(n.baslik)}</h3><div class="nf-alt">${inline(n.alt)}</div><div class="nf-kol">${n.kolonlar.map(c => `<div class="nf-k"><div class="nf-kb">${esc(c.baslik)}</div><div class="nf-not">${inline(c.not)}</div>${c.satirlar.map(r => `<div class="nf-s">${tex(r, true)}</div>`).join('')}</div>`).join('')}</div><div class="dip">${inline(n.dip)}</div></div>`);
    } else if (n.tur === 'efsane') {
      B.push(`<div class="blk n-efsane"><h3>${esc(n.baslik)} <small>Önce tahmin et, sonra kâğıdı çevir.</small></h3><div class="ef-grid">${n.kartlar.map((c, i) => `<div class="ef"><div class="ef-n">${i + 1}</div><div class="ef-i">"${inline(c.iddia)}"</div><div class="ef-sec"><span>☐ Efsane</span><span>☐ Gerçek</span></div><div class="ef-cevap">${c.sekil ? `<div class="ef-res">${window.BFY_FIG(c.sekil)}</div>` : ''}<b>${c.karar ? 'GERÇEK' : 'EFSANE'}.</b> ${inline(c.aciklama)}</div></div>`).join('')}</div></div>`);
    } else if (n.tur === 'deney') {
      B.push(`<div class="blk n-deney"><div class="nd-sekil">${window.BFY_FIG(n.sekil)}</div><div class="nd-metin"><div class="na-etk turuncu">Sen de dene</div><h3>${esc(n.baslik)}</h3>${md(n.metin)}${tabloHTML(n.tablo, 'kucuk')}${n.dip ? `<div class="dip">${inline(n.dip)}</div>` : ''}</div></div>`);
    } else if (n.tur === 'kartlar') {
      B.push(kartlarBlok(n));
    } else if (n.tur === 'cikmis') {
      B.push(...cikmisBloklari(n));
    } else if (n.tur === 'oyun') {
      B.push(oyunBlok(n, `${k.id}:${k.not.filter(x => x.tur !== 'anim3b').indexOf(n)}`));
    } else if (n.tur === 'cozumlu') {
      B.push(...cozumluBloklari(n, k.not.filter(x => x.tur === 'cozumlu').indexOf(n) + 1));
    } else if (n.tur === 'anim3b') {
      // 3B animasyon: PDF'te sahnenin en açıklayıcı karesi (gömülü durağan görüntü) ve kısa açıklama
      const A = (window.BFY_ANIM3B_VERI || {})[n.sahne] || {};
      B.push(`<div class="blk n-a3b-pdf">${A.poster ? `<div class="na3-res"><img src="${A.poster}" width="840" height="840" alt=""></div>` : ''}<div class="na3-m"><div class="na-etk mavi">3B görünüm</div><h3>${esc(n.baslik)}</h3>${md(n.metin)}<div class="dip">${/^sagel/.test(n.sahne || '') ? 'Dijital kitapta bu sahne hareketli 3B animasyon olarak oynar; sahne döndürülebilir, akım ters çevrilebilir.' : n.sahne === 'rampa' ? 'Dijital kitapta bu sahne hareketli 3B animasyon olarak oynar; sahne döndürülebilir, sürtünme açılıp kapatılabilir.' : 'Dijital kitapta bu sahne hareketli 3B animasyon olarak oynar; adım adım izlenebilir, sahne döndürülebilir.'}</div></div></div>`);
    } else if (n.tur === 'ozet') {
      B.push(`<div class="blk n-ozet"><h3>${esc(n.baslik)}</h3>${n.maddeler.map(m => `<div class="oz"><span class="kb"></span><div>${inline(m)}</div></div>`).join('')}</div>`);
    }
  });
  return B;
}

// Çıkmış soru analizi (PDF): yıllara göre sayı şeridi, kalıplar ve kartlar (soru metni yok, resmî kitapçık adresiyle).
function cikmisBloklari(n) {
  const yil = Object.keys(n.yillar || {}).sort(), sin = UR.sinav;
  const serit = yil.length ? `<table class="vt cm-tab"><tr><th>Yıl</th>${yil.map(y => `<td>${y}</td>`).join('')}</tr><tr><th>Soru</th>${yil.map(y => `<td>${n.yillar[y] || '–'}</td>`).join('')}</tr></table>` : '';
  const kal = (n.kaliplar || []).length ? `<div class="dip"><b>En sık kalıplar:</b> ${n.kaliplar.map(([a, b]) => esc(a) + (b ? ` (${b})` : '')).join(', ')}.</div>` : '';
  const kart = c => `<div class="blk n-cikmis-p cm-tek"><div class="cm-pk"><div class="cm-pb"><b>${c.yil} ${esc(c.oturum || sin)}, ${c.no}. soru</b> ${inline(c.olcen)}</div><div><b>Kalıp:</b> ${inline(c.kalip)}</div>${c.adimlar && c.adimlar.length ? `<ol>${c.adimlar.map(x => `<li>${inline(x)}</li>`).join('')}</ol>` : ''}${c.tuzak ? `<div><b>Tuzak:</b> ${inline(c.tuzak)}</div>` : ''}</div></div>`;
  // Başlık ve şerit tek blok; her kart ayrı blok (sayfaya bölünebilsin).
  return [`<div class="blk n-cikmis-p"><div class="na-etk kirmizi">Çıkmış soru analizi</div><h3>${esc(n.baslik)}</h3>${n.metin ? md(n.metin) : ''}${serit}${kal}<div class="dip">Sorular ÖSYM'ye aittir; burada yalnızca neyi ölçtükleri ve çözüm yolu anlatılır. Soruların kendisi ÖSYM'nin resmî kitapçıklarındadır.</div></div>`, ...(n.kartlar || []).map(kart)];
}

// Simülasyon (PDF): varsayılan değerlerle durağan sahne, başlık, kısa metin ve şekildeki değerler.
let _simU = 0;
function simPdfBlok(s) {
  const A = window.BFY_SIM_ARAC, v = A.degerler(s);
  let f = '', durum = '';
  try {
    f = s.ciz(v, 'sp' + (++_simU) + '_');
    const ks = s.kontroller.map(k => (A.kaydirici(k) ? `${k.etiket} ${A.sayi(k.deger, A.adimOndalik(k.adim))}${k.birim ? ' ' + k.birim : ''}` : `${k.etiket}: ${(k.secenekler.find(o => o.deger === k.deger) || {}).etiket}`));
    // Ölçümlerden yalnız kontrollerde olmayanlar ve her etiketin ilki (ör. Pa ve kPa'dan Pa) yazılır.
    const ol = s.olcumler(v), ka = s.kontroller.map(k => k.etiket);
    const tek = ol.filter((o, i) => !ka.includes(o.etiket) && ol.findIndex(x => x.etiket === o.etiket) === i).map(o => `${o.etiket} ${A.sayi(o.deger, o.ondalik)}${o.birim ? ' ' + o.birim : ''}`);
    durum = `<b>Şekildeki durum:</b> ${esc(ks.join(', '))}.${tek.length ? ' ' + esc(tek.join(', ')) + '.' : ''}`;
  } catch (e) { console.error('Simülasyon çizilemedi: ' + s.id, e); }
  return `<div class="blk n-sim-pdf"><div class="na-etk mavi">Simülasyon</div><h3>${esc(s.baslik)}</h3>${md(s.pdfMetin || s.metin)}<div class="nsp-sekil">${f}</div><div class="nsp-alt">${durum ? `<div class="nsp-durum">${durum}</div>` : ''}<div class="dip">Uygulamada değerleri değiştirerek deneyebilirsin.</div></div></div>`;
}

// Çözümlü örnek (TYT): soru + 5 şık; seçenek sırası örneğin kimliğine bağlıdır (PDF ve uygulamada aynı).
// PDF'te iki blok: soru bloğu ve kutulu çözüm bloğu (sayfa sonunda ayrılabilir).
function hashSayi(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const _cz = {};
function cozumluHazirla(n) { const id = n.id || n.baslik; if (!_cz[id]) _cz[id] = seceneklerKaristir({ ...n, tur: 'cs', id }, rng(hashSayi(id))); return _cz[id]; }
const cikmisEtiket = c => (c ? `Çıkmış soru benzeri${c.yil ? ' (' + esc(c.yil) + (c.no ? ` ${esc(c.oturum || UR.sinav)}, ${esc(c.no)}. soru` : '') + ')' : ''}` : '');
function cozumluBloklari(n, no) {
  const q = cozumluHazirla(n);
  const genis = /_genis$/.test(n.sekil || ''), fig = n.sekil ? window.BFY_FIG(n.sekil) : '';
  const ctx = { tablo: n.tablo ? tabloBaslikli(n.tablo) : '', sekil: n.sekil ? `<div class="q-sekil-ic ${genis ? 'genis' : ''}">${fig}</div>` : '' };
  const govde = md(n.metin, ctx), ic = /\{\{sekil\}\}/.test(n.metin);
  const ops = q.sira.map(i => n.secenekler[i]), maxL = Math.max(...ops.map(plainLen));
  const sec = `<ol class="sec ${maxL <= 9 ? 'k5' : maxL <= 26 ? 'k2' : 'k1'}">${ops.map((o, i) => `<li><b>${HARF[i]})</b><span>${inline(o)}</span></li>`).join('')}</ol>`;
  const z = n.zorluk || 1;
  const ust = `<div class="cz-bas"><span class="na-etk mavi">Çözümlü örnek ${no}</span><span class="q-z z${z}">${yildiz(z)} ${ZAD[z]}</span>${n.cikmis ? `<span class="cz-cik">${cikmisEtiket(n.cikmis)}</span>` : ''}</div><h3>${esc(n.baslik)}</h3>`;
  const body = n.sekil && !ic ? `<div class="q-yan"><div class="q-metin">${govde}</div><div class="q-sekil">${fig}</div></div>` : `<div class="q-metin">${govde}</div>`;
  const harfle = c => c.replace(/\{\{S(\d)\}\}/g, (_, x) => HARF[q.sira.indexOf(+x)]);
  const kutu = (cls, et, m) => (m ? `<div class="${cls}"><b>${et}</b>${md(m)}</div>` : '');
  return [`<div class="blk n-cozumlu">${ust}${body}${sec}</div>`,
    `<div class="blk n-cozumlu-c"><div class="czk-ust"><b>Çözüm</b><span class="cz-cev">Cevap: ${HARF[q.sira.indexOf(n.dogru)]}</span></div><ol>${n.cozum.map(c => `<li>${md(harfle(c))}</li>`).join('')}</ol>${kutu('cz-ip', 'İpucu', n.ipucu)}${kutu('cz-tz', UR.sinav + ' tuzağı', n.tuzak)}</div>`];
}
// Kavram kartları: her kartta ön yüz (kalın), kesikli çizgi, arka yüz. Kısa kartlar 3, uzunlar 2 sütun.
function kartlarBlok(n) {
  const uzun = n.kartlar.some(c => plainLen(c.arka) > 110 || plainLen(c.on) > 28);
  return `<div class="blk n-kartlar"><h3>${esc(n.baslik)} <small>${inline(n.alt && !/dokun/i.test(n.alt) ? n.alt : 'Arka yüzü kapat, önce kendin hatırla.')}</small></h3><div class="kt-grid ${uzun ? 'k2' : 'k3'}">${n.kartlar.map((c, i) => `<div class="kt"><div class="kt-n">${i + 1}</div>${c.sekil ? `<div class="kt-res">${window.BFY_FIG(c.sekil)}</div>` : ''}<div class="kt-on">${inline(c.on)}</div>${c.ipucu ? `<div class="kt-ip">${inline(c.ipucu)}</div>` : ''}<div class="kt-arka">${inline(c.arka)}</div></div>`).join('')}</div></div>`;
}
// Not içi mini oyun: soru gibi basılır; cevap efsane kartlarındaki gibi ters yazılır.
function oyunBlok(n, key) {
  const q = ETK.etkKaristir({ ...n.oyun, id: key }, rng(ETK.hashSayi(key)));
  return `<div class="blk n-oyun"><div class="na-etk mor">Mini oyun: ${ETK.TUR_AD[q.tur]}</div><h3>${esc(n.baslik)}</h3>${md(n.yonerge)}${etkHTML(q, false)}<div class="oy-cevap"><b>Cevap:</b> ${inline(ETK.cevapMetni(q))}</div></div>`;
}
function baglamBlok(st, a, b) {
  const genis = /_genis$/.test(st.sekil || '');
  const fig = st.sekil ? window.BFY_FIG(st.sekil) : '';
  const ctx = { tablo: st.tablo ? tabloBaslikli(st.tablo) : '', sekil: st.sekil ? `<div class="q-sekil-ic ${genis ? 'genis' : ''}">${fig}</div>` : '' };
  const govde = md(st.metin, ctx);
  const ic = /\{\{sekil\}\}/.test(st.metin);
  const body = st.sekil && !ic ? `<div class="q-yan"><div class="q-metin">${govde}</div><div class="q-sekil">${fig}</div></div>` : `<div class="q-metin">${govde}</div>`;
  return `<div class="blk baglam"><div class="bg-ust">${a}–${b}. soruları aşağıdaki bilgilere göre cevaplayınız.</div>${st.baslik ? `<h4>${esc(st.baslik)}</h4>` : ''}${body}${st.kaynak ? `<div class="bg-kaynak">Kaynak: ${inline(st.kaynak)}</div>` : ''}</div>`;
}
function soruBlok(q, no, opts) {
  const genisSekil = ['grafikSec', 'grafikler'].includes(q.sekil) || /_genis$/.test(q.sekil || '');
  const figHTML = q.sekil ? window.BFY_FIG(q.sekil) : '';
  const ctx = { tablo: q.tablo ? tabloBaslikli(q.tablo) : '', sekil: q.sekil ? `<div class="q-sekil-ic ${genisSekil ? 'genis' : ''}">${figHTML}</div>` : '' };
  const icSekil = /\{\{sekil\}\}/.test(q.metin);
  const govde = md(q.metin, ctx);
  let secHTML = '';
  if (q.tur === 'cs') {
    const ops = q.sira.map(i => q.secenekler[i]);
    const maxL = Math.max(...ops.map(plainLen));
    const kol = maxL <= 9 ? 'k5' : maxL <= 26 ? 'k2' : 'k1';
    secHTML = `<ol class="sec ${kol}">${ops.map((o, i) => `<li><b>${HARF[i]})</b><span>${inline(o)}</span></li>`).join('')}</ol>`;
  } else if (ETK.etkMi(q)) {
    secHTML = etkHTML(q, opts.cozumAlt);
  } else {
    secHTML = `<div class="satirlar">${'<i></i>'.repeat(q.satir || 6)}</div>`;
  }
  const yanSekil = q.sekil && !icSekil;
  const puan = q.tur === 'acik' ? `<span class="q-puan">${q.puan} puan</span>` : '';
  const ogr = S.mod === 'ogrenci';
  const ust = `<div class="q-ust"><span class="q-no">${no}</span>${ETK.etkMi(q) ? `<span class="q-tur">${ETK.TUR_AD[q.tur]}</span>` : ''}<span class="q-z z${q.zorluk}">${yildiz(q.zorluk)} ${ZAD[q.zorluk]}</span>${ogr ? `<span class="q-xp">${XP[q.zorluk]} XP</span>` : ''}${puan}${q.yks && !window.BFYTYT ? '<span class="q-yks">YKS tarzı</span>' : ''}${q.cikmis ? `<span class="q-yks">${cikmisEtiket(q.cikmis)}</span>` : ''}${q.tahmin ? '<span class="q-yks thm">Çıkma ihtimali yüksek</span>' : ''}<span class="q-bec">${esc(q.beceri)}</span>${ogr ? '<span class="q-tik">☐ çözdüm</span>' : ''}</div>`;
  let body;
  if (yanSekil) body = `<div class="q-yan"><div class="q-metin">${govde}</div><div class="q-sekil">${figHTML}</div></div>${secHTML}`;
  else body = `<div class="q-metin">${govde}</div>${secHTML}`;
  const coz = opts.cozumAlt ? cozumHTML(q) : '';
  return `<div class="blk soru${q.set ? ' set-soru' : ''}${ETK.etkMi(q) ? ' etk' : ''}">${ust}${body}${coz}</div>`;
}
// Etkileşimli türlerin basılı biçimi: eşleştir (numaralı sol, harfli sağ, harf kutusu), sınıfla (öğe × grup tablosu),

function skorBlok(qs) {

// Etkileşimli sorunun anahtar hücresi cevabın uzunluğuna göre 1–6 sütun kaplar.
function anahtarEtk(q, no) {

// Sınıflama cevabı: her grup kalın adıyla, ayrı satırda.
const snNokta = x => String(x).replace(/[.\s]+$/, '');
const snCevap = q => ETK.gruplama(q).map(([g, l]) => { const m = l.map(snNokta), son = /[?!]$/.test(m[m.length - 1] || '') ? '' : '.'; return `<span class="sn-g"><b>${inline(snNokta(g))}:</b> ${m.map(inline).join(', ')}${son}</span>`; }).join('');
// Birden çok formda her form ayrı blok olur (formEtiketi = true): uzun anahtar tek sayfaya sığmadığında sayfalar arasında bölünebilir.
function anahtarBlok(forms, formEtiketi = forms.length > 1, baslikli = true) {

/* ---------------- Doküman ---------------- */
// Sayfa düzeni için set sırasını ve setlerden önceki son m tekil soruyu yeniden yerleştirir (v = {m, p}).
function permler(n) {
  const out = [], a = [...Array(n).keys()];
  const gez = (k) => { if (k === n) { out.push(a.slice()); return; } for (let i = k; i < n; i++) { [a[k], a[i]] = [a[i], a[k]]; gez(k + 1); [a[k], a[i]] = [a[i], a[k]]; } };
  gez(0); return out;
}
function setDuzen(qs, v) {
  if (!v || (!v.m && !v.p)) return qs;
  const ilk = qs.findIndex(q => q.set); if (ilk < 0) return qs;
  let son = ilk; qs.forEach((q, i) => { if (q.set) son = i; });
  const once = qs.slice(0, ilk), sonra = qs.slice(son + 1), birim = [];
  qs.slice(ilk, son + 1).forEach(q => { const b = birim[birim.length - 1]; if (b && b[0].set.id === q.set.id) b.push(q); else birim.push([q]); });
  const pr = permler(birim.length)[v.p % Math.max(1, permler(birim.length).length)] || birim.map((_, i) => i);
  const m = Math.min(v.m || 0, once.filter(q => q.tur === 'cs').length);
  const tas = []; for (let i = once.length - 1; i >= 0 && tas.length < m; i--) if (once[i].tur === 'cs') tas.unshift(...once.splice(i, 1));
  return [...once, ...pr.flatMap(i => birim[i]), ...tas, ...sonra];
}
function belgeBloklari() {
  // TYT birden çok konu: konu konu kitapçık (her konunun notu ve soruları birlikte)
  if (S.sinif >= 20 && secKonular().length > 1) return tytKitapBloklari();
  const bloklar = [];
  const forms = S.mod === 'ogretmen' && S.ab && S.seviye >= 2 ? ['A', 'B'] : ['A'];
  const formQs = forms.map(h => ({ harf: h, qs: S.parca.sorular ? setDuzen(formHazirla(S.seed, h), S._duzen) : [] }));
  const cozumAlt = S.mod === 'ogretmen' && S.cozum === 'altinda' && S.seviye >= 2;
  const cozumSonda = S.cozum === 'sonda' && S.seviye >= 1;
  formQs.forEach(({ harf, qs }, fi) => {
    if (fi > 0) bloklar.push('<div class="blk kir"></div>');
    bloklar.push(kapakBlok(harf));
    if (S.parca.not && fi === 0) secKonular().forEach(k => bloklar.push(...notBloklari(k)));
    if (qs.length) {
      if (S.parca.not && fi === 0) bloklar.push('<div class="blk kir"></div>');
      bloklar.push(`<div class="blk bolum"><span class="bn soru">SORULAR</span><h2>${S.mod === 'ogretmen' ? 'Değerlendirme' : 'Sıra sende'}</h2><span class="bc">${qs.length} soru</span></div>`);
      qs.forEach((q, i) => {
        if (q.set && (i === 0 || !qs[i - 1].set || qs[i - 1].set.id !== q.set.id)) {
          const son = i + qs.filter(x => x.set && x.set.id === q.set.id).length;
          bloklar.push(baglamBlok(q.set, i + 1, son));
        }
        bloklar.push(soruBlok(q, i + 1, { cozumAlt }));
      });
      if (S.mod === 'ogrenci' && S.parca.skor) bloklar.push(skorBlok(qs));
    }
  });
  const hepsi = formQs.filter(f => f.qs.length);
  if (hepsi.length && S.anahtar !== false) {
    bloklar.push('<div class="blk kir"></div>');
    if (hepsi.length > 1) hepsi.forEach((f, i) => bloklar.push(anahtarBlok([f], true, i === 0))); else bloklar.push(anahtarBlok(hepsi));
    if (cozumSonda && !cozumAlt) {
      bloklar.push(`<div class="blk bolum"><span class="bn cz">ÇÖZÜMLER</span><h2>Adım adım çözümler</h2><span class="bc">${hepsi[0].harf} Formu sırasıyla</span></div>`);
      hepsi[0].qs.forEach((q, i) => bloklar.push(`<div class="blk">${cozumHTML(q, i + 1)}</div>`));
    }
  }
  if (S.seviye === 0) bloklar.push(`<div class="blk tanitim"><b>Bu ücretsiz örnektir.</b> Tüm sorular, adım adım çözümler, kişiye özel kapak ve öğretmen modu (A-B form, çözümlü sürüm) için ${sinifAd(S.sinif)} lisansı al: ${CFG.site}</div>`);
  return bloklar;
}

/* ---------------- TYT konu kitapçığı (birden çok konu) ----------------
   Kapak, içindekiler, her konu için not + o konunun soruları (numaralar konuda 1'den başlar),
   sonda konu konu cevap anahtarı ve çözümler. Soru sayısı ve zorluk seçimi her konuya ayrı uygulanır. */
function tytKitapBloklari() {
  const B = [], ks = secKonular();
  const forms = S.mod === 'ogretmen' && S.ab && S.seviye >= 2 ? ['A', 'B'] : ['A'];
  const cozumAlt = S.mod === 'ogretmen' && S.cozum === 'altinda' && S.seviye >= 2;
  const cozumSonda = S.cozum === 'sonda' && S.seviye >= 1;
  const formlar = forms.map(h => ({ harf: h, kq: ks.map((k, i) => ({ k, qs: S.parca.sorular ? setDuzen(formHazirla(S.seed + i * 7919, h, [k]), S._duzen) : [] })) }));
  const notVar = S.parca.not;
  formlar.forEach(({ harf, kq }, fi) => {
    if (fi > 0) B.push('<div class="blk kir"></div>');
    B.push(kapakBlok(harf));
    if (fi === 0) B.push(icindekilerBlok(kq.map(x => x.k), notVar, kq.some(x => x.qs.length)));
    kq.forEach(({ k, qs }, ki) => {
      const bas = `data-kbas="${fi}-${ki}"`;
      if (notVar && fi === 0) {
        B.push('<div class="blk kir"></div>');
        B.push(...notBloklari(k).map((b, j) => (j === 0 ? b.replace('class="blk bolum"', `class="blk bolum" ${bas}`) : b)));
      }
      if (!qs.length) return;
      B.push('<div class="blk kir"></div>');
      B.push(`<div class="blk bolum" ${notVar && fi === 0 ? '' : bas}><span class="bn soru">SORULAR</span><h2>${esc(k.kisa || k.ad)}</h2><span class="bc">${qs.length} soru${forms.length > 1 ? ` – ${harf} Formu` : ''}</span></div>`);
      qs.forEach((q, i) => {
        if (q.set && (i === 0 || !qs[i - 1].set || qs[i - 1].set.id !== q.set.id)) B.push(baglamBlok(q.set, i + 1, i + qs.filter(x => x.set && x.set.id === q.set.id).length));
        B.push(soruBlok(q, i + 1, { cozumAlt }));
      });
    });
    const tum = kq.flatMap(x => x.qs);
    if (S.mod === 'ogrenci' && S.parca.skor && tum.length) B.push(skorBlok(tum));
  });
  const soruVar = formlar[0].kq.some(x => x.qs.length);
  if (soruVar && S.anahtar !== false) {
    B.push('<div class="blk kir"></div>');
    B.push(`<div class="blk bolum"><span class="bn cz">ANAHTAR</span><h2>Cevap anahtarı</h2><span class="bc">${ks.length} konu</span></div>`);
    formlar[0].kq.forEach(({ k }, ki) => {
      const fs = formlar.map(f => ({ harf: f.harf, qs: f.kq[ki].qs })).filter(f => f.qs.length);
      if (fs.length) B.push(anahtarBlok(fs).replace('<h3>Cevap anahtarı</h3>', `<h3 class="an-konu">${esc(k.id.replace(/^[TAY]\./, ''))} ${esc(k.ad)}</h3>`));
    });
    if (cozumSonda && !cozumAlt) {
      B.push('<div class="blk kir"></div>');
      B.push(`<div class="blk bolum"><span class="bn cz">ÇÖZÜMLER</span><h2>Adım adım çözümler</h2><span class="bc">${forms.length > 1 ? 'A Formu sırasıyla' : ks.length + ' konu'}</span></div>`);
      formlar[0].kq.forEach(({ k, qs }) => {
        if (!qs.length) return;
        B.push(`<div class="blk cz-konu"><b>${esc(k.id.replace(/^[TAY]\./, ''))}</b> ${esc(k.ad)}</div>`);
        qs.forEach((q, i) => B.push(`<div class="blk">${cozumHTML(q, i + 1)}</div>`));
      });
    }
  }
  if (S.seviye === 0) B.push(`<div class="blk tanitim"><b>Bu ücretsiz örnektir.</b> Tüm sorular, adım adım çözümler, kişiye özel kapak ve öğretmen modu (A-B form, çözümlü sürüm) için ${sinifAd(S.sinif)} lisansı al: ${CFG.site}</div>`);
  return B;
}
// İçindekiler: sayfa numaraları sayfalamadan sonra doldurulur (data-ics -> konu başlığının sayfası).
function icindekilerBlok(ks, notVar, soruVar) {
  const icerik = notVar && soruVar ? 'Konu özeti, çözümlü örnekler ve sorular' : notVar ? 'Konu özeti ve çözümlü örnekler' : 'Sorular';
  let un = null, h = '';
  ks.forEach((k, i) => {
    const u = tytUniteleri([k])[0];
    if (u && u !== un) { un = u; h += `<div class="ic-un">${u.no}. Ünite – ${esc(u.ad)}</div>`; }
    h += `<div class="ic-s"><span class="ic-no">${esc(k.id.replace(/^[TAY]\./, ''))}</span><span class="ic-ad">${esc(k.ad)}</span><i></i><span class="ic-sy" data-ics="0-${i}">…</span></div>`;
  });
  return `<div class="blk icindekiler"><h3>İçindekiler <small>${icerik}</small></h3>${h}</div>`;
}

/* ---------------- TYT deneme ve tarama kitapçığı ----------------
   Gerçek sınav kâğıdı düzeni: A4, iki sütun, soru numaraları, şekiller; her denemenin başında ad-soyad,
   süre ve D/Y/Net kutusu; isteğe bağlı kapak (net çizelgesi), optik cevap şeridi, cevap anahtarı ve çözümler.
   A kitapçığında şık sırası uygulamadakiyle aynıdır (soru kimliğine bağlı); B kitapçığında soru sırası ve

const TYT_UCRETSIZ = UR.ucretsiz;
const tytTestler = () => window.BFY_TYT_TEST || {};
const tytTestListe = () => Object.keys(tytTestler()).sort((a, b) => a.localeCompare(b, 'tr', { numeric: true }));
const tytTestAcik = id => TYT_UCRETSIZ.includes(id) || S.seviye > 0;
const dnSecili = () => S.denemeler.filter(id => tytTestler()[id] && tytTestAcik(id)).sort((a, b) => a.localeCompare(b, 'tr', { numeric: true }));
function dnFormlar() { return S.mod === 'ogretmen' && S.ab && S.seviye >= 2 ? ['A', 'B'] : ['A']; }
function dnHazirla(t, harf) {
  const qs = t.sorular.map(q => ({ ...q, tur: 'cs' }));
  if (harf === 'B') { const rnd = rng(S.seed * 31 + hashSayi(t.id)); return shuffle(qs, rnd).map(q => seceneklerKaristir(q, rnd)); }
  return qs.map(q => seceneklerKaristir(q, rng(hashSayi(q.id))));
}
const dnKonuAd = id => { for (const s of window.BFY_KATALOG) for (const u of s.uniteler || []) for (const k of u.konular) if (k.id === id) return k.ad; return id || ''; };
const dnSure = t => Math.round((t.sure || 600) / 60);
const dnAralik = ids => (ids.length === 1 ? ids[0] : ids.length === 2 ? ids.join(', ') : `${ids[0]}–${ids[ids.length - 1]}`);
const dnTarama = t => /^[TAY]U/.test(t.id);
const dnSayiYazi = ids => { const tu = ids.filter(id => /^[TAY]U/.test(id)).length, td = ids.length - tu; return [td ? td + ' deneme' : '', tu ? tu + ' tarama' : ''].filter(Boolean).join(', '); };
function dnKapakBlok(ids, sik) {

  const say = [td ? td + ' deneme' : '', tu ? tu + ' ünite taraması' : ''].filter(Boolean).join(', ');
  // Uzun listede çizelge yan yana parçalara bölünür, sütunlar kısalır: 13–24 kitapçık iki, 25'ten çoğu üç parça.

  const satirT = t => parca === 3 ? `<tr><td class="dk-id">${esc(t.id)}</td><td></td><td></td><td></td><td></td></tr>` : cift ? `<tr><td class="dk-id">${esc(t.id)}</td><td></td><td></td><td></td><td></td><td></td></tr>` : `<tr><td class="dk-id">${esc(t.id)}</td><td class="dk-adi">${esc(t.ad)}</td><td>${t.sorular.length}</td><td>${dnSure(t)} dk</td><td></td><td></td><td></td><td></td><td></td></tr>`;
  const bas = parca === 3 ? '<tr><th>Kod</th><th>Tarih</th><th>D</th><th>Y</th><th>Net</th></tr>' : cift ? '<tr><th>Kod</th><th>Tarih</th><th>Süre</th><th>D</th><th>Y</th><th>Net</th></tr>' : '<tr><th>Kod</th><th class="dk-adi">Deneme</th><th>Soru</th><th>Süre</th><th>Tarih</th><th>Geçen süre</th><th>D</th><th>Y</th><th>Net</th></tr>';
  const boy = Math.ceil(ts.length / parca), tablo = L => `<table class="dk-tab${cift ? ' cift' : ''}"><thead>${bas}</thead><tbody>${L.map(satirT).join('')}</tbody></table>`;
  const cizelge = cift ? `<div class="dk-iki p${parca}">${Array.from({ length: parca }, (_, i) => tablo(ts.slice(i * boy, (i + 1) * boy))).join('')}</div>` : tablo(ts);

  </div>`;
}
// Kapakta: kitapçıktaki soruların ünitelere dağılımı (yatay çubuklar)
function dnDagilim(ts) {
  const sin = window.BFY_KATALOG.find(x => x.no === UR.sinif); if (!sin) return '';

    kamOfs: D => ({ pitch: 0.2 * D.kam, yaw: 0, uzak: 0 }),

      { D: { giris: 1, kavra: 0, akim: 1, alan: 0, yay: 0 }, kam: { yaw: -0.25 * sg, pitch: 0.05, m: 0.62, h: elH }, metin: 'Sağ elini tele getir ve başparmağını akım yönüne çevir.' },
      { D: { giris: 1, kavra: 1, akim: 1, alan: 0, yay: 1 }, kam: { yaw: 0.6 * sg, pitch: 0.35, m: 0.62, h: [-1 * sg, -1 * sg, 0.5] }, metin: 'Dört parmağını teli saracak biçimde kıvır. Kalın mavi ok, parmaklarının tel çevresinde döndüğü yönü gösterir.' },
      { D: { giris: 1, kavra: 1, akim: 1, alan: 1, yay: 1 }, kam: { yaw: 0.15 * sg, pitch: 0.72, m: 0.95, h: [0, -3 * sg, 0] }, metin: '<b>Parmakların dönüş yönü = alan çizgilerinin (<i>B</i>) dönüş yönü.</b> Halkalar teli, parmaklarınla ve kalın okla aynı yönde dolanır.' },
      { D: { giris: 1, kavra: 1, akim: 1, alan: 1, yay: 1 }, kam: { yaw: 0.15 * sg, pitch: 0.55, m: 0.95, h: [0, -3 * sg, 0] }, metin: 'Akımı ters çevir: başparmak öbür yönü gösterir, alanın dolanımı da tersine döner.', ters: true }
