<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#244f40">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Ben Fizik Yapabilirim YKS 2027 TYT – Fizik Çalışma | Ben Fizik Yapamıyorum</title>
<meta name="description" content="2027 YKS TYT fizik (eski müfredat): kısa konu özetleri, simülasyonlar, kolay-orta-zor sorular, çıkmış soru analizi, benzer sorular, günlük 7 soru ve 7 soruluk süreli TYT denemeleri.">

<style>/* ============ BFY Not Oluşturucu — stiller ============ */
:root{
  --ink:#173430; --ink2:#4b6059; --green:#244f40; --green2:#1b3b31; --copper:#aa693e; --coral:#d9573b;
  --sun:#e7a93b; --blue:#2e6f95; --cream:#fffef4; --mint:#eef4ee; --line:#d4ded5; --paper:#ffffff;
  --ui-bg:#f4f7f1; --ui-card:#ffffff; --ui-text:#173430; --ui-muted:#5c6f68; --ui-line:#d9e2da;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ui-bg:#0f1f1c; --ui-card:#162a26; --ui-text:#e8efe9; --ui-muted:#a3b5ad; --ui-line:#2a423b; } }
:root[data-theme="dark"]{ --ui-bg:#0f1f1c; --ui-card:#162a26; --ui-text:#e8efe9; --ui-muted:#a3b5ad; --ui-line:#2a423b; }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ui-bg);color:var(--ui-text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}

/* ---------- Uygulama düzeni ---------- */
.app{display:grid;grid-template-columns:minmax(300px,380px) 1fr;min-height:100vh}
.panel{background:var(--ui-card);border-right:1px solid var(--ui-line);padding:20px 20px 110px;position:sticky;top:0;height:100vh;overflow:auto}
.marka{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.marka .logo{width:36px;height:36px;border-radius:10px;background:var(--green);color:#fffef4;display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:600;font-size:18px}
.marka h1{font-family:'Fraunces',serif;font-weight:600;font-size:22px;margin:0;letter-spacing:-.01em}
.alt{color:var(--ui-muted);font-size:13px;margin:0 0 14px}
.dij-link{display:block;margin:-6px 0 14px;padding:9px 12px;border-radius:12px;border:1.5px dashed var(--copper);color:var(--copper);font-weight:800;font-size:13px;text-decoration:none}
.durum{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--mint);color:var(--green);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:700;margin-bottom:16px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .durum{background:#1f3a33;color:#cfe6d8} }
.durum button{border:0;background:var(--green);color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:12.5px;cursor:pointer}
body[data-seviye="2"] .durum button{display:none}
.grp{margin:0 0 16px}
.grp > h3{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ui-muted);margin:0 0 8px;font-weight:800;display:flex;align-items:center;gap:6px}
.kilit{font-size:10.5px;letter-spacing:0;text-transform:none;background:#f6e7da;color:#8a4f25;border-radius:999px;padding:2px 8px;font-weight:700}
.grp:not(.kilitli) .kilit{display:none}
.kilitli .satir, .kilitli .cips, .kilitli label, .kilitli .alanlar{opacity:.5}
.cips{display:flex;flex-wrap:wrap;gap:6px}
.cip{border:1.5px solid var(--ui-line);background:transparent;border-radius:999px;padding:7px 13px;font-weight:700;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.cip small{font-size:10.5px;font-weight:600;color:var(--ui-muted)}
.cip.on{background:var(--green);border-color:var(--green);color:#fffef4}
.cip:disabled{cursor:not-allowed;opacity:.55}
.cip:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
select,input[type=text]{width:100%;border:1.5px solid var(--ui-line);background:var(--ui-card);border-radius:10px;padding:9px 11px;font-size:14px}
#konular{display:grid;gap:4px;margin-top:8px}
.konu{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer}
.konu:hover{background:var(--mint)}
.konu.pasif{color:var(--ui-muted);font-weight:500;cursor:default}
.konu.pasif:hover{background:transparent}
.konu small{margin-left:auto;font-size:10.5px;color:var(--ui-muted)}
.konu input,.tik input{accent-color:var(--green);width:17px;height:17px;flex:none}
.tikler{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.tik{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:4px 0;cursor:pointer}
.alanlar{display:grid;gap:8px}
.alanlar label{font-size:12.5px;font-weight:700;color:var(--ui-muted);display:grid;gap:4px}
.ipucu{font-size:12.5px;color:var(--ui-muted);margin:6px 0 0}
.formsat{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.formsat code{background:var(--mint);color:var(--green);padding:4px 8px;border-radius:8px;font-weight:800;font-size:13px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px;cursor:pointer}
.btn.ana{background:var(--copper);color:#fff;width:100%}
.btn.ana:hover{background:#94592f}
.btn.ikincil{background:transparent;border:1.5px solid var(--ui-line);padding:8px 12px;font-size:13.5px;border-radius:10px}
.alt-bar{position:fixed;left:0;bottom:0;width:min(380px,100%);padding:12px 20px 16px;background:linear-gradient(to top,var(--ui-card) 75%,transparent);z-index:5}
.alt-bar .btn{box-shadow:0 6px 18px rgba(170,105,62,.28)}
.alt-bar .ipucu{text-align:center}
#onizleme{padding:22px 12px 60px;overflow:auto;min-width:0}
.onbaslik{display:flex;justify-content:space-between;align-items:center;max-width:794px;margin:0 auto 12px;gap:10px;flex-wrap:wrap}
.onbaslik b{font-size:14px}
.onbaslik span{color:var(--ui-muted);font-size:13px;font-weight:600}
#sayfalar{margin:0 auto;width:794px}
dialog{border:0;border-radius:16px;padding:22px;max-width:380px;width:calc(100% - 32px);background:var(--ui-card);color:var(--ui-text);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(15,31,28,.45)}
dialog h2{font-family:'Fraunces',serif;font-weight:600;margin:0 0 6px;font-size:21px}
dialog p{margin:0 0 12px;color:var(--ui-muted);font-size:14px}
.kod-sat{display:flex;gap:8px}
.kod-sat input{letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.kod-hata{color:var(--coral);font-size:13px;min-height:18px;margin-top:6px}
.kod-al{display:grid;gap:6px;margin-top:10px}
.kod-al a{display:block;text-align:center;border:1.5px solid var(--ui-line);border-radius:10px;padding:9px;font-weight:700;color:var(--green);text-decoration:none;font-size:14px}
.kapat{position:absolute;right:12px;top:10px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--ui-muted)}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .panel{position:static;height:auto;border-right:0;border-bottom:1px solid var(--ui-line);padding:16px 16px 20px}
  .alt-bar{width:100%;padding:10px 16px 14px}
  #onizleme{padding:16px 8px 110px}
}

/* ---------- A4 sayfa ---------- */
.sheet{width:794px;height:1123px;background:#fff;color:var(--ink);margin:0 auto 22px;position:relative;box-shadow:0 4px 24px rgba(20,40,34,.14);border-radius:3px;overflow:hidden}
.sheet-ic{position:absolute;left:53px;right:53px;top:46px;height:1017px;overflow:hidden}
#olcum{position:absolute;left:-10000px;top:0;width:688px;visibility:hidden}
.sheet-ic,#olcum{font-size:13.4px;line-height:1.5;color:var(--ink)}
.sf{position:absolute;left:53px;right:53px;bottom:22px;display:flex;justify-content:space-between;font-size:10.5px;color:#7b8c85;border-top:1px solid #e3e9e4;padding-top:7px;font-weight:600}
.blk{margin:0 0 14px}
.sheet-ic p{margin:0 0 7px}
.sheet-ic ul{margin:0 0 7px;padding-left:18px}
.sheet-ic li{margin:0 0 3px}
.sheet-ic h3{font-family:'Fraunces',serif;font-weight:600;font-size:18px;margin:0 0 7px;color:var(--green);letter-spacing:-.005em}
.sheet-ic .katex{font-size:1.06em}
.nw{white-space:nowrap}
.nw.bs{margin-right:.14em}
.dmath{margin:4px 0 8px}
.dip{font-size:12px;color:var(--ink2);margin-top:6px}
.fig{width:100%;height:auto;display:block}

/* kapak */
.kapak{display:grid;grid-template-columns:1.45fr 1fr;gap:16px;background:var(--green);color:#fffef4;border-radius:18px;padding:22px 24px;position:relative;overflow:hidden}
.kapak::after{content:"";position:absolute;right:-50px;top:-60px;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6c08e,#c9793f 55%,#7d4a27);opacity:.2}
.kp-ust{font-size:11px;letter-spacing:.14em;font-weight:800;opacity:.8}
.kapak h1{font-family:'Fraunces',serif;font-weight:600;font-size:40px;line-height:1.05;margin:6px 0 10px;letter-spacing:-.02em}
.kp-cikti{font-size:11.5px;opacity:.85;font-weight:600}
.kp-sag{position:relative;z-index:1;display:grid;gap:7px;align-content:start}
.kp-ad{display:flex;align-items:flex-end;gap:8px;font-size:12px;font-weight:700}
.kp-ad span{opacity:.8;width:40px}
.kp-ad b{flex:1;border-bottom:1.5px solid rgba(255,254,244,.55);font-size:14px;min-height:20px;padding-bottom:1px}
.kp-gorev{font-size:11.5px;background:rgba(255,254,244,.1);border-radius:10px;padding:7px 9px;line-height:1.55}
.kp-gorev span{white-space:nowrap;font-weight:800;color:#f2c98f}
.kp-unvan{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:11px;font-weight:800}
.kp-unvan span{background:#fffef4;color:var(--green);border-radius:999px;padding:3px 8px}
.kp-unvan i{opacity:.6;font-style:normal}
.kapak-hoca{border:1.8px solid var(--ink);border-radius:12px;padding:12px 14px}
.kh-ust{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.kh-okul{font-family:'Fraunces',serif;font-weight:600;font-size:19px}
.kh-alt{font-size:13px;font-weight:600;color:var(--ink2)}
.kh-kod{font-size:11px;font-weight:800;border:1.4px solid var(--ink);border-radius:8px;padding:3px 7px;white-space:nowrap}
.kh-tab{width:100%;border-collapse:collapse;margin:10px 0 6px;font-size:12px}
.kh-tab th,.kh-tab td{border:1.2px solid var(--ink);padding:7px 8px;text-align:left}
.kh-tab th{background:#f1f4f2;width:1%;white-space:nowrap}
.kh-tab td.dar{width:12%}
.kh-not{font-size:11.5px;color:var(--ink2)}

/* bölüm başlığı */
.bolum{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--green);padding-bottom:5px;margin-top:6px}
.bolum h2{font-family:'Fraunces',serif;font-weight:600;font-size:23px;margin:0;color:var(--ink);letter-spacing:-.01em}
.bolum .bn{font-size:10.5px;font-weight:800;letter-spacing:.12em;background:var(--blue);color:#fff;border-radius:6px;padding:3px 7px;align-self:center}
.bolum .bn.soru{background:var(--copper)}
.bolum .bn.cz{background:var(--green)}
.bolum .bc{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--ink2)}

/* not blokları */
.n-kart{background:#f6f9f7;border-radius:14px;padding:13px 15px}
.n-acilis{background:#f3f6fa;border-left:5px solid var(--blue);border-radius:4px 14px 14px 4px;padding:13px 16px}
.na-etk{display:inline-block;font-size:10.5px;letter-spacing:.12em;font-weight:800;text-transform:uppercase;color:var(--blue);margin-bottom:2px}
.na-etk.turuncu{color:var(--copper)}
.na-soru{background:#fff;border-radius:10px;padding:7px 10px;font-size:13px;margin-top:4px;border:1px dashed #b9cbd8}
.kutu{background:#fff8ec;border:1px solid #f0d9b5;border-radius:11px;padding:8px 11px;margin-top:8px;font-size:13px}
.kutu > b{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--copper);margin-bottom:2px}
.kutu p{margin:0}
.n-ikili{display:grid;grid-template-columns:1.35fr 1fr;gap:12px}
.n-ikili .yan{background:#fbf6ee}
.n-yan{display:grid;grid-template-columns:1fr 270px;gap:14px;align-items:start}
.ny-sekil .fig{max-width:270px!important}
.sekil-genis{margin:2px 0 8px}
.sekil-genis .fig{max-width:100%!important}
.n-formul{border:1.8px solid var(--green);border-radius:14px;padding:12px 15px}
.nf-alt{font-size:13px;color:var(--ink2);margin-bottom:8px}
.nf-kol{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nf-k{background:#f3f7f4;border-radius:11px;padding:9px 12px}
.nf-kb{font-weight:800;font-size:13px;color:var(--green)}
.nf-not{font-size:11.5px;color:var(--ink2);margin-bottom:2px}
.nf-s{margin:2px 0}
.nf-s .katex-display{margin:3px 0;text-align:left}
.nf-s .katex-display>.katex{text-align:left;font-size:1.3em}
.n-efsane h3 small{font-family:'Plus Jakarta Sans',sans-serif;font-size:11.5px;color:var(--ink2);font-weight:600;margin-left:6px}
.ef-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ef{border:1.5px dashed #c8d4cc;border-radius:12px;padding:9px 11px 8px;position:relative;display:flex;flex-direction:column}
.ef-n{position:absolute;left:-7px;top:-8px;width:22px;height:22px;border-radius:50%;background:var(--sun);color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center}
.ef-i{font-weight:700;font-size:13px;margin-bottom:6px}
.ef-sec{display:flex;gap:14px;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.ef-cevap{margin-top:auto;transform:rotate(180deg);font-size:10.5px;color:#6f817a;border-top:1px dotted #c8d4cc;padding-top:5px;line-height:1.4}
.n-deney{display:grid;grid-template-columns:150px 1fr;gap:14px;background:#fbf6ee;border-radius:14px;padding:12px 15px}
.nd-sekil .fig{max-width:150px!important}
table.vt{border-collapse:collapse;font-size:12.5px;margin:4px 0 6px}
table.vt th,table.vt td{border:1px solid #cfdad2;padding:4px 9px;text-align:center}
table.vt th{background:#eef4ef;font-weight:800}
table.vt.yatay thead th{background:var(--green);color:#fff;border-color:var(--green)}
table.vt.kucuk{font-size:12px}
.n-ozet{border-top:2px dotted #c8d4cc;padding-top:10px}
.oz{display:flex;gap:9px;align-items:flex-start;font-size:13px;margin-bottom:5px}
.kb{width:15px;height:15px;border:1.6px solid var(--green);border-radius:4px;flex:none;margin-top:2px}

/* bağlam setleri (TYMM bağlam temelli soru seti) */
.baglam{border:1.6px solid #d8c6ae;background:#fdfaf4;border-radius:14px;padding:10px 14px 8px}
.bg-ust{font-size:11.5px;font-weight:800;color:var(--copper);letter-spacing:.02em;margin-bottom:6px}
.baglam h4{font-family:'Fraunces',serif;font-weight:600;font-size:16px;margin:0 0 5px;color:var(--ink)}
.baglam .q-metin p{margin:0 0 6px}
.baglam table.vt{margin:6px auto 8px}
.bg-kaynak{font-size:10.5px;color:var(--ink2);font-style:italic;margin-top:4px}
.soru.set-soru{border-left:4px solid #d8c6ae}
.tema-eko .baglam{background:#fff}

/* sorular */
.soru{border:1.4px solid #dbe4dd;border-radius:14px;padding:11px 14px 10px}
.q-ust{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;font-size:11px;font-weight:800}
.q-no{width:27px;height:27px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800;flex:none}
.q-no.k{width:22px;height:22px;font-size:12px;border-radius:7px}
.q-z{color:var(--copper);letter-spacing:.02em}
.q-z .off{color:#e2d3c6}
.q-xp{background:#fdf1dc;color:#9a6a1c;border-radius:999px;padding:2px 8px}
.q-puan{background:#eef4ef;color:var(--green);border-radius:999px;padding:2px 8px}
.q-yks{background:#e8f1f7;color:#1f5d8a;border-radius:999px;padding:2px 8px}
.q-bec{color:#8a9b94;font-weight:700}
.q-tik{margin-left:auto;color:#8a9b94;font-weight:700}
.q-metin p{margin:0 0 6px}
.q-yan{display:grid;grid-template-columns:1fr 232px;gap:14px;align-items:start}
.q-sekil .fig{max-width:232px!important;margin-left:auto}
.q-sekil-ic{margin:4px 0 8px;display:flex;justify-content:center}
.q-sekil-ic .fig{max-width:300px!important}
.q-sekil-ic.genis .fig{max-width:100%!important}
.yargi{display:flex;align-items:baseline;gap:8px;margin:0 0 3px;padding-left:4px}
.yargi > span{font-weight:800;min-width:24px}
.sec{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px 12px}
.sec li{display:flex;gap:6px;align-items:baseline;font-size:13.2px}
.sec li b{color:var(--ink);min-width:18px}
.sec.k5{grid-template-columns:repeat(5,1fr)}
.sec.k2{grid-template-columns:1fr 1fr}
.sec.k1{grid-template-columns:1fr}
.satirlar{margin-top:6px}
.satirlar i{display:block;height:25px;border-bottom:1px solid #cfdad2}
.satirlar.ince i{height:22px}
.cozum{background:#f2f7f3;border-radius:11px;padding:9px 12px 6px;margin-top:9px;font-size:12.6px}
.cz-ust{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.cz-ust b{color:var(--green);font-size:13px}
.cz-cev{margin-left:auto;background:var(--green);color:#fff;border-radius:999px;padding:2px 10px;font-weight:800;font-size:11.5px}
.cozum ol{margin:0;padding-left:18px}
.cozum li{margin-bottom:4px}
.cozum li p{margin:0}
.skor{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:#fdf6ea;border-radius:16px;padding:14px 16px}
.skor h3{color:var(--copper)}
.sk-sat{font-size:12.8px;font-weight:600;display:flex;align-items:flex-end;gap:6px;margin:6px 0}
.sk-sat i,.sk-top i{display:inline-block;width:42px;border-bottom:1.4px solid var(--ink2);height:16px}
.sk-top{font-weight:800;font-size:14px;margin-top:10px;display:flex;gap:6px;align-items:flex-end}
.sk-u{display:flex;justify-content:space-between;font-size:12.8px;border-bottom:1px dotted #e3cfb2;padding:3px 0}
.sk-u span{color:var(--ink2);font-weight:600}
.sk-zor{font-size:12px;font-weight:700;margin-top:10px;color:var(--ink2)}
.anahtar .an-f{margin-bottom:8px}
.an-h{display:block;font-size:12.5px;margin-bottom:4px}
.an-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.an-grid>span{border:1.3px solid #d3ddd6;border-radius:9px;padding:5px 8px;font-weight:800;font-size:13px;display:flex;gap:7px;align-items:center}
.an-grid i{font-style:normal;color:#8a9b94;font-size:11px;min-width:16px}
.tanitim{background:#fff3e5;border:1.5px dashed var(--copper);border-radius:12px;padding:10px 13px;font-size:12.5px;color:#7a4a25}

/* etkileşimli türler (basılı): eşleştir, sınıfla, sırala, kavram kartları, mini oyun */
.q-tur{background:#efeaf7;color:#5b3f8c;border-radius:999px;padding:2px 8px}
.etk-es{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px;margin-top:6px}
.etk-es ol{list-style:none;margin:0;padding:0;display:grid;gap:5px;align-content:start}
.etk-es li{display:flex;align-items:center;gap:8px;font-size:13.2px;min-height:26px}
.es-no{width:21px;height:21px;border-radius:7px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.es-m{flex:1;min-width:0}
.es-sag li{border-left:2px solid #e3e9e4;padding-left:9px}
.es-sag li b{min-width:18px;flex:none}
.cvp{width:26px;height:24px;border:1.5px solid var(--ink2);border-radius:6px;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px;background:#fff}
.cvp.dolu,.kare.dolu{color:#1d6a41;border-color:#2f8f5b;background:#e9f6ee}
.etk-not{font-size:11.2px;color:var(--ink2);margin-top:6px;font-style:italic}
table.etk-sn{border-collapse:collapse;width:100%;margin-top:6px;font-size:13px;table-layout:fixed}
table.etk-sn th,table.etk-sn td{border:1px solid #cfdad2;padding:4px 8px;text-align:center;vertical-align:middle}
table.etk-sn thead th{background:#eef4ef;font-weight:800;font-size:12.2px;line-height:1.3}
table.etk-sn thead th:first-child{background:transparent;border-top-color:transparent;border-left-color:transparent}
table.etk-sn td.sn-m{text-align:left}
table.etk-sn.g2 th:first-child{width:52%} table.etk-sn.g3 th:first-child{width:43%} table.etk-sn.g4 th:first-child{width:36%}
.kare{display:inline-grid;place-items:center;width:17px;height:17px;border:1.5px solid var(--ink2);border-radius:4px;font-size:12px;font-weight:800;vertical-align:middle}
.etk-sr{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:5px}
.etk-sr li{display:flex;align-items:center;gap:10px;font-size:13.2px}
.n-kartlar h3 small{font-family:'Plus Jakarta Sans',sans-serif;font-size:11.5px;color:var(--ink2);font-weight:600;margin-left:6px}
.kt-grid{display:grid;gap:10px}
.kt-grid.k3{grid-template-columns:repeat(3,1fr)}
.kt-grid.k2{grid-template-columns:1fr 1fr}
.kt{border:1.5px solid #c8d4cc;border-radius:12px;padding:9px 11px 8px;position:relative;background:#fff;min-width:0;overflow-wrap:anywhere}
.kt-n{position:absolute;left:-7px;top:-8px;width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;font-size:11px;display:grid;place-items:center}
.kt-on{font-weight:800;font-size:14px;color:var(--green)}
.kt-ip{font-size:11px;color:var(--ink2);font-style:italic}
.kt-arka{border-top:1.5px dashed #c8d4cc;margin-top:6px;padding-top:5px;font-size:12.3px;line-height:1.45}
.n-oyun{border:1.8px dashed #b9a6d6;border-radius:14px;padding:11px 15px 9px;background:#fbf9fe}
.na-etk.mor{color:#5b3f8c}
.n-oyun > p{margin:0 0 4px}
.oy-cevap{transform:rotate(180deg);font-size:10.5px;color:#6f817a;border-top:1px dotted #c8d4cc;padding-top:5px;margin-top:8px;text-align:right}
.an-etk{border:1.3px solid #d3ddd6;border-radius:9px;padding:5px 8px;font-size:11.5px;font-weight:700;display:flex;gap:7px;align-items:baseline}
.an-etk em{font-style:normal;line-height:1.35}
.cz-sn{margin:0 0 5px;font-size:12.4px}
.sn-g{display:block}
.an-etk .sn-g{border:0;padding:0;display:block;font-weight:700}
.sn-g b{color:var(--green)}
.an-etk .sn-g b{color:var(--ink)}
.tema-eko .n-oyun{background:#fff}
.tema-eko .q-tur{background:#fff;border:1px solid #b9a6d6}

/* boş alan doldurucu */
.doldur{margin:0;border-radius:12px;position:relative;border:1.2px dashed #d5dfd8}
.doldur span{position:absolute;left:10px;top:6px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#9aaba4;background:#fff;padding:0 4px}
.doldur.kareli{background-image:linear-gradient(#e7eee9 1px,transparent 1px),linear-gradient(90deg,#e7eee9 1px,transparent 1px);background-size:18px 18px;background-position:-1px -1px}
.doldur.cizgili{background-image:linear-gradient(transparent 27px,#e3eae5 27px);background-size:100% 28px}
/* öğretmen modu: süsleri sadeleştir */
.ogretmen .soru{border-color:#cfd8d2}

/* Az mürekkep teması */
.tema-eko .bg{display:none}
.tema-eko .kapak{background:#fff;color:var(--ink);border:2px solid var(--green)}
.tema-eko .kapak::after{display:none}
.tema-eko .kp-ad b{border-color:var(--ink2)}
.tema-eko .kp-gorev{background:#f5f7f5}
.tema-eko .kp-gorev span{color:var(--copper)}
.tema-eko .kp-unvan span{border:1px solid var(--green)}
.tema-eko .n-kart,.tema-eko .n-acilis,.tema-eko .n-deney,.tema-eko .skor,.tema-eko .nf-k,.tema-eko .cozum,.tema-eko .kutu{background:#fff;border:1.2px solid #cfdad2}
.tema-eko table.vt.yatay thead th{background:#eef4ef;color:var(--ink);border-color:#cfdad2}
.tema-eko .q-no{background:#fff;color:var(--ink);border:1.6px solid var(--ink)}
.tema-eko .cz-cev{background:#fff;color:var(--green);border:1.3px solid var(--green)}

/* ---------- Yazdırma ---------- */
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff!important}
  .panel,.alt-bar,.onbaslik,dialog{display:none!important}
  .app{display:block}
  #onizleme{padding:0!important;overflow:visible}
  #sayfalar{zoom:1!important;width:auto}
  .sheet{box-shadow:none;border-radius:0;margin:0;width:210mm;height:297mm;page-break-after:always;break-after:page}
  .sheet:last-child{page-break-after:auto;break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* 3B görünümlü çizimler (baskı) */
.n-res{display:grid;grid-template-columns:minmax(0,1fr) 64mm;gap:12px;align-items:start}
.n-res .nr-s svg{width:100%;height:auto;max-width:none!important;border-radius:10px}
.kt-res{float:left;width:27mm;margin:1px 8px 3px 0}
.ef-res{float:right;width:26mm;margin:0 0 2px 8px}
.kt-res svg,.ef-res svg{display:block;width:100%;height:auto;max-width:none!important;border-radius:7px}
.kt-arka{clear:both}
.ef-cevap::after{content:'';display:block;clear:both}

/* ---- TYT: çözümlü örnek (not bloğu cozumlu) ---- */
.na-etk.mavi{color:var(--blue)}
.n-cozumlu{border:1.4px solid #cfe0ea;border-radius:13px;padding:10px 13px 8px;background:#fbfdfe}
.n-cozumlu h3{margin:2px 0 6px}
.cz-bas{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:11px;font-weight:700}
.cz-bas .na-etk{margin:0}
.cz-cik{background:#e8f1f7;color:#1f5d8a;border-radius:999px;padding:2px 8px}
.n-cozumlu-c{background:#f2f7f3;border:1.4px solid #cfe0d4;border-radius:13px;padding:8px 13px 6px;font-size:12.8px}
.n-cozumlu-c .czk-ust{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.n-cozumlu-c .czk-ust b{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}
.n-cozumlu-c .cz-cev{margin-left:auto}
.n-cozumlu-c ol{margin:0;padding-left:18px}
.n-cozumlu-c li{margin-bottom:4px}
.n-cozumlu-c li p{margin:0}
.cz-ip,.cz-tz{border-radius:10px;padding:6px 10px;margin:6px 0 4px;font-size:12.5px}
.cz-ip{background:#eef5fb;border:1px solid #cfe0ea}
.cz-tz{background:#fff4e6;border:1px solid #f0d9b5}
.cz-ip > b,.cz-tz > b{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:1px}
.cz-ip > b{color:var(--blue)}.cz-tz > b{color:var(--copper)}
.cz-ip p,.cz-tz p{margin:0}
.onizleme-bant{position:fixed;left:8px;bottom:8px;z-index:99;background:#7a3e00;color:#fff;font:800 10px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:.12em;padding:4px 8px;border-radius:8px;pointer-events:none;opacity:.8}
@media print{.onizleme-bant{display:none}}

/* 3B animasyon bloğu (tur:'anim3b'): baskıda durağan kare + kısa açıklama */
.n-a3b-pdf{display:grid;grid-template-columns:72mm minmax(0,1fr);gap:12px;align-items:center;border:1.2px solid #d3dee6;background:#f6f9fb;border-radius:12px;padding:8px 12px 8px 8px}
.n-a3b-pdf .na3-res img{display:block;width:100%;height:auto;aspect-ratio:1/1;border-radius:8px}
.n-a3b-pdf h3{margin:1px 0 5px}
.n-a3b-pdf p{margin:0 0 4px}
/* Simülasyon bloğu (PDF): varsayılan değerlerle durağan sahne */
.n-sim-pdf{border:1.2px solid #d3dee6;background:#f6f9fb;border-radius:12px;padding:10px 14px 8px;break-inside:avoid}
.n-sim-pdf .nsp-sekil{margin:4px auto 6px;max-width:150mm}
.n-sim-pdf .nsp-sekil .fig{display:block;width:100%;max-width:100%!important;height:auto}
.n-sim-pdf h3{margin:1px 0 5px}
.n-sim-pdf p{margin:0 0 5px}
.n-sim-pdf .nsp-alt{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.n-sim-pdf .nsp-durum{font-size:12px;background:#fff;border:1px dashed #b9cbd8;border-radius:9px;padding:4px 8px}
.n-sim-pdf .nsp-alt .dip{margin:0}
.tema-eko .n-sim-pdf{background:#fff}

/* ---- TYT paneli: kitapçık türü, bütün üniteler, deneme listesi ---- */
.tyt-gizli{display:none!important}
.cips.dikey{flex-direction:column;align-items:stretch}
.cips.dikey .cip{justify-content:space-between;border-radius:12px;text-align:left}
.konu.un-bas{font-weight:800;color:var(--green);margin-top:6px;border-top:1px solid var(--ui-line);border-radius:0 0 9px 9px;padding-top:9px}
.konu.un-bas:first-child{margin-top:0;border-top:0}
.konu.alt{padding:5px 9px 5px 26px}
.kn-say{font-size:12px;color:var(--ui-muted);margin-top:6px}
.dn-et{font-size:12px;font-weight:800;color:var(--ui-muted);margin:6px 0 5px}
.dn-izg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.dn-t{display:flex;align-items:center;gap:4px;border:1.5px solid var(--ui-line);border-radius:9px;padding:5px 6px;font-size:12.5px;font-weight:700;cursor:pointer}
.dn-t input{accent-color:var(--green);width:14px;height:14px;margin:0;flex:none}
.dn-t.kilitli{opacity:.55;cursor:not-allowed}
.dn-t small{font-size:10px;margin-left:auto}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .konu.un-bas{color:#cfe6d8} }

/* ---- TYT konu kitapçığı: içindekiler, anahtar ve çözüm başlıkları ---- */
.icindekiler{border:1.4px solid #d4ded5;border-radius:14px;padding:12px 18px 10px}
.icindekiler h3 small{font-family:'Plus Jakarta Sans',sans-serif;font-size:11.5px;color:var(--ink2);font-weight:600;margin-left:6px}
.ic-un{font-weight:800;font-size:11px;color:var(--copper);letter-spacing:.08em;margin:9px 0 2px;text-transform:uppercase}
.ic-s{display:flex;align-items:baseline;gap:8px;font-size:13px;padding:2px 0}
.ic-no{font-weight:800;color:var(--green);min-width:28px}
.ic-s i{flex:1;border-bottom:1.5px dotted #b8c6be;transform:translateY(-3px)}
.ic-sy{font-weight:800;min-width:22px;text-align:right}
.sheet-ic h3.an-konu{font-size:15px;margin-bottom:5px}
.cz-konu{font-family:'Fraunces',serif;font-size:17px;font-weight:600;color:var(--green);border-bottom:1.5px solid #cfdad2;padding-bottom:4px;margin-top:4px}
.cz-konu b{font-family:'Plus Jakarta Sans',sans-serif;font-size:11.5px;background:var(--green);color:#fff;border-radius:6px;padding:2px 7px;margin-right:6px;vertical-align:2px}
.tema-eko .cz-konu b{background:#fff;color:var(--green);border:1.2px solid var(--green)}

/* ---- TYT deneme ve tarama kitapçığı: sınav kâğıdı düzeni ---- */
.dn-kitap{font-size:13px;line-height:1.48}
.dn-iki{display:grid;grid-template-columns:1fr 1fr;column-gap:28px;position:relative;margin:0 0 6px}
.dn-iki::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1.2px solid #9fb0a8}
.dn-kol{min-width:0}
.dn-soru{display:flex;gap:5px;margin:0 0 18px}
.dn-no{font-weight:800;font-size:14px;min-width:21px;line-height:1.4}
.dn-ic{flex:1;min-width:0}
.dn-kitap .q-metin p{margin:0 0 6px}
.dn-sekil{margin:4px 0 8px;display:flex;justify-content:center}
.dn-sekil .fig{max-width:100%!important}
.dn-soru.tam .dn-sekil .fig{max-width:150mm!important}
.dn-kitap table.vt{margin:4px auto 8px;font-size:12px}
.dn-kitap table.vt th,.dn-kitap table.vt td{padding:3px 6px}
.dn-sec{margin-top:7px;gap:3px 10px}
.dn-sec li{font-size:13px}
.dn-bas{border:2px solid var(--ink);border-radius:10px;overflow:hidden;margin-bottom:16px}
.db-ust{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;padding:5px 12px;font-size:10.5px;font-weight:800;letter-spacing:.14em}
.db-kod b{background:#fff;color:var(--ink);border-radius:4px;padding:1px 6px;margin-left:6px;letter-spacing:.08em}
.db-orta{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 12px 6px}
.db-orta h2{font-family:'Fraunces',serif;font-weight:600;font-size:24px;margin:0;letter-spacing:-.01em;line-height:1.15}
.db-alt{font-size:12px;color:var(--ink2);font-weight:600}
.db-sure{border:2px solid var(--ink);border-radius:10px;padding:4px 12px 3px;text-align:center;line-height:1.05;flex:none}
.db-sure b{display:block;font-size:22px}
.db-sure span{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.db-tab{width:calc(100% - 24px);margin:0 12px 7px;border-collapse:collapse;font-size:11.5px;table-layout:fixed}
.db-tab th,.db-tab td{border:1.2px solid var(--ink);padding:4px 6px;height:28px}
.db-tab th{background:#eef2ef;font-weight:800;text-align:left}
.db-tab th:nth-child(1){width:76px}.db-tab th:nth-child(3){width:76px}.db-tab th:nth-child(5),.db-tab th:nth-child(7),.db-tab th:nth-child(9){width:34px;text-align:center}
.db-tab td.db-genis{width:auto;font-size:13px;font-weight:700}.db-tab td.db-orta-h{width:70px}.db-tab td.db-k{width:40px}
.db-yon{font-size:11.5px;color:var(--ink2);padding:0 12px 8px}
.dn-surekli{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;color:var(--ink2);border-bottom:1.5px solid var(--ink);padding-bottom:4px;margin-bottom:14px}
.dn-son{border-top:1.5px solid var(--ink);padding-top:8px;margin-top:2px}
.ds-yazi{text-align:center;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.ds-optik{display:flex;align-items:center;gap:12px;border:1.4px solid #9fb0a8;border-radius:10px;padding:7px 10px}
.ds-et{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--ink2);width:auto;white-space:nowrap;flex:none}
.ds-izg{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:6px 10px;flex:1}
.ds-s{display:flex;align-items:center;gap:3px}
.ds-s i{font-style:normal;font-weight:800;font-size:11.5px;min-width:17px}
.ds-s span{width:17px;height:17px;border:1.3px solid var(--ink2);border-radius:50%;font-size:8.5px;font-weight:700;display:grid;place-items:center;color:var(--ink2)}
.dn-kapak{min-height:990px;display:flex;flex-direction:column;gap:10px}
.dk-bant{display:flex;justify-content:space-between;background:var(--green);color:#fffef4;border-radius:12px;padding:10px 16px;font-size:11px;font-weight:800;letter-spacing:.16em}
.sheet-ic .dn-kapak h1{font-family:'Fraunces',serif;font-weight:600;font-size:46px;line-height:1.05;margin:30px 0 0;letter-spacing:-.02em;color:var(--green)}
.dk-alt{font-size:13px;color:var(--ink2);font-weight:600}
.dk-ad{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin:16px 0 6px}
.dk-ad div{display:flex;align-items:flex-end;gap:8px;font-size:12px;font-weight:700}
.dk-ad span{color:var(--ink2);white-space:nowrap}
.dk-ad b{flex:1;border-bottom:1.5px solid var(--ink2);min-height:22px;font-size:15px}
.sheet-ic .dn-kapak h3{margin:12px 0 0}
.dk-tab{width:100%;border-collapse:collapse;font-size:12px}
.dk-tab th,.dk-tab td{border:1.1px solid #b8c6be;padding:5px 7px;text-align:center;height:27px}
.dk-tab thead th{background:var(--green);color:#fff;border-color:var(--green);font-size:11px}
.dk-tab .dk-adi{text-align:left}
.dk-id{font-weight:800}
.dk-iki{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dk-tab.cift td{height:24px;padding:3px 6px}
.dk-yon{background:#f3f7f4;border-radius:12px;padding:10px 14px;font-size:12px;margin-top:auto}
.dk-yon ol{margin:4px 0 0;padding-left:18px}
.dk-yon li{margin-bottom:2px}
.dn-an{margin-bottom:12px}
.da-f{font-weight:800;font-size:12.5px;margin-bottom:4px}
.da-tab{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
.da-tab th,.da-tab td{border:1.1px solid #c3d0c8;padding:3px 2px;text-align:center}
.da-tab thead th{background:#eef4ef;font-weight:800}
.da-tab th:first-child{width:64px}
.da-tab td.da-id{font-weight:800}
.da-tab td b{display:block;font-size:14px;line-height:1.2}
.da-tab td small{display:block;font-size:9.5px;color:#7b8c85;font-weight:700;line-height:1.2}
.da-lej{font-size:11px;color:var(--ink2);line-height:1.7}
.da-lej span{display:inline-block;margin-right:12px}
.da-lej em{font-style:normal;font-weight:800;color:var(--ink)}
.dn-cz .cz-ust b{color:var(--ink)}
.dn-bos{border:1.5px dashed #c8d4cc;border-radius:14px;padding:40px 20px;text-align:center;color:var(--ink2)}
.dn-bos p{margin:8px 0 0}
.tema-eko .db-ust,.tema-eko .dk-bant{background:#fff;color:var(--ink);border-bottom:1.5px solid var(--ink)}
.tema-eko .dk-bant{border:1.5px solid var(--green)}
.tema-eko .db-kod b{border:1.2px solid var(--ink)}
.tema-eko .dk-tab thead th{background:#eef4ef;color:var(--ink);border-color:#b8c6be}
.tema-eko .dk-yon{background:#fff;border:1.2px solid #cfdad2}
#olcum.dn-kitap,.sheet-ic.dn-kitap{font-size:13px;line-height:1.48}
.db-yon{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.db-saat{white-space:nowrap;font-weight:700;color:var(--ink)}
.db-saat i{display:inline-block;width:46px;border-bottom:1.2px solid var(--ink2);margin:0 8px 0 3px}
.dk-dag{display:grid;gap:5px;margin-top:2px}
.dk-dag > div{display:grid;grid-template-columns:270px 1fr 24px;gap:10px;align-items:center;font-size:12px}
.dd-ad{font-weight:600;color:var(--ink2)}
.dd-cb{height:10px;background:#eef3ef;border-radius:999px;overflow:hidden}
.dd-cb i{display:block;height:100%;background:var(--copper);border-radius:999px}
.dk-dag b{text-align:right}
.tema-eko .dd-cb i{background:#9aa9a2}
.dn-kol > .dn-soru:last-child{margin-bottom:0}
.da-gr{font-weight:800;font-size:12.5px;color:var(--green);margin:2px 0 4px}
.dn-kitap table.vt td.kisa{white-space:nowrap}
.dn-kitap table.vt td.uzun{text-align:left}
.dn-kitap table.vt.genis{width:100%}
.dn-kitap table.vt.genis td:first-child{text-align:left}
/* Deneme kitapçığı: ekranda ve baskıda aynı genişlik (baskıda 210 mm = 793,7 px olduğundan sağdan hizalama kullanılmaz);
   ölçüm 2 px dar yapılır ki basılı satır kırılması ölçülenden fazla olmasın. İç kenar boşlukları blok içinde kalır. */
.sheet-ic.dn-kitap{right:auto;width:688px}
#olcum.dn-kitap{width:686px}
.dn-iki{grid-template-columns:330px 330px}
.dn-kitap > .blk:not(.dn-soru):not(.dn-surekli):not(.dn-kapak){display:flow-root}
.dk-iki.p3{grid-template-columns:1fr 1fr 1fr;gap:10px}
.dn-kapak.sik{min-height:0}
.dn-kapak.sik h1{margin-top:12px}
.dn-son{margin-top:12px}
.dk-iki{align-items:start}
/* TYT konu kitapçığı: baskıda da 688 px içerik genişliği (ekrandaki ölçümle aynı satır kırılması) */
.sheet-ic.tyt-ic{right:auto;width:688px}
.sheet-ic .dn-kapak h1{line-height:1.12;margin-bottom:6px}

/* Çıkmış soru analizi (PDF) */
.n-cikmis-p .na-etk.kirmizi{color:#c2410c}
.n-cikmis-p .cm-tab{margin:6px 0}
.n-cikmis-p .cm-tab th,.n-cikmis-p .cm-tab td{text-align:center;padding:2px 4px}
.n-cikmis-p .cm-pk{border:1px solid #e3e7e1;border-radius:8px;padding:6px 9px;margin-top:6px;break-inside:avoid}
.n-cikmis-p .cm-pk ol{margin:3px 0;padding-left:18px}
.n-cikmis-p .cm-pb b{color:#c2410c}
.q-yks.thm{background:#fdf0e6;color:#9a3d12}
.n-cikmis-p.cm-tek{padding-top:0;margin-top:-2px}
.n-cikmis-p.cm-tek .cm-pk{margin-top:4px}
.tk-kalip{font-size:10pt;line-height:1.45;padding:5px 0 5px 10px;border-left:3px solid #d9573b;margin:4px 0}
.tk-kalip .tk-tz{display:block;color:#9a3412;font-size:9.5pt}
.tk-kart{font-size:10pt;line-height:1.45;padding:5px 0 5px 10px;border-left:3px solid #244f40;margin:4px 0}

/* ============ BFY Dijital Çalışma — telefon, tablet, bilgisayar ============ */
body.dj{font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
.dj a{color:inherit}
.dj-ana{max-width:820px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom))}
@media (min-width:900px){ .dj-ana{padding-top:20px} }

/* üst çubuk */
.dj-ust{position:sticky;top:0;z-index:20;background:var(--green);color:#fffef4;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:10px;min-height:56px;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.dj-ust .geri{border:0;background:rgba(255,254,244,.14);color:#fffef4;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none;text-decoration:none}
.dj-ust .geri svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.dj-ust .logo{width:36px;height:36px;border-radius:10px;background:#fffef4;color:var(--green);display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:600;font-size:18px;flex:none}
.dj-ust .bas{min-width:0;flex:1}
.dj-ust .bas b{display:block;font-family:'Fraunces',serif;font-weight:600;font-size:18px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dj-ust .bas small{display:block;font-size:12px;opacity:.8;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp-cip{display:inline-flex;align-items:center;gap:5px;background:#fffef4;color:var(--green);border-radius:999px;padding:6px 11px;font-weight:800;font-size:13.5px;flex:none;white-space:nowrap}
.xp-cip i{font-style:normal;color:var(--copper)}
.xp-cip.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.25)}}
.ust-btn{border:0;background:rgba(255,254,244,.14);color:#fffef4;height:40px;border-radius:12px;padding:0 12px;font-weight:800;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;flex:none}
.ust-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ust-btn.on{background:#fffef4;color:var(--green)}

/* alt menü */
.dj-nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--ui-card);border-top:1px solid var(--ui-line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.dj-nav a{display:grid;justify-items:center;gap:2px;text-decoration:none;color:var(--ui-muted);font-size:11.5px;font-weight:700;padding:5px 0;border-radius:12px}
.dj-nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dj-nav a.on{color:var(--green);background:var(--mint)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .dj-nav a.on{color:#cfe6d8;background:#1f3a33} }
body.dj.odak .dj-nav{display:none}
body.dj.odak .dj-ana{padding-bottom:calc(120px + env(safe-area-inset-bottom))}

/* genel parçalar */
.baslik2{font-family:'Fraunces',serif;font-weight:600;font-size:22px;margin:18px 2px 10px;letter-spacing:-.01em}
.baslik2 small{display:block;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;color:var(--ui-muted);font-weight:600;letter-spacing:0;margin-top:2px}
.kart{background:var(--ui-card);border:1px solid var(--ui-line);border-radius:18px;padding:14px}
.btn.ana.kucuk{width:auto;padding:10px 16px}
.btn.gen{width:100%}
.btn.yesil{background:var(--green);color:#fffef4}
.btn.yesil:disabled{opacity:.45;cursor:not-allowed}
.btn.cizgi{background:transparent;border:2px solid var(--ui-line);color:var(--ui-text)}
.btn-sat{display:flex;gap:10px;margin-top:14px}
.btn-sat .btn{flex:1}
.etiket{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800;background:var(--mint);color:var(--green)}
.kilit-bant{display:flex;align-items:center;gap:10px;background:#fff4e6;color:#7a4a22;border:1px solid #f0d9b5;border-radius:14px;padding:11px 13px;font-size:14px;font-weight:600;margin:10px 0}
.kilit-bant button{margin-left:auto;border:0;background:var(--copper);color:#fff;border-radius:999px;padding:8px 13px;font-weight:800;cursor:pointer;flex:none}

/* ana ekran */
.hero{background:linear-gradient(135deg,var(--green),#2f6a55);color:#fffef4;border-radius:22px;padding:18px;position:relative;overflow:hidden;margin-top:6px}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6c08e,#c9793f 55%,#7d4a27);opacity:.25}
.hero h1{font-family:'Fraunces',serif;font-weight:600;font-size:26px;margin:0 0 4px;letter-spacing:-.01em;position:relative}
.hero p{margin:0 0 12px;opacity:.88;font-size:14px;position:relative;max-width:30em}
.hero-istat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;position:relative}
.hero-istat.uc{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (min-width:480px){ .hero-istat{grid-template-columns:repeat(4,minmax(0,1fr))} }
.hero-istat div{background:rgba(255,254,244,.14);border-radius:14px;padding:8px 10px;min-width:0}
.hero-istat b{display:block;font-size:19px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-istat span{font-size:11.5px;opacity:.85;font-weight:700}
.devam{display:flex;align-items:center;gap:12px;margin-top:12px;text-decoration:none;background:var(--ui-card);border:1.5px solid var(--ui-line);border-radius:16px;padding:12px 14px}
.devam .ok{margin-left:auto;font-size:22px;color:var(--copper)}
.devam b{display:block;font-size:15px}
.devam small{color:var(--ui-muted);font-weight:600;font-size:12.5px}
.sinif-sec{display:flex;gap:6px;margin:16px 0 0;flex-wrap:wrap}
.konu-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:600px){ .konu-grid{grid-template-columns:1fr 1fr} }
.konu-kart{display:flex;align-items:center;gap:12px;text-decoration:none;background:var(--ui-card);border:1px solid var(--ui-line);border-radius:18px;padding:12px 14px;position:relative;overflow:hidden;min-height:78px}
.konu-kart::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--renk,var(--green))}
.konu-kart:active{transform:scale(.99)}
.halka{width:52px;height:52px;flex:none;position:relative}
.halka svg{width:52px;height:52px;transform:rotate(-90deg)}
.halka circle{fill:none;stroke-width:5}
.halka .zemin{stroke:var(--ui-line)}
.halka .dolu{stroke:var(--renk,var(--green));stroke-linecap:round;transition:stroke-dashoffset .6s}
.halka span{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;font-weight:800}
.kk-metin{min-width:0}
.kk-metin small{display:block;color:var(--ui-muted);font-size:12px;font-weight:700}
.kk-metin b{display:block;font-size:15.5px;line-height:1.25}
.kk-metin em{display:block;font-style:normal;font-size:12px;color:var(--copper);font-weight:800;margin-top:2px}
.pdf-link{display:flex;align-items:center;justify-content:center;gap:8px;margin:22px 0 4px;color:var(--ui-muted);font-weight:700;font-size:14px}

/* konu ekranı */
.sekmeler{display:flex;gap:6px;background:var(--ui-card);border:1px solid var(--ui-line);border-radius:14px;padding:4px;margin:4px 0 12px;position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:10;box-shadow:0 6px 12px -8px rgba(0,0,0,.18)}
.sekmeler a{flex:1;text-align:center;text-decoration:none;padding:9px 6px;border-radius:10px;font-weight:800;font-size:14px;color:var(--ui-muted)}
.sekmeler a.on{background:var(--green);color:#fffef4}
.soru-liste{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.sl{display:flex;align-items:center;gap:12px;text-decoration:none;background:var(--ui-card);border:1px solid var(--ui-line);border-radius:14px;padding:11px 13px}
.sl .no{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800;background:var(--mint);color:var(--green);flex:none}
.sl.d .no{background:#2f8f5b;color:#fff}
.sl.y .no{background:var(--coral);color:#fff}
.sl.kilitli{opacity:.55}
.sl .sl-m{min-width:0;flex:1}
.sl .sl-m b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl .sl-m small{color:var(--ui-muted);font-weight:700;font-size:12px}
.sl .yz{color:var(--sun);font-size:13px;letter-spacing:1px;flex:none}

/* kâğıt (içerik kartları her temada açık kalır: şekiller okunaklı) */
.kagit{background:#fff;color:var(--ink);border-radius:20px;padding:18px 16px;box-shadow:0 2px 14px rgba(20,40,34,.08);position:relative;margin-bottom:12px}
/* Kâğıt genişliği cihaza sabittir (ekranın kısa kenarından hesaplanır): tablet ya da telefon yan
   döndüğünde yazılar yeniden dizilmez, kalemle yazılanlar yerinde kalır. İç düzen ekrana değil
   kâğıdın kendi genişliğine göre ayarlanır (container query). */
.kagit{container-type:inline-size;width:var(--kagit-w,100%);max-width:100%;margin-inline:auto;padding:18px var(--kagit-pad,16px)}
.dj-ana > .q-alt, .dj-ana > .ilerleme-nok, .dj-ana > .sekmeler, .dj-ana > a.btn{width:var(--kagit-w,100%);max-width:100%;margin-inline:auto}
.kagit p{margin:0 0 9px}
.kagit ul{margin:0 0 9px;padding-left:20px}
.kagit li{margin:0 0 4px}
.kagit h3{font-family:'Fraunces',serif;font-weight:600;font-size:20px;margin:0 0 8px;color:var(--green);letter-spacing:-.005em}
.kagit .katex{font-size:1.05em}
.kagit .fig{max-width:100%;height:auto}
.kagit table.vt{max-width:100%;display:block;overflow-x:auto}

/* not blokları: mobilde tek sütun, ekranda okunaklı yazı boyları */
.dj-not{font-size:16px;line-height:1.6}
.dj-not .oz{font-size:15.5px}
.dj-not table.vt{font-size:14px}
.dj-not .kutu{font-size:15px}
.dj-not .nf-not{font-size:13px}
.dj-not .dip{font-size:13.5px}
.dj-not .na-soru{font-size:15px}
.dj-not .blk{margin:0 0 14px}
.dj-not .n-yan{grid-template-columns:1fr}
.dj-not .ny-sekil{order:-1}
.dj-not .ny-sekil .fig{max-width:340px!important;margin:0 auto}
.dj-not .n-ikili{grid-template-columns:minmax(0,1fr)}
.dj-not .n-ikili>.n-kart{min-width:0}
.dj-not .n-ikili .n-kart.yan{overflow-x:auto}
.dj-not .nf-kol{grid-template-columns:1fr}
.dj-not .n-deney{grid-template-columns:1fr}
.dj-not .nd-sekil .fig{max-width:340px;margin:0 auto}
@container (min-width:700px){
  .dj-not .n-yan{grid-template-columns:1fr 300px}
  .dj-not .ny-sekil{order:0}
  .dj-not .n-ikili{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
  .dj-not .nf-kol{grid-template-columns:1fr 1fr}
}
.dj-not .bolum{margin-top:0}
.dj-not .n-efsane{background:transparent;border:0;padding:0}
.ef-dj{display:grid;gap:10px}
@container (min-width:600px){ .ef-dj{grid-template-columns:1fr 1fr} }
.efk{border:2px solid #e3e9e4;border-radius:16px;padding:13px;background:#fbfcfa}
.efk .efk-i{font-weight:700;font-size:15.5px;margin-bottom:10px}
.efk .efk-b{display:flex;gap:8px}
.efk .efk-b button{flex:1;border:2px solid #d4ded5;background:#fff;border-radius:12px;padding:10px;font-weight:800;cursor:pointer;color:var(--ink)}
.efk .efk-c{display:none;margin-top:10px;font-size:14.5px}
.efk.acik .efk-c{display:block;animation:acil .35s}
.efk.acik .efk-b{display:none}
.efk.dogru{border-color:#2f8f5b;background:#f0f8f2}
.efk.yanlis{border-color:var(--coral);background:#fdf3f0}
.efk .efk-sonuc{font-weight:800;margin-bottom:4px}
.efk.dogru .efk-sonuc{color:#23784a}
.efk.yanlis .efk-sonuc{color:#b8452c}
@keyframes acil{from{opacity:0;transform:translateY(-4px)}}
.dusun{margin-top:10px;background:#fff;border:1.5px dashed #b9cbd8;border-radius:12px;padding:10px 12px}

/* soru ekranı */
.ilerleme-nok{display:flex;gap:4px;flex-wrap:wrap;margin:2px 0 10px}
.ilerleme-nok a{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:11.5px;font-weight:800;text-decoration:none;background:var(--ui-card);border:1.5px solid var(--ui-line);color:var(--ui-muted)}
.ilerleme-nok a.d{background:#2f8f5b;border-color:#2f8f5b;color:#fff}
.ilerleme-nok a.y{background:var(--coral);border-color:var(--coral);color:#fff}
.ilerleme-nok a.su{outline:2.5px solid var(--copper);outline-offset:1px}
.ilerleme-nok a.k{opacity:.4}
.q-bas{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.q-bas .z1{background:#e9f4ec;color:#23784a}.q-bas .z2{background:#fff3df;color:#9a5b12}.q-bas .z3{background:#fde9e4;color:#b8452c}
.q-bas .yks{background:#e8f1f7;color:#1f5d8a}
.q-bas .bec{background:#f1f4f2;color:#4b6059}
.q-metin{font-size:16.5px;line-height:1.6}
.q-metin .yargi{display:flex;gap:8px;align-items:baseline;margin:4px 0}
.q-metin .yargi > span{font-weight:800;min-width:26px}
.dj-sekil{margin:10px auto 12px;max-width:420px}
.dj-sekil.genis{max-width:640px}
.dj-sekil .fig{width:100%!important;max-width:100%!important}
.q-metin .q-sekil-ic{margin:10px auto;max-width:420px}
.q-metin .q-sekil-ic.genis{max-width:640px}
.q-metin .q-sekil-ic .fig{width:100%!important;max-width:100%!important}
.secenekler{display:grid;gap:9px;margin-top:14px}
.secenekler.iki{grid-template-columns:1fr 1fr}
.secenekler button{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid #dde5de;background:#fff;border-radius:15px;padding:11px 13px;min-height:54px;cursor:pointer;color:var(--ink);font-size:16px;line-height:1.4;transition:border-color .15s,background .15s,transform .1s}
.secenekler button:active{transform:scale(.99)}
.secenekler button .h{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:#eef3ef;color:var(--green);flex:none}
.secenekler button.secili{border-color:var(--green);background:#f1f7f3}
.secenekler button.secili .h{background:var(--green);color:#fff}
.secenekler button.dogru{border-color:#2f8f5b;background:#e9f6ee}
.secenekler button.dogru .h{background:#2f8f5b;color:#fff}
.secenekler button.yanlis{border-color:var(--coral);background:#fdeee9}
.secenekler button.yanlis .h{background:var(--coral);color:#fff}
.secenekler button.soluk{opacity:.55}
.secenekler button:disabled{cursor:default}
.sonuc{border-radius:16px;padding:13px 14px;margin-top:14px;font-weight:700;display:flex;gap:12px;align-items:flex-start;animation:acil .3s}
.sonuc .ik{font-size:26px;line-height:1}
.sonuc.d{background:#e9f6ee;color:#1d6a41}
.sonuc.y{background:#fdeee9;color:#9c3a24}
.sonuc small{display:block;font-weight:600;color:inherit;opacity:.9;margin-top:3px;font-size:14px}
.neden{margin-top:10px;background:#fff8ec;border:1px solid #f0d9b5;border-radius:12px;padding:10px 12px;font-size:15px;color:var(--ink)}
.neden b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--copper);margin-bottom:3px}
.cozum-dj{margin-top:14px;border-top:2px dashed #e3e9e4;padding-top:12px}
.cozum-dj h4{margin:0 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--green)}
.cozum-dj ol{margin:0;padding:0;list-style:none;counter-reset:a}
.cozum-dj li{counter-increment:a;position:relative;padding:10px 12px 10px 44px;background:#f6f9f7;border-radius:12px;margin-bottom:8px;animation:acil .3s}
.cozum-dj li::before{content:counter(a);position:absolute;left:10px;top:9px;width:24px;height:24px;border-radius:8px;background:var(--green);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center}
.cozum-dj li.senin{background:#fff4e6;outline:1.5px solid #f0d9b5}
.cozum-dj li p{margin:0 0 4px}
.cozum-dj li p:last-child{margin:0}
.rubrik li{display:flex;gap:10px;align-items:flex-start;padding-left:12px}
.rubrik li::before{display:none}
.rubrik input{width:22px;height:22px;accent-color:#2f8f5b;flex:none;margin-top:2px}
.rubrik .pn{margin-left:auto;font-weight:800;color:var(--green);white-space:nowrap;flex:none}
.puan-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;font-weight:800}
.q-alt{display:flex;gap:10px;margin-top:12px}
.q-alt .btn{flex:1}
.q-alt .btn.ince{flex:0 0 auto}
.karalama{margin-top:12px;border-radius:16px;border:1.5px solid #e3e9e4;height:300px;position:relative;overflow:hidden;background-color:#fff;background-image:linear-gradient(#edf1ee 1px,transparent 1px),linear-gradient(90deg,#edf1ee 1px,transparent 1px);background-size:22px 22px}
.karalama .kl-et{position:absolute;left:12px;top:8px;font-size:11px;font-weight:800;letter-spacing:.1em;color:#9aaaa3;text-transform:uppercase;pointer-events:none}
.karalama-arti{display:block;margin:6px auto 0;border:0;background:none;color:var(--ui-muted);font-weight:800;cursor:pointer;font-size:13.5px}
.kilit-soru{text-align:center;padding:30px 16px}
.kilit-soru .ik{font-size:40px}

/* mürekkep katmanı */
.murekkep-host{position:relative}
svg.murekkep{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:3}
body.kalem-acik .murekkep-host{cursor:crosshair}
body.kalem-acik .murekkep-host.dokunmatik-kalem{touch-action:none}
.kalem-bar[hidden]{display:none!important}
.kalem-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:4px;background:#173430;color:#fffef4;border-radius:18px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100% - 20px);overflow-x:auto}
.kalem-bar button{border:0;background:transparent;color:inherit;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.kalem-bar button.on{background:rgba(255,254,244,.18)}
.kalem-bar button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kalem-bar .renk{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.7)}
.kalem-bar .ayr{width:1px;height:26px;background:rgba(255,255,255,.2);margin:0 3px;flex:none}
.kalem-bar .yazi{width:auto;padding:0 10px;font-weight:800;font-size:12.5px;white-space:nowrap}
.kalem-bar .yazi.on{background:#fffef4;color:#173430}

/* deneme */
.cips.buyuk .cip{padding:9px 14px;font-size:14.5px}
.den-konu{display:grid;gap:6px;margin-top:8px}
.den-konu label{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--ui-card);border:1px solid var(--ui-line);font-weight:700;font-size:14.5px;cursor:pointer}
.den-konu input{width:20px;height:20px;accent-color:var(--green)}
.sure{font-variant-numeric:tabular-nums}
.sure.az{color:#ffd2c4}
.sonuc-ozet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.sonuc-ozet div{background:var(--ui-card);border:1px solid var(--ui-line);border-radius:14px;padding:10px;text-align:center}
.sonuc-ozet b{display:block;font-size:26px;font-weight:800}
.sonuc-ozet span{font-size:12px;font-weight:700;color:var(--ui-muted)}
.cubuk{height:10px;background:var(--ui-line);border-radius:999px;overflow:hidden}
.cubuk i{display:block;height:100%;background:var(--renk,var(--green));border-radius:999px}
.kb-sat{display:grid;gap:5px;margin-bottom:12px}
.kb-sat div:first-child{display:flex;justify-content:space-between;font-size:14px;font-weight:700}

/* ilerleme ve rozetler */
.rozetler{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.rozet{background:var(--ui-card);border:1px solid var(--ui-line);border-radius:16px;padding:12px;text-align:center}
.rozet .ik{font-size:30px;line-height:1.1}
.rozet b{display:block;font-size:13.5px;margin-top:4px}
.rozet small{display:block;font-size:11.5px;color:var(--ui-muted);font-weight:600}
.rozet.yok{opacity:.38;filter:grayscale(1)}
.ayar-sat{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px solid var(--ui-line);font-weight:700}
.ayar-sat:last-child{border-bottom:0}
.dugme-a{appearance:none;width:48px;height:28px;border-radius:999px;background:var(--ui-line);position:relative;cursor:pointer;flex:none;transition:background .2s}
.dugme-a::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.dugme-a:checked{background:var(--green)}
.dugme-a:checked::after{left:23px}

/* konfeti, tost, XP uçuşu */
#konfeti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
#konfeti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:dus 1.3s ease-in forwards}
@keyframes dus{to{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:.9}}
#tost{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:#173430;color:#fffef4;padding:10px 16px;border-radius:14px;font-weight:800;font-size:14.5px;opacity:0;pointer-events:none;transition:all .3s;z-index:60;max-width:calc(100% - 32px);text-align:center}
#tost.goster{opacity:1;transform:translate(-50%,0)}
.bos{text-align:center;color:var(--ui-muted);padding:40px 16px;font-weight:600}
.bos .ik{font-size:44px;margin-bottom:6px}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

/* Yan çevrilmiş telefon: kısa ekranda üst ve alt çubuklar incelir */
@media (max-height:500px) and (orientation:landscape){
  .dj-ust{min-height:46px;padding-top:calc(4px + env(safe-area-inset-top));padding-bottom:4px}
  .dj-ust .geri,.dj-ust .ust-btn{height:36px}
  .dj-ust .bas small{display:none}
  .dj-nav a span{display:none}
  .dj-nav a{padding:3px 0}
  .sekmeler{top:calc(46px + env(safe-area-inset-top))}
}

/* bağlam setleri */
.baglam-dj{background:#fdfaf4;border:1.5px solid #e2d3bd;border-radius:16px;padding:12px 14px;margin-bottom:14px}
.baglam-dj .bg-ust{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--copper);margin-bottom:4px}
.baglam-dj h4{font-family:'Fraunces',serif;font-weight:600;font-size:18px;margin:0 0 6px;color:var(--ink)}
.baglam-dj table.vt{font-size:14px;margin:8px 0;display:block;overflow-x:auto;max-width:100%}
.bg-kaynak{font-size:12px;color:#6b7c75;font-style:italic;margin-top:4px}
.sl-baslik{font-weight:800;font-size:14px;color:var(--copper);margin:10px 2px 0;display:flex;flex-direction:column}
.sl-baslik small{font-weight:600;color:var(--ui-muted);font-size:12px}
.sl.set{border-left:4px solid #e2d3bd}

/* Çok sütunlu bağlam tabloları: dar kâğıtta çevrilmiş hâli */
.baglam-dj .tb-dar{display:none}
@container (max-width:560px){ .baglam-dj .tb-genis{display:none} .baglam-dj .tb-dar{display:block} }

.hero-ad{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.8;margin-bottom:6px}
/* Uzun satır içi formüller telefonda taşmasın: yalnızca "=" sonrasında satır kırılabilir. */
.nw .kr{white-space:normal}
.secenekler button{min-width:0}.secenekler button>span:last-child{min-width:0;overflow-wrap:anywhere}

/* ---- Etkileşimli türler: eşleştir, sınıfla, sırala, mini oyun, kavram kartları ---- */
.q-bas .tur{background:#efeaf7;color:#5b3f8c}
.etk{margin-top:12px;--r0:#2e6f95;--r1:#aa693e;--r2:#6b4fa0;--r3:#23784a;--r4:#c0392b;--r5:#8a6d0b}
.etk-ip{font-size:13.5px;color:#5c6f68;margin:0 0 10px!important;font-weight:600}
.etk button{font:inherit;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
.etk button:focus-visible,.kc:focus-visible{outline:3px solid var(--copper);outline-offset:2px}
.etk button:disabled{cursor:default}
.es-kol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@container (max-width:300px){ .es-kol{grid-template-columns:1fr} }
.es-sut{display:grid;gap:8px;align-content:start}
.es-o{display:flex;align-items:center;gap:9px;text-align:left;border:2px solid #dde5de;background:#fff;border-radius:14px;padding:9px 10px;min-height:52px;font-size:15px;line-height:1.35;min-width:0;transition:border-color .15s,background .15s}
.es-o .es-m{min-width:0;overflow-wrap:break-word;hyphens:auto}
/* Dar kâğıtta numara rozeti köşeye taşınır: metin bütün genişliği kullanır, sözcükler bölünmez. */
@container (max-width:380px){ .es-kol{gap:12px} .es-o{position:relative;padding:17px 10px 10px 12px;font-size:15px;min-height:56px} .es-r{position:absolute;left:-7px;top:-8px;width:24px;height:24px;font-size:13px;border-radius:8px;box-shadow:0 0 0 2px #fff} .es-sut:last-child .es-o:not([class*=" r"]) .es-r{display:none} .es-sut{gap:12px} }
.es-r{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:14px;background:#eef3ef;color:#5c6f68;flex:none;border:2px dashed transparent}
.es-sut:last-child .es-o:not([class*=" r"]) .es-r{background:transparent;border-color:#cbd6ce}
.es-o.secili{border-color:var(--green);background:#f1f7f3;box-shadow:0 0 0 3px rgba(36,79,64,.15)}
.es-o.secili .es-r{background:var(--green);color:#fff}
.es-o.r0{--c:var(--r0)}.es-o.r1{--c:var(--r1)}.es-o.r2{--c:var(--r2)}.es-o.r3{--c:var(--r3)}.es-o.r4{--c:var(--r4)}.es-o.r5{--c:var(--r5)}
.es-o[class*=" r"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,#fff)}
.es-o[class*=" r"] .es-r{background:var(--c);color:#fff;border-color:var(--c)}
.etk-sonuc{display:grid;gap:8px}
.es-s{display:flex;align-items:flex-start;gap:10px;border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.4}
.es-s > div{flex:1;min-width:0;overflow-wrap:anywhere}
.es-s.d{background:#e9f6ee}.es-s.y{background:#fdeee9}
.es-s .ik{font-weight:800;font-size:18px;line-height:1.2;flex:none}
.es-s.d .ik{color:#23784a}.es-s.y .ik{color:#b8452c}
.es-s small{display:block;font-weight:700;color:#1d6a41;margin-top:2px;font-size:13.5px}
.sn-liste{display:grid;gap:10px}
.sn-sat{border:1.5px solid #e3e9e4;border-radius:14px;padding:10px 12px;display:grid;gap:8px}
.sn-sat.d{border-color:#2f8f5b;background:#f3faf5}.sn-sat.y{border-color:var(--coral);background:#fdf5f2}
.sn-m{font-weight:700;font-size:15.5px;display:flex;gap:8px;align-items:baseline;overflow-wrap:anywhere;min-width:0}
.sn-sat.d .ik{color:#23784a}.sn-sat.y .ik{color:#b8452c}
.sn-g{display:flex;gap:6px;background:#eef3ef;border-radius:12px;padding:4px}
.sn-g button{flex:1 1 0;min-width:0;border:0;background:transparent;border-radius:9px;padding:9px 8px;font-size:14px;font-weight:700;line-height:1.25;min-height:42px;overflow-wrap:anywhere;color:#3d524b}
.sn-g button.on{background:var(--green);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.sn-g button.dogru{background:#2f8f5b;color:#fff}
.sn-g button.yanlis{background:var(--coral);color:#fff}
.sn-g button.olmali{background:#fff;color:#1d6a41;outline:2px dashed #2f8f5b;outline-offset:-2px}
.sn-g.uzun{flex-direction:column}
.sn-dg{font-weight:700;color:#1d6a41;font-size:13.5px}
@container (min-width:560px){
  .sn-sat{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:center}
  .sn-g.uzun{flex-direction:row}
  .sn-dg{grid-column:2}
}
.sr-liste{display:grid;gap:8px}
.sr-o{display:flex;align-items:center;gap:11px;text-align:left;border:2px solid #dde5de;background:#fff;border-radius:14px;padding:10px 12px;min-height:52px;font-size:15px;line-height:1.4;width:100%}
.sr-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;border:2px dashed #cbd6ce;color:var(--green);flex:none}
.sr-o.on{border-color:var(--green);background:#f1f7f3}
.sr-o.on .sr-n{background:var(--green);border:2px solid var(--green);color:#fff}
.es-s .sr-n{width:26px;height:26px;font-size:13.5px;border-style:solid;background:#fff}
.etk-arac{display:flex;justify-content:flex-end;margin-top:8px}
.etk-arac .btn{padding:7px 12px;font-size:13.5px}
.btn.ince{padding:8px 12px}
.etk.bitti{animation:acil .3s}
/* not içi mini oyun */
.n-oyun-dj{border:2px dashed #c9b8e4;border-radius:18px;padding:13px 13px 6px;background:#fbf9fe}
.n-oyun-dj .na-etk.mor{color:#5b3f8c}
.n-oyun-dj > p{margin:0 0 4px}
.n-oyun-dj .sonuc{margin-top:12px}
/* kavram kartları (dokununca 3B çevrilir) */
.kt-bas{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.kt-bas h3{margin:0!important}
.kt-bas .btn{flex:none;font-size:13px;padding:7px 11px}
.n-kartlar-dj > .dip{margin:0 0 8px}
.kc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px;align-items:start}
@container (min-width:600px){ .kc-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
@container (max-width:300px){ .kc-grid{grid-template-columns:1fr} }
.kc{border:0;background:none;padding:0;text-align:left;font:inherit;color:var(--ink);cursor:pointer;perspective:900px;display:grid;border-radius:16px;min-width:0}
.kc-ic{display:grid;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;min-height:118px}
.kc.acik .kc-ic{transform:rotateY(180deg)}
.kc-y{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0;overflow-wrap:break-word}
.kc-on{background:linear-gradient(145deg,#2f6a55,var(--green));color:#fffef4;justify-content:center;box-shadow:0 3px 10px rgba(20,40,34,.18)}
.kc-on b{font-family:'Fraunces',serif;font-weight:600;font-size:19px;line-height:1.2}
.kc-on small{font-size:12.5px;opacity:.85;font-weight:600}
.kc-on em{font-style:normal;font-size:11.5px;font-weight:800;letter-spacing:.06em;opacity:.7;margin-top:auto;padding-top:6px}
.kc-arka{transform:rotateY(180deg);background:#fff;border:2px solid #cfe0d6;font-size:14.5px;line-height:1.6}
.kc-arka b{color:var(--green);font-size:13px;letter-spacing:.02em}
/* Kart boyu görünen yüze göre: kapalıyken ön yüz, açıkken açıklama belirler. */
.kc-ic{position:relative}
.kc:not(.acik) .kc-arka{position:absolute;inset:0;overflow:hidden}
.kc.acik .kc-on{position:absolute;inset:0}
@media (prefers-reduced-motion: reduce){ .kc-ic{transition:none} }
/* Süreli konu testi */
.kt-kart{border-color:var(--copper)}
.kt-kart .kt-ik{font-size:26px;line-height:1}
.kt-kart small:last-of-type{display:block;margin-top:2px}
.kt-giris{text-align:center}
.kt-giris .kt-buyuk{font-size:40px;line-height:1.1}
.kt-giris h2{margin:6px 0 8px;font-size:20px}
.kt-giris p{margin:6px 0}
.kt-sure-kart{text-align:center}
.kt-sure-buyuk{font-size:44px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0}
.kt-kiyas b{display:block;margin-bottom:4px}
.kt-kiyas p{margin:0;font-size:14.5px;line-height:1.5}
.kt-kiyas p b{display:inline;margin:0}
.kt-uzun{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--copper);border-radius:99px;padding:1px 7px;margin-left:4px;vertical-align:1px}
.kt-cubuk{display:block;height:5px;border-radius:9px;background:var(--ui-line);margin-top:5px;overflow:hidden}
.kt-cubuk i{display:block;height:100%;background:var(--copper);border-radius:9px}

/* 3B görünümlü çizimler */
.kc-on b.u1{font-size:16px}.kc-on b.u2{font-size:14px}
.kc-res{display:block;margin:-4px -4px 6px}
.kc-res svg{display:block;width:100%;height:auto;max-width:none!important;border-radius:11px}
.blk-res{margin:2px 0 10px}
.blk-res svg{display:block;width:100%;max-width:440px!important;height:auto;margin:0 auto;border-radius:14px}
.efk-res{margin:10px 0 2px}
.efk-res svg{display:block;width:100%;max-width:300px!important;height:auto;margin:0 auto;border-radius:12px}

/* ---- TYT: çözümlü örnek (uygulama) ---- */
.n-cozumlu-dj{border:1.5px solid #cfe0ea;border-radius:16px;padding:14px 14px 12px;margin:14px 0;background:#fbfdfe}
.n-cozumlu-dj .cz-bas{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px}
.n-cozumlu-dj .cz-bas .na-etk{margin:0 4px 0 0}
.n-cozumlu-dj .secenekler{margin-top:10px}
.n-cozumlu-dj .cz-yon{font-size:13.5px;color:#4b6059;margin:10px 0 0}
.n-cozumlu-dj .btn-sat{margin-top:10px}
.n-cozumlu-dj .cz-ip,.n-cozumlu-dj .cz-tz{border-radius:12px;padding:9px 12px;margin-top:10px;font-size:14.5px}
.n-cozumlu-dj .cz-ip{background:#eef5fb;border:1px solid #cfe0ea}
.n-cozumlu-dj .cz-tz{background:#fff4e6;border:1px solid #f0d9b5}
.n-cozumlu-dj .cz-ip > b,.n-cozumlu-dj .cz-tz > b{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.n-cozumlu-dj .cz-ip > b{color:var(--blue)}.n-cozumlu-dj .cz-tz > b{color:var(--copper)}
.n-cozumlu-dj .cz-ip p,.n-cozumlu-dj .cz-tz p{margin:0}
.na-etk.mavi{color:var(--blue)}

/* ---- TYT denemeleri ---- */
.tyt-kart .kt-ik{font-size:26px;line-height:1}
.tyt-bilgi p{margin:4px 0 0;font-size:14px;color:var(--ui-muted);font-weight:600}
.sl .no.tyt-no{width:auto;min-width:44px;padding:0 7px;font-size:13px}
.tyt-net{text-align:center}
.tyt-net .tn-buyuk{font-size:38px;font-weight:800;line-height:1.1}
.tyt-net .tn-buyuk small{font-size:16px;color:var(--ui-muted);font-weight:700}
.tyt-net .tn-ip{margin-top:8px;font-size:13px;font-weight:600;background:#fff4e6;color:#7a4a22;border-radius:10px;padding:7px 10px}
.tyt-yk{align-items:flex-start}
.tyt-yk .sl-m b{white-space:normal}
.tyt-yk .sl-m small a{color:inherit}
.tyt-git{flex:none;align-self:center;font-size:12.5px;font-weight:800;color:var(--copper);text-decoration:none;border:1.5px solid #f0d9b5;border-radius:999px;padding:5px 10px}
.tyt-git.pasif{color:var(--ui-muted);border-color:var(--ui-line)}
.tyt-konu-et{display:inline-block;font-size:12px;font-weight:800;color:var(--blue);background:#eef5fb;border-radius:999px;padding:3px 10px;margin-bottom:8px}
.net-grafik svg{width:100%;height:auto;display:block}
.net-grafik .ng-iz{stroke:var(--ui-line);stroke-width:1}
.net-grafik .ng-iz.sifir{stroke:#9fb3a8}
.net-grafik .ng-e{font-size:11px;fill:var(--ui-muted);font-weight:700;font-family:'Plus Jakarta Sans',sans-serif}
.net-grafik .ng-cizgi{fill:none;stroke:var(--blue);stroke-width:2.2;stroke-linejoin:round}
.net-grafik .ng-n{fill:var(--ui-card);stroke:var(--blue);stroke-width:2}
.net-grafik .ng-n.son{fill:var(--copper);stroke:var(--copper)}
.net-grafik .ng-d{font-size:11.5px;font-weight:800;fill:var(--ui-text);font-family:'Plus Jakarta Sans',sans-serif}
.net-grafik .ng-d.son{fill:var(--copper)}
.ng-ozet{display:flex;justify-content:space-around;gap:8px;margin-top:6px;font-size:13px;font-weight:700;color:var(--ui-muted)}
.ng-ozet b{color:var(--ui-text);font-size:15px}
.onizleme-bant{position:fixed;left:8px;bottom:8px;z-index:99;background:#7a3e00;color:#fff;font:800 10px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:.12em;padding:4px 8px;border-radius:8px;pointer-events:none;opacity:.8}
.dj .onizleme-bant{bottom:calc(76px + env(safe-area-inset-bottom))}

/* 3B animasyon bloğu (tur:'anim3b') */
.n-a3b{background:#fff;border:1px solid #dbe5ea;border-radius:16px;padding:14px 14px 12px}
.a3b-sahne{position:relative;aspect-ratio:1/1;width:100%;max-width:560px;border-radius:14px;overflow:hidden;margin:10px auto 10px;background:radial-gradient(ellipse at 50% 40%,#fbfcfd 0%,#e7edf1 55%,#c4cfd6 100%);touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.a3b-poster,.a3b-tuval{position:absolute;inset:0;width:100%;height:100%;display:block}
.a3b-poster{object-fit:cover}

(function () {

function mt(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/_\{([^}]*)\}/g, '<tspan baseline-shift="sub" font-size="72%">$1</tspan>')

function T(x, y, s, o = {}) {

}

/* ---------- küçük grafik yardımcısı ---------- */
function miniGraph(o) {
  // o: x,y (sol üst), w,h, yMin,yMax, tMax, yLabel, fn (t->y) veya lines, label
  const { x, y, w, h } = o;
  const ox = x + 26, right = x + w - 14, top = y + 14, bot = y + h - 6;
  const sy = v => top + (o.yMax - v) / (o.yMax - o.yMin) * (bot - top);
  const sx = t => ox + t / o.tMax * (right - 18 - ox);
  const zy = sy(0);
  let s = '';
  if (o.panel !== false) s += `<rect class="bg" x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="#f6f9f7"/>`;
  s += o.under ? o.under(sx, sy) : '';
  // eksenler
  s += `<line x1="${ox}" y1="${bot}" x2="${ox}" y2="${top + 4}" stroke="${P.ink}" stroke-width="1.4"/>` +
       `<polygon points="${ox},${top - 2} ${ox - 3.8},${top + 7} ${ox + 3.8},${top + 7}" fill="${P.ink}"/>`;
  s += `<line x1="${ox}" y1="${zy}" x2="${right - 4}" y2="${zy}" stroke="${P.ink}" stroke-width="1.4"/>` +
       `<polygon points="${right + 2},${zy} ${right - 7},${zy - 3.8} ${right - 7},${zy + 3.8}" fill="${P.ink}"/>`;
  s += T(ox - 6, top + 4, o.yLabel, { size: 13, anchor: 'end', weight: 700 });
  s += T(right + 1, zy + 17, 't', { size: 13, anchor: 'end', weight: 700, italic: true });
  if (o.roman) s += T(x + w - 10, y + 22, o.roman, { size: 14, anchor: 'end', weight: 800, fill: P.copper });
  // eğri
  if (o.fn) {
    let d = '';
    for (let i = 0; i <= 60; i++) { const t = o.tMax * i / 60; d += (i ? 'L' : 'M') + sx(t).toFixed(1) + ' ' + sy(o.fn(t)).toFixed(1); }
    s += `<path d="${d}" fill="none" stroke="${o.color || P.blue}" stroke-width="2.6" stroke-linecap="round"/>`;
  }
  s += o.over ? o.over(sx, sy) : '';
