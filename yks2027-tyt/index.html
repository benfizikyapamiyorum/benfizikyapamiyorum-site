    let s = `<rect class="bg" x="0" y="0" width="300" height="330" rx="14" fill="url(#${u}dawn)"/>`;
    // peribacaları
    const chim = (x, h, w) => `<path d="M${x - w} ${gy} L${x - w * 0.35} ${gy - h} L${x + w * 0.35} ${gy - h} L${x + w} ${gy} Z" fill="#e3c79d"/><ellipse cx="${x}" cy="${gy - h - 3}" rx="${w * 0.55}" ry="7" fill="#b7936a"/>`;
    s += `<g class="bg" opacity=".85">${chim(30, 70, 22)}${chim(250, 90, 24)}${chim(285, 55, 16)}${chim(210, 45, 15)}</g>`;
    s += `<rect class="bg" x="0" y="${gy}" width="300" height="28" fill="url(#${u}soil)"/>`;
    // balon
    const bx = 150, by = 78;
    const env = `M${bx} ${by - 62} C${bx + 60} ${by - 62} ${bx + 66} ${by + 6} ${bx + 34} ${by + 46} L${bx + 14} ${by + 70} L${bx - 14} ${by + 70} L${bx - 34} ${by + 46} C${bx - 66} ${by + 6} ${bx - 60} ${by - 62} ${bx} ${by - 62} Z`;
    s += `<clipPath id="${u}env"><path d="${env}"/></clipPath>`;
    const cols = ['#d9573b', '#f2b134', '#244f40', '#f2b134', '#d9573b', '#f2b134', '#244f40', '#f2b134', '#d9573b'];
    s += `<g clip-path="url(#${u}env)">` + cols.map((c, i) => `<rect x="${bx - 66 + i * 14.7}" y="${by - 64}" width="15" height="140" fill="${c}"/>`).join('') +
      `<rect x="${bx - 70}" y="${by - 64}" width="140" height="140" fill="url(#${u}b_copper)" opacity=".18"/></g>`;
    s += `<path d="${env}" fill="none" stroke="#7a3a22" stroke-width="1.2"/>`;
    s += `<g stroke="#6b5a45" stroke-width="1"><line x1="${bx - 13}" y1="${by + 70}" x2="${bx - 11}" y2="${by + 86}"/><line x1="${bx + 13}" y1="${by + 70}" x2="${bx + 11}" y2="${by + 86}"/></g>`;
    s += `<rect x="${bx - 13}" y="${by + 86}" width="26" height="16" rx="3" fill="#a9773f" stroke="#6f4b22" stroke-width="1"/>`;
    s += `<g stroke="#6f4b22" stroke-width=".6">` + [1, 2, 3].map(i => `<line x1="${bx - 13 + i * 6.5}" y1="${by + 87}" x2="${bx - 13 + i * 6.5}" y2="${by + 101}"/>`).join('') + `</g>`;
    s += arrow(bx + 58, by + 70, bx + 58, by + 24, { color: P.coral, w: 2.4 });
    s += T(bx + 68, by + 50, '5 m/s', { size: 12.5, weight: 800, fill: P.coral });
    // kum torbası
    const sy0 = by + 104;
    s += `<path d="M${bx - 8} ${sy0} Q${bx} ${sy0 - 8} ${bx + 8} ${sy0} Q${bx + 11} ${sy0 + 14} ${bx} ${sy0 + 16} Q${bx - 11} ${sy0 + 14} ${bx - 8} ${sy0} Z" fill="url(#${u}sack)" stroke="#7c6536" stroke-width="1"/>`;
    s += T(bx - 16, sy0 + 12, 'kum torbası', { size: 11, weight: 700, anchor: 'end', fill: P.ink2 });
    s += dashLine(bx, sy0 + 22, bx, gy - 2, '#8a7a66', '5 4', 1.3);
    s += dimV(262, sy0 + 8, gy, '30 m', { side: 'left', size: 13.5 });
    return svg(300, 330, s, u, 70);
  },

  jonglor(u) {
    const Y = h => 250 - h * 2.25; // h: 0..100 (tepe = 100 birim)
    const L = 112, R = 188, top = Y(100), hl = Y(58);
    let s = `<rect class="bg" x="0" y="0" width="300" height="290" rx="14" fill="#f3f7fa"/>`;
    s += `<path d="M${L} ${Y(0)} V${top + 26} Q${L} ${top} ${(L + R) / 2} ${top} Q${R} ${top} ${R} ${top + 26} V${Y(0)}" fill="none" stroke="#9fb3c2" stroke-width="1.4" stroke-dasharray="5 4"/>`;
    s += `<line x1="62" y1="${hl}" x2="250" y2="${hl}" stroke="${P.copper}" stroke-width="1.8" stroke-dasharray="8 5"/>`;
    s += T(254, hl - 8, 'işaret', { size: 11, weight: 700, fill: P.copper, anchor: 'end' });
    s += ball(u, L, hl, 8, 'green') + ball(u, R, hl, 8, 'green');
    s += T(L - 14, hl + 18, 't anında', { size: 11.5, weight: 700, anchor: 'end' }) + T(R + 14, hl + 18, '3t anında', { size: 11.5, weight: 700 });
    s += `<circle cx="${(L + R) / 2}" cy="${top}" r="8" fill="none" stroke="#3f8a67" stroke-width="1.4" stroke-dasharray="3 3"/>`;
    s += T((L + R) / 2, top - 14, 'tepe', { size: 11, anchor: 'middle', weight: 700, fill: P.ink2 });
    s += `<line x1="84" y1="${Y(0)}" x2="216" y2="${Y(0)}" stroke="${P.ink2}" stroke-width="1.4"/>`;
    s += T(150, Y(0) + 18, 'atış noktası', { size: 11, anchor: 'middle', weight: 700, fill: P.ink2 });
    s += dimV(46, hl, Y(0), 'h', { side: 'left', size: 14 });
    s += dimV(282, top, Y(0), '', { side: 'left' }) + T(282, top - 10, 'h_{max} = ?', { size: 12.5, anchor: 'end', weight: 700 });
    return svg(300, 290, s, u, 64);
  },

  fiskiye(u) {
    const base = 282, Y = h => base - h * 33.6;
    let s = `<rect class="bg" x="0" y="0" width="300" height="330" rx="14" fill="url(#${u}sky)"/>`;
    s += `<rect class="bg" x="0" y="296" width="300" height="34" fill="url(#${u}grass)"/>`;
    const tree = (x, h) => `<rect x="${x - 3}" y="${296 - h * 0.45}" width="6" height="${h * 0.45}" fill="#7a5a3a"/><ellipse cx="${x}" cy="${296 - h * 0.62}" rx="${h * 0.26}" ry="${h * 0.3}" fill="#6fa25a"/><ellipse cx="${x - h * 0.08}" cy="${296 - h * 0.7}" rx="${h * 0.14}" ry="${h * 0.14}" fill="#86b76e" opacity=".8"/>`;
    s += `<g class="bg">${tree(34, 110)}${tree(272, 130)}</g>`;
    // havuz
    s += `<ellipse cx="150" cy="298" rx="78" ry="14" fill="url(#${u}stone)" stroke="#9b907c" stroke-width="1"/>`;
    s += `<ellipse cx="150" cy="294" rx="66" ry="9" fill="url(#${u}water)"/>`;
    // jet (tepede kalınlaşan)
    const tp = Y(7.2);
    s += `<path d="M146 ${base} C147 ${base - 120} 145 ${tp + 60} 140 ${tp + 14} Q140 ${tp - 4} 150 ${tp - 4} Q160 ${tp - 4} 160 ${tp + 14} C155 ${tp + 60} 153 ${base - 120} 154 ${base} Z" fill="url(#${u}jet)" stroke="#6fb4dc" stroke-width=".8"/>`;
    [[136, tp + 26], [164, tp + 30], [132, tp + 50], [167, tp + 58], [139, tp + 80], [161, tp + 90]].forEach(([x, y]) => { s += `<circle cx="${x}" cy="${y}" r="1.8" fill="#5aa9dc"/>`; });
    s += `<rect x="143" y="${base - 2}" width="14" height="8" rx="2" fill="url(#${u}metalV)" stroke="#7d868e" stroke-width=".7"/>`;
    s += arrow(186, base - 6, 186, base - 58, { color: P.coral, w: 2.4 });
    s += T(194, base - 30, 'ϑ_0 = 12 m/s', { size: 12, weight: 800, fill: P.coral });
    const y54 = Y(5.4);
    s += `<line x1="92" y1="${y54}" x2="226" y2="${y54}" stroke="${P.copper}" stroke-width="1.6" stroke-dasharray="7 5"/>`;
    s += dimV(84, y54, base, '5,4 m', { side: 'left', size: 13 });
    return svg(300, 330, s, u, 64);
  }
};

/* balkon3: düzgün sürüm */
FIGS.balkon3 = function (u) {
  const gy = 262;
  let s = `<rect class="bg" x="0" y="0" width="340" height="290" rx="14" fill="url(#${u}sky)"/>`;
  s += `<rect class="bg" x="0" y="${gy}" width="340" height="28" fill="url(#${u}grass)"/>`;
  s += `<rect x="18" y="18" width="70" height="${gy - 18}" fill="url(#${u}facade)" stroke="#bfae92" stroke-width="1"/>`;
  for (let r = 0; r < 4; r++) s += `<rect x="34" y="${130 + r * 32}" width="38" height="22" rx="2" fill="url(#${u}glass)" stroke="#9fb3c2" stroke-width=".8"/>`;
  s += `<rect x="36" y="34" width="34" height="52" rx="2" fill="#8fb3c9" stroke="#7a95a7" stroke-width=".8"/>`;
  s += `<rect x="88" y="92" width="150" height="10" fill="#d4c9b7" stroke="#a89a82" stroke-width=".8"/>`;
  s += `<g stroke="#8a7f70" stroke-width="1.6">` + [0, 1, 2, 3, 4, 5, 6, 7].map(i => `<line x1="${96 + i * 19}" y1="92" x2="${96 + i * 19}" y2="62"/>`).join('') + `</g>`;
  s += `<line x1="90" y1="62" x2="236" y2="62" stroke="#6f665a" stroke-width="3" stroke-linecap="round"/>`;
  const bY = 50;
  s += ball(u, 256, bY, 8, 'blue') + ball(u, 284, bY, 8, 'green') + ball(u, 312, bY, 8, 'copper');
  s += T(256, bY - 16, 'A', { size: 13, anchor: 'middle', weight: 800 }) + T(284, bY + 64, 'B', { size: 13, anchor: 'middle', weight: 800 }) + T(312, bY + 30, 'C', { size: 13, anchor: 'middle', weight: 800 });
  s += arrow(284, bY + 11, 284, bY + 46, { color: P.coral, w: 2.3 }) + T(294, bY + 36, 'ϑ', { size: 12.5, weight: 800, fill: P.coral });
  s += arrow(312, bY - 11, 312, bY - 44, { color: P.coral, w: 2.3 }) + T(322, bY - 26, 'ϑ', { size: 12.5, weight: 800, fill: P.coral });
  s += T(256, bY + 26, 'ϑ_0 = 0', { size: 10.5, anchor: 'middle', weight: 700, fill: '#1d5a86' });
  s += dimV(334, bY, gy, 'h', { side: 'left', size: 14 });
  return svg(340, 290, s, u, 76);
};

window.BFY_FIG = function (key) {
  const f = FIGS[key];
  if (!f) return '';
  return f('u' + (++UID) + '_');
};
/* Konu dosyalarının kullanacağı ortak araçlar */
window.BFY_FIGLIB = { P, FONT, mt, T, arrow, dimV, ball, defs, svg, dashLine, miniGraph };
window.BFY_FIG_EKLE = function (key, fn) {
  if (FIGS[key]) throw new Error('Şekil anahtarı zaten var: ' + key);
  FIGS[key] = fn;
};
window.BFY_FIG_VAR = key => !!FIGS[key];
})();

</script>
<script>
/* ============================================================
   BFY — 3B görünümlü (izometrik) çizim kütüphanesi
   Kartlar, hikâyeler, tanımlar, efsaneler ve deneyler için küçük sahneler.
   Işık sol üstten gelir: üst yüz açık, sol yüz orta, sağ yüz koyu.
   Kullanım (konu figs.js içinde):
     const I = window.BFY_ISO;
     BFY_FIG_EKLE('k911_kart_mekanik', u => I.sahne(u, s => { ... }, { w:160, h:110 }));
   Her çizim yalnızca SVG'dir; internetsiz çalışır, baskıda da keskin kalır.
   ============================================================ */
(function () {
const { FONT, mt } = window.BFY_FIGLIB;

/* ---------- renk araçları ---------- */
const RENK = {
  yesil: '#3f8a67', koyu: '#244f40', bakir: '#c9793f', mercan: '#d9573b', gok: '#3b8fc8', lacivert: '#2b4a8b',
  gunes: '#e7a93b', mor: '#7b5bc4', gri: '#9aa5ad', krem: '#f3ead6', ahsap: '#c9955a', cam: '#bfe2f2',
  metal: '#b8c0c7', beyaz: '#f7f8f6', siyah: '#2a3330', kirmizi: '#d24b3e', mavi: '#2f7fb8', turuncu: '#ee8a3a',
  pembe: '#e58aa8', sari: '#f2c94c', zemin: '#e9efe9'
};
function hex2rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgb2hex(r, g, b) { return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
/* k > 0 açar (beyaza), k < 0 koyulaştırır (siyaha) */
function ton(h, k) { const [r, g, b] = hex2rgb(RENK[h] || h); return k >= 0 ? rgb2hex(r + (255 - r) * k, g + (255 - g) * k, b + (255 - b) * k) : rgb2hex(r * (1 + k), g * (1 + k), b * (1 + k)); }
const r1 = v => Math.round(v * 10) / 10;

/* ---------- izometrik izdüşüm ----------
   Dünya: x sağ-ön, y sol-ön, z yukarı. Ekran: (ox, oy) orijin. */
function Izo(ox, oy, s = 1) {
  const C = Math.cos(Math.PI / 6) * s, S = Math.sin(Math.PI / 6) * s;
  const p = (x, y, z = 0) => [r1(ox + (x - y) * C), r1(oy + (x + y) * S - z * s)];
  const pts = arr => arr.map(a => p(...a).join(',')).join(' ');
  return { p, pts, s, C, S, ox, oy };
}

/* ---------- temel cisimler ---------- */
// Kutu: (x,y,z) köşesinden w (x yönü), d (y yönü), h (yükseklik)
function kutu(I, x, y, z, w, d, h, renk, o = {}) {
  const c = RENK[renk] || renk, cizgi = o.cizgi || ton(c, -0.45), sw = o.sw ?? 0.9;
  const ust = I.pts([[x, y, z + h], [x + w, y, z + h], [x + w, y + d, z + h], [x, y + d, z + h]]);
  const sag = I.pts([[x + w, y, z], [x + w, y + d, z], [x + w, y + d, z + h], [x + w, y, z + h]]);
  const sol = I.pts([[x, y + d, z], [x + w, y + d, z], [x + w, y + d, z + h], [x, y + d, z + h]]);
  let s = `<polygon points="${sol}" fill="${o.sol || ton(c, -0.08)}" stroke="${cizgi}" stroke-width="${sw}" stroke-linejoin="round"/>`;
  s += `<polygon points="${sag}" fill="${o.sag || ton(c, -0.28)}" stroke="${cizgi}" stroke-width="${sw}" stroke-linejoin="round"/>`;
  s += `<polygon points="${ust}" fill="${o.ust || ton(c, 0.28)}" stroke="${cizgi}" stroke-width="${sw}" stroke-linejoin="round"/>`;
  return s;
}
// Zemin plakası: yuvarlatılmış kenarlı ince plaka (sahne tabanı)
function plaka(I, x, y, w, d, renk = '#dfe8e1', kal = 6) {
  return kutu(I, x, y, -kal, w, d, kal, renk, { cizgi: ton(renk, -0.25), sw: 0.8, ust: ton(renk, 0.35) });
}
// Dik silindir: taban merkezi (x,y,z), yarıçap r, yükseklik h
function silindir(I, u, x, y, z, r, h, renk, o = {}) {
  const c = RENK[renk] || renk, id = u + 'cy' + (++silindir.n);
  const [bx, by] = I.p(x, y, z), [tx, ty] = I.p(x, y, z + h);
  const rx = r * I.C * 1.155, ry = r * I.S * 1.155;
  let s = `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${ton(c, 0.05)}"/><stop offset=".35" stop-color="${ton(c, 0.3)}"/><stop offset="1" stop-color="${ton(c, -0.35)}"/></linearGradient></defs>`;
  s += `<path d="M${r1(bx - rx)},${by} L${r1(tx - rx)},${ty} A${r1(rx)},${r1(ry)} 0 0 0 ${r1(tx + rx)},${ty} L${r1(bx + rx)},${by} A${r1(rx)},${r1(ry)} 0 0 1 ${r1(bx - rx)},${by}Z" fill="url(#${id})" stroke="${ton(c, -0.45)}" stroke-width=".9"/>`;
  if (!o.acik) s += `<ellipse cx="${tx}" cy="${ty}" rx="${r1(rx)}" ry="${r1(ry)}" fill="${o.kapak || ton(c, 0.35)}" stroke="${ton(c, -0.45)}" stroke-width=".9"/>`;
  return s;
}
silindir.n = 0;
// Yatay silindir (x ekseni boyunca): merkez (x,y,z), yarıçap r, uzunluk L
function yatSilindir(I, u, x, y, z, r, L, renk) {
  const c = RENK[renk] || renk, id = u + 'ys' + (++silindir.n);
  const a = I.p(x, y, z), b = I.p(x + L, y, z);
  const ry = r, rx = r * 0.5;
  let s = `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${ton(c, 0.35)}"/><stop offset=".5" stop-color="${ton(c, 0.05)}"/><stop offset="1" stop-color="${ton(c, -0.35)}"/></linearGradient></defs>`;
  s += `<path d="M${a[0]},${r1(a[1] - ry)} L${b[0]},${r1(b[1] - ry)} L${b[0]},${r1(b[1] + ry)} L${a[0]},${r1(a[1] + ry)}Z" fill="url(#${id})" stroke="${ton(c, -0.45)}" stroke-width=".9"/>`;
  s += `<ellipse cx="${b[0]}" cy="${b[1]}" rx="${r1(rx)}" ry="${r1(ry)}" fill="${ton(c, 0.2)}" stroke="${ton(c, -0.45)}" stroke-width=".9"/>`;
  return s;
}
// Küre (ekran koordinatı): parlak noktalı, yumuşak gölgeli
function kure(u, cx, cy, r, renk, o = {}) {
  const c = RENK[renk] || renk, id = u + 'k' + (++kure.n);
  let s = `<defs><radialGradient id="${id}" cx="34%" cy="30%" r="78%"><stop offset="0" stop-color="${ton(c, 0.75)}"/><stop offset=".45" stop-color="${ton(c, 0.1)}"/><stop offset="1" stop-color="${ton(c, -0.45)}"/></radialGradient></defs>`;
  if (o.golge !== false) s += `<ellipse cx="${r1(cx + r * 0.15)}" cy="${r1(cy + r * (o.golgeY || 1.05))}" rx="${r1(r * 0.85)}" ry="${r1(r * 0.25)}" fill="#0b1f18" opacity=".14"/>`;
  s += `<circle cx="${r1(cx)}" cy="${r1(cy)}" r="${r1(r)}" fill="url(#${id})"${o.cizgi === false ? '' : ` stroke="${ton(c, -0.5)}" stroke-width=".7"`}/>`;
  return s;
}
kure.n = 0;
// Gölge elipsi (ekran)
const golge = (cx, cy, rx, ry, op = 0.16) => `<ellipse cx="${r1(cx)}" cy="${r1(cy)}" rx="${r1(rx)}" ry="${r1(ry)}" fill="#0b1f18" opacity="${op}"/>`;
// Ekran düzleminde ok
function ok(x1, y1, x2, y2, o = {}) {
  const c = RENK[o.renk] || o.renk || RENK.mercan, w = o.w || 2.4, hl = o.bas || 8, hw = o.basG || 5;
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, bx = x2 - ux * hl, by = y2 - uy * hl;
  return `<line x1="${r1(x1)}" y1="${r1(y1)}" x2="${r1(bx)}" y2="${r1(by)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"${o.kesik ? ` stroke-dasharray="${o.kesik}"` : ''}/><polygon points="${r1(x2)},${r1(y2)} ${r1(bx - uy * hw)},${r1(by + ux * hw)} ${r1(bx + uy * hw)},${r1(by - ux * hw)}" fill="${c}"/>`;
}
// İzometrik düzlemde ok (dünya koordinatı)
function izoOk(I, a, b, o = {}) { const [x1, y1] = I.p(...a), [x2, y2] = I.p(...b); return ok(x1, y1, x2, y2, o); }
// Etiket hapı (ekran)
function etiket(x, y, yazi, o = {}) {
  const size = o.size || 10, w = o.w || Math.max(24, String(yazi).replace(/[_^{}]/g, '').length * size * 0.56 + 12), h = size + 8, c = RENK[o.renk] || o.renk || RENK.koyu;
  const x0 = o.anchor === 'start' ? x : o.anchor === 'end' ? x - w : x - w / 2;
  return `<g><rect x="${r1(x0)}" y="${r1(y - h / 2)}" width="${r1(w)}" height="${h}" rx="${h / 2}" fill="${o.zemin || '#fff'}" stroke="${c}" stroke-width="1" opacity=".96"/><text x="${r1(x0 + w / 2)}" y="${r1(y + size * 0.36)}" font-family="${FONT}" font-size="${size}" font-weight="800" fill="${c}" text-anchor="middle">${mt(yazi)}</text></g>`;
}
// Düz yazı (ekran), beyaz haleli
function yazi(x, y, s, o = {}) {
  const size = o.size || 10, a = o.anchor || 'middle', c = RENK[o.renk] || o.renk || RENK.siyah;
  return `<text x="${r1(x)}" y="${r1(y)}" font-family="${FONT}" font-size="${size}" font-weight="${o.weight || 700}" fill="${c}" text-anchor="${a}" paint-order="stroke" stroke="${o.hale || '#fff'}" stroke-width="${o.haleW ?? 2.6}" stroke-linejoin="round"${o.italic ? ' font-style="italic"' : ''}>${mt(s)}</text>`;
}
// Parıltı / ışın (ekran)
function parilti(cx, cy, r, renk = 'gunes', n = 8) {
  const c = RENK[renk] || renk; let s = '';
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, r0 = r * 0.55; s += `<line x1="${r1(cx + Math.cos(a) * r0)}" y1="${r1(cy + Math.sin(a) * r0)}" x2="${r1(cx + Math.cos(a) * r)}" y2="${r1(cy + Math.sin(a) * r)}" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/>`; }
  return s;
}
// Dalga çizgisi (ekran): (x1,y) -> (x2,y), genlik A, dalga sayısı n
function dalga(x1, y, x2, A, n, renk = 'gok', w = 2.2) {
  const c = RENK[renk] || renk; let d = '';
  for (let i = 0; i <= 60; i++) { const t = i / 60, x = x1 + (x2 - x1) * t; d += (i ? 'L' : 'M') + r1(x) + ',' + r1(y - A * Math.sin(t * n * Math.PI * 2)); }
  return `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
}

/* ---------- hazır nesneler (sahne parçaları) ---------- */
const N = {
  // Basit insan figürü (ekran): ayak noktası (x,y), boy h
  insan(u, x, y, h = 40, renk = 'gok', o = {}) {
    const k = h / 40, ten = o.ten || '#e8b892';
    let s = golge(x, y, 9 * k, 2.6 * k);
    s += `<path d="M${r1(x - 4 * k)},${r1(y)} L${r1(x - 3 * k)},${r1(y - 14 * k)} M${r1(x + 4 * k)},${r1(y)} L${r1(x + 3 * k)},${r1(y - 14 * k)}" stroke="${o.pantolon || '#34495e'}" stroke-width="${r1(4.2 * k)}" stroke-linecap="round"/>`;
    s += `<rect x="${r1(x - 6 * k)}" y="${r1(y - 29 * k)}" width="${r1(12 * k)}" height="${r1(16 * k)}" rx="${r1(5 * k)}" fill="${RENK[renk] || renk}" stroke="${ton(renk, -0.4)}" stroke-width=".8"/>`;
    s += kure(u, x, y - 34 * k, 5.6 * k, ten, { golge: false, cizgi: false });
    if (o.sac !== false) s += `<path d="M${r1(x - 5.6 * k)},${r1(y - 35 * k)} A${r1(5.6 * k)},${r1(5.6 * k)} 0 0 1 ${r1(x + 5.6 * k)},${r1(y - 35 * k)} Q${r1(x)},${r1(y - 37.5 * k)} ${r1(x - 5.6 * k)},${r1(y - 35 * k)}Z" fill="${o.sacRenk || '#3b2a20'}"/>`;
    return s;
  },
  // Ağaç (ekran)
  agac(u, x, y, h = 34) { return golge(x, y, h * 0.32, h * 0.09) + `<rect x="${r1(x - h * 0.05)}" y="${r1(y - h * 0.42)}" width="${r1(h * 0.1)}" height="${r1(h * 0.42)}" fill="#8a5a33"/>` + kure(u, x, y - h * 0.62, h * 0.3, '#4f9a5d', { golge: false }); },
  // Mıknatıs çubuğu (izometrik): N kırmızı, S mavi
  miknatis(I, x, y, z, L = 40, k = 10) { return kutu(I, x, y, z, L / 2, k, k, '#d24b3e') + kutu(I, x + L / 2, y, z, L / 2, k, k, '#2f6fb8'); },
  // Pil (yatay silindir)
  pil(I, u, x, y, z, L = 34, r = 7) { return yatSilindir(I, u, x, y, z, r, L * 0.75, '#2b3330') + yatSilindir(I, u, x + L * 0.75, y, z, r, L * 0.22, '#c9a33a'); },
  // Ampul (ekran): taban merkezi (x,y)
  ampul(u, x, y, r = 10, yanik = true) {
    let s = yanik ? `<circle cx="${x}" cy="${r1(y - r * 1.6)}" r="${r1(r * 2.2)}" fill="#ffd95a" opacity=".22"/>` : '';
    s += `<rect x="${r1(x - r * 0.45)}" y="${r1(y - r * 0.7)}" width="${r1(r * 0.9)}" height="${r1(r * 0.75)}" rx="1.5" fill="#9aa5ad" stroke="#5f6a70" stroke-width=".7"/>`;
    s += kure(u, x, y - r * 1.6, r, yanik ? '#ffe27a' : '#e8eef0', { golge: false });
    return s;
  },
  // Termometre (ekran): taban (x,y), boy h, dolu oran f
  termometre(x, y, h = 50, f = 0.6, renk = 'kirmizi') {
    const c = RENK[renk] || renk;
    return `<rect x="${x - 4}" y="${y - h}" width="8" height="${h}" rx="4" fill="#fff" stroke="#7d8a91" stroke-width="1"/><rect x="${x - 2}" y="${r1(y - h * f)}" width="4" height="${r1(h * f)}" rx="2" fill="${c}"/><circle cx="${x}" cy="${y + 2}" r="6.5" fill="${c}" stroke="${ton(c, -0.4)}" stroke-width="1"/>` +
      [0.25, 0.5, 0.75].map(t => `<line x1="${x + 4}" y1="${r1(y - h * t)}" x2="${x + 7}" y2="${r1(y - h * t)}" stroke="#7d8a91" stroke-width="1"/>`).join('');
  },
  // Alev (ekran): taban (x,y)
  alev(u, x, y, h = 22) {
    const id = u + 'al' + (++kure.n);
    return `<defs><radialGradient id="${id}" cx="50%" cy="80%" r="80%"><stop offset="0" stop-color="#fff3b0"/><stop offset=".45" stop-color="#ffb02e"/><stop offset="1" stop-color="#e2502a"/></radialGradient></defs><path d="M${x},${y} C${r1(x - h * 0.45)},${y} ${r1(x - h * 0.42)},${r1(y - h * 0.45)} ${r1(x - h * 0.12)},${r1(y - h * 0.62)} C${r1(x - h * 0.1)},${r1(y - h * 0.82)} ${r1(x + h * 0.05)},${r1(y - h * 0.9)} ${x},${y - h} C${r1(x + h * 0.3)},${r1(y - h * 0.72)} ${r1(x + h * 0.46)},${r1(y - h * 0.4)} ${r1(x + h * 0.3)},${r1(y - h * 0.12)} C${r1(x + h * 0.22)},${r1(y - h * 0.02)} ${r1(x + h * 0.1)},${y} ${x},${y}Z" fill="url(#${id})"/>`;
  },
  // Beher (ekran): taban merkezi (x,y), genişlik w, yükseklik h, sıvı oranı f
  beher(x, y, w = 30, h = 36, f = 0.55, sivi = '#7cc3e8') {
    const l = x - w / 2, r = x + w / 2, sy = y - h * f;
    return `<path d="M${l},${y - h} L${l},${y - 3} Q${l},${y} ${l + 3},${y} L${r - 3},${y} Q${r},${y} ${r},${y - 3} L${r},${y - h}" fill="rgba(220,240,250,.35)" stroke="#6f8f9f" stroke-width="1.4"/>` +
      `<path d="M${l + 1},${r1(sy)} L${l + 1},${y - 3} Q${l + 1},${y - 1} ${l + 3},${y - 1} L${r - 3},${y - 1} Q${r - 1},${y - 1} ${r - 1},${y - 3} L${r - 1},${r1(sy)}Z" fill="${sivi}" opacity=".75"/>` +
      `<ellipse cx="${x}" cy="${r1(sy)}" rx="${r1(w / 2 - 1)}" ry="2" fill="${ton(sivi, 0.35)}"/>` +
      `<line x1="${l + 4}" y1="${y - h + 6}" x2="${l + 4}" y2="${y - 6}" stroke="#fff" stroke-width="1.6" opacity=".7"/>`;
  },
  // Atom (ekran): merkez, yarıçap
  atom(u, cx, cy, R = 26, renk = 'gok') {
    const c = RENK[renk] || renk; let s = '';
    [0, 60, 120].forEach(a => { s += `<ellipse cx="${cx}" cy="${cy}" rx="${R}" ry="${r1(R * 0.36)}" fill="none" stroke="${c}" stroke-width="1.6" transform="rotate(${a} ${cx} ${cy})" opacity=".85"/>`; });
    s += kure(u, cx, cy, R * 0.22, 'mercan', { golge: false });
    [[0, 1], [60, -1], [120, 1]].forEach(([a, sg]) => { const t = a * Math.PI / 180, ex = cx + R * Math.cos(t) * sg, ey = cy + R * Math.sin(t) * sg; s += kure(u, ex, ey, R * 0.1, renk, { golge: false }); });
    return s;
  },
  // Gezegen / Dünya (ekran)
  dunya(u, cx, cy, r) {
    const id = u + 'dn' + (++kure.n);
    return `<defs><clipPath id="${id}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath></defs>` + kure(u, cx, cy, r, '#3f8fd0', { golge: false }) +
      `<g clip-path="url(#${id})" fill="#5fae6a" opacity=".9"><path d="M${r1(cx - r * 0.6)},${r1(cy - r * 0.5)} q${r1(r * 0.4)},${r1(-r * 0.25)} ${r1(r * 0.6)},${r1(r * 0.1)} t${r1(r * 0.1)},${r1(r * 0.5)} q${r1(-r * 0.4)},${r1(r * 0.2)} ${r1(-r * 0.7)},0z"/><path d="M${r1(cx + r * 0.1)},${r1(cy + r * 0.2)} q${r1(r * 0.5)},${r1(-r * 0.1)} ${r1(r * 0.6)},${r1(r * 0.3)} t${r1(-r * 0.3)},${r1(r * 0.4)} q${r1(-r * 0.3)},${r1(-r * 0.2)} ${r1(-r * 0.3)},${r1(-r * 0.7)}z"/></g>` +
      '';
  },
  // Prizma (izometrik üçgen prizma, ekran yaklaşık): sol alt köşe (x,y), kenar a, derinlik d
  prizma(u, x, y, a = 40) {
    const id = u + 'pr' + (++kure.n), h = a * 0.866, dx = a * 0.35, dy = -a * 0.2;
    return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf6fc" stop-opacity=".95"/><stop offset="1" stop-color="#9ccbe4" stop-opacity=".8"/></linearGradient></defs>` +
      `<polygon points="${x + a / 2},${r1(y - h)} ${r1(x + a / 2 + dx)},${r1(y - h + dy)} ${r1(x + a + dx)},${r1(y + dy)} ${x + a},${y}" fill="#a9d2e8" stroke="#5d8fa8" stroke-width="1" opacity=".9"/>` +
      `<polygon points="${x},${y} ${x + a / 2},${r1(y - h)} ${x + a},${y}" fill="url(#${id})" stroke="#5d8fa8" stroke-width="1.1"/>`;
  }
};

/* ---------- sahne çerçevesi ----------
   Kart, hikâye ve tanım çizimleri için ortak dış görünüm: yumuşak zemin, köşe yuvarlak. */
function sahne(u, ciz, o = {}) {
  const w = o.w || 160, h = o.h || 110, zem = o.zemin === undefined ? 'url(#' + u + 'zg)' : o.zemin;
  const I = Izo(o.ox ?? w / 2, o.oy ?? h * 0.62, o.s || 1);
  let s = `<defs><linearGradient id="${u}zg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${o.ust || '#f4f8f5'}"/><stop offset="1" stop-color="${o.alt || '#e3ece6'}"/></linearGradient></defs>`;
  if (zem) s += `<rect class="bg" x="0" y="0" width="${w}" height="${h}" rx="${o.rx ?? 12}" fill="${zem}"/>`;
  s += ciz(I);
  const mm = o.mm || 46;
  return `<svg class="fig izo" viewBox="0 0 ${w} ${h}" style="max-width:${mm}mm" xmlns="http://www.w3.org/2000/svg" role="img"${o.ad ? ` aria-label="${o.ad}"` : ''}>${s}</svg>`;
}

window.BFY_ISO = { RENK, ton, Izo, kutu, plaka, silindir, yatSilindir, kure, golge, ok, izoOk, etiket, yazi, parilti, dalga, N, sahne };
})();

<script>
/* ============================================================
   BFY — Oynanan simülasyon not blokları (ortak çekirdek)
   Her konu klasöründe isteğe bağlı sim.js: window.BFY_SIM['9.3.2'] = [ {...}, ... ]
   Bankaya (bank.js) hiçbir şey yazılmaz: motor sim bloklarını not listesine yalnız
   gösterim sırasında, "sonra" alanındaki başlıklı nottan sonra yerleştirir.
   Sim blokları not sırası (notDizi, oyun/efsane/kart anahtarları) indekslemesine girmez.
   Ayrıntı: SIM_KILAVUZ.md
   ============================================================ */
(function () {
'use strict';
window.BFY_SIM = window.BFY_SIM || {};

/* Türkçe sayı: ondalık virgül, 10 000 ve üstünde bölünmez boşlukla binlik ayırma, eksi işareti "−". */
function sayi(x, ondalik) {
  const o = Math.max(0, Math.min(6, ondalik | 0));
  if (typeof x !== 'number' || !isFinite(x)) return String(x);
  let t = Math.abs(x).toFixed(o);
  if (+t === 0) t = (0).toFixed(o);
  const neg = x < 0 && +t !== 0;
  let [tam, kes] = t.split('.');
  if (tam.length >= 5) tam = tam.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (neg ? '−' : '') + tam + (kes ? ',' + kes : '');
}
/* Kaydırıcı adımının ondalık basamak sayısı (0,5 -> 1; 0,05 -> 2) */
function adimOndalik(adim) { const s = String(adim); return s.includes('.') ? s.split('.')[1].length : 0; }
const kaydirici = k => !Array.isArray(k.secenekler);

/* Konunun sim tanımları */
const liste = id => (window.BFY_SIM[id] || []).filter(s => s && typeof s === 'object');
/* Tüm simler: id -> tanım */
function bul(id) { for (const k of Object.keys(window.BFY_SIM)) { const s = liste(k).find(x => x.id === id); if (s) return s; } return null; }
/* Varsayılan değerler: { ad: deger } */
function degerler(s) { const v = {}; (s.kontroller || []).forEach(k => { v[k.ad] = k.deger; }); return v; }

/* Notlar + sim blokları (gösterim listesi). Sim öğesi: { tur: 'sim', sim: tanım }.
   "sonra" bir notun başlığıyla eşleşmezse (ya da yoksa) sim, notun sonuna eklenir. */
const _onbellek = new WeakMap();
const notBaslik = n => n.baslik || (n.sol && n.sol.baslik) || '';
function notSimli(konu) {
  const sims = liste(konu.id);
  if (!sims.length) return konu.not;
  const c = _onbellek.get(konu);
  if (c && c.not === konu.not && c.n === konu.not.length && c.sims === sims.length) return c.dizi;
  const dizi = konu.not.slice();
  sims.forEach(s => {
    const blok = { tur: 'sim', sim: s };
    let i = -1;
    if (s.sonra) for (let j = 0; j < dizi.length; j++) if (dizi[j].tur !== 'sim' && notBaslik(dizi[j]) === s.sonra) i = j;
    if (i < 0) { dizi.push(blok); return; }
    // aynı nottan sonra birden çok sim: yazıldıkları sırayla
    let k = i + 1; while (k < dizi.length && dizi[k].tur === 'sim') k++;
    dizi.splice(k, 0, blok);
  });
  _onbellek.set(konu, { not: konu.not, n: konu.not.length, sims: sims.length, dizi });
  return dizi;
}

/* Tanım denetimi: hata listesi (boşsa geçerli). qa/sim.py ve geliştirme sırasında kullanılır. */
function denetle(s, konuId) {
  const H = [], ad = (s && s.id) || '?';
  const h = m => H.push(`${ad}: ${m}`);
  if (!s || typeof s !== 'object') return ['tanım nesne değil'];
  if (!/^k\w+_sim\d+$/.test(s.id || '')) h('id "kKKK_simN" biçiminde olmalı');
  ['baslik', 'metin'].forEach(f => { if (!s[f] || typeof s[f] !== 'string') h(f + ' eksik'); });
  if (typeof s.ciz !== 'function') h('ciz(v, u) fonksiyonu eksik');
  if (typeof s.olcumler !== 'function') h('olcumler(v) fonksiyonu eksik');
  if (s.denklem != null && typeof s.denklem !== 'function') h('denklem bir fonksiyon olmalı');
  if (s.gorevCevap && !s.gorev) h('gorevCevap var ama gorev yok');
  const ks = s.kontroller;
  if (!Array.isArray(ks) || !ks.length || ks.length > 3) h('kontroller 1–3 öğe olmalı');
  const adlar = new Set();
  (ks || []).forEach((k, i) => {
    const kk = `kontrol ${i + 1} (${k.ad})`;
    if (!/^[a-zA-Z_]\w*$/.test(k.ad || '')) h(kk + ': ad geçersiz');
    if (adlar.has(k.ad)) h(kk + ': ad tekrar ediyor'); adlar.add(k.ad);
    if (!k.etiket) h(kk + ': etiket eksik');
    if (kaydirici(k)) {
      ['min', 'max', 'adim', 'deger'].forEach(f => { if (typeof k[f] !== 'number' || !isFinite(k[f])) h(`${kk}: ${f} sayı olmalı`); });
      if (!(k.max > k.min)) h(kk + ': max > min olmalı');
      if (!(k.adim > 0)) h(kk + ': adim > 0 olmalı');
      if (k.deger < k.min || k.deger > k.max) h(kk + ': deger aralık dışında');
      const n = (k.deger - k.min) / k.adim, m = (k.max - k.min) / k.adim;
      if (Math.abs(n - Math.round(n)) > 1e-6) h(kk + ': deger adıma oturmuyor');
      if (Math.abs(m - Math.round(m)) > 1e-6) h(kk + ': (max − min) adımın tam katı değil');
      if (!k.birim && k.birim !== '') h(kk + ': birim eksik (birimsizse birim: \'\')');
    } else {
      if (k.secenekler.length < 2 || k.secenekler.length > 5) h(kk + ': 2–5 seçenek olmalı');
      if (!k.secenekler.some(o => o.deger === k.deger)) h(kk + ': deger seçeneklerde yok');
      k.secenekler.forEach(o => { if (!o.etiket) h(kk + ': seçenek etiketi eksik'); });
    }
  });
  // Metin kuralları: "·" yok; cümleler nokta ya da soru işaretiyle biter.
  ['baslik', 'metin', 'pdfMetin', 'gorev', 'gorevCevap'].forEach(f => {
    const t = s[f]; if (!t) return;
    if (t.includes('·')) h(f + ': "·" kullanılmaz (çarpma için $\\cdot$)');
    if (f !== 'baslik' && !/[.?!][")”’]*$/.test(t.trim())) h(f + ': nokta ya da soru işaretiyle bitmeli');
  });
  if (s.baslik && /[.]$/.test(s.baslik.trim())) h('baslik nokta ile bitmez');
  if (typeof s.olcumler === 'function' && ks && ks.length) {
    try {
      const o = s.olcumler(degerler(s));
      if (!Array.isArray(o) || !o.length || o.length > 4) h('olcumler 1–4 öğe döndürmeli');
      else o.forEach((x, i) => { if (!x.etiket || typeof x.deger !== 'number' || !isFinite(x.deger)) h(`ölçüm ${i + 1}: etiket ve sonlu sayı olmalı`); });
    } catch (e) { h('olcumler hata verdi: ' + e.message); }
  }
  if (konuId && window.BFY_BANK && window.BFY_BANK[konuId] && s.sonra && !window.BFY_BANK[konuId].not.some(n => notBaslik(n) === s.sonra)) h(`sonra: "${s.sonra}" başlıklı not bulunamadı (sim notun sonuna eklenir)`);
  return H;
}

window.BFY_SIM_ARAC = { sayi, adimOndalik, kaydirici, liste, bul, degerler, notSimli, denetle };
})();

</script>
<script>
/* ============================================================
   BFY — Ben Fizik Yapabilirim YKS 2027 TYT · Y.8.3 Kaldırma Kuvveti — şekiller
   Önek: kY83_ (soru, not ve çözümlü örnek şekilleri; düz 2B), iY83_ (tanım ve efsane çizimleri; 3B izometrik).
   Kurallar: sıvı yüzeyleri yatay; yüzen cisim kısmen sıvının dışında, batan cisim tabana oturur;
   kuvvet okları: kaldırma kuvveti mavi (yukarı), ağırlık kırmızı (aşağı), basınç kuvvetleri yüzeye dik.
   ============================================================ */
(function () {
const { P, T, arrow, svg, dashLine } = window.BFY_FIGLIB;
const f1 = v => (+v).toFixed(1);
const BG = '#f4f7f9', CAM = '#5d7d8f', TEL = '#2a3330', FKR = '#2f7fb8', GR = '#d9573b', GRI = '#8a9aa6';
const SIV = {
  su: ['#dcedf8', '#a7d0ea', '#2a6f9e'], yag: ['#fbf3d2', '#ecd68a', '#a8892c'], alkol: ['#eef5f9', '#d6e5ee', '#7f99aa'],
  karisim: ['#e6f1ef', '#b9d8d3', '#4f8a86'], Y: ['#eef6e6', '#c9e2b4', '#5f8f43'], X: ['#f6e2e6', '#e4a9b5', '#a34a5d'], Z: ['#ece4f6', '#c2aee4', '#6b4fa8']
};
let N = 0;
const yeniId = (u, ad) => `${u}${ad}${++N}`;
/* doğrusal gradyan tanımı: yatay (x) ya da dikey (y) */
function lg(id, renkler, yon = 'y') {
  const xy = yon === 'y' ? 'x1="0" y1="0" x2="0" y2="1"' : 'x1="0" y1="0" x2="1" y2="0"';
  return `<defs><linearGradient id="${id}" ${xy}>${renkler.map((c, i) => `<stop offset="${f1(i / (renkler.length - 1))}" stop-color="${c}"/>`).join('')}</linearGradient></defs>`;
}
const zemin = (W, H) => `<rect class="bg" x="0" y="0" width="${W}" height="${H}" rx="14" fill="${BG}"/>`;
const masa = (x1, x2, y) => `<rect class="bg" x="${x1}" y="${y}" width="${x2 - x1}" height="7" rx="2" fill="#e3d2b0" stroke="#c9a76c" stroke-width=".8"/>`;
/* cam kap: iç sol duvar x, ağız y, iç genişlik w, iç derinlik h; sıvı yüzeyi ys (yoksa sıvı yok) */
function kapSivi(u, x, y, w, h, ys, sv = 'su') {
  if (ys == null) return '';
  const c = SIV[sv], id = yeniId(u, 'sv');
  return lg(id, [c[0], c[1]]) + `<rect x="${f1(x)}" y="${f1(ys)}" width="${f1(w)}" height="${f1(y + h - ys)}" fill="url(#${id})"/>` +
    `<line x1="${f1(x)}" y1="${f1(ys)}" x2="${f1(x + w)}" y2="${f1(ys)}" stroke="${c[2]}" stroke-width="1.5"/>`;
}
function kapCam(x, y, w, h, o = {}) {
  const k = o.k ?? 2.2;
  let s = `<path d="M${f1(x - k)} ${f1(y)} V${f1(y + h + k)} H${f1(x + w + k)} V${f1(y)}" fill="none" stroke="${CAM}" stroke-width="${o.w || 3}" stroke-linejoin="round"/>`;
  s += `<line x1="${f1(x + 5)}" y1="${f1(y + 8)}" x2="${f1(x + 5)}" y2="${f1(y + h - 8)}" stroke="#fff" stroke-width="2" opacity=".55"/>`;
  return s;
}
/* sıvının içindeki kısmın üstüne yarı saydam sıvı örtüsü (dikdörtgen cisim) */
function ortu(x, y, w, h, ys, sv = 'su', op = 0.38) {
  const y0 = Math.max(y, ys); if (y0 >= y + h) return '';
  return `<rect x="${f1(x)}" y="${f1(y0)}" width="${f1(w)}" height="${f1(y + h - y0)}" fill="${SIV[sv][1]}" opacity="${op}"/>`;
}
/* dikdörtgen cisim (yatay gradyanlı) */
const RENK = { ahsap: ['#b07a3a', '#e2b578', '#a46d31', '#7e5226'], metal: ['#8e979f', '#e4e8ec', '#a9b3bb', '#5f6a72'], bakir: ['#a85f2c', '#ecb07e', '#b46a36', '#7d4a27'],
  al: ['#a9b3bb', '#f1f4f6', '#b8c1c8', '#7d8a91'], plastik: ['#5f9fd0', '#bfe0f5', '#6faad6', '#2f6f9e'], mantar: ['#b98a52', '#e6c48f', '#c0925a', '#8a6233'],
  pirinc: ['#a8862a', '#f2d675', '#b8952e', '#7d6420'], kursun: ['#5f6770', '#a7b0b8', '#6b737c', '#3f474f'], parafin: ['#e8e1c8', '#fbf8ec', '#e2dac0', '#b9ad86'] };
function blok(u, x, y, w, h, tur = 'ahsap', o = {}) {
  const c = RENK[tur], id = yeniId(u, 'bl');
  return lg(id, [c[0], c[1], c[2]], 'x') + `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="${o.rx ?? 2}" fill="url(#${id})" stroke="${c[3]}" stroke-width="1.1"/>`;
}
function top_(u, cx, cy, r, renk) {
  const id = yeniId(u, 'kr');
  return `<defs><radialGradient id="${id}" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".25" stop-color="${renk}"/><stop offset="1" stop-color="${renk}" stop-opacity="1"/></radialGradient></defs>` +
    `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${r}" fill="url(#${id})" stroke="${TEL}" stroke-width=".9"/>`;
}
/* yaylı dinamometre: üst halka (x, y), gövde boyu L, gösterge oranı f (0: en üst); kanca ucunu döndürür */
function din(x, y, L, f) {
  const g0 = y + 6, py = g0 + 6 + f * (L - 12);
  let s = `<circle cx="${x}" cy="${y + 2}" r="3" fill="none" stroke="#55626b" stroke-width="1.4"/>`;
  s += `<rect x="${x - 8}" y="${g0}" width="16" height="${L}" rx="4" fill="#fbfcfb" stroke="#55626b" stroke-width="1.5"/>`;
  for (let i = 0; i <= 6; i++) { const ty = g0 + 6 + i * (L - 12) / 6; s += `<line x1="${x + 2}" y1="${f1(ty)}" x2="${x + (i % 2 ? 5 : 7)}" y2="${f1(ty)}" stroke="#55626b" stroke-width=".9"/>`; }
  let d = `M${x - 3} ${g0 + 3}`; const n = 8; for (let i = 1; i <= n; i++) d += ` L${i % 2 ? x - 6 : x}${' '}${f1(g0 + 3 + i * (py - g0 - 3) / n)}`;
  s += `<path d="${d}" fill="none" stroke="#7d8a91" stroke-width="1.1"/>`;
  s += `<line x1="${x - 7}" y1="${f1(py)}" x2="${x + 1}" y2="${f1(py)}" stroke="${P.coral}" stroke-width="2.6"/>`;
  s += `<line x1="${x}" y1="${g0 + L}" x2="${x}" y2="${g0 + L + 8}" stroke="#55626b" stroke-width="1.6"/><path d="M${x} ${g0 + L + 8} q-5 0 -5 5 q0 5 5 5" fill="none" stroke="#55626b" stroke-width="1.6"/>`;
  return { s, uc: g0 + L + 16 };
}
/* destek (statif): taban x0, çubuk x, yükseklik y1..y2, kol ucu xk */
const statif = (x, y1, y2, xk) => `<rect x="${x - 18}" y="${y2 - 5}" width="40" height="5" rx="1.5" fill="#6d7a84"/><rect x="${x - 2.5}" y="${y1}" width="5" height="${y2 - y1 - 5}" fill="#8b98a2"/><rect x="${x - 2.5}" y="${y1}" width="${xk - x + 4}" height="5" rx="2" fill="#8b98a2"/>`;
/* mutfak terazisi: üst yüzey y */
function terazi(x1, x2, y, ekran = true) {
  let s = `<rect x="${x1}" y="${y}" width="${x2 - x1}" height="22" rx="5" fill="#e9edf0" stroke="#6f7d85" stroke-width="1.3"/><rect x="${x1 + 6}" y="${y}" width="${x2 - x1 - 12}" height="4" rx="2" fill="#c9d1d6"/>`;
  if (ekran) { const xm = (x1 + x2) / 2; s += `<rect x="${xm - 22}" y="${y + 8}" width="44" height="11" rx="2" fill="#24343a"/><text x="${xm}" y="${y + 17}" font-family="monospace" font-size="9" fill="#7ee0b0" text-anchor="middle">0000</text>`; }
  return s;
}
const yildizNok = (cx, cy, r) => Array.from({ length: 10 }, (_, i) => { const a = (-90 + 36 * i) * Math.PI / 180, rr = i % 2 ? r * 0.45 : r; return f1(cx + rr * Math.cos(a)) + ',' + f1(cy + rr * Math.sin(a)); }).join(' ');
const ok = (x1, y1, x2, y2, c, o = {}) => arrow(f1(x1), f1(y1), f1(x2), f1(y2), Object.assign({ color: c, w: 2.4, head: 8, headW: 4.6 }, o));
/* kaplumbağa oyuncak: tabanı (cx, yb) */
function kaplumbaga(u, cx, yb) {
  const id = yeniId(u, 'kb');
  let s = `<defs><radialGradient id="${id}" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#bfe3a8"/><stop offset="1" stop-color="#4f9a5d"/></radialGradient></defs>`;
  s += `<ellipse cx="${cx - 15}" cy="${yb - 2}" rx="4" ry="2.4" fill="#6fae5a"/><ellipse cx="${cx + 13}" cy="${yb - 2}" rx="4" ry="2.4" fill="#6fae5a"/>`;
  s += `<circle cx="${cx + 23}" cy="${yb - 9}" r="5" fill="#7cbf66" stroke="#3f7a3a" stroke-width=".8"/><circle cx="${cx + 25}" cy="${yb - 10}" r="1" fill="${TEL}"/>`;
  s += `<path d="M${cx - 21} ${yb - 3} Q${cx - 20} ${yb - 22} ${cx} ${yb - 22} Q${cx + 20} ${yb - 22} ${cx + 21} ${yb - 3} Z" fill="url(#${id})" stroke="#3f7a3a" stroke-width="1"/>`;
  s += `<path d="M${cx - 10} ${yb - 4} L${cx - 6} ${yb - 16} L${cx + 6} ${yb - 16} L${cx + 10} ${yb - 4}" fill="none" stroke="#3f7a3a" stroke-width=".8" opacity=".7"/>`;
  return s;
}
/* tek bir F-h grafiği paneli */
function grafik(x0, y0, w, h, fn, et) {
  const ox = x0 + 26, oy = y0 + h - 24, ex = x0 + w - 14, ey = y0 + 14, H = ox + (ex - ox - 22) * 0.62, Fm = ey + 22;
  let s = `<rect class="bg" x="${x0}" y="${y0}" width="${w}" height="${h}" rx="10" fill="#fff" stroke="#dbe4ea"/>`;
  s += `<line x1="${ox}" y1="${oy}" x2="${ex}" y2="${oy}" stroke="${P.ink}" stroke-width="1.4"/><polygon points="${ex + 6},${oy} ${ex - 3},${oy - 3.6} ${ex - 3},${oy + 3.6}" fill="${P.ink}"/>`;
  s += `<line x1="${ox}" y1="${oy}" x2="${ox}" y2="${ey}" stroke="${P.ink}" stroke-width="1.4"/><polygon points="${ox},${ey - 6} ${ox - 3.6},${ey + 3} ${ox + 3.6},${ey + 3}" fill="${P.ink}"/>`;
  s += T(ox + 7, ey + 2, 'F_k', { size: 12, weight: 700 }) + T(ex - 2, oy + 16, 'h', { size: 12.5, weight: 700, italic: true, anchor: 'end' });
  s += T(ox - 5, oy + 13, '0', { size: 11.5, anchor: 'end', fill: P.ink2 }) + T(H, oy + 14, 'H', { size: 12, anchor: 'middle', weight: 700, fill: P.ink2 });
  s += dashLine(H, oy, H, Fm, '#9aa8b1', '3 3', 1);
  let d = ''; for (let i = 0; i <= 40; i++) { const t = i / 40; d += (i ? 'L' : 'M') + f1(ox + (H - ox) * t) + ' ' + f1(oy - (oy - Fm) * fn(t)); }
  d += ` L${f1(ex - 8)} ${f1(Fm)}`;
  s += `<path d="${d}" fill="none" stroke="${P.blue}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;
  s += T(x0 + w - 10, y0 + 22, et, { size: 14, weight: 800, anchor: 'end', fill: P.copper });
  return s;
}

/* Q10: eğimli rampada su dolu kap; tabandaki taş ve beş ok */
BFY_FIG_EKLE('kY83_egik', function (u) {

  const id = yeniId(u, 'sv');
  s += lg(id, [SIV.su[0], SIV.su[1]]) + `<g clip-path="url(#${cid})"><rect x="0" y="${f1(yS)}" width="${W}" height="${H}" fill="url(#${id})"/><line x1="0" y1="${f1(yS)}" x2="${W}" y2="${f1(yS)}" stroke="${SIV.su[2]}" stroke-width="1.5"/></g>`;

  const tc = pt(70, 9);
  s += `<ellipse cx="${f1(tc[0])}" cy="${f1(tc[1])}" rx="14" ry="8" transform="rotate(${f1(-22)} ${f1(tc[0])} ${f1(tc[1])})" fill="#9a9488" stroke="#5f5a50" stroke-width="1"/>`;

  s += `<line x1="${f1(c4[0])}" y1="${f1(c4[1])}" x2="${f1(c3[0])}" y2="${f1(c3[1])}" stroke="#fff" stroke-width="0"/>`;
  // oklar: 1 tabana dik, 2 taban boyunca yukarı, 3 düşey yukarı, 4 taban boyunca aşağı, 5 yatay sağa
  const L = 42, yon = { 1: Nn, 2: A, 3: [0, -1], 4: [-A[0], -A[1]], 5: [1, 0] };

  sorular: [
    {
      id: 'kY83_01', yks: true, zorluk: 2, tur: 'cs', cikti: '10.2.2.1', beceri: 'Kesin çıkarım', cikmis: { yil: 2018, no: 3, kalip: 'Eşit taşan sıvıdan kesinlikle doğru yargılar' },
      metin: r`Bir kozmetik laboratuvarında Nehir, yan ağzına kadar badem yağıyla dolu bir taşırma kabına P boncuğunu yavaşça bırakıyor ve taşan yağı hassas bir terazide tartıyor. Kabı yeniden ağzına kadar doldurup aynı işlemi R boncuğuyla tekrarlıyor. Boncuklar yağda çözünmüyor ve iki denemede taşan yağın kütlesi aynı çıkıyor.

Buna göre,

I. P ve R boncuklarının yağın içinde kalan hacimleri eşittir.
II. Yağın P ve R boncuklarına uyguladığı kaldırma kuvvetleri eşittir.
III. P ve R boncuklarının kütleleri eşittir.

yargılarından hangileri kesinlikle doğrudur?`,

        r`I. Taşan sıvı aynı yağdır; kütleleri eşitse hacimleri de eşittir. Taşan sıvının hacmi boncuğun yağın içindeki hacmine eşit olduğundan batan hacimler eşittir. **Kesinlikle doğru.**`,
        r`II. Arşimet ilkesine göre kaldırma kuvveti, yeri değişen (taşan) sıvının ağırlığına eşittir. Taşan yağların kütleleri, dolayısıyla ağırlıkları eşittir. **Kesinlikle doğru.**`,
        r`III. Boncuklardan biri yüzüyor, öbürü batmış olabilir. Yüzen boncuğun kütlesi taşan yağın kütlesine eşittir, batan boncuğunki ondan büyüktür. Kütleler eşit olabilir de olmayabilir de. **Kesin değil.**`,

    {
      id: 'kY83_02', yks: true, zorluk: 2, tur: 'cs', cikti: '10.2.2.1', beceri: 'Değişkenler arası ilişki', cikmis: { yil: 2020, no: 3, kalip: 'Sıvının özkütlesi değişince yüzen cismin batan hacmi ve kaldırma kuvveti' },
      metin: r`Kimya laboratuvarında Tuna, su dolu bir behere bir mantar tıpa bırakıyor; tıpa şekildeki gibi yüzüyor. Ardından behere bir miktar etil alkol ekleyip karıştırıyor. Sıvıların sıcaklığı değişmiyor, tıpa sıvı emmiyor ve yine yüzüyor. Etil alkolün özkütlesi suyunkinden küçüktür.

Alkol eklendikten sonra tıpanın sıvıya batan hacmi ve tıpaya etki eden kaldırma kuvveti ilk duruma göre nasıl değişir?`,
      sekil: 'kY83_tipa',
      secenekler: ['Batan hacim azalır; kaldırma kuvveti azalır.', 'Batan hacim azalır; kaldırma kuvveti değişmez.', 'Batan hacim değişmez; kaldırma kuvveti azalır.', 'Batan hacim artar; kaldırma kuvveti artar.', 'Batan hacim artar; kaldırma kuvveti değişmez.'],
      dogru: 4,
      cozum: [

        r`{{S1}} alkol eklenince sıvının yoğunlaştığını sanır. {{S2}} batan hacmin sıvıya göre ayarlandığını görmez ve seyrek sıvının daha az kaldırdığını düşünür. {{S3}} batan hacim arttığı için kaldırma kuvvetinin de arttığını sanır; sıvının özkütlesi de azalmıştır. {{S0}} seyrek sıvının tıpayı daha az kaldırdığını ve tıpanın daha az battığını sanır; oysa yüzen tıpada kuvvet ağırlığa eşit kalır ve seyrek sıvıda tıpa daha çok batar.`

      metin: r`Bir bilim gösterisinde, sıcaklığı ve basıncı sabit tutulan büyük cam bir tank bir gazla ya da gaz karışımıyla dolduruluyor. Tankın tabanına, içi başka bir gazla ya da gaz karışımıyla doldurulmuş, ağzı bağlı ince zarlı bir balon konuyor. Kullanılan P, R, S ve T gazlarının aynı sıcaklık ve basınçtaki kütle-hacim grafiği şekildedir.

{{sekil}}

{{tablo}}

Balonun zarının ağırlığı önemsiz olduğuna göre hangi durumlarda balon tankın tabanından yükselir?`,
      sekil: 'kY83_gazlar',
      tablo: [['Durum', 'Tanktaki gaz', 'Balondaki gaz'], ['I', 'S', 'T'], ['II', 'T', 'R ve S karışımı'], ['III', 'P ve R karışımı', 'S ve T karışımı']],
      secenekler: [r`Yalnız I`, r`Yalnız III`, r`I ve II`, r`I ve III`, r`II ve III`],
      dogru: 3,
      cozum: [
        r`Kütle-hacim grafiğinde eğim özkütleyi verir: $d_P > d_R > d_S > d_T$. Balon, içindeki gazın özkütlesi tanktaki gazınkinden küçükse yükselir; çünkü o zaman tankın gazının uyguladığı kaldırma kuvveti balondaki gazın ağırlığından büyüktür.`,

        r`III. Tanktaki karışım $d_R$ ile $d_P$ arasında, balondaki karışım $d_T$ ile $d_S$ arasındadır. Balondaki gaz kesinlikle daha seyrektir; balon yükselir.`,
        r`{{S0}} iki karışım karşılaştırmasında aralıkların çakışmadığını görmez. {{S1}} I'de T'nin S'den seyrek olduğunu atlar. {{S2}} karışımın özkütlesinin bileşenlerinin arasında kaldığını unutur, II'deki R ve S karışımını T'den seyrek sanır ve III'teki iki karışımı karşılaştırmaz. {{S4}} II'deki R ve S karışımını T'den seyrek sanır ve I'de T'nin S'den seyrek olduğunu atlar.`

    {
      id: 'kY83_04', yks: true, zorluk: 2, tur: 'cs', cikti: '10.2.2.1', beceri: 'Kavramsal karşılaştırma', cikmis: { yil: 2024, no: 3, kalip: 'Eşit hacimli batan ve yüzen cisimlerde kaldırma kuvveti' },
      metin: r`Bir takı tasarımcısı aynı kalıptan, içi dolu ve hacimleri eşit üç yıldız biçimli süs döküyor: biri polipropilen (PP) plastikten, biri camdan, biri pirinçten. Süsleri su dolu bir cam kaba bıraktığında PP süs yüzüyor; cam ve pirinç süsler şekildeki gibi kabın tabanına batıyor. Pirincin özkütlesi camınkinden büyüktür.

Buna göre,

I. Pirinç süse etki eden kaldırma kuvveti, cam süse etki edenden büyüktür.

III. PP süse etki eden kaldırma kuvveti, PP süsün ağırlığına eşittir.

yargılarından hangileri doğrudur?`,

        r`I. Cam ve pirinç süsler tamamen batmıştır; batan hacimleri eşit hacimlerine eşittir. Aynı sıvıda kaldırma kuvvetleri eşittir. **Yanlış.**`,
        r`II. PP süsün bir kısmı suyun dışında olduğu için batan hacmi süsün hacminden küçüktür; cam süsün batan hacmi ise süsün tamamıdır. Cama etki eden kaldırma kuvveti daha büyüktür. **Doğru.**`,

        r`{{S0}} kaldırma kuvvetinin cismin özkütlesine bağlı olduğunu sanır ve iki doğru yargıyı atlar. {{S1}} yüzen süsün batan hacminin daha küçük olduğunu görmez ve yüzen süsteki dengeyi atlar. {{S2}} pirince daha büyük kuvvet etki ettiğini sanır ve yüzen süsteki dengeyi atlar. {{S3}} pirince daha büyük kuvvet etki ettiğini sanır ve yüzen süsün batan hacminin küçük olduğunu atlar.`

    {
      id: 'kY83_05', yks: true, zorluk: 1, tur: 'cs', cikti: '10.2.2.1', beceri: 'Gözlemden çıkarım', cikmis: { yil: 2025, no: 3, kalip: 'Aynı cismin batma ve yüzme durumundan özkütle yargıları' },
      metin: r`Ilgın, içi dolu ve sıvı almayan plastik bir oyuncak kaplumbağayı su dolu bir kaba bırakıyor; oyuncak kabın tabanına batıyor (1. durum). Kaba bir miktar gliserin ekleyip iyice karıştırınca oyuncak yükselip şekildeki gibi yüzmeye başlıyor (2. durum). Gliserin ile su tamamen karışıyor.

Buna göre,

I. Gliserinin özkütlesi oyuncağın özkütlesinden büyüktür.
II. Oyuncağın özkütlesi suyunkinden küçüktür.
III. Karışımın özkütlesi suyunkinden büyüktür.

yargılarından hangileri doğrudur?`,
      sekil: 'kY83_oyuncak',
      secenekler: [r`Yalnız I`, r`I ve II`, r`I ve III`, r`II ve III`, r`I, II ve III`],
      dogru: 2,
      cozum: [
        r`1. durumda oyuncak batıyor: $d_\text{oyuncak} > d_\text{su}$. II **yanlıştır.** 2. durumda yüzüyor: $d_\text{karışım} > d_\text{oyuncak}$.`,
        r`III. $d_\text{karışım} > d_\text{oyuncak} > d_\text{su}$ olduğundan **Doğru.**`,
        r`I. Karışımın özkütlesi su ile gliserininkinin arasındadır; karışım sudan yoğun olduğuna göre gliserin karışımdan da yoğundur: $d_\text{gliserin} > d_\text{karışım} > d_\text{oyuncak}$. **Doğru.**`,
        r`{{S0}} 1. ve 2. durumu birlikte kullanıp karışımın sudan yoğun olduğunu çıkarmaz ve III'ü atlar. {{S1}} oyuncağın yüzmeye başlamasını oyuncağın hafiflemesi sanır ve II'yi doğru sayar. {{S3}} 1. durumda oyuncağın battığını gözden kaçırır ve karışımın özkütlesinin bileşenlerin arasında kaldığını kullanmayıp I'i atlar. {{S4}} 1. durumda oyuncağın battığını, yani sudan yoğun olduğunu gözden kaçırır.`

    {
      id: 'kY83_06', yks: true, zorluk: 3, tur: 'cs', cikti: '10.2.2.1', beceri: 'Olasılık değerlendirme', cikmis: { yil: 2026, no: 3, kalip: 'Kısmi özkütle sıralamasından olabilir yargıları' },
      metin: r`Bir laboratuvarda birbiriyle karışmayan, özkütleleri bilinmeyen X, Y ve Z sıvıları inceleniyor. Doruk, Y sıvısıyla dolu bir deney tüpüne damlalıkla bir damla X damlatıyor; damla Y'nin içinde dibe iniyor. Başka bir Y tüpüne bir damla Z damlatınca Z damlası da dibe iniyor.

{{sekil}}

Buna göre Doruk'un bu sıvılarda çözünmeyen katı cisimlerle yapacağı denemelerle ilgili,

I. Y sıvısında batan bir cisim X sıvısında yüzer.
II. X sıvısında askıda kalan bir cisim Y sıvısında yüzer.
III. Z sıvısında yüzen bir cisim Y sıvısında batar.

yargılarından hangileri doğru olabilir?`,
      sekil: 'kY83_damla',
      secenekler: [r`Yalnız I`, r`Yalnız II`, r`I ve II`, r`I ve III`, r`I, II ve III`],
      dogru: 3,
      cozum: [
        r`Dibe inen damla, içine damlatıldığı sıvıdan yoğundur: $d_X > d_Y$ ve $d_Z > d_Y$. X ile Z'nin karşılaştırması belirlenemez.`,

        r`III. Z'de yüzen cisim için $d_c < d_Z$. $d_Y < d_c < d_Z$ ise Y'de batar. **Olabilir.**`,
        r`{{S0}} III'teki $d_Y < d_c < d_Z$ aralığının da mümkün olduğunu görmez. {{S1}} askıdaki cismin özkütlesini Y'ninkinden küçük sanır; oysa $d_c = d_X > d_Y$'dir ve olası iki yargıyı da dışarıda bırakır. {{S2}} askıdaki cismin özkütlesinin X'inkine eşit, dolayısıyla Y'ninkinden büyük olduğunu atlar ve III'ü görmez. {{S4}} II'nin hiçbir durumda sağlanamayacağını görmez.`
      ]
