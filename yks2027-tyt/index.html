        h.oklar.guncelle(t * 0.07 * (6 / h.rr), g); halkaMat.opacity = 0.55 * ss(4.2, 5.3, tA); h.tup.visible = g > 0.01; });
      bYay.ayarla(D.yay || 0);
    }
  };
};

/* 2) Akım makarası: dört parmak sarımlardaki akım yönünde, başparmak içerideki alan = N ucu */
SAHNE.sagel_makara = function (T, S, el, sg) {
  const Rc = 2.65, rw = 0.33, Nt = 12, Lc = 17, xs = -Lc / 2;
  // sarmal: θ arttıkça +X etrafında pozitif dolanım; akım (sg=+1) sarmal boyunca θ artarken akar
  const sarmal = []; const ns = Nt * 72;
  for (let i = 0; i <= ns; i++) { const s = i / ns, th = Math.PI + 2 * Math.PI * Nt * s; sarmal.push([xs + Lc * s, Rc * Math.cos(th), Rc * Math.sin(th)]); }
  const uc0 = sarmal[0], uc1 = sarmal[ns];
  const tamYol = [[uc0[0], -40, uc0[2]], [uc0[0], -12, uc0[2]], [uc0[0], uc0[1] - 1.2, uc0[2]], ...sarmal, [uc1[0], uc1[1] - 1.2, uc1[2]], [uc1[0], -12, uc1[2]], [uc1[0], -40, uc1[2]]];
  const seg = []; for (let i = 0; i < tamYol.length - 1; i++) seg.push({ a: tamYol[i], b: tamYol[i + 1], I: sg });
  const Bic = biot(seg, [0, 0, 0]);                       // içerideki alan (Biot–Savart)
  const ex = Math.sign(Bic[0]);                           // +1: alan +X yönünde, N ucu +X
  const bakir = new T.MeshPhysicalMaterial({ color: new T.Color('#df8657'), metalness: 1, roughness: 0.3, clearcoat: 0.35, clearcoatRoughness: 0.2 });
  const telM = tupYap(T, tamYol, rw, bakir); telM.geometry.dispose();
  telM.geometry = new T.TubeGeometry(telM.egri, 2600, rw, 12, false); telM.castShadow = telM.receiveShadow = true; S.scene.add(telM);
  // şeffaf gövde (makara borusu)
  const boru = new T.Mesh(new T.CylinderGeometry(Rc - rw - 0.08, Rc - rw - 0.08, Lc + 1.2, 48, 1, true), new T.MeshPhysicalMaterial({ color: 0xe8eef2, roughness: 0.15, transmission: 0, transparent: true, opacity: 0.28, side: T.DoubleSide, depthWrite: false }));
  boru.rotation.z = Math.PI / 2; S.scene.add(boru);
  // akım okları: sarmal üzerinde kayan küçük mercan koniler (teğet yönü × sg)
  const sarEgri = new T.CatmullRomCurve3(tamYol.map(p => new T.Vector3(...p)), false, 'centripetal');
  const akimMat = new T.MeshPhysicalMaterial({ color: RENK.akim, roughness: 0.35, clearcoat: 0.5, emissive: RENK.akim, emissiveIntensity: 0.2, transparent: true });
  const akimO = []; for (let i = 0; i < 44; i++) { const c = new T.Mesh(new T.ConeGeometry(0.62, 1.5, 20), akimMat); c.castShadow = true; S.scene.add(c); akimO.push(c); }
  // alan çizgileri: Biot–Savart ile izlenir (RK4), içeriden N ucundan çıkıp S ucundan döner
  const alanMat = new T.MeshPhysicalMaterial({ color: RENK.alan, roughness: 0.4, transparent: true, opacity: 0, emissive: RENK.alan, emissiveIntensity: 0.2 });
  // Alan çizgileri: sarmalla aynı dolanımda akım taşıyan eş eksenli halkalar (ideal makara) için Biot–Savart + RK4.
  // Bu model eksene göre simetriktir; çizgiler düzlemseldir, bir kez izlenip farklı yarı düzlemlere döndürülür.
  const halka = []; const NR = 2 * Nt;
  for (let k = 0; k < NR; k++) { const x = xs + Lc * (k + 0.5) / NR; for (let j = 0; j < 40; j++) { const a = j / 40 * 2 * Math.PI, b = (j + 1) / 40 * 2 * Math.PI; halka.push({ a: [x, Rc * Math.cos(a), Rc * Math.sin(a)], b: [x, Rc * Math.cos(b), Rc * Math.sin(b)], I: sg }); } }
  const exHalka = Math.sign(biot(halka, [0, 0, 0])[0]);
  const izle = (rho) => {
    const p0 = [0, rho, 0], pts = [p0.slice()]; let p = p0.slice(); const h = 0.3;
    const f = q => nrm(biot(halka, q));
    for (let k = 0; k < 900; k++) {
      const k1 = f(p), k2 = f(add(p, mul(k1, h / 2))), k3 = f(add(p, mul(k2, h / 2))), k4 = f(add(p, mul(k3, h)));
      const q = p; p = add(p, mul(add(add(k1, mul(k2, 2)), add(mul(k3, 2), k4)), h / 6));
      if (k > 40 && Math.sign(p[0]) !== Math.sign(q[0]) && Math.abs(p[1]) < Rc - 0.3) { pts.push(p0.slice()); return pts; }
      if (k % 2 === 0) pts.push(p);
      if (Math.abs(p[0]) > 40 || Math.abs(p[1]) > 20) return null;
    }
    return null;
  };
  const cizgiler = [];
  const egriler = { 2.2: izle(2.2), 2.42: izle(2.42) };
  [[2.2, 158], [2.42, 182], [2.2, 206], [2.42, 232], [2.2, -62], [0, 0]].map(([r, f]) => [r, ex > 0 ? f : 180 - f]).forEach(([rho, phiD], k) => {
    const phi = phiD * Math.PI / 180, c = Math.cos(phi), sn = Math.sin(phi);
    let pts, kapali = false;
    if (rho === 0) pts = [[-ex * 17, 0, 0], [0, 0, 0], [ex * 17, 0, 0]];
    else { const e2 = egriler[rho]; if (!e2) return; pts = e2.map(q => [q[0], q[1] * c, q[1] * sn]); pts.pop(); kapali = true; }
    const tup = tupYap(T, pts, rho === 0 ? 0.15 : 0.09, alanMat, kapali); S.scene.add(tup);
    const egri = tup.egri; const L = egri.getLength();
    const oklar = akanOklar(T, egri, rho === 0 ? 5 : Math.max(3, Math.round(L / 12)), RENK.alan, rho === 0 ? 1.4 : 1.1, rho === 0 ? 0.6 : 0.46); S.scene.add(oklar);
    cizgiler.push({ tup, oklar, L, gec: k * 0.1, eksen: rho === 0 });
  });
  // el: başparmak içerideki alan yönünde (Bic), parmaklar kameraya doğru
  const C = elCati([0, -0.94 * ex, 0.34], [ex, 0, 0]);         // el sırtı kameraya; parmaklar önden aşağı (ters akımda yukarı) sarar
  const R = Rc + rw, cx = 7.15, cy = -1.32 - R + 0.18;
  const orjin = add(sub([0, 0, 0], add(mul(C.Xl, cx), mul(C.Yl, cy))), mul(C.Zl, 3.0));
  grupYerlestir(T, el.grup, C, orjin);
  const kavra = sar(cx, cy, R, 0.05);
  // akım dolanım yayı: elin bulunduğu kesitte, makara ekseni (+X) etrafında akımın döndüğü yönde (sg).
  // Sağ el kuralı gereği bu yön, başparmağın (ex) çevresinde pozitif dolanımdır: ex·X ekseni etrafında pozitif dönüş.
  el.grup.updateMatrixWorld(true); const xh = dunya(T, el.kemikler.p[1][0])[0];
  // yay, elin N tarafında makarayı çevreler; başparmağın uzandığı üst kısımda boşluk bırakır
  const aYay = dolanimYayi(T, [xh + 4.2 * ex, 0, 0], [ex, 0, 0], [0, Math.cos(0.75), ex * Math.sin(0.75)], R + 2.5, 2 * Math.PI - 1.5, RENK.akim, 0.3); S.scene.add(aYay);
  // öndeki sarımlarda akımın yönü (ön yüzde teğet: sg > 0 iken aşağı) — elin gelip parmaklarını hizalayacağı yerde
  const onYon = [0, -sg, 0], onOk = okYap(T, RENK.akim, 0.34, 1.7, 0.95); S.scene.add(onOk);
  const sarYon = (() => { const i = Math.round(ns * 0.5); return nrm(mul(sub(sarmal[i + 1], sarmal[i]), sg)); })();
  const bas = { hedef: [0.3, -0.12, -1], a1: 0.2, a2: 0.2 };
  const P0 = pozYap(T, el, { fl: ACIK_FL, ac: PARMAK.map(f => f.ac * 0.8), bas: null, bilek: [0.05, 0] });
  const P1 = pozYap(T, el, { fl: kavra, ac: [-0.05, 0, 0.05, 0.11], bas, bilek: [0, 0] });
  const etiket = [
    { ad: 'akım <i>i</i>', renk: '#c2452b', p: () => [uc0[0] - 2.2, -11, 1], g: D => ss(0.6, 1, D.akim) },
    { ad: 'akımın dönüş yönü', renk: '#c2452b', p: () => aYay.orta, g: D => ss(0.3, 1, D.yay) },
    { ad: 'öndeki sarımlarda akım', renk: '#c2452b', p: () => [xh, 4.1 * sg, Rc + 1.3], g: D => ss(0.3, 1, D.on || 0) },
    { ad: 'alan <i>B</i>', renk: '#2a6fa3', p: () => [ex * 15, 1.6, 0], g: D => ss(0.55, 0.95, D.alan) },
    { ad: 'N', renk: '#c8402f', p: () => [ex * (Lc / 2 + 2.6), -2.6, 2.2], g: D => ss(0.8, 1, D.alan), buyuk: true },
    { ad: 'S', renk: '#2f6fb0', p: () => [-ex * (Lc / 2 + 2.6), -2.6, 2.2], g: D => ss(0.8, 1, D.alan), buyuk: true }
  ];
  return {
    hedef: [0.6 * ex, -1, 0], uzak: 62, yaw: -0.5, pitch: 0.24, salin: 0.5, etiket, poz: { P0, P1 }, giris: mul(C.Xl, -16), C, basHedef: Bic,
    kanal: t => ({ giris: clamp(t / 1.9, 0, 1), kavra: clamp((t - 1.55) / 1.9, 0, 1), akim: clamp((t - 3) / 0.8, 0, 1), alan: clamp((t - 4.2) / 2, 0, 1), yay: ss(2.4, 3.2, t) * (1 - ss(7.6, 8.6, t)), on: ss(0.6, 1.2, t) * (1 - ss(2.2, 2.8, t)) }),
    adimlar: [
      { D: { giris: -1.6, kavra: 0, akim: 1, alan: 0, yay: 1, on: 1 }, kam: { yaw: ex * 0.5 + 0.5, pitch: -0.04, m: 0.74, h: [xh + 1.5 * ex, 0, 1] }, metin: 'Sarımlardaki akımı gör: mercan oklar akımın yönü. Öndeki sarımlarda akım ' + (ex > 0 ? 'aşağı' : 'yukarı') + ', arkadakilerde ' + (ex > 0 ? 'yukarı' : 'aşağı') + ' akar; makarayı çevreleyen kalın ok bu dönüşü gösterir.' },
      { D: { giris: 1, kavra: 0, akim: 1, alan: 0, yay: 1, on: 1 }, kam: { yaw: ex * 0.4 + 0.5, pitch: 0.0, m: 0.76, h: [xh + 1.5 * ex, 0, 1.5] }, metin: 'Sağ elini makaraya getir: açık parmakların, öndeki sarımlarda akımın aktığı yöne (' + (ex > 0 ? 'aşağı' : 'yukarı') + ') uzansın.' },
      { D: { giris: 1, kavra: 1, akim: 1, alan: 0, yay: 1, on: 0 }, kam: { yaw: ex * 1.12 + 0.5, pitch: -0.08, m: 0.7, h: [xh + 2 * ex, 0, 0] }, metin: 'Dört parmağını sarımlara sar: <b>parmakların sarılma yönü = sarımlardaki akımın dönüş yönü</b>. Halkayı uçtan görüyorsun; parmaklar ve kalın ok aynı yönde döner.' },
      { D: { giris: 1, kavra: 1, akim: 1, alan: 1, yay: 1, on: 0 }, kam: { yaw: 0, pitch: 0, m: 1 }, metin: 'Başparmağın gösterdiği uç <b>N</b> kutbudur: içerideki alan (<i>B</i>) bu yöndedir. Dışarıda alan çizgileri N’den çıkıp S’ye döner.' },
      { D: { giris: 1, kavra: 1, akim: 1, alan: 1, yay: 1, on: 0 }, kam: { yaw: 0, pitch: 0, m: 1 }, metin: 'Akımı ters çevir: akımın dönüşü tersine döner, parmaklar da öbür yöne sarılır; başparmak öbür ucu gösterir, N ve S yer değiştirir.', ters: true }

      const yayDol = dot(crs([1, 0, 0], aYay.son), aYay.yon) * 1, sarDol = dot(crs([1, 0, 0], sarmal[Math.round(ns * 0.5)]), sarYon);

    adim(D, t) {

        c.position.copy(p); c.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), tg); c.scale.setScalar(Math.max(0.01, gor) * (p.y < -14 ? 0.01 : 1)); });
      cizgiler.forEach(c => { const g = ss(4.2 + c.gec, 5.4 + c.gec, tA); c.oklar.guncelle(t * (c.eksen ? 0.09 : 1.6 / c.L), g); c.tup.visible = g > 0.01; });
      alanMat.opacity = 0.55 * ss(4.2, 5.3, tA); aYay.ayarla(D.yay || 0);
      const og = D.on || 0; onOk.ayarla([xh, 2.3 * sg, Rc + 1.25], onYon, 4.6 * og); onOk.visible = og > 0.02; onOk.mat.transparent = true; onOk.mat.opacity = og;
    }
  };
};

/* 3) Tele etki eden kuvvet: dört parmak i, avuç içi B (parmaklar B'ye kıvrılabilir), başparmak F = i × B */
SAHNE.sagel_kuvvet = function (T, S, el, sg) {
  const iY = [sg, 0, 0], B = [0, 0, -1], F = crs(iY, B);          // F = i·L × B (L akım yönünde)
  const C = elCati(iY, F);                                       // parmaklar i, başparmak F; avuç içi (-Y_l) B yönünde
  const bakir = new T.MeshPhysicalMaterial({ color: new T.Color('#e08a5c'), metalness: 1, roughness: 0.3, clearcoat: 0.3 });
  const tel = new T.Mesh(new T.CylinderGeometry(0.42, 0.42, 80, 24), bakir); tel.rotation.z = Math.PI / 2; tel.castShadow = tel.receiveShadow = true; S.scene.add(tel);
  // mıknatıs kutupları: N önde (+Z), S arkada; aralarındaki düzgün alan N'den S'ye (-Z)
  const mx = 10.5 * sg, gw = 12.5, gh = 8.6, g0 = 5.2, kal = 5.4;

  const kN = new T.Mesh(new T.BoxGeometry(gw, gh, kal), kutupMat(RENK.N, 0.32)); kN.position.set(mx, 0, g0 + kal / 2); S.scene.add(kN);
  const kNk = new T.LineSegments(new T.EdgesGeometry(kN.geometry), new T.LineBasicMaterial({ color: RENK.N, transparent: true, opacity: 0.85 })); kNk.position.copy(kN.position); S.scene.add(kNk);
  const kS = new T.Mesh(new T.BoxGeometry(gw, gh, kal), kutupMat(RENK.S, 1)); kS.position.set(mx, 0, -g0 - kal / 2); kS.castShadow = kS.receiveShadow = true; S.scene.add(kS);
  // el: parmaklar tel boyunca, serçe kenarı telin hemen üstünde, avuç içi B'ye (S kutbuna) bakar
  const orjin = add(add(mul(iY, -16), mul(nrm(F), 4.1)), mul(C.Yl, 1.6));
  grupYerlestir(T, el.grup, C, orjin);
  const basL = { hedef: [0.06, 0.0, -1], a1: 0.08, a2: 0.06 };
  const yan = [0.02, 0, -0.02, -0.01];
  const P0 = pozYap(T, el, { fl: ACIK_FL, ac: PARMAK.map(f => f.ac * 0.8), bas: null, bilek: [0.05, 0] });
  const P1 = pozYap(T, el, { fl: [[0.05, 0.06, 0.04], [0.04, 0.06, 0.04], [0.05, 0.07, 0.05], [0.06, 0.08, 0.06]], ac: yan, bas: basL, bilek: [0, 0] });
  const P2 = pozYap(T, el, { fl: [[0.62, 0.7, 0.4], [0.6, 0.72, 0.42], [0.62, 0.74, 0.44], [0.64, 0.76, 0.46]], ac: yan, bas: basL, bilek: [0, 0] });
  // alan çizgileri: kutup yüzeyleri arasında düz (-Z)
  const alanMat = new T.MeshPhysicalMaterial({ color: RENK.alan, roughness: 0.4, transparent: true, opacity: 0, emissive: RENK.alan, emissiveIntensity: 0.2 });
  const cizgiler = [];

/* ---- Soru kartı (çalışma, deneme ve inceleme modlarında ortak) ---- */

function soruKart(q, { mod, secim, cevap, konu }) {

  h += `<div class="q-metin">${md(q.metin, ctx)}</div>`;
  if (q.sekil && !icSekil) h += `<div class="dj-sekil ${genis ? 'genis' : ''}">${fig}</div>`;
  if (q.tur === 'cs') {

  });

}
