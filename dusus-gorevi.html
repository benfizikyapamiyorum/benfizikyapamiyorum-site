<script>
/* ---------- saf fizik ve soru mantığı (test edilebilir) ---------- */
var Sim = (function () {
  var G = 10;
  function fallTime(h) { return Math.sqrt(2 * h / G); }
  function pick(arr, rnd, not) {
    var a = arr.filter(function (x) { return x !== not; });
    return a[Math.floor(rnd() * a.length)];
  }
  /* her görev için parametre ve doğru cevap */
  function make(level, rnd, prev) {
    prev = prev || {};
    if (level === 0) { var h0 = pick([20, 45], rnd, prev.h); return { h: h0, answer: 2 }; }
    if (level === 1) { var h1 = pick([5, 20, 45, 80], rnd, prev.h); return { h: h1, answer: fallTime(h1) }; }
    if (level === 2) { var h2 = pick([5, 20, 45, 80], rnd, prev.h); return { h: h2, answer: G * fallTime(h2) }; }
    if (level === 3) {
      var combos = [], vs = [5, 10, 15, 20], hs = [20, 45, 80];
      vs.forEach(function (v) { hs.forEach(function (h) { if (!(prev.v === v && prev.h === h)) combos.push({ v: v, h: h }); }); });
      var c = combos[Math.floor(rnd() * combos.length)];
      return { v: c.v, h: c.h, answer: c.v * fallTime(c.h) };
    }
    var v0 = pick([10, 20, 30], rnd, prev.v0);
    return { v0: v0, answer: v0 * v0 / (2 * G) };
  }
  /* t anındaki durum. guess yalnızca 3. görevde (bayrak uzaklığı) hareketi etkiler. */
  function state(level, p, t, guess) {
    var tf, s = {};
    if (level <= 2) {
      tf = fallTime(p.h); if (t > tf) t = tf;
      return { t: t, h: Math.max(0, p.h - 0.5 * G * t * t), v: G * t, done: t >= tf, total: tf };
    }
    if (level === 3) {
      var x0 = Math.min(84, guess + 1.2 * p.v); if (x0 <= guess) x0 = guess;
      var tr = (x0 - guess) / p.v; tf = fallTime(p.h);
      var total = tr + tf; if (t > total) t = total;
      var tfall = Math.max(0, t - tr);
      s = { t: t, x: x0 - p.v * t, released: t >= tr, tfall: tfall, h: Math.max(0, p.h - 0.5 * G * tfall * tfall), v: G * tfall, done: t >= total, total: total };
      s.miss = guess - p.v * tf; /* paket yere vardığında kamyonetin hedefe uzaklığı (+: henüz gelmedi) */
      return s;
    }
    tf = 2 * p.v0 / G; if (t > tf) t = tf;
    return { t: t, h: Math.max(0, p.v0 * t - 0.5 * G * t * t), v: p.v0 - G * t, done: t >= tf, total: tf };
  }
  function correct(level, p, guess) { return Math.abs(guess - p.answer) < 1e-9; }
  return { G: G, fallTime: fallTime, make: make, state: state, correct: correct };
})();
if (typeof module !== "undefined") { module.exports = Sim; }

/* ---------- arayüz ---------- */
(function () {
  if (typeof document === "undefined") return;
  function $(id) { return document.getElementById(id); }
  function tr(n, d) { return n.toLocaleString("tr-TR", { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }
  function num(n) { return Number.isInteger(n) ? String(n) : tr(n, 1); }

  var LEVELS = [
    { name: "Hangisi önce?", go: "Bırak!", kind: "choice", init: -1 },
    { name: "Kronometre", go: "Bırak!", kind: "stepper", unit: "s", min: 0.5, max: 6, step: 0.5, init: 2.5 },
    { name: "Çarpma hızı", go: "Bırak!", kind: "stepper", unit: "m/s", min: 5, max: 60, step: 5, init: 25 },
    { name: "Kasaya düşür", go: "Kamyoneti yola çıkar", kind: "slider", init: 0 },
    { name: "Yukarı fırlat", go: "Fırlat!", kind: "stepper", unit: "m", min: 5, max: 80, step: 5, init: 10 }
  ];
  var level = 0, P = [], guess, phase = "predict", t0 = 0, simT = 0, stars = [false, false, false, false, false], raf = 0, lastOK = false;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- sahne ---------- */
  var cv = $("cv"), ctx = cv.getContext("2d"), W = 760, H = 470, GY = 400;
  (function () { var d = Math.min(2, window.devicePixelRatio || 1); cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); })();
  var FONT = '"Figtree", system-ui, sans-serif';
  function axisMax(h) { return h <= 5 ? 10 : h <= 20 ? 25 : h <= 45 ? 50 : 90; }
  function tickStep(m) { return m <= 10 ? 2 : m <= 25 ? 5 : m <= 50 ? 10 : 20; }
  function text(s, x, y, size, color, align, weight) {
    ctx.font = (weight || 600) + " " + size + "px " + FONT; ctx.fillStyle = color; ctx.textAlign = align || "left"; ctx.textBaseline = "middle"; ctx.fillText(s, x, y);
  }
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function ball(x, y, r, c1, c2) {
    var g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.15, x, y, r);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.stroke();
  }
  function backdrop(roadDrop) {
    var g = ctx.createLinearGradient(0, 0, 0, GY);
    g.addColorStop(0, "#bfe0f7"); g.addColorStop(1, "#eef7fd");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    /* uzak şehir silüeti */
    ctx.fillStyle = "#d3e3ee";
    [[420, 60, 46], [472, 96, 38], [516, 44, 52], [574, 120, 34], [614, 76, 48], [668, 52, 40], [712, 90, 48]].forEach(function (b) { ctx.fillRect(b[0], GY - b[1], b[2], b[1] + (roadDrop || 0)); });
    /* zemin */
    var gy = GY + (roadDrop || 0);
    ctx.fillStyle = roadDrop ? "#59626e" : "#7fb069"; ctx.fillRect(0, gy, W, H - gy);
    ctx.fillStyle = roadDrop ? "#444c56" : "#6a9a56"; ctx.fillRect(0, gy, W, 4);
  }
  function ruler(x, amax, sy, zeroLabel) {
    var st = tickStep(amax), m;
    ctx.strokeStyle = "#31475c"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, GY); ctx.lineTo(x, GY - amax * sy); ctx.stroke();
    for (m = 0; m <= amax + 0.001; m += st) {
      var y = GY - m * sy;
      ctx.beginPath(); ctx.moveTo(x - 7, y); ctx.lineTo(x, y); ctx.stroke();
      text(m === 0 && zeroLabel ? zeroLabel : m + " m", x - 11, m === 0 ? y - 7 : y, 13, "#22384c", "right", 600);
    }
  }
  function tower(x, topY) {
    ctx.fillStyle = "#6b7785"; ctx.fillRect(x - 46, topY - 6, 9, GY - topY + 6);
    ctx.fillStyle = "#4d5967"; ctx.fillRect(x - 50, topY - 12, 64, 7);
    ctx.fillStyle = "#3b4551"; ctx.fillRect(x - 54, GY - 6, 26, 6);
  }
  function hud(lines) {
    var w = 196, h = 16 + lines.length * 24, x = W - w - 14, y = 14;
    ctx.fillStyle = "rgba(255,255,255,.93)"; rr(x, y, w, h, 10); ctx.fill();
    ctx.strokeStyle = "#b8c7d6"; ctx.lineWidth = 1; ctx.stroke();
    lines.forEach(function (l, i) {
      text(l[0], x + 14, y + 22 + i * 24, 14, "#4a5b6e", "left", 600);
      text(l[1], x + w - 14, y + 22 + i * 24, 17, "#14202e", "right", 700);
    });
  }
  function dashed(x1, y, x2, color, label) {
    ctx.save(); ctx.setLineDash([7, 6]); ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke(); ctx.restore();
    if (label) text(label, x2 + 8, y, 13, color, "left", 700);
  }
  /* hız-zaman grafiği: zaman ekseni adı yatay eksenin yanında */
  function graph(total, vmin, vmax, t, vOf) {
    var x = 474, y = 150, w = 176, h = 170, i, n = 60;
    ctx.fillStyle = "rgba(255,255,255,.93)"; rr(x - 44, y - 30, w + 138, h + 62, 10); ctx.fill();
    ctx.strokeStyle = "#b8c7d6"; ctx.lineWidth = 1; ctx.stroke();
    function gx(tt) { return x + tt / total * w; }
    function gyv(v) { return y + h - (v - vmin) / (vmax - vmin) * h; }
    ctx.strokeStyle = "#31475c"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(x, y - 6); ctx.lineTo(x, y + h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, gyv(0)); ctx.lineTo(x + w + 6, gyv(0)); ctx.stroke();
    text("hız (m/s)", x - 30, y - 16, 12.5, "#22384c", "left", 600);
    text("zaman (s)", x + w + 12, gyv(0), 12.5, "#22384c", "left", 600);
    text(String(vmax), x - 7, gyv(vmax), 12.5, "#22384c", "right", 600);
    if (vmin < 0) text("−" + Math.abs(vmin), x - 7, gyv(vmin), 12.5, "#22384c", "right", 600);
    text("0", x - 7, gyv(0), 12.5, "#22384c", "right", 600);
    text(num(total), gx(total), gyv(0) + (vmin < 0 ? -12 : 14), 12.5, "#22384c", "center", 600);
    ctx.strokeStyle = "#31475c"; ctx.beginPath(); ctx.moveTo(gx(total), gyv(0) - 4); ctx.lineTo(gx(total), gyv(0) + 4); ctx.stroke();
    ctx.strokeStyle = "#e2530b"; ctx.lineWidth = 3; ctx.lineJoin = "round"; ctx.beginPath();
    for (i = 0; i <= n; i++) { var tt = t * i / n; if (i === 0) ctx.moveTo(gx(tt), gyv(vOf(tt))); else ctx.lineTo(gx(tt), gyv(vOf(tt))); }
    ctx.stroke();
    ctx.fillStyle = "#e2530b"; ctx.beginPath(); ctx.arc(gx(t), gyv(vOf(t)), 4.5, 0, Math.PI * 2); ctx.fill();
  }
  function drone(x, y) {
    ctx.strokeStyle = "#2b3440"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x - 24, y); ctx.lineTo(x + 24, y); ctx.stroke();
    ctx.fillStyle = "#2b3440"; rr(x - 11, y - 5, 22, 11, 4); ctx.fill();
    ctx.fillStyle = "#e2530b"; ctx.fillRect(x - 3, y - 2, 6, 4);
    [x - 24, x + 24].forEach(function (rx) {
      ctx.fillStyle = "#2b3440"; ctx.fillRect(rx - 1.5, y - 7, 3, 7);
      ctx.fillStyle = "rgba(43,52,64,.35)"; ctx.beginPath(); ctx.ellipse(rx, y - 8, 14, 2.6, 0, 0, Math.PI * 2); ctx.fill();
    });
    ctx.strokeStyle = "#2b3440"; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x, y + 6); ctx.lineTo(x, y + 12); ctx.stroke();
  }
  function truck(cx, flagM, X) {
    var road = GY + 14;
    /* kasa tabanı GY hizasında */
    ctx.fillStyle = "#2f6fb3"; ctx.fillRect(cx - 30, GY, 60, 7);
    ctx.fillRect(cx - 30, GY - 11, 4, 11); ctx.fillRect(cx + 26, GY - 11, 4, 11);
    ctx.fillStyle = "#1f4f85"; rr(cx - 52, GY - 17, 22, 24, 4); ctx.fill();
    ctx.fillStyle = "#cfe6f7"; ctx.fillRect(cx - 48, GY - 13, 11, 9);
    ctx.fillStyle = "#1b2430";
    [cx - 40, cx + 14].forEach(function (wx) { ctx.beginPath(); ctx.arc(wx, road - 6, 6.5, 0, Math.PI * 2); ctx.fill(); });
  }

  function draw() {
    var p = P[level], s = Sim.state(level, p, simT, guess), sy, amax, dx, r, i;
    if (level <= 2) {
      amax = axisMax(p.h); sy = 330 / amax; dx = 250;
      backdrop(0); ruler(dx - 96, amax, sy); tower(dx, GY - p.h * sy - (level === 0 ? 26 : 20));
      if (level === 0) {
        ball(dx - 20, GY - s.h * sy - 13, 13, "#5d6b7a", "#1d2732");
        ball(dx + 14, GY - s.h * sy - 7, 7, "#f4ff8a", "#b9cc1c");
        text("6 kg", dx - 24, GY - p.h * sy - 52, 13, "#22384c", "center", 700);
        text("60 g", dx + 22, GY - p.h * sy - 52, 13, "#22384c", "center", 700);
        hud([["Süre", tr(s.t, 1) + " s"], ["Bowling topu", tr(s.h, 0) + " m"], ["Tenis topu", tr(s.h, 0) + " m"]]);
      } else {
        r = 10;
        if (level === 1 && phase !== "predict" && guess < s.total && simT >= guess) {
          var hg = p.h - 5 * guess * guess;
          dashed(dx - 30, GY - hg * sy, dx + 34, "#7e22ce", "Tahminin: " + num(guess) + " s");
        }
        ball(dx, GY - s.h * sy - r, r, "#ff9a62", "#c2410c");
        hud([["Süre", tr(s.t, 1) + " s"], ["Hız", (level === 2 && phase === "predict" ? "?" : tr(s.v, 0)) + " m/s"], ["Yükseklik", tr(s.h, 0) + " m"]]);
        if (phase !== "predict") graph(s.total, 0, Sim.G * s.total, s.t, function (tt) { return Sim.G * tt; });
      }
    } else if (level === 3) {
      amax = axisMax(p.h); sy = 330 / amax; dx = 150;
      var X = function (m) { return dx + m * 7.2; };
      backdrop(14); ruler(dx - 70, amax, sy, "kasa");
      drone(dx, GY - p.h * sy - 26);
      for (i = 10; i <= 80; i += 10) {
        ctx.strokeStyle = "#dfe6ee"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X(i), GY + 14); ctx.lineTo(X(i), GY + 22); ctx.stroke();
        text(i + (i === 80 ? " m" : ""), X(i), GY + 36, 13, "#ffffff", "center", 600);
      }
      /* bayrak */
      ctx.strokeStyle = "#14202e"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X(guess), GY + 14); ctx.lineTo(X(guess), GY - 50); ctx.stroke();
      ctx.fillStyle = "#e2530b"; ctx.beginPath(); ctx.moveTo(X(guess), GY - 50); ctx.lineTo(X(guess) + 22, GY - 42); ctx.lineTo(X(guess), GY - 34); ctx.closePath(); ctx.fill();
      text(guess + " m", X(guess) + 4, GY - 62, 13, "#14202e", "left", 700);
      truck(X(s.x), guess, X);
      /* paket */
      var py = GY - s.h * sy - 14, landedMiss = s.done && Math.abs(s.miss) > 1e-9;
      if (landedMiss) py = GY;
      ctx.fillStyle = "#b9803f"; ctx.fillRect(dx - 7, py, 14, 14); ctx.strokeStyle = "#6f4a1e"; ctx.lineWidth = 1.2; ctx.strokeRect(dx - 7, py, 14, 14);
      ctx.beginPath(); ctx.moveTo(dx, py); ctx.lineTo(dx, py + 14); ctx.stroke();
      hud([["Süre", tr(s.t, 1) + " s"], ["Kamyonet", tr(Math.max(0, s.x), 0) + " m uzakta"], ["Paket", tr(s.h, 0) + " m"]]);
    } else {
      var hm = p.answer; amax = axisMax(Math.max(hm, guess)); sy = 330 / amax; dx = 250; r = 10;
      backdrop(0); ruler(dx - 96, amax, sy);
      ctx.fillStyle = "#4d5967"; rr(dx - 16, GY - 6, 32, 6, 2); ctx.fill();
      dashed(dx - 40, GY - guess * sy, dx + 40, "#7e22ce", "Tahminin: " + guess + " m");
      if (phase === "done") dashed(dx - 40, GY - hm * sy, dx + 40, "#14783c", lastOK ? "" : "Gerçek: " + hm + " m");
      ball(dx, GY - s.h * sy - r, r, "#ff9a62", "#c2410c");
      hud([["Süre", tr(s.t, 1) + " s"], ["Hız", tr(Math.abs(s.v), 0) + " m/s " + (s.v > 0.05 ? "↑" : s.v < -0.05 ? "↓" : "")], ["Yükseklik", tr(s.h, 0) + " m"]]);
      if (phase !== "predict") graph(s.total, -p.v0, p.v0, s.t, function (tt) { return p.v0 - Sim.G * tt; });
    }
  }

  /* ---------- görev metinleri ---------- */
  function story() {
    var p = P[level];
    if (level === 0) return ["Vinçte bir bowling topu ile bir tenis topu aynı hizada duruyor. İkisi " + p.h + " m yükseklikten aynı anda bırakılacak.", "Hangisi yere önce ulaşır?"];
    if (level === 1) return ["Top " + p.h + " m yükseklikten ilk hızsız bırakılacak.", "Top kaç saniye sonra yere çarpar?"];
    if (level === 2) return ["Top bu kez " + p.h + " m yükseklikten ilk hızsız bırakılacak.", "Top yere hangi hızla çarpar?"];
    if (level === 3) return ["Havada sabit duran bir dron, yardım paketini kamyonetin kasasından " + p.h + " m yukarıda tutuyor. Kamyonet " + p.v + " m/s sabit hızla dronun altına doğru geliyor. Kamyonet bayrağın hizasına geldiği anda paket bırakılacak.", "Paketin kasaya düşmesi için bayrağı dronun hizasından kaç metre uzağa dikersin?"];
    return ["Top yerden yukarı doğru " + p.v0 + " m/s hızla fırlatılacak. Top elden çıktığı andan itibaren serbest düşme hareketi yapar, çünkü üzerinde yalnızca yer çekimi etkilidir.", "Top en fazla kaç metre yükselir?"];
  }
  function explain(ok) {
    var p = P[level], t;
    if (level === 0) return (ok ? "" : "İkisi aynı anda yere ulaştı. ") + "Hava direnci ihmal edildiğinde bütün cisimler aynı ivmeyle düşer. Bu ivme yaklaşık 10 m/s² büyüklüğündedir ve cismin kütlesine bağlı değildir.";
    t = Sim.fallTime(p.h);
    if (level === 1) return "h = g t² / 2 bağıntısından " + p.h + " = 10 t² / 2, yani t² = " + (t * t) + " ve t = " + t + " s bulunur." + (ok ? "" : " Senin tahminin " + num(guess) + " s idi.");
    if (level === 2) return "Önce süre: " + p.h + " = 10 t² / 2 eşitliğinden t = " + t + " s. Sonra hız: v = g t = 10 × " + t + " = " + (10 * t) + " m/s. Grafikteki doğrunun eğimi ivmeyi verir." + (ok ? "" : " Senin tahminin " + guess + " m/s idi.");
    if (level === 3) {
      var s = Sim.state(3, p, 1e9, guess), base = "Paket " + p.h + " m yükseklikten " + t + " s sürede düşer. Kamyonet bu sürede " + p.v + " × " + t + " = " + p.answer + " m yol alır. Bayrak " + p.answer + " m uzağa dikilmelidir.";
      if (ok) return base;
      return (s.miss > 0 ? "Paket yere vardığında kamyonet hedefe henüz " + s.miss + " m uzaktaydı. " : "Paket yere vardığında kamyonet hedefi " + Math.abs(s.miss) + " m geçmişti. ") + base;
    }
    var tu = p.v0 / 10;
    return "Topun hızı her saniye 10 m/s azalır ve " + p.v0 + " / 10 = " + tu + " s sonra sıfır olur. Bu sürede ortalama hızı " + p.v0 + " / 2 = " + (p.v0 / 2) + " m/s olduğundan " + (p.v0 / 2) + " × " + tu + " = " + p.answer + " m yükselir. İniş de " + tu + " s sürer ve top yere yine " + p.v0 + " m/s hızla döner.";
  }

  /* ---------- akış ---------- */
  function renderStars() {
    $("stars").innerHTML = stars.map(function (s) { return '<span class="' + (s ? "on" : "") + '">★</span>'; }).join("");
    $("stars").setAttribute("aria-label", "Kazanılan yıldız: " + stars.filter(Boolean).length + " / 5");
    $("nav").innerHTML = LEVELS.map(function (l, i) {
      return '<button data-i="' + i + '" aria-current="' + (i === level) + '">' + (i + 1) + ". " + l.name + (stars[i] ? '<span class="st">★</span>' : "") + "</button>";
    }).join("");
  }
  function renderPanel() {
    var L = LEVELS[level], st = story();
    $("eyebrow").textContent = "Görev " + (level + 1) + " / 5";
    $("title").textContent = L.name; $("story").textContent = st[0]; $("ask").textContent = st[1];
    $("cChoices").classList.toggle("hide", L.kind !== "choice");
    $("cStepper").classList.toggle("hide", L.kind !== "stepper");
    $("cSlider").classList.toggle("hide", L.kind !== "slider");
    if (L.kind === "choice") [0, 1, 2].forEach(function (i) { $("ch" + i).setAttribute("aria-pressed", String(guess === i)); $("ch" + i).disabled = phase !== "predict"; });
    if (L.kind === "stepper") { $("val").textContent = num(guess); $("unit").textContent = L.unit; $("minus").disabled = $("plus").disabled = phase !== "predict"; }
    if (L.kind === "slider") { $("range").value = guess; $("range").disabled = phase !== "predict"; $("sval").textContent = guess + " m"; }
    $("go").textContent = L.go;
    $("go").disabled = phase !== "predict" || (L.kind === "choice" && guess < 0);
    $("go").classList.toggle("hide", phase === "done");
    $("result").classList.toggle("show", phase === "done");
    $("after").classList.toggle("hide", phase !== "done");
    $("next").textContent = level === 4 ? "Sonuçları gör" : "Sonraki görev";
    renderStars();
  }
  function load(i, fresh) {
    cancelAnimationFrame(raf);
    level = i;
    if (fresh || !P[i]) P[i] = Sim.make(i, Math.random, P[i]);
    guess = LEVELS[i].init; phase = "predict"; simT = 0;
    $("finish").classList.remove("show");
    renderPanel(); draw();
  }
  function finishRun() {
    phase = "done"; lastOK = Sim.correct(level, P[level], guess);
    if (lastOK) stars[level] = true;
    $("result").className = "result show " + (lastOK ? "ok" : "no");
    $("rTitle").textContent = lastOK ? "Doğru tahmin, yıldız senin." : "Bu sefer tutmadı.";
    $("rText").textContent = explain(lastOK);
    renderPanel(); draw();
  }
  function frame(now) {
    simT = (now - t0) / 1000;
    var s = Sim.state(level, P[level], simT, guess);
    if (s.done) { simT = s.total; finishRun(); return; }
    draw(); raf = requestAnimationFrame(frame);
  }
  function go() {
    if (phase !== "predict") return;
    phase = "run"; renderPanel();
    if (reduce) { simT = 1e9; simT = Sim.state(level, P[level], simT, guess).total; finishRun(); return; }
    t0 = performance.now(); raf = requestAnimationFrame(frame);
  }
  function showFinish() {
    var n = stars.filter(Boolean).length;
    $("fTitle").textContent = "5 görevde " + n + " yıldız.";
    $("fText").textContent = n === 5 ? "Hepsini tutturdun. Serbest düşmede süre, hız ve yükseklik arasındaki ilişkiyi kurabiliyorsun."
      : "Yıldızı eksik kalan görevleri üstteki düğmelerden açıp yeni sayılarla tekrar deneyebilirsin.";
    $("finish").classList.add("show");
    $("finish").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" });
  }

  [0, 1, 2].forEach(function (i) { $("ch" + i).addEventListener("click", function () { if (phase === "predict") { guess = i; renderPanel(); } }); });
  $("minus").addEventListener("click", function () { var L = LEVELS[level]; guess = Math.max(L.min, guess - L.step); renderPanel(); draw(); });
  $("plus").addEventListener("click", function () { var L = LEVELS[level]; guess = Math.min(L.max, guess + L.step); renderPanel(); draw(); });
  $("range").addEventListener("input", function () { guess = Number($("range").value); $("sval").textContent = guess + " m"; draw(); });
  $("go").addEventListener("click", go);
  $("again").addEventListener("click", function () { load(level, true); });
  $("next").addEventListener("click", function () { if (level === 4) showFinish(); else load(level + 1, false); });
  $("nav").addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) load(Number(b.getAttribute("data-i")), false); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { draw(); });

  load(0, true);
})();
</script>
